  mrp:{d:'Weekly replenishment planner: demand + lead time + PAR → order qty, then auto-create POs grouped by supplier.',h:['Enter demand per product (or Import/Upload by SKU, or Sync from Sheets)','Adjust any line with Manual ±kg','💾 Save plan to keep it; 🧾 Generate Draft POs to order'],l:['Order = weekly need + PAR + lead-time buffer − on-hand, ± manual, rounded up to Min Order','Raw need = usable ÷ yield; lead buffer = need × (lead days ÷ 7); order-by = plan date − lead','Auto-PO groups by each ingredient\'s DEFAULT supplier — when 2 suppliers exist, the default wins']},
  reporting:{d:'Standard reports (the 4 Checks + operational reports) and a custom pivot builder. The Checks trace one unit of value across the whole chain; the rest are day-to-day triggers.',h:['⭐ Standard: tap a card — Checks (ordered→received→paid, usage/yield, transfer, delivery), plus Low stock, Supplier payables, Expiring soon (FEFO), COGS drift, Gross margin, Sales momentum','🛠 Custom: choose Source → Measure (count/sum/avg) → Group by, then ★ Save','Most report rows are clickable — open the underlying item, PO or product'],l:['Check 1 = 3-way match (ordered vs received vs paid); Check 2/3 = ingredient usage & yield; Check 4 = produced→sent→received; Check 5 = delivery','Low stock / payables / expiring are operational; the variance log is where you close each gap','Custom reports are pivots saved per browser; for heavy BI, Metabase runs on the same Supabase database']},
  supplies:{d:'Kitchen supplies — packaging, labels/stickers and consumables (vacuum bags, ecobags, thermal pouches). Split out from food ingredients.',h:['Add/edit a supply with its unit cost, PAR and reorder point','Keep "Kitchen supply" ticked so it stays out of the Ingredients list','Group by Type; reorder via Purchasing → Supplies Reorder'],l:['Shares the ingredients table (is_supply = true) so stock & receiving still work','Cost/unit feeds Gross Margin packaging and PO value estimates','Received & counted in whole units (not kg)']},
  margin:{d:'Live gross margin per product: BOM raw cost + variable process & packaging + fees → GP% and a suggested price at your target.',h:['Edit the global rate model (per-gram utilities, labor, packaging, fees, target GM) then 💾 Save','Set each product’s Cost profile tab: deboning / butcher / sous-vide / ecobag / thermal','Tap a row to open the product; ⬆ Write total cost pushes COGS to products'],l:['Raw = BOM grams × ingredient moving-average cost (falls back to processed/list price)','Process = (electricity+water+transport) per gram + labor (plain OR deboning) ± butcher ± sous-vide','Packaging = vacuum + sticker + ecobag + thermal, pulled from Kitchen Supplies costs','Fees = (transaction+marketing) % of price; Suggested = fixed cost ÷ (1 − target − fees%)','Rates persist in Supabase (app_settings.cost_model) — shared with the whole team']},
  momentum:{d:'Reads Shopify rolling sales (30/60/90/120 days) against live stock to show what to make now vs what’s overstocked.',h:['📊 Runway view: days of stock left per product, most urgent first','🎯 Quadrant view: momentum × stock for a two-axis read','Group by family or priority; 📥 Import/paste sales; tap a row to open the product'],l:['Momentum × = recent 30-day daily rate ÷ 120-day average (>1 = accelerating)','Days of cover = current stock ÷ recent daily rate','Stockout risk = low cover + steady/rising demand; overstock = high cover + slowing','Fed hourly from the “90-120 Day Demand” sheet into the sales_momentum table']},
  sticker_reorder:{d:'Label demand per site — the larger of what production needs and what PAR needs — turned into a sticker PO.',h:['Pick the site, review Need (production vs PAR top-up)','Adjust Order where you want a different quantity — it rounds up to whole sheets','🧾 Generate Sticker PO — one draft per label supplier'],l:['One label per pack; production need = packs planned − labels on hand','Need is the LARGER of production and PAR top-up, never the sum','Quantities are in pieces; the PO reference carries [STICKERS] so it opens on the Sticker PO screen']},
  supplies_reorder:{d:'Supplies below their PAR, with the quantity to reorder, ready to turn into a supplier PO.',h:['Review items below PAR (reorder = PAR − on hand)','🧾 Generate Supplies PO — one draft per supplier, ready to send','Set each supply’s PAR & reorder in Kitchen Supplies'],l:['Simple PAR rule — supplies have no recipe so they aren’t in MRP','Reorder qty is in the item’s own unit','Generated POs are confirmed and priced at the supply’s unit cost']},
  ffprofiles:{d:'A searchable list of the Fresh Food Calculator’s saved customers, shared across devices via Supabase.',h:['Search by customer, pet, or feeding type','Open the 🧮 Calculator to build a pack for one (Load saved profile there)','Profiles sync from the calculator’s ☁ Sync'],l:['Reads the ffcalc_profiles table (run wr_ffcalc_profiles.sql once)','Each calculator save pushes here; the calculator pulls on load','Read-only here — edit in the calculator']},
  ffcalc:{d:'The full Fresh Food Calculator, embedded in the app — size a custom pack per pet, then push it straight into a Custom Order.',h:['Fill in the pet profile & feeding type, compute the pack (Feeding / Kitchen)','Click 📤 Send order to ERP (top-right) to import the recipe','It lands as a Custom Order — map any unmatched ingredient, then 🔒 Lock'],l:['Runs isolated in a frame so it never clashes with the ERP','Sending posts the per-pack recipe (ingredient + grams), pack size, packs, customer & price','The ERP matches ingredient names to your master SKUs; unmatched ones are flagged for you to pick']},
  custom_orders:{d:'Customer-service quotes that lock into confirmed orders — each custom recipe becomes its own sellable SKU + BOM and flows into demand.',h:['＋ New quote → add standard products and/or custom recipes (ingredient + g/pack)','Edit freely while it is a quote; 🔒 Lock creates the SKUs + BOMs and pushes packs into demand','Pull the demand in Demand/MRP with ☁ Sync for the needed week'],l:['Each distinct custom recipe hashes to one CUST-… SKU (identical recipes reuse it)','Locking writes the order packs to the demand table keyed by the created SKU + needed date','A locked order can be marked fulfilled; cancel voids a quote']},
  prodplan:{d:'Plan and confirm a production run — good packs per product plus any output ingredients to make, then the actual processed used / raw used / output created.',h:['Add products + Good packs, and/or add Output ingredients + Needed qty (target/remaining come from the latest demand plot)','✅ Confirm production → the popup uses existing processed stock first, then makes the shortfall from raw','Enter actual Processed used / Raw used / Output created — live yield = output ÷ raw'],l:['Posting draws processed stock first, then deducts raw + adds processed for the shortfall, runs the mix, outputs finished packs','Excess (processed used + output created − needed) returns to the processed ingredient’s stock','Best-before auto-stamps = production date + the product’s shelf-life days; real yield is recorded on the batch']},
  approvals:{d:'Review and approve bulk-edit change requests submitted by non-admin users.',h:['Open a pending request to see the exact field changes','✓ Approve & apply writes the changes','✕ Reject with a reason'],l:['Non-admin bulk edits queue here instead of writing directly','Approving applies every change atomically','Recent decisions are logged; Admin only']},
  connection:{d:'Connect the app to your Supabase project (LIVE) or run on local demo data.',h:['Paste your Supabase URL + anon key, or sign in','Green LIVE = connected; DEMO = local sample data','Sign out to switch projects'],l:['The anon key is safe in the client — RLS protects the data','Signed-in requests use your user token','Demo data lives only in this browser']},
  fieldacl:{d:'Hide or lock specific fields (like cost) per role.',h:['Pick a model and field','Set hide / read-only per role','Save — it applies on the next render'],l:['Controls what each role sees in lists and forms','Hiding cost fields also hides margin & value figures for that role','App-level control; enforce hard security with Supabase RLS']},
  refs:{d:'The numbering scheme and live counters for every document type (DP, PO, DR, RR, PR, WI).',h:['Review the current counter per document type','Adjust a prefix/format if you need to'],l:['References are assigned at SAVE (not on open) so numbers aren’t burned by discarded drafts','Format: PREFIX-MMDDYYYY [SCOPE].Vxx']},
  notif:{d:'Edit the alert message templates sent to Telegram / email for each event.',h:['Pick an event (PO confirmed, mention, record done…)','Edit its template with {placeholders}','Save'],l:['Templates are filled with the record’s data at send time','Delivery runs through your automations (Apps Script / n8n)']},
  cleanser:{d:'Admin tools: upload opening balances, back up & restore your data, and wipe test transactions.',h:['📥 Upload opening balances (day-1 stock, auto-valued)','💾 Backup & Restore — download a JSON snapshot or restore to roll back','🧹 Wipe test transactions (type-to-confirm)'],l:['Opening balances post as opening ledger entries, valued from master prices','Backup captures all live tables; restore replaces current data','Always take a backup before any experiment']},
  users:{d:'Manage users, roles, and which modules each role can see.',h:['Add users and assign a role','Tick the role → module matrix to control navigation','Switch the acting user from the top bar'],l:['This governs the app menus only','Real security is enforced in Supabase with RLS + Auth (ask for the SQL)']},
  studio:{d:'Customize the app without code — relabel fields, show/hide columns, add custom & formula fields.',h:['Pick a model','Rename labels or toggle "show in list"','Add a custom field, or a formula field like list_price_kg*1.12'],l:['Changes are saved to this browser and applied on load','Formula fields are read-only, computed over the record','DB-level defaults/automation are done in Supabase SQL']},
  automations:{d:'One-stop hub for the n8n-powered integrations (Sheets, Drive, Shopify, Telegram, MRP schedule).',h:['Toggle an automation on','Paste its webhook / sheet / folder URL','Save — the workflow runs in n8n'],l:['This stores config; the actual workflows live in n8n','The Drive folder here powers attachment links across records']},
  selftest:{d:'In-app unit tests that verify the whole app is healthy.',h:['Click Run tests','Read the ✅/❌ table and the pass count','Run after connecting Supabase or changing Studio'],l:['Checks data, relations, formulas, MRP, counts, access & modules','Adds a live Supabase connection test when connected']},
};
