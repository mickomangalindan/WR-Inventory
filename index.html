function openCmd(){ ensureCmd(); $('cmdwrap').classList.add('on'); $('cmdq').value=''; cmdSearch(''); setTimeout(()=>{const q=$('cmdq'); if(q)q.focus();},30); }
function closeCmd(){ const w=$('cmdwrap'); if(w) w.classList.remove('on'); }
/* ---- ⌘K, rebuilt ------------------------------------------------------------
   What was wrong with the old one, in order of how often it bit:
     • it searched FOUR tables — ingredients, products, suppliers, POs. A custom
       order, a batch, a count, a transfer, a variance was simply unfindable.
     • it matched ONE column per table (the model's `name`), so a SKU, a PO
       reference, a customer name or a supplier's name on a PO never matched.
     • every failure was swallowed by `catch(e){}` — an RLS block or a missing
       column looked exactly like "nothing found".
     • it showed the name and nothing else, so two look-alike rows were
       indistinguishable, and six results per table was a hard ceiling.
   Now: every table with a search config, all its declared columns, errors shown
   rather than hidden, the SKU / reference on every line, and the modules the
   term matches kept at the bottom instead of eating the first slots.          */
const CMD_MODELS=['products','ingredients','supplies','suppliers','purchase_orders','custom_orders',
                  'production_batches','transfers','count_sessions','variance_log','inventory_movements'];
// second line under a result — what tells two similar rows apart
function _cmdSub(mdl,r){
  const p=[];
  if(mdl==='products'||mdl==='ingredients'||mdl==='supplies'){ if(r.sku)p.push(r.sku); if(r.group_1||r.category)p.push(r.group_1||r.category); if(r.variant)p.push(r.variant); }
  else if(mdl==='purchase_orders'){ if(r.supplier_name)p.push(r.supplier_name); if(r.order_date)p.push(r.order_date); if(r.status)p.push(statusLabel('purchase_orders',r.status)); }
  else if(mdl==='custom_orders'){ if(r.customer_name)p.push(r.customer_name); if(r.needed_date)p.push('needed '+r.needed_date); if(r.status)p.push(typeof coStatDef==='function'?(coStatDef(r.status).l||r.status):r.status); }
  else if(mdl==='production_batches'){ if(r.product_sku)p.push(r.product_sku); if(r.production_date)p.push(r.production_date); if(r.status)p.push(r.status); }
  else if(mdl==='transfers'){ p.push((r.from_code||'?')+' → '+(r.to_code||'?')); if(r.transfer_date)p.push(r.transfer_date); }
  else if(mdl==='count_sessions'){ if(r.location_code)p.push(r.location_code); if(r.count_date)p.push(r.count_date); }
  else if(mdl==='variance_log'){ if(r.check_type)p.push(r.check_type); if(r.location)p.push(r.location); }
  else if(mdl==='inventory_movements'){ if(r.movement_type)p.push(r.movement_type); if(r.location_code)p.push(r.location_code); if(r.qty!=null)p.push(num(r.qty)); }
  else if(mdl==='suppliers'){ if(r.supplier_id)p.push(r.supplier_id); if(r.mobile)p.push(r.mobile); if(r.payment_term)p.push(r.payment_term); }
  return p.filter(Boolean).join(' · ');
}
// an exact SKU / reference hit ranks above a word found mid-name
function _cmdScore(mdl,r,q){
  const m=MODELS[mdl]||{}; const pk=String(r[m.pk]||'').toLowerCase(), nm=String(r[m.name]||'').toLowerCase();
  if(pk===q||nm===q) return 0;
  if(pk.startsWith(q)||nm.startsWith(q)) return 1;
  if(pk.includes(q)) return 2;
  if(nm.includes(q)) return 3;
  return 4;
}
let _cmdSeq=0;
async function cmdSearch(q){
  const raw=String(q||'').trim(); const ql=raw.toLowerCase(); const seq=++_cmdSeq;
  const items=[], mods=[], errs=[];
  if(!ql||'dashboard'.includes(ql)) mods.push({icon:'🏠',label:'Dashboard',tag:'Go to',act:()=>openModel('home')});
  Object.keys(MODELS).forEach(k=>{ if(!ql||MODELS[k].label.toLowerCase().includes(ql)) mods.push({icon:MODELS[k].icon,label:MODELS[k].label,tag:'Go to',act:()=>openModel(k)}); });
  if(ql.length>=2){
    const found=await Promise.all(CMD_MODELS.map(async mdl=>{
      const m=MODELS[mdl]; if(!m) return null;
      try{ return {mdl, rows:await db.list(mdl,{search:raw})}; }
      catch(e){ return {mdl, rows:[], err:(e&&e.message)||String(e)}; }
    }));
    if(seq!==_cmdSeq) return;                       // a newer keystroke overtook this one
    found.filter(Boolean).forEach(({mdl,rows,err})=>{
      const m=MODELS[mdl];
      if(err){ errs.push({icon:'⚠',label:'Could not search '+m.label,sub:err,tag:'Error',act:()=>openModel(mdl)}); return; }
      (rows||[]).filter(r=>r.active!==false)
        .sort((a,b)=>_cmdScore(mdl,a,ql)-_cmdScore(mdl,b,ql))
        .slice(0,8)
        .forEach(r=>items.push({icon:m.icon, label:String(r[m.name]||r[m.pk]||'(untitled)'), sub:_cmdSub(mdl,r), tag:m.label,
          _s:_cmdScore(mdl,r,ql),
          act:()=>{ if(mdl==='custom_orders'){ openModel('custom_orders'); setTimeout(()=>coOpen(encodeURIComponent(r[m.pk])),60); }
                    else if(m.special){ openModel(mdl); }
                    else gotoRecord(mdl, r[m.pk]); }}));
    });
    items.sort((a,b)=>a._s-b._s);
  }
  cmdItems=errs.concat(items.slice(0,40)).concat(mods.slice(0,12));
  if(ql.length===1) cmdItems=mods.slice(0,20);
  cmdSel=0; renderCmd(ql);
}
function renderCmd(q){ const el=$('cmdres'); if(!el) return;
  const nRec=cmdItems.filter(i=>i.tag!=='Go to'&&i.tag!=='Error').length;
  const hint = (q&&q.length===1) ? '<div class="r" style="color:var(--muted);font-size:12px">Keep typing — records are searched from 2 characters.</div>' : '';
  el.innerHTML=hint+cmdItems.map((it,i)=>`<div class="r ${i===cmdSel?'sel':''}" onclick="cmdRun(${i})"><span>${it.icon}</span><span>${esc(it.label)}${it.sub?`<div class="mini" style="color:var(--muted)">${esc(it.sub)}</div>`:''}</span><span class="tag">${esc(it.tag)}</span></div>`).join('')
    || (q?'<div class="r">No match for “'+esc(q)+'” — try a SKU, a reference, a customer or a supplier.</div>':'<div class="r">Type to search.</div>');
  el.setAttribute('data-n',nRec); }
function cmdRun(i){ const it=cmdItems[i]; if(it){ closeCmd(); it.act(); } }
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openCmd(); return; }
  const w=$('cmdwrap'); if(!w||!w.classList.contains('on')) return;
  if(e.key==='Escape') closeCmd();
  else if(e.key==='ArrowDown'){ e.preventDefault(); cmdSel=Math.min(cmdItems.length-1,cmdSel+1); renderCmd(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); cmdSel=Math.max(0,cmdSel-1); renderCmd(); }
  else if(e.key==='Enter') cmdRun(cmdSel);
});

/* ==================== Custom Orders (CS quote → lock → product+BOM+demand) ==================== */
let coRec={}, coLines=[]; let _coView='list'; let _coProd={}, _coIng=[];
/* ---- Custom order lifecycle -------------------------------------------------
   The old model had three states (quote / confirmed / fulfilled) which could not
   answer "is this in the demand run yet?" or "has half of it been made?". These
   six do. Everything after `for_production` is DERIVED from facts — a demand row,
   a production plan, confirmed packs — so nobody has to remember to move a card.  */
const CO_FLOW=[
  {k:'draft',          l:'Draft',                b:'open',      d:'Editable quote. Nothing reserved, nothing in demand.'},
  {k:'for_production', l:'For Production',       b:'confirmed', d:'Locked. Its packs go into the demand run.'},
  {k:'in_demand',      l:'Added in Demand',      b:'invoiced',  d:'Counted in a demand plan / MRP.'},
  {k:'in_production',  l:'In Production',        b:'invoiced',  d:'On a DRAFT production plan whose date has not passed. Nothing is produced yet — confirming the run moves it on. An abandoned draft in the past does not count.'},
  {k:'partial',        l:'Partially Fulfilled',  b:'invoiced',  d:'At least one confirmed production, not all packs yet.'},
  {k:'completed',      l:'Completed',            b:'received',  d:'Every ordered pack has been produced.'},
  {k:'cancelled',      l:'Cancelled',            b:'cancelled', d:'Voided.'}
];
const _CO_LEGACY={quote:'draft', confirmed:'for_production', fulfilled:'completed', '':'draft'};
function coStat(s){ const k=String(s||'').toLowerCase(); return _CO_LEGACY[k]||(CO_FLOW.some(f=>f.k===k)?k:'draft'); }
function coStatDef(s){ const k=coStat(s); return CO_FLOW.find(f=>f.k===k)||CO_FLOW[0]; }
function coStatLabel(s){ return coStatDef(s).l; }
function coStatBadge(s){ const f=coStatDef(s); return `<span class="badge b-${f.b}" title="${esc(f.d)}">${esc(f.l)}</span>`; }
// Locked = past Draft and not cancelled. These are the orders that owe production.
const CO_OPEN=['for_production','in_demand','in_production','partial'];
function coIsOpen(s){ return CO_OPEN.includes(coStat(s)); }
function coIsLocked(s){ const k=coStat(s); return k!=='draft'; }
function _coHash(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return (h>>>0).toString(36); }
function _coRecipeKey(recipe, packG){ const norm=(recipe||[]).filter(r=>r.ingredient_sku&&+r.grams>0).map(r=>r.ingredient_sku+':'+(+r.grams)).sort().join('|'); return _coHash(norm+'@'+(+packG||0)); }
function _coLineTotal(l){ return Math.round((+l.packs||0)*(+l.unit_price||0)*100)/100; }
function _coSubtotal(){ return coLines.reduce((s,l)=>s+_coLineTotal(l),0); }
function _coTotal(){ return Math.max(0,_coSubtotal()-(+coRec.discount||0)+(+coRec.delivery_fee||0)); }
// Add/accumulate a demand row for a product SKU on a plan date (feeds Demand/MRP).
// Returns '' on success, or an error string. NEVER swallow the failure silently:
// a demand row that was never written is invisible until someone notices the MRP
// is short, which is far too late.
async function coAddDemand(sku, qty, planDate){ qty=+qty||0; if(!(qty>0)||!sku) return '';
  if(isLive()){ try{ const ex=await sb('demand?select=id,qty&sku=eq.'+encodeURIComponent(sku)+'&plan_date=eq.'+encodeURIComponent(planDate));
      if(ex&&ex.length){ await sb('demand?id=eq.'+encodeURIComponent(ex[0].id),{method:'PATCH',body:JSON.stringify({qty:(+ex[0].qty||0)+qty})}); }
      else { await sb('demand',{method:'POST',prefer:'return=minimal',body:JSON.stringify({sku,qty,plan_date:planDate})}); }
      return ''; }
    catch(e){ const m=String((e&&e.message)||e); console.error('coAddDemand failed',sku,planDate,m); return sku+' → '+m; } }
  DEMO.demand=DEMO.demand||[]; const ex=DEMO.demand.find(d=>d.sku===sku&&String(d.plan_date||'')===String(planDate||''));
  if(ex) ex.qty=(+ex.qty||0)+qty; else DEMO.demand.push({sku,qty,plan_date:planDate});
  return ''; }

/* Demand owed by every LOCKED, not-yet-completed custom order — deliberately
   independent of the scheduled date. Once an order is locked the packs have to be
   made; holding them out of the run until their needed_date arrives is what made
   the MRP under-order. The needed date still travels with the row so you can see
   what is urgent and what is not.

   This also replaces the `demand` table as the source of truth for CUST- SKUs.
   That table is only a cache written at lock time: it can be missing (the write
   failed, or the order was loaded by SQL) or stale (needed_date moved later).
   Returns {sku: {packs, needed, orders:[{ref,customer,packs,needed}]}}.          */
async function coOpenDemand(){
  const map={};
  let orders=[], lines=[];
  try{ orders=await db.list('custom_orders',{}); lines=await db.list('custom_order_lines',{}); }catch(e){ return map; }
  const keep={};
  (orders||[]).forEach(o=>{ if(coIsOpen(o.status)) keep[o.order_ref]=o; });
  /* Only what is STILL OWED. Packs already produced come off, so an order that
     has been made does not queue up again in the next demand run — and a
     partially fulfilled one asks for the remainder, not the whole order.
     Attribution is soonest-needed-first, the same order coSyncStatuses uses,
     so two orders sharing a recipe cannot both claim the same packs. */
  const made={};
  try{ let rows;
    // prep batches carry kilos, not packs — they must never count as packs made
    if(isLive()) rows=await sb('production_batches?select=product_sku,good_packs,status,kind&status=eq.confirmed');
    else rows=(DEMO.production_batches||[]).filter(b=>b.status==='confirmed');
    (rows||[]).filter(b=>b.kind!=='output').forEach(b=>{ made[b.product_sku]=(made[b.product_sku]||0)+(+b.good_packs||0); });
  }catch(e){}
  const pool={...made}, owed={};
  const byNeed=Object.values(keep).sort((a,b)=>
    String(a.needed_date||'9999').localeCompare(String(b.needed_date||'9999'))||String(a.order_ref).localeCompare(b.order_ref));
  byNeed.forEach(o=>{ (lines||[]).forEach(l=>{ if(l.order_ref!==o.order_ref||!l.product_sku) return;
    const q=+l.packs||0; if(!(q>0)) return;
    const take=Math.min(q, pool[l.product_sku]||0);
    pool[l.product_sku]=(pool[l.product_sku]||0)-take;
    owed[o.order_ref+'|'+l.product_sku]=(owed[o.order_ref+'|'+l.product_sku]||0)+(q-take);
  }); });
  (lines||[]).forEach(l=>{ const o=keep[l.order_ref]; if(!o||!l.product_sku) return;
    const q=owed[l.order_ref+'|'+l.product_sku]||0; if(!(q>0)) return;
    const needed=String(o.needed_date||o.order_date||'').slice(0,10);
    const e=map[l.product_sku]=map[l.product_sku]||{packs:0,needed:'',orders:[]};
    e.packs+=q;
    if(needed && (!e.needed || needed<e.needed)) e.needed=needed;       // soonest need drives urgency
    e.orders.push({ref:l.order_ref, customer:o.customer_name||'', packs:q, needed});
  });
  return map; }
// Flat {sku: packs} for the demand map.
async function coOpenDemandMap(){ const m=await coOpenDemand(); const out={};
  Object.keys(m).forEach(s=>{ out[s]=m[s].packs; }); return out; }

/* Why is the custom-order section empty? There are only four reasons an order
   fails to reach the demand run, and guessing between them from a screenshot is
   hopeless — so the app says which one it is, per order. */
async function coDemandDiag(){
  let orders=[], lines=[], err='';
  try{ orders=await db.list('custom_orders',{}); }catch(e){ err=String(e&&e.message||e); }
  try{ lines=await db.list('custom_order_lines',{}); }catch(e){ err=err||String(e&&e.message||e); }
  const byOrder={}; (lines||[]).forEach(l=>{ (byOrder[l.order_ref]=byOrder[l.order_ref]||[]).push(l); });
  const rows=(orders||[]).map(o=>{
    const ls=byOrder[o.order_ref]||[];
    const withSku=ls.filter(l=>l.product_sku);
    const packs=withSku.reduce((s,l)=>s+(+l.packs||0),0);
    const st=coStat(o.status);
    let reason='';
    if(st==='draft')          reason='Still a Draft — open it and press 🔒 Lock.';
    else if(st==='cancelled') reason='Cancelled.';
    else if(st==='completed') reason='Completed — every pack already produced.';
    else if(!ls.length)       reason='No order lines at all.';
    else if(!withSku.length)  reason='Lines have no product SKU — it was never locked, so no CUST- SKU was created.';
    else if(!(packs>0))       reason='Lines have a SKU but zero packs.';
    return {ref:o.order_ref, customer:o.customer_name||'', status:st, label:coStatLabel(o.status),
            needed:String(o.needed_date||'').slice(0,10), lines:ls.length, withSku:withSku.length, packs, reason};
  }).sort((a,b)=>String(a.needed||'9999').localeCompare(String(b.needed||'9999')));
  return {rows, err, counted:rows.filter(r=>!r.reason).length};
}

/* ---- WHERE IS THIS ORDER ACTUALLY PLANNED? ---------------------------------
   One shared reading of the facts, used by the status sync AND by the demand
   run — so the badge on a card and the grouping in the MRP can never disagree.

   Two things count as "planned":
     • a row in the `demand` table (a saved demand plot), with its plan date
     • a line on a production plan that is still a DRAFT, with its run reference

   The draft test is deliberately narrow. Before this, ANY draft batch row for a
   SKU — including one from a plan dated weeks ago that the kitchen abandoned and
   never confirmed — held the order at "In Production" for ever, which is how an
   order with nothing produced ends up looking like it is being made right now.
   A draft only counts while its production date is still ahead of us, and only
   if it actually plans packs.                                                  */
async function coPlanEvidence(){
  const _today=todayISO();
  const planned={}, inDemand={};
  try{ let rows;
    if(isLive()) rows=await sb('production_batches?select=product_sku,status,planned_packs,good_packs,production_date,run_ref,batch_ref,kind&status=eq.draft');
    else rows=(DEMO.production_batches||[]).filter(b=>b.status==='draft');
    (rows||[]).filter(b=>b.kind!=='output').forEach(b=>{
      if(!((+b.planned_packs||0)>0 || (+b.good_packs||0)>0)) return;     // a zero line plans nothing
      const d=String(b.production_date||'').slice(0,10);
      if(d && d<_today) return;                                          // abandoned draft — not "in production"
      const cur=planned[b.product_sku];
      if(!cur || (d && (!cur.date || d<cur.date))) planned[b.product_sku]={ref:b.run_ref||b.batch_ref||'', date:d};
    });
  }catch(e){}
  try{ let rows;
    if(isLive()) rows=await sb('demand?select=sku,qty,plan_date');
    else rows=(DEMO.demand||[]);
    (rows||[]).forEach(r=>{ if(!((+r.qty||0)>0)) return;
      const d=String(r.plan_date||'').slice(0,10); const cur=inDemand[r.sku];
      if(!cur || (d && (!cur.date || d>cur.date))) inDemand[r.sku]={date:d, qty:+r.qty||0};
    });
  }catch(e){}
  /* THE SAVED DEMAND PLOT. This is where the first version went wrong: a plot
     does not write rows into the `demand` table — it stores the whole SKU→packs
     map inside its own document (mrp_plans.data.demand), which is also what the
     Production Plan reads its locked target from. Checking only the `demand`
     table meant an order that was plotted and LOCKED still reported "not planned
     yet", because the evidence was sitting in a place nobody looked. */
  try{
    const plots=await mrpPlans();
    (plots||[]).forEach(pl=>{
      const d=(pl&&pl.data)||{}; const dem=d.demand||{};
      const date=String(pl.plan_date||pl.date||'').slice(0,10);
      const ref=d.ref||pl.ref||'';
      Object.keys(dem).forEach(sku=>{ if(!((+dem[sku]||0)>0)) return;
        const cur=inDemand[sku];
        // the most recent plot wins, and a plot is better evidence than a bare
        // demand row because it carries the DP reference the kitchen works from
        if(!cur || !cur.ref || (date && cur.date && date>cur.date)) inDemand[sku]={date, qty:+dem[sku]||0, ref, locked:!!d.locked};
      });
    });
  }catch(e){}
  return {planned, inDemand};
}
// Plain-English "why is it at this status", for the card and the demand run.
function coWhyText(ev, sku){
  const p=(ev.planned||{})[sku], d=(ev.inDemand||{})[sku];
  if(p) return 'on production plan '+(p.ref||'(draft)')+(p.date?' for '+p.date:'');
  if(d) return (d.locked?'in locked demand ':'on the demand plot ')+(d.ref?d.ref+' ':'')
              +(d.date?'('+d.date+')':'')+(d.qty?' · '+d.qty+' pack(s)':'');
  return '';
}

/* Recompute every custom order's status from what is actually true, and persist
   the ones that moved. Called when the Custom Orders list renders, after a demand
   pull and after a production post — so the board is never stale.
   NOTE: identical recipes hash to the SAME CUST- SKU, so two orders for the same
   recipe share produced packs. Production is attributed soonest-needed-first.   */
async function coSyncStatuses(){
  let orders=[], lines=[];
  try{ orders=await db.list('custom_orders',{}); lines=await db.list('custom_order_lines',{}); }catch(e){ return {}; }
  // packs confirmed produced, per SKU
  const made={};
  try{ let rows;
    // prep batches carry kilos, not packs — they must never count as packs made
    if(isLive()) rows=await sb('production_batches?select=product_sku,good_packs,status,kind&status=eq.confirmed');
    else rows=(DEMO.production_batches||[]).filter(b=>b.status==='confirmed');
    (rows||[]).filter(b=>b.kind!=='output').forEach(b=>{ made[b.product_sku]=(made[b.product_sku]||0)+(+b.good_packs||0); });
  }catch(e){}
  // one shared reading of what is planned where — see coPlanEvidence
  const ev=await coPlanEvidence();
  const planned=ev.planned, inDemand=ev.inDemand;
  // plus whatever is typed into the demand run on screen right now
  Object.keys(mrpDemand||{}).forEach(s=>{ if((+mrpDemand[s]||0)>0 && !inDemand[s]) inDemand[s]={date:(typeof MRPDATE!=='undefined'?MRPDATE:''), qty:+mrpDemand[s]||0}; });

  const byOrder={}; (lines||[]).forEach(l=>{ if(l.product_sku) (byOrder[l.order_ref]=byOrder[l.order_ref]||[]).push(l); });
  // attribute produced packs soonest-needed-first so a shared SKU cannot complete two orders at once
  const pool={...made};
  const open=(orders||[]).filter(o=>coIsOpen(o.status))
    .sort((a,b)=>String(a.needed_date||'9999').localeCompare(String(b.needed_date||'9999'))||String(a.order_ref).localeCompare(b.order_ref));
  const fulfilled={};
  open.forEach(o=>{ let ord=0, got=0;
    (byOrder[o.order_ref]||[]).forEach(l=>{ const q=+l.packs||0; ord+=q;
      const take=Math.min(q, pool[l.product_sku]||0); pool[l.product_sku]=(pool[l.product_sku]||0)-take; got+=take; });
    fulfilled[o.order_ref]={ord,got};
  });

  const moved={}; const why={};
  for(const o of (orders||[])){
    // draft / cancelled / completed are terminal here — an order that is already
    // finished must not be reopened just because the batch history was cleared.
    const cur=coStat(o.status); if(cur==='draft'||cur==='cancelled'||cur==='completed') continue;
    const ls=byOrder[o.order_ref]||[]; const f=fulfilled[o.order_ref]||{ord:0,got:0};
    let next;
    if(f.ord>0 && f.got>=f.ord){ next='completed'; why[o.order_ref]=f.got+' of '+f.ord+' pack(s) produced'; }
    else if(f.got>0){             next='partial';   why[o.order_ref]=f.got+' of '+f.ord+' pack(s) produced'; }
    else if(ls.some(l=>planned[l.product_sku])){
      next='in_production';
      why[o.order_ref]=coWhyText({planned},(ls.find(l=>planned[l.product_sku])||{}).product_sku);
    }
    else if(ls.some(l=>inDemand[l.product_sku])){
      next='in_demand';
      why[o.order_ref]=coWhyText({inDemand},(ls.find(l=>inDemand[l.product_sku])||{}).product_sku);
    }
    else { next='for_production'; why[o.order_ref]='locked, not on any plan yet'; }
    if(next!==cur){
      moved[o.order_ref]=next;
      try{ await db.update('custom_orders','order_ref',o.order_ref,{status:next}); o.status=next; }catch(e){}
      try{ sysLog('custom_orders',o.order_ref,'→ '+coStatLabel(next)+(why[o.order_ref]?' ('+why[o.order_ref]+')':'')); }catch(e){}
    }
  }
  window._coWhy=why;
  return moved;
}

      <td><input type="number" step="any" inputmode="decimal" ${dis} value="${l.pack_size_g||''}" oninput="coLines[${i}].pack_size_g=+this.value||0" style="width:74px;text-align:right" ${isCustom?'':'title="from product"'}></td>

      <td>${locked?'':`<span style="cursor:pointer;color:var(--danger)" onclick="coDelLine(${i})">✕</span>`}</td></tr>`;
  }).join('');
  $('content').innerHTML=`<div class="formwrap wide"><div class="sheet">
    <div class="hd"><input class="ttl" value="${esc(coRec.order_ref||'')}" disabled placeholder="(reference set on save)"><div class="sub">Custom order ${badge}</div></div>
    <div class="groups">
      <div><div class="fld"><label>Customer</label><div class="val"><input ${dis} value="${esc(coRec.customer_name||'')}" oninput="coRec.customer_name=this.value" style="width:100%"></div></div>
        <div class="fld"><label>Contact</label><div class="val"><input ${dis} value="${esc(coRec.contact||'')}" oninput="coRec.contact=this.value" style="width:100%"></div></div></div>
      <div><div class="fld"><label>Order date</label><div class="val"><input type="date" ${dis} value="${esc(coRec.order_date||'')}" oninput="coRec.order_date=this.value"></div></div>
        <div class="fld"><label>Personalised name label</label><div class="val"><select ${dis} onchange="coRec.personalized_sticker=this.value==='true'">
          <option value="false" ${coRec.personalized_sticker?'':'selected'}>No — uses the shared Custom Name Sticker</option>
          <option value="true" ${coRec.personalized_sticker?'selected':''}>Yes — printed with the customer's name</option></select></div></div>
        <div class="fld"><label>Needed (demand week)</label><div class="val"><input type="date" ${dis} value="${esc(coRec.needed_date||'')}" oninput="coRec.needed_date=this.value"></div></div></div>
    </div>
    <div class="notebook"><div class="nbtabs"><button class="on">Order lines (${coLines.length})</button></div>
      <div class="lines"><table><thead><tr><th>Type</th><th>Item / recipe</th><th class="num">Pack g</th><th class="num">Packs</th><th class="num">₱/pack</th><th class="num">Line ₱</th><th></th></tr></thead>
      <tbody>${lineRows||'<tr><td colspan="7" class="empty">Add a product or a custom recipe below.</td></tr>'}</tbody></table></div>
      ${locked?'':`<div style="margin-top:8px;display:flex;gap:8px"><span class="addrow" onclick="coAddProduct()">＋ Add product</span><span class="addrow" onclick="coAddCustom()">＋ Add custom recipe</span></div>`}
    </div>
    <div class="groups" style="margin-top:10px">
      <div><div class="fld"><label>Discount ₱</label><div class="val"><input type="number" step="any" inputmode="decimal" ${dis} value="${coRec.discount||''}" oninput="coRec.discount=+this.value||0;coToticker()" style="width:120px"></div></div>
        <div class="fld"><label>Delivery ₱</label><div class="val"><input type="number" step="any" inputmode="decimal" ${dis} value="${coRec.delivery_fee||''}" oninput="coRec.delivery_fee=+this.value||0;coToticker()" style="width:120px"></div></div></div>
      <div><div class="fld"><label>Notes</label><div class="val"><input ${dis} value="${esc(coRec.notes||'')}" oninput="coRec.notes=this.value" style="width:100%"></div></div>
        <div style="text-align:right;margin-top:8px;font-size:15px">Subtotal <b id="coSub">${wpeso(_coSubtotal())}</b> · <b>Total <span id="coTot">${wpeso(_coTotal())}</span></b></div></div>
    </div>
    ${locked?_coFulfilHtml().html:''}
  </div></div>`;
}
function coToticker(){ coLines.forEach((l,i)=>{ const el=$('coLT'+i); if(el) el.textContent=wpeso(_coLineTotal(l)); }); const s=$('coSub'); if(s)s.textContent=wpeso(_coSubtotal()); const t=$('coTot'); if(t)t.textContent=wpeso(_coTotal()); }
function coAddProduct(){ coLines.push({line_type:'product', product_sku:'', description:'', recipe:[], pack_size_g:0, packs:1, unit_price:0}); drawCOForm(); }
function coAddCustom(){ coLines.push({line_type:'custom', product_sku:'', description:'', recipe:[{ingredient_sku:'',grams:0}], pack_size_g:500, packs:1, unit_price:0}); drawCOForm(); }
function coDelLine(i){ coLines.splice(i,1); drawCOForm(); }
function coSetProduct(i,sku){ const l=coLines[i]; l.product_sku=sku; const p=_coProd[sku]; if(p){ l.description=p.name||sku; l.pack_size_g=+p.pack_g||l.pack_size_g||0; if(!(+l.unit_price>0)) l.unit_price=+p.sell_price||0; } drawCOForm(); }
// ---- Recipe editor for a custom line (add/remove counter before saving) ----
let _coEditIdx=-1, _coEditRows=[], _coEditBase=0;
function coEditRecipe(i){ _coEditIdx=i; const l=coLines[i]; _coEditRows=(l.recipe||[]).map(r=>({...r}));
  // No blank starter row any more — each PMR section carries its own "＋ Add".
  _coEditBase=_coEditRows.filter(r=>r.ingredient_sku&&+r.grams>0).length; drawCoRecipe(); }
/* Was grouped by `ingredient_group`, which is not a field on ingredients — so every
   ingredient landed in one "Other" bucket. Now category › base material, like the count. */
function _coIngOptions(sel){ return _ingGroupOptions(_coIng, _coIng, {selected:sel, showKind:true}); }

/* ---- PMR sections, the same eight the Fresh Food Calculator uses ------------
   A raw recipe is not a flat list — it is a ratio. The calculator builds it as
   muscle / organ / bone / liver / secreting / veg / seed / fruit, and CS reads
   the sheet that way, so the ERP's editor now does too: one block per category,
   its own running grams and share of the pack, next to the standard target.
   Colours and targets are lifted from the calculator so the two read alike.   */
const CO_CATS=[
  {k:'muscle',   l:'Muscle meat',             c:'#1D9E75', pct:.45, re:/muscle\s*meat|whole\s*dressed|^meat|fish|sardine|mackerel|source\s*material/i},
  {k:'organ',    l:'Muscle organ',            c:'#7F77DD', pct:.25, re:/muscle\s*organ|^organ/i},
  {k:'bones',    l:'Raw meaty bones',         c:'#D85A30', pct:.10, re:/bone/i},
  {k:'liver',    l:'Liver',                   c:'#BA7517', pct:.05, re:/liver/i},
  {k:'secreting',l:'Other secreting organs',  c:'#D4537E', pct:.05, re:/secret/i},
  {k:'veggies',  l:'Vegetables',              c:'#639922', pct:.07, re:/veg/i},
  {k:'seeds',    l:'Seeds',                   c:'#888780', pct:.02, re:/seed|nut/i},
  {k:'fruit',    l:'Fruit',                   c:'#E24B4A', pct:.01, re:/fruit|berr/i},
  {k:'other',    l:'Supplements &amp; other',  c:'#7b6fe0', pct:0,   re:null},
];
/* Order matters: "Other secreting organs" contains the word "organ", and
   "raw meaty bones" contains "meat". Test the specific ones first. */
const _CO_CAT_ORDER=['bones','liver','secreting','organ','veggies','seeds','fruit','muscle'];
function _coCatOf(ing){
  const t=String((ing&&ing.category)||'')+' '+String((ing&&ing.ingredient_group)||'');
  for(const k of _CO_CAT_ORDER){ const c=CO_CATS.find(x=>x.k===k); if(c&&c.re&&c.re.test(t)) return k; }
  return 'other';
}
function _coCat(k){ return CO_CATS.find(c=>c.k===k)||CO_CATS[CO_CATS.length-1]; }
// The bucket a row sits in: whatever its ingredient is, or the section it was added under.
function _coRowCat(r){
  const ing=(_coIng||[]).find(i=>i.sku===r.ingredient_sku);
  return ing?_coCatOf(ing):(r._cat||'other');
}
// Options for one section — that category first, everything else still reachable below.
function _coIngOptionsFor(cat, sel){
  const mine=(_coIng||[]).filter(i=>_coCatOf(i)===cat);
  const rest=(_coIng||[]).filter(i=>_coCatOf(i)!==cat);
  let h=`<option value="">— pick an ingredient —</option>`;
  if(mine.length) h+=`<optgroup label="${esc(_coCat(cat).l.replace(/&amp;/g,'&'))}">`+
    mine.map(i=>`<option value="${esc(i.sku)}" ${sel===i.sku?'selected':''}>${esc((i.is_intermediate?'Processed: ':'Raw: ')+(i.name||i.sku))}</option>`).join('')+`</optgroup>`;
  h+=`<optgroup label="── everything else ──">`+
    rest.map(i=>`<option value="${esc(i.sku)}" ${sel===i.sku?'selected':''}>${esc(_coCat(_coCatOf(i)).l.replace(/&amp;/g,'&')+' · '+(i.name||i.sku))}</option>`).join('')+`</optgroup>`;
  return h;
}
function _coAddTo(cat){ _coEditRows.push({ingredient_sku:'',grams:0,_cat:cat}); drawCoRecipe(); }
function drawCoRecipe(){
  const now=_coEditRows.filter(r=>r.ingredient_sku&&+r.grams>0).length;
  const totG=_coEditRows.reduce((s,r)=>s+(+r.grams||0),0); const packG=+coLines[_coEditIdx].pack_size_g||0;
  const nUnm=_coEditRows.filter(r=>r.src_name&&!r.ingredient_sku).length;
  // bucket every row by its ingredient's PMR category
  const byCat={}; CO_CATS.forEach(c=>byCat[c.k]=[]);
  _coEditRows.forEach((r,j)=>{ const k=_coRowCat(r); (byCat[k]=byCat[k]||[]).push({r,j}); });
  const rowHtml=({r,j},cat)=>{ const unm=r.src_name&&!r.ingredient_sku;
    const srcHint=r.src_name?`<div class="mini" style="color:${unm?'var(--danger)':'var(--muted)'}">calculator: <b>${esc(r.src_name)}</b>${unm?' — pick a match':''}</div>`:'';
    return `<tr${unm?' style="background:#fdf3f0"':''}><td><select onchange="_coEditRows[${j}].ingredient_sku=this.value;drawCoRecipe()" style="width:100%;min-width:200px">${_coIngOptionsFor(cat,r.ingredient_sku)}</select>${srcHint}</td>
      <td class="num"><input type="number" step="any" inputmode="decimal" value="${r.grams||''}" oninput="_coEditRows[${j}].grams=+this.value||0;coRecipeTick()" style="width:84px;text-align:right"> g</td>
      <td style="width:24px"><span style="cursor:pointer;color:var(--danger)" title="Remove" onclick="_coEditRows.splice(${j},1);drawCoRecipe()">✕</span></td></tr>`; };
  const sections=CO_CATS.map(c=>{
    const rows=byCat[c.k]||[];
    if(!rows.length && c.k==='other') return '';                 // don't show an empty catch-all
    const g=rows.reduce((n,x)=>n+(+x.r.grams||0),0);
    const pctNow=packG>0?(g/packG*100):0;
    const tgt=c.pct?Math.round(c.pct*100):0;
    const off=(packG>0&&c.pct)?Math.abs(pctNow-tgt):0;
    const col=!c.pct?'var(--muted)':(off<=2?'#4e7a3e':(off<=6?'var(--earth,#b5762a)':'var(--danger)'));
    return `<div style="border:1px solid var(--line);border-left:4px solid ${c.c};border-radius:8px;margin:0 0 10px;overflow:hidden">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 10px;background:#fbfbf8">
        <b style="color:${c.c}">${c.l}</b>
        <span class="mini" style="color:var(--muted)">${rows.length} item${rows.length===1?'':'s'}</span>
        <div style="flex:1"></div>
        <span class="mini"><b>${Math.round(g*10)/10} g</b>${packG>0?` · <span style="color:${col};font-weight:700">${pctNow.toFixed(1)}%</span>`:''}${c.pct?` <span style="color:var(--muted)">of ${tgt}% standard</span>`:''}</span>
      </div>
      ${rows.length?`<table style="margin:0"><tbody>${rows.map(x=>rowHtml(x,c.k)).join('')}</tbody></table>`:''}
      <div style="padding:6px 10px"><span class="addrow" onclick="_coAddTo('${c.k}')">＋ Add ${c.l.replace(/&amp;/g,'&').toLowerCase()}</span></div>
    </div>`; }).join('');
  $('modal').innerHTML=`<div><h3>🧪 Custom recipe — ${esc(coLines[_coEditIdx].description||'')||'(unnamed)'}</h3>
    <p class="mini">Built the way the <b>Fresh Food Calculator</b> builds it — one section per PMR category, grams <b>per pack</b>. Each header shows what that section adds up to against the standard raw ratio, so an unbalanced mix is obvious before you save. This becomes the sellable SKU's BOM when the order is locked. Pack size: <b>${packG||'—'} g</b>.${nUnm?` <b style="color:var(--danger)">${nUnm} calculator ingredient(s) need a match</b> — pick the equivalent from your master list; the app <b>remembers it</b> for next time.`:''}</p>
    <div style="max-height:52vh;overflow:auto;padding-right:2px">${sections}</div>
    <div id="coRecSum" style="margin-top:10px;padding:8px 10px;background:#f6f8f4;border-radius:8px;font-size:13px">${_coRecipeSummaryHtml()}</div>
    <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" id="coRecSaveBtn" onclick="coSaveRecipe()">💾 Save recipe (${now})</button><button class="btn sec" onclick="closeModal()">Cancel</button></div></div>`;
  modalWide(true); $('overlay').classList.add('on');
}
// summary HTML (recomputed live without re-rendering rows, so focus stays put)
function _coRecipeSummaryHtml(){
  const now=_coEditRows.filter(r=>r.ingredient_sku&&+r.grams>0).length; const added=Math.max(0,now-_coEditBase), removed=Math.max(0,_coEditBase-now);
  const totG=_coEditRows.reduce((s,r)=>s+(+r.grams||0),0); const packG=+((coLines[_coEditIdx]||{}).pack_size_g)||0;
  // #2 duplicate check — does this exact recipe already exist as a custom SKU?
  const clean=_coEditRows.filter(r=>r.ingredient_sku&&+r.grams>0);
  let dupHtml='';
  if(clean.length && packG>0){ const sku='CUST-'+_coRecipeKey(clean,packG).toUpperCase(); const dup=_coProd[sku];
    if(dup) dupHtml=`<div style="margin-top:6px;color:#2f7d33">♻ This exact recipe already exists as <b>${esc(dup.name||sku)}</b> (<code>${esc(sku)}</code>) — locking will <b>reuse</b> it, no duplicate SKU is created.</div>`; }
  return `Recipe total <b>${Math.round(totG)} g</b>${packG?` of ${packG} g pack ${Math.abs(totG-packG)<0.5?'<span style="color:#4e7a3e">✓ matches</span>':`<span style="color:var(--earth,#b5762a)">(${totG>packG?'+':''}${Math.round(totG-packG)} g vs pack)</span>`}`:''} · <b>${now}</b> ingredient(s) — <span style="color:#4e7a3e">${added} added</span>, <span style="color:var(--danger)">${removed} removed</span> since opened${dupHtml}`;
}
function coRecipeTick(){ const s=$('coRecSum'); if(s) s.innerHTML=_coRecipeSummaryHtml(); const btn=$('coRecSaveBtn'); if(btn){ const now=_coEditRows.filter(r=>r.ingredient_sku&&+r.grams>0).length; btn.textContent='💾 Save recipe ('+now+')'; } }
function coSaveRecipe(){ const clean=_coEditRows.filter(r=>r.ingredient_sku&&+r.grams>0); coLines[_coEditIdx].recipe=clean;
  // remember every calculator-name → SKU mapping so future imports auto-match
  const toLearn=_coEditRows.filter(r=>r.src_name&&r.ingredient_sku);
  if(toLearn.length){ (async()=>{ for(const r of toLearn){ await ffLearnAlias(r.src_name, r.ingredient_sku); } })(); }
  closeModal(); drawCOForm(); toast('Recipe saved · '+clean.length+' ingredient(s)'+(toLearn.length?' · '+toLearn.length+' mapping(s) remembered':'')); }
async function coSave(){
  if(!coLines.length){ toast('Add at least one line',true); return; }
  if(!coRec.order_ref){ try{ coRec.order_ref=(await genRef('CO',{date:coRec.order_date})).ref; }catch(e){ coRec.order_ref='CO-'+_mmddyyyy(coRec.order_date)+'-'+String(Date.now()).slice(-4); } }
  try{
    const hdr={order_ref:coRec.order_ref, customer_name:coRec.customer_name||'', contact:coRec.contact||'', order_date:coRec.order_date||todayISO(), needed_date:coRec.needed_date||coRec.order_date||todayISO(), status:coRec.status||'draft', notes:coRec.notes||'', discount:+coRec.discount||0, delivery_fee:+coRec.delivery_fee||0, personalized_sticker:!!coRec.personalized_sticker, created_by:coRec.created_by||CURRENT_USER};
    const exists=(await db.list('custom_orders',{})).some(o=>o.order_ref===coRec.order_ref);
    if(exists) await db.update('custom_orders','order_ref',coRec.order_ref,hdr); else await db.create('custom_orders',hdr);
    await _coSaveLines();
    sysLog('custom_orders',coRec.order_ref,'📝 Quote saved ('+coLines.length+' line(s)) by '+CURRENT_USER);
    toast('Quote saved · '+coRec.order_ref+(isLive()?' · Supabase':' · local only')); drawCOForm();
  }catch(e){ toast(_coErr(e),true); }
}
// Friendlier persistence error — the usual cause is the migration not being run.
function _coErr(e){ const m=String((e&&e.message)||e||''); return /custom_order|relation|does not exist|schema cache|404|Not Found|PGRST/i.test(m) ? ('Save failed — is the Custom Orders migration applied? Run wr_migration_custom_orders.sql in Supabase. ('+m+')') : m; }
async function _coSaveLines(){ const recs=coLines.map(l=>({order_ref:coRec.order_ref, line_type:l.line_type, product_sku:l.product_sku||null, description:l.description||'', recipe:(l.line_type==='custom'?(l.recipe||[]):null), pack_size_g:+l.pack_size_g||0, packs:+l.packs||0, unit_price:+l.unit_price||0}));
  await db.replaceChildren({model:'custom_order_lines',fk:'order_ref'}, coRec.order_ref, recs); }
async function coLock(){
  if(!coLines.length){ toast('Nothing to lock',true); return; }
  // validate
  for(const l of coLines){ if(l.line_type==='product'){ if(!l.product_sku){ toast('Pick a product on every product line',true); return; } }
    else { const clean=(l.recipe||[]).filter(r=>r.ingredient_sku&&+r.grams>0); if(!clean.length){ toast('Add ingredients to every custom recipe',true); return; } if(!(+l.pack_size_g>0)){ toast('Set a pack size on every custom recipe',true); return; } if(!(+l.packs>0)){ toast('Set packs on every line',true); return; } } }
  if(!confirm('Lock this order?\n\n• Each custom recipe becomes a sellable SKU + BOM\n• '+coLines.reduce((s,l)=>s+(+l.packs||0),0)+' pack(s) go into demand for '+(coRec.needed_date||coRec.order_date)+'\n\nThe quote can no longer be edited.')) return;
  if(!coRec.order_ref){ try{ coRec.order_ref=(await genRef('CO',{date:coRec.order_date})).ref; }catch(e){ coRec.order_ref='CO-'+_mmddyyyy(coRec.order_date)+'-'+String(Date.now()).slice(-4); } }
  showBusy('Locking order — creating SKUs, BOMs & demand…');
  try{
    const existProd=new Set((await db.list('products',{})).map(p=>p.sku));
    let made=0; const demErrs=[];
    for(const l of coLines){
      if(l.line_type==='custom'){
        const recipe=(l.recipe||[]).filter(r=>r.ingredient_sku&&+r.grams>0);
        const sku='CUST-'+_coRecipeKey(recipe,l.pack_size_g).toUpperCase();
        l.product_sku=sku;
        if(!existProd.has(sku)){
          const prec={sku, group_1:'Custom Orders', group_2:(coRec.customer_name||'Custom'), family:'Custom', variant:(l.description||'Custom meal'),
            name:(l.description||'Custom meal')+' · '+(l.pack_size_g||0)+'g', pack_g:+l.pack_size_g||0, box_size:1, status:'Active',
            animal:'Dog', sell_price:+l.unit_price||0, shelf_life_days:4, is_custom:true, feeding_style:'Mix'};
          try{ await db.create('products',prec); existProd.add(sku); made++;
            const bom=recipe.map(r=>({product_sku:sku, ingredient_sku:r.ingredient_sku, usable_g:+r.grams||0}));
            await db.replaceChildren({model:'bom_lines',fk:'product_sku'}, sku, bom);
          }catch(e){}
        }
        if(!_coProd[sku]) _coProd[sku]={sku,name:prec2Name(l),group_1:'Custom Orders',group_2:coRec.customer_name||'Custom',pack_g:+l.pack_size_g||0,is_custom:true};
      }
      const _de=await coAddDemand(l.product_sku, +l.packs||0, coRec.needed_date||coRec.order_date||todayISO());
      if(_de) demErrs.push(_de);
    }
    coRec.status='for_production';
    await coSave();   // persists lines (with product_sku) + header with status confirmed
    await db.update('custom_orders','order_ref',coRec.order_ref,{status:'for_production'});
    coRec.status='for_production';
    sysLog('custom_orders',coRec.order_ref,'🔒 Order locked — '+made+' new custom SKU(s), demand '+(demErrs.length?('FAILED for '+demErrs.length+' line(s): '+demErrs.join('; ')):('pushed for '+(coRec.needed_date||coRec.order_date)))+' by '+CURRENT_USER);
    hideBusy();
    if(demErrs.length) toast('Order locked, but the demand write failed for '+demErrs.length+' line(s) — Demand/MRP will still pick it up from the order itself. '+demErrs[0],true);
    else toast('Order locked · '+made+' custom SKU(s) created · demand pushed'+(isLive()?' · saved to Supabase':' · local only'));
    drawCOForm();
  }catch(e){ hideBusy(); toast(_coErr(e),true); }
}
function prec2Name(l){ return (l.description||'Custom meal')+' · '+(l.pack_size_g||0)+'g'; }
async function coFulfil(){ if(!confirm('Mark this order fulfilled?')) return; try{ await db.update('custom_orders','order_ref',coRec.order_ref,{status:'completed'}); coRec.status='completed'; sysLog('custom_orders',coRec.order_ref,'✓ Fulfilled by '+CURRENT_USER); toast('Marked fulfilled'); drawCOForm(); }catch(e){ toast(e.message,true); } }

// Flatten a backup file into ffcalc_profiles rows. Tolerates both the wrapped backup shape
// and a bare {single_pet:{},multi_pet:{}} object.
function _ffFlatten(j){
  const src=(j&&j.profiles)||j||{}; const out=[];
  const take=(bucket,kind)=>{ const o=src[bucket]||{}; Object.keys(o).forEach(k=>{ const p=o[k]||{};

      dog:p.dogName||(dogs.length?dogs.join(', '):''), payload:p, updated_at:p.savedAt||null,
      pets:dogs.length||1 }); }); };
  take('single_pet','nc'); take('multi_pet','md');
  return out;
}

async function ffImportRun(){

      updated_at:x.updated_at||new Date().toISOString()}));

/* ===== Production Request workbook → BOM =====
   The kitchen's "Production Request" .xlsx holds the real recipe per customer: one tab per
   customer, one "Mix N" block per product inside. These tabs are hand-made and inconsistent —
   the parser below was proven against all 65 tabs (88 mixes, 86 balancing to their stated pack
   size; the 2 that don't are sheet errors, and are flagged rather than silently used).

   This is a BETTER source than a calculator profile: a profile stores category choices and the
   app derives grams from BARF ratios, whereas this workbook is what the kitchen actually weighs.
   When both exist for an order, the workbook wins. */
const _prMixRe   = /^\s*mix\s*#?\s*(\d+)\s*[:\-]?\s*(.*)$/i;
const _prTotalRe = /^\s*(total|total grams|grand total)\s*$/i;
const _prSkipRe  = /^\s*(ingredient|kitchen sheet|variant|weight|portion|grams?|mix\s*#|qty|number of packs)\s*$/i;
function _prNum(v){ if(typeof v==='number' && isFinite(v)) return v;
  if(typeof v==='string'){ const n=parseFloat(v.replace(/,/g,'').trim()); return isFinite(n)&&/^[-\d.,\s]+$/.test(v)?n:null; }
  return null; }
function _prBanners(aoa){ const out=[];
  aoa.forEach((row,r)=>(row||[]).forEach((v,c)=>{ if(typeof v==='string'){ const m=_prMixRe.exec(v);
    if(m) out.push({r,c,no:+m[1],label:(m[2]||'').trim()}); } }));
  return out; }
/* The label is the LAST text cell BEFORE the first number in the row. That single rule handles
   every layout seen: it steps over the "Mix 1" banner and the "GC PORK" variant column, over the
   "Kitchen Sheet" marker, and picks up the ingredient sitting beside the mix name in column A. */
function _prReadBlock(aoa, r0, c0, rEnd, cEnd){
  const lines=[]; let packSize=null; const packsSeen=[];
  for(let r=r0; r<Math.min(rEnd, aoa.length); r++){
    const row=aoa[r]||[]; const win=[];
    for(let c=c0; c<Math.min(cEnd, row.length); c++) win.push([c,row[c]]);
    let firstNumC=null; for(const [c,v] of win){ if(_prNum(v)!==null){ firstNumC=c; break; } }
    const strs=win.filter(([c,v])=>typeof v==='string' && v.trim() && (firstNumC===null||c<firstNumC));
    const label=strs.length?String(strs[strs.length-1][1]).trim():null;
    const labC =strs.length?strs[strs.length-1][0]:null;
    const nums=win.filter(([,v])=>_prNum(v)!==null).map(([c,v])=>[c,_prNum(v)]);
    if(label && _prTotalRe.test(label)){
      if(!lines.length) continue;                 // a header row ending in "Total", not the end
      if(nums.length) packSize=nums[0][1];
      break;
    }
    if(!label){ if(nums.length && packSize===null && lines.length){ packSize=nums[0][1]; break; } continue; }
    if(_prSkipRe.test(label) || _prMixRe.test(label)) continue;
    const after=nums.filter(([c])=>labC===null||c>labC).map(([,n])=>n);
    if(!after.length || after[0]<=0) continue;
    const g=after[0];
    const p=(after.length>1 && after[1]>0 && after[1]===Math.round(after[1]) && after[1]<10000)?after[1]:null;
    lines.push({name:label, grams:g, packs:p});
    if(p) packsSeen.push(p);
  }
  let packs=null;
  if(packsSeen.length){ const cnt={}; packsSeen.forEach(x=>cnt[x]=(cnt[x]||0)+1);
    packs=+Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]; }
  if(packSize===null && lines.length) packSize=Math.round(lines.reduce((s,l)=>s+l.grams,0)*100)/100;
  return {lines, pack_size_g:packSize, packs};
}
function _prParseSheet(aoa){
  const banners=_prBanners(aoa); if(!banners.length) return [];
  const byRow={}; banners.forEach(b=>(byRow[b.r]=byRow[b.r]||[]).push(b));
  const rows=Object.keys(byRow).map(Number).sort((a,b)=>a-b);
  const ncols=aoa.reduce((m,r)=>Math.max(m,(r||[]).length),0);
  const out=[];
  rows.forEach((r,i)=>{
    const grp=byRow[r].slice().sort((a,b)=>a.c-b.c);
    const rEnd=(i+1<rows.length)?rows[i+1]:aoa.length;
    grp.forEach((b,j)=>{
      const cEnd=(j+1<grp.length)?grp[j+1].c:ncols;
      const blk=_prReadBlock(aoa,b.r,b.c,rEnd,cEnd);
      if(blk.lines.length){
        const sum=Math.round(blk.lines.reduce((s,l)=>s+l.grams,0)*100)/100;
        // A retail pack is grams, not kilos. A "pack size" in the tens of thousands means the
        // block's total row is a BATCH figure, or the banner was a stray word on a master tab
        // (the WR sheet yields a phantom 185 kg mix). Flag it — never silently drop or use it.
        const suspect = !(blk.pack_size_g>0 && blk.pack_size_g<=5000) || blk.lines.length<2;
        out.push({mix:b.no, label:b.label, ...blk, sum, suspect,
                  balances:!!(blk.pack_size_g && Math.abs(sum-blk.pack_size_g)<1.5) && !suspect});
      }
    });
  });
  return out;
}
/* Read the whole workbook into {sheetName: [mix,…]} using SheetJS, which the app always loads. */
function prLoadPick(){
  if(typeof XLSX==='undefined'){ toast('The spreadsheet library did not load — check your connection and reload',true); return; }
  const inp=document.createElement('input'); inp.type='file'; inp.accept='.xlsx,.xlsm,.xls'; inp.style.display='none';
  inp.onchange=()=>{ const f=inp.files&&inp.files[0]; if(f) prLoadRead(f); inp.remove(); };
  document.body.appendChild(inp); inp.click();
}
function prLoadRead(f){
  const r=new FileReader();
  r.onload=()=>{
    let wb; try{ wb=XLSX.read(new Uint8Array(r.result),{type:'array'}); }
    catch(e){ toast('Could not read that workbook: '+(e&&e.message||e),true); return; }
    const book={}; let mixes=0, flagged=0;
    wb.SheetNames.forEach(n=>{
      try{
        const aoa=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null});
        const ms=_prParseSheet(aoa);
        if(ms.length){ book[n]=ms; mixes+=ms.length; flagged+=ms.filter(m=>!m.balances).length; }
      }catch(e){}
    });
    window._prBook=book; window._prBookName=f.name;
    toast('Loaded '+Object.keys(book).length+' customer tab(s) · '+mixes+' mix(es)'+(flagged?(' · '+flagged+' do not balance'):''));
    if(window._coImp){ _coImpResolve().then(()=>_coImpDraw()); }
    const el=$('prStatus'); if(el) el.innerHTML=_prStatusHtml();
  };
  r.readAsArrayBuffer(f);
}
function _prStatusHtml(){
  const bk=window._prBook;
  if(!bk) return '<span class="mini" style="color:var(--muted)">No workbook loaded — recipes will come from the saved calculator profiles only.</span>';
  const tabs=Object.keys(bk); const mixes=tabs.reduce((s,t)=>s+bk[t].length,0);
  const sus=tabs.reduce((s,t)=>s+bk[t].filter(m=>m.suspect).length,0);
  const bad=tabs.reduce((s,t)=>s+bk[t].filter(m=>!m.balances&&!m.suspect).length,0);
  return `<span class="mini">📗 <b>${esc(window._prBookName||'workbook')}</b> · ${tabs.length} tab(s) · ${mixes} mix(es)`
    + (bad?` · <span style="color:var(--warn)">${bad} don't sum to their stated pack size</span>`:'')
    + (sus?` · <span style="color:var(--muted)">${sus} look like batch totals, not pack recipes — ignored unless you pick them</span>`:'')
    + (!bad&&!sus?' · all balance':'')
    + `</span>`;
}
/* Find the customer's tab, then the mix that fits the order. A tab whose name starts with
   "New " or "Do not use" is handled by preferring the newest-looking name on a tie. */
function _prFindTab(cust){
  const bk=window._prBook; if(!bk) return null;
  const n=_coNorm(cust); if(!n) return null;
  const nt=n.split(' ').filter(Boolean);
  let best=null;
  Object.keys(bk).forEach(tab=>{
    const t=_coNorm(tab); if(!t || /^(do ?nt|dont|do not) use/.test(t)) return;
    const tt=t.split(' ').filter(Boolean);
    const shared=nt.filter(w=>tt.includes(w));
    const solid=shared.filter(w=>w.length>=4);
    if(!solid.length) return;
    let score = (t===n)?3 : (shared.length===nt.length?2 : (solid.length>=2?2:1));
    if(/^new /.test(t)) score+=0.5;                    // "New Marienette Marquez" supersedes the old tab
    if(!best || score>best.score) best={tab, score};
  });
  return best;
}
function _prPickMix(mixes, packG, packs, mixNo){
  if(!mixes||!mixes.length) return -1;
  let bi=-1, bs=-1, bd=Infinity;
  mixes.forEach((m,i)=>{
    let s=0;
    if(mixNo && +m.mix===+mixNo) s+=3;   // the request named the mix — trust it above all
    if(packG && m.pack_size_g && Math.abs(m.pack_size_g-packG)<=Math.max(1.5,packG*0.01)) s+=2;
    if(packs && m.packs && +m.packs===+packs) s+=2;
    if(!m.balances) s-=1;
    if(m.suspect) s-=3;                  // a batch-total or phantom block can never win
    // Clemence's Mix 3 (225 g) and Mix 4 (225.2 g) both fit 60 packs — break the tie on the
    // closer pack size so a first-listed near-match can't win over the exact one.
    const d=(packG&&m.pack_size_g)?Math.abs(m.pack_size_g-packG):Infinity;
    if(s>bs || (s===bs && d<bd)){ bs=s; bd=d; bi=i; }
  });
  return bs>=2 ? bi : -1;      // need at least a pack-size or pack-count agreement
}
/* ===== Custom Orders: paste-in importer =====
   Paste rows straight out of the order-tracking sheet (Date of Entry, Customer, Request,
   Status, Expected delivery). Each row becomes a draft quote with the pack size and pack
   count parsed out of the free-text request, and the customer matched against the saved
   calculator profiles so CS can load the recipe instead of retyping it. Nothing is created
   until you tick the rows and press Create — and every row lands as a `quote`, never locked. */
function coImportOpen(){
  $('modal').innerHTML=`<div><h3>📥 Import custom orders from the sheet</h3>
    <p class="mini">Copy the rows out of your order sheet (including the header row) and paste them below — tab-separated straight from Google Sheets works. Each row becomes a <b>draft quote</b>; nothing is locked and no demand is created until you open and lock it.</p>
    <div style="background:#f7f6f2;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0 0 10px">
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <button class="btn sec sm" onclick="prLoadPick()">📗 Load Production Request workbook</button>
        <span class="mini" style="color:var(--muted)">optional — gives each order its real kitchen recipe instead of one derived from the calculator profile</span></div>
      <div id="prStatus" style="margin-top:6px"></div></div>
    <textarea id="coImpTxt" rows="7" placeholder="Date of Entry&#9;Customer Name&#9;Request&#9;Status&#9;Expected Delivery&#10;August 12&#9;Alayne Chan&#9;Raw Quail Mix 350g x 42 packs&#9;&#9;August 22" style="width:100%;box-sizing:border-box;padding:9px;border:1px solid var(--line);border-radius:6px;font-family:ui-monospace,Menlo,monospace;font-size:12px"></textarea>
    <div style="display:flex;gap:8px;margin-top:10px"><button class="btn" onclick="coImportParse()">Preview rows →</button><button class="btn sec" onclick="closeModal()">Cancel</button></div>

// Split pasted text into records. Handles Sheets' quoting of multi-line cells.
function _coSplitRows(txt){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<txt.length;i++){ const c=txt[i];
    if(q){ if(c==='"'){ if(txt[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; continue; }
    if(c==='"'){ q=true; continue; }
    if(c==='\t'){ row.push(cell); cell=''; continue; }
    if(c==='\r'){ continue; }
    if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; continue; }
    cell+=c; }
  row.push(cell); rows.push(row);
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
// Pull pack size and pack count out of "Raw Quail Mix 350g x 42 packs" / "Mix 4 … 1kg x 28 packs".
function _coParseReq(req){
  const t=String(req||'').replace(/\s+/g,' ').trim();
  let g=0; const mg=t.match(/(\d+(?:\.\d+)?)\s*(kgs?|grams?|gr?|g)\b/i);
  if(mg){ const n=+mg[1]; g=/^k/i.test(mg[2])?Math.round(n*1000):Math.round(n); }
  // The multiplier must be a standalone "x"/"×" — otherwise the x inside "Mix 4" wins
  // and a 60-pack order reads as 4.
  let packs=0; const mp=t.match(/(?:^|[\s(:•\-])[x×]\s*(\d+)\b/i) || t.match(/(\d+)\s*(?:packs?|sets?|pcs?)\b/i);
  if(mp) packs=+mp[1];
  const cooked=/gently\s*cook|sous\s*vide|cookable|cooked/i.test(t);
  // "Mix 4: Duck + Buffalo…" names the exact block in the Production Request tab.
  const mm=t.match(/\bmix\s*#?\s*(\d+)/i); const mixNo=mm?+mm[1]:null;
  return {pack_size_g:g, packs, cooked, mixNo, desc:t};
}
const _coNorm=s=>String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
// Match a sheet customer name against the saved calculator profiles. Exact → contains →
// shared-token. Returns the candidates with a confidence label so a human decides, because
// "Alayne Chan · Sardines 305g" may or may not be the recipe behind "Raw Quail Mix".
function _coMatchProfiles(name){
  const all=window._ffProf||[]; const n=_coNorm(name); if(!n||n.length<3) return [];
  const nt=n.split(' ').filter(Boolean);
  const scored=all.map(p=>{
    const c=_coNorm(p.cust); if(!c||c.length<3) return null;      // "A", "Sy" etc. are test rows
    if(c===n) return {p, score:3, why:'exact name'};
    // A profile name often carries a suffix: "Teps Perez - Duck Mix". Compare token sets and
    // insist on at least one substantial shared token, so a stray initial can't match everybody.
    const ct=c.split(' ').filter(Boolean);
    const shared=nt.filter(w=>ct.includes(w));
    const solid=shared.filter(w=>w.length>=4);
    if(!solid.length) return null;
    if(shared.length===nt.length) return {p, score:2, why:'all name parts match'};
    if(solid.length>=2) return {p, score:2, why:'surname + given name'};
    return {p, score:1, why:'only "'+solid[0]+'" matches'};
  }).filter(Boolean);
  scored.sort((a,b)=>b.score-a.score||String(a.p.cust).length-String(b.p.cust).length);
  return scored.slice(0,4);
}
async function coImportParse(){
  const txt=(($('coImpTxt')||{}).value)||'';
  if(!txt.trim()){ toast('Paste the rows first',true); return; }
  if(!(window._ffProf||[]).length && isLive()){ try{ await renderFFProfilesQuiet(); }catch(e){} }
  const rows=_coSplitRows(txt);
  // header detection: a row mentioning both a customer column and a request/order column
  let hdr=null, start=0;
  const h0=rows[0].map(_coNorm);
  if(h0.some(c=>/customer|client|name/.test(c)) && h0.some(c=>/request|order|item|description/.test(c))){ hdr=h0; start=1; }
  const idxOf=(...pats)=>{ if(!hdr) return -1; for(const p of pats){ const i=hdr.findIndex(c=>p.test(c)); if(i>=0) return i; } return -1; };
  const iDate=hdr?idxOf(/date of entry/,/^date/,/entry/):0;
  const iCust=hdr?idxOf(/customer/,/client/,/^name/):1;
  const iReq =hdr?idxOf(/request/,/order/,/item/,/description/):2;
  const iDue =hdr?idxOf(/expected|deliver|needed|due/):-1;
  const out=[];
  for(let r=start;r<rows.length;r++){
    const row=rows[r];
    const cust=String(row[iCust>=0?iCust:1]||'').trim();
    const req =String(row[iReq >=0?iReq :2]||'').trim();
    if(!cust && !req) continue;
    if(/^please see/i.test(req) && !cust) continue;
    const parsed=_coParseReq(req);
    out.push({ i:out.length, on:true, date:String(row[iDate>=0?iDate:0]||'').trim(), cust, req,
      due:iDue>=0?String(row[iDue]||'').trim():'', ...parsed, matches:_coMatchProfiles(cust) });
  }
  window._coImp=out;
  await _coImpResolve();
  _coImpDraw();
}
/* For every row, expand the chosen saved profile into a real recipe at that ORDER's pack size
   and map the names to ERP SKUs. This is what makes the imported quote usable — CS gets the
   recipe, not just a pointer to a profile. Auto-picks the best match at "likely" or better;
   a weak match is offered but never applied on its own. */
async function _coImpResolve(){
  const rows=window._coImp||[];
  for(const r of rows){
    if(r.sel===undefined) r.sel=(r.matches[0] && r.matches[0].score>=2) ? 0 : -1;
    r.recipe=[]; r.unmatched=[]; r.recipeErr=''; r.src='';
    // --- 1st choice: the kitchen's Production Request workbook (what they actually weigh) ---
    r.prTab=_prFindTab(r.cust); r.prMixes=(r.prTab && window._prBook)?window._prBook[r.prTab.tab]:null;
    if(r.prMixes && r.prMixes.length){
      if(r.prSel===undefined) r.prSel=_prPickMix(r.prMixes, r.pack_size_g, r.packs, r.mixNo);
      if(r.prSel>=0){
        const mx=r.prMixes[r.prSel];
        const scale=(r.pack_size_g && mx.pack_size_g)?(r.pack_size_g/mx.pack_size_g):1;
        const items=mx.lines.map(l=>({name:l.name, grams:Math.round(l.grams*scale*100)/100}));
        const mapped=await _ffMapItems(items);
        r.recipe=mapped.recipe; r.unmatched=mapped.unmatched;
        r.src='workbook'; r.srcLabel=r.prTab.tab+' · Mix '+mx.mix+(mx.label?' ('+mx.label+')':'');
        if(!r.pack_size_g && mx.pack_size_g) r.pack_size_g=mx.pack_size_g;
        if(!r.packs && mx.packs) r.packs=mx.packs;
        if(!mx.balances) r.recipeErr='workbook mix does not sum to its stated pack size — check the sheet';
        continue;
      }
    }
    // --- fallback: derive from the saved calculator profile ---
    const m=(r.sel>=0)?r.matches[r.sel]:null;
    if(!m){ continue; }
    const pay=m.p.payload || (m.p.raw&&m.p.raw.payload) || null;
    if(!pay){ r.recipeErr='profile payload not loaded'; continue; }
    const packG=+r.pack_size_g||+pay.packSize||+pay.customPackGrams||0;
    if(!(packG>0)){ r.recipeErr='no pack size to scale the recipe to'; continue; }
    const items=_ffProfileRecipe(pay, packG);
    if(!items.length){ r.recipeErr='profile has no ingredients'; continue; }
    const mapped=await _ffMapItems(items);
    r.recipe=mapped.recipe; r.unmatched=mapped.unmatched;
    r.src='profile'; r.srcLabel=m.p.cust+(m.p.dog?' · '+m.p.dog:'');
  }
}

  _coImpResolve().then(()=>_coImpDraw()); }
function coImpPick(i,v){ const r=(window._coImp||[])[i]; if(!r) return; r.sel=+v;

// "August 22" / "Aug 22" / "2026-08-22" → ISO, assuming the current year when none is given.
function _coDueISO(s){
  const t=String(s||'').trim(); if(!t) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(t)) return t;
  const d=new Date(t+(/\d{4}/.test(t)?'':(' '+new Date().getFullYear())));
  if(isNaN(d.getTime())) return '';
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

/* ===== Expand a saved calculator profile into an ERP recipe =====
   A profile stores the chosen ingredient NAMES per category plus dailyGrams — not grams per
   ingredient. The calculator derives grams from the BARF ratios at load time, so we mirror that
   here exactly (freshfoodcalculator.html → BASE_RATIOS / computeRatios / the per-category split),
   then scale to the ORDER's pack size, because bom_lines.usable_g is grams per pack. */
const FF_BASE_RATIOS={
  raw:     {muscle:.45,bones:.10,organ:.25,liver:.05,secreting:.05,veggies:.07,seeds:.02,fruit:.01},
  cookable:{muscle:.55,organ:.25,liver:.05,secreting:.05,veggies:.07,seeds:.02,fruit:.01},
  sousVide:{muscle:.55,organ:.25,liver:.05,secreting:.05,veggies:.07,seeds:.02,fruit:.01}
};
function _ffRatios(feedingType, excludedCats){
  const base=FF_BASE_RATIOS[feedingType]||FF_BASE_RATIOS.cookable;
  const r={...base}; const ex=excludedCats||{}; let muscleBonus=0;
  const lv=!!ex.liver, sc=!!ex.secreting;
  if(lv&&!sc){ r.secreting=(r.secreting||0)+(r.liver||0); r.liver=0; }
  else if(!lv&&sc){ r.liver=(r.liver||0)+(r.secreting||0); r.secreting=0; }
  else if(lv&&sc){ muscleBonus+=(r.liver||0)+(r.secreting||0); r.liver=0; r.secreting=0; }
  ['organ','veggies','seeds','fruit'].forEach(c=>{ if(ex[c]&&r[c]!==undefined){ muscleBonus+=r[c]; r[c]=0; } });
  if(ex.bones&&r.bones!==undefined){ muscleBonus+=r.bones; r.bones=0; }
  r.muscle=(r.muscle||0)+muscleBonus;
  return r;
}
/* Returns [{name,cat,grams}] for ONE pack of `packG` grams. Mirrors the calculator's
   "split the category % evenly across the chosen items", including its two redistribution
   rules: an empty secreting list gives its % to liver and vice versa; every other empty
   category gives its % to muscle. */
function _ffProfileRecipe(payload, packG){
  const p=payload||{}; const total=+packG||0; if(!(total>0)) return [];
  const pick=(p.ingredients&&typeof p.ingredients==='object')?p.ingredients:p;   // multi-pet nests them
  const ratios=_ffRatios(p.feedingType, p.excludedCats);
  const rows=[]; let toMuscle=0, toLiver=0, toSecreting=0;
  const CATS=['bones','organ','liver','secreting','veggies','seeds','fruit'];
  CATS.forEach(cat=>{
    const pct=ratios[cat]||0; if(!pct) return;
    const sel=(pick[cat]||[]).filter(Boolean);
    if(!sel.length){ if(cat==='secreting') toLiver+=pct; else if(cat==='liver') toSecreting+=pct; else toMuscle+=pct; return; }
    const per=(total*pct)/sel.length;
    sel.forEach(item=>rows.push({name:item, cat, grams:per}));
  });
  if(toLiver>0){ const lr=rows.filter(r=>r.cat==='liver'); if(lr.length){ const e=(total*toLiver)/lr.length; lr.forEach(r=>r.grams+=e); } else toMuscle+=toLiver; }
  if(toSecreting>0){ const sr=rows.filter(r=>r.cat==='secreting'); if(sr.length){ const e=(total*toSecreting)/sr.length; sr.forEach(r=>r.grams+=e); } else toMuscle+=toSecreting; }
  const mus=(pick.muscle||[]).filter(Boolean);
  const mpct=(ratios.muscle||0)+toMuscle;
  if(mus.length && mpct>0){ const per=(total*mpct)/mus.length; mus.forEach(item=>rows.unshift({name:item, cat:'muscle', grams:per})); }
  return rows.filter(r=>r.grams>0).map(r=>({...r, grams:Math.round(r.grams*10)/10}));
}
/* Map calculator ingredient NAMES to ERP SKUs. Same resolution order the calculator import
   uses: learned alias → exact name → fuzzy contains. Returns {recipe, unmatched}. */
async function _ffMapItems(items){
  let ings=[]; try{ ings=await listIngredients(); }catch(e){}
  await loadFFAliases(); const valid=new Set(ings.map(i=>i.sku));
  const norm=s=>String(s||'').trim().toLowerCase();
  const idx={}; ings.forEach(it=>{ [it.name,it.raw_input,it.approved_alt].forEach(nm=>{ const k=norm(nm); if(k&&!idx[k]) idx[k]=it.sku; }); });
  const recipe=[], unmatched=[];
  (items||[]).forEach(x=>{
    const q=norm(x.name); let sku='';
    if(FFCALC_ALIASES[q] && valid.has(FFCALC_ALIASES[q])) sku=FFCALC_ALIASES[q];
    if(!sku) sku=idx[q]||'';
    if(!sku){ const bare=q.replace(/\([^)]*\)/g,' ').replace(/\s+/g,' ').trim();   // "Broccoli (Precooked)" → "broccoli"
      // Fold plurals so the calculator's "Strawberry" finds the master's "Strawberries".
      const sing=w=>String(w||'').replace(/ies\b/g,'y').replace(/([^s])s\b/g,'$1');
      const bs=sing(bare);
      const hit=ings.find(it=>{ const a=norm(it.name), b=norm(it.raw_input);
        return (a&&(a===bare||a.includes(bare)||bare.includes(a))) || (b&&(b===bare||b.includes(bare))); })
        || ings.find(it=>{ const a=sing(norm(it.name)), b=sing(norm(it.raw_input));
        return (a&&(a===bs||a.includes(bs)||bs.includes(a))) || (b&&(b===bs||b.includes(bs))); });
      if(hit) sku=hit.sku; }
    if(!sku) unmatched.push(x.name);
    recipe.push({ingredient_sku:sku, grams:+x.grams||0, src_name:x.name});
  });

/* The target is a RUNNING target, and this is where that is decided:

   what is still owed rather than the full week again. It was picking the most recent
   saved plot regardless of date, which meant planning an older date showed next

async function prodLoadTargets(){

     custom order. Whatever is being typed into the MRP screen right now is a

     committed to, and it changed under them as someone edited. Nothing here
     stops you adding products or output ingredients that have no target at all. */

  try{ mrpPlanCache=await mrpPlans();
    const cands=(mrpPlanCache||[]).map(p=>({p, d:String(p.plan_date||p.date||'')})).filter(x=>x.d);
    // the most recent saved plot on or before this production date — the week we are in
    const pick=cands.filter(x=>x.d<=prodPlanDate).sort((a,b)=>b.d.localeCompare(a.d))[0];
    if(pick){ const d=pick.p.data||pick.p; dm={...(d.demand||{})}; planDate=pick.d; ref=(d&&d.ref)||pick.p.ref||''; locked=true; }

  try{ const co=await coOpenDemandMap(); Object.keys(co).forEach(s=>{ if(!(+dm[s]>0)){ dm[s]=co[s]; coCount++; } }); }catch(e){}
  window._prodTargetLocked=locked||coCount>0; window._prodTargetRef=ref; window._prodTargetCo=coCount;
  prodTargetMap=dm; window._prodTargetDate=planDate;
  prodProducedMap={};
  try{ let rows;
    if(isLive()){ rows=await sb('production_batches?select=product_sku,good_packs,status,production_date,kind&status=eq.confirmed&production_date=gte.'+encodeURIComponent(planDate)); }
    else { rows=(DEMO.production_batches||[]).filter(b=>b.status==='confirmed' && String(b.production_date||'')>=String(planDate)); }
    (rows||[]).filter(b=>b.kind!=='output').forEach(b=>{ prodProducedMap[b.product_sku]=(prodProducedMap[b.product_sku]||0)+(+b.good_packs||0); });
  }catch(e){}
}

/* ---- Daily Production Sheet -------------------------------------------------
   A faithful reproduction of WR_Kitchen_Production_Dashboard.html's printout —
   its stylesheet is used verbatim (see KSHEET_CSS) and the DOM is built to the
   same shape, so what the kitchen has been reading on paper does not change.
   What DOES change is the source: every mix, ingredient, gram and SKU comes from
   the ERP masterlist (products › BOM › ingredients) instead of a hardcoded list,
   so the sheet can never drift from the recipes the app costs and depletes.

   Mapping, masterlist → sheet:
     product.group_1            → Feeding Format   (Gently Cooked / Cookable / Raw Feeding)
     product.group_2            → Mix Category     (Wholesome Mix / Single Protein / BARF Mix …)
     product.variant | family   → Mix name
     product.pack_g             → Pack size
     bom_lines.usable_g         → grams per pack
     ingredient's count category→ colour + BONE flag
   Weights print as kg to 3 dp, because that is what the kitchen scale reads.     */
const KSHEET_CATS=[
  {k:'Bones',     l:'Raw Meaty Bone',   c:'#D85A30', re:/bone/i},
  {k:'Muscle',    l:'Muscle Meat',      c:'#1D9E75', re:/muscle\s*meat|^meat|whole\s*dressed|source\s*material/i},
  {k:'OilyFish',  l:'Oily Fish',        c:'#0E7C9D', re:/oily|fish|sardine|mackerel/i},
  {k:'Organ',     l:'Organ Meat',       c:'#7F77DD', re:/organ(?!.*secret)|muscle\s*organ/i},
  {k:'Liver',     l:'Liver',            c:'#BA7517', re:/liver/i},
  {k:'Secreting', l:'Secreting Organs', c:'#D4537E', re:/secret/i},
  {k:'Veggies',   l:'Vegetables',       c:'#639922', re:/veg/i},
  {k:'Seeds',     l:'Seeds',            c:'#888780', re:/seed/i},
  {k:'Fruit',     l:'Fruits',           c:'#E24B4A', re:/fruit|berr/i},
  {k:'Other',     l:'Other',            c:'#5C5C5C', re:/./}
];
const KSHEET_ORDER=KSHEET_CATS.map(c=>c.k);
// Map a masterlist category (from the weekly count classifier) onto the sheet's palette.
function _ksCat(cat){ const s=String(cat||'');
  const byKey=KSHEET_CATS.find(c=>c.k===s); if(byKey) return byKey;      // already a sheet key
  for(const c of KSHEET_CATS) if(c.re.test(s)) return c;
  return KSHEET_CATS[KSHEET_CATS.length-1]; }
function _ksDot(cat){ return `<span class="cat-dot" style="background:${_ksCat(cat).c}"></span>`; }
const _ksKg=g=>(Math.round((+g||0))/1000).toFixed(3)+' kg';
// Tagalog prep notes, keyed off the feeding format exactly as the dashboard does,
// plus any either/or ingredient (a "/" in the name) and a bone-handling reminder.
function _ksPrepNotes(fmt, ings){
  const n=[]; const f=String(fmt||'');
  if(/gently\s*cooked/i.test(f)){
    n.push('Hilaw na idinaragdag ang mga gulay — naluluto ito sa proseso ng sous-vide.');
    n.push('Tinatanggal muna ang taba ng karne bago iproseso.');
  } else if(/cookable/i.test(f)){
    n.push('Niluto na (precooked) ang mga gulay bago isama sa mix.');
    n.push('Cookable na produkto ito — ihahanda nang hilaw, ang customer ang magluluto sa bahay.');
  } else if(/raw/i.test(f)){
    n.push('Niluto na (precooked) ang mga gulay bago isama sa mix.');
    n.push('Ang mga sangkap na may buto ay giniling nang buo — sundin ang bone-meat ratio sa formulation kapag tinitimbang.');
  }
  (ings||[]).forEach(i=>{ if(String(i.name||'').includes('/')) n.push(`"${i.name}" — pwedeng alinman sa dalawa, gamitin kung ano ang available.`); });
  if((ings||[]).some(i=>i.bones)) n.push('Ang mga sangkap na may BONE flag ay isaalang-alang sa bone-meat math habang nagpoproseso — huwag palitan ng de-buto/walang-butong karne.');
  return [...new Set(n)];
}
async function prodKitchenSheet(){
  const lines=prodPlanLines.filter(l=>(+l.good_packs||0)>0);
  const outs=prodOutLines.filter(l=>(+l.needed_kg||0)>0);
  if(!lines.length && !outs.length){ toast('Add products with packs, or an output ingredient, first',true); return; }
  const bm=await prodBOMMap();
  const ings=await listIngredients(); const im={}; ings.forEach(i=>im[i.sku]=i);
  const bySku={},byName={}; ings.forEach(i=>{ bySku[i.sku]=i; const nm=(i.name||'').trim().toLowerCase(); if(nm)byName[nm]=i; });
  const {ctx}=_outIngCtx(ings);
  const pm={}; try{ (await db.list('products',{})).forEach(p=>pm[p.sku]=p); }catch(e){}
  // one ingredient row, resolved from the masterlist
  const ingRow=(sku,gramsPerPack)=>{ const it=im[sku]||{}; const cl=_countIngClass(it,ctx)||{};
    const cat=_ksCat(cl.g1||it.category||'');
    return {sku, name:_outName(it,cl)||it.name||sku, cat:cat.k, catLabel:cat.l, color:cat.c,
            bones:/bone/i.test(String(cl.g1||it.category||''))||/bone/i.test(String(it.name||'')),
            grams:+gramsPerPack||0, note:(it.processing_method||'').trim()};

  const esc2=esc;
  let dayPacks=0, dayKg=0;
  const items=lines.map(l=>{

    const perPack=bom.reduce((s,x)=>s+x.grams,0);
    const packG=+p.pack_g||Math.round(perPack);
    dayPacks+=packs; dayKg+=(packG*packs)/1000;
    return {sku:l.product_sku, packs, packG, perPack,

  // Standalone output ingredients get their own block so the prep team sees them on the same sheet.
  const outItems=outs.map(o=>{ const it=im[o.ingredient_sku]||{}; const par=_procParent(it,bySku,byName);

    return {name:it.name||o.ingredient_sku, sku:o.ingredient_sku, needG, rawG:needG/y,

  const fill=n=>Array.from({length:n},()=>'<div class="line"></div>').join('');

  const cover=`<div id="coverSheet"><div class="cover">

  // ---- one block per mix, exactly the dashboard's .mix-block ----
  const combined=new Map();
  const mixBlocks=items.map(x=>{

    const rows=x.ings.map(i=>{

    return `<div class="mix-block">

      <div class="mix-sub"><b>${x.packs} packs</b> × ${_ksKg(x.packG)} (${esc2(x.animal)}) planned<span class="sku-badge">${esc2(x.sku)}</span></div>
      <div class="mix-content">

              <div class="track-row"><span>Planadong packs</span><div class="fill-line">${x.packs}</div></div>
              <div class="track-row"><span>Aktwal na nagawa</span><div class="fill-line"></div></div>
              <div class="track-row"><span>Ginawa ni</span><div class="fill-line"></div></div>

            </div>
            <div class="tracking-block">
              <h3>Packaging</h3>
              <div class="track-row"><span>Vacuum bags nagamit</span><div class="fill-line"></div></div>
              <div class="track-row"><span>Stickers nagamit</span><div class="fill-line"></div></div>
              <div class="track-row"><span>Vacuum bags nasayang</span><div class="fill-line"></div></div>
              <div class="track-row"><span>Stickers nasayang</span><div class="fill-line"></div></div>
            </div>
          </div>
        </div>
        <div class="notes-free">
          <h3>Mga Tala</h3>
          <div class="lined-area"><div></div><div></div><div></div><div></div></div>
        </div>
      </div>
    </div>`;
  }).join('');

  // Output ingredients to prep straight to stock (no finished pack) — same block styling.
  const outBlock=outItems.length?`<div class="mix-block">
    <div class="mix-title">Output ingredients — gawing processed stock</div>
    <div class="mix-sub">Hindi ito napupunta sa pack. Iproseso at ibalik sa processed inventory.</div>
    <div class="mix-content"><div class="ingred-col">
      <table class="ingred">
        <thead><tr><th>Processed</th><th class="num">Raw to pull</th><th class="num">Target output</th></tr></thead>
        <tbody>${outItems.map(x=>`<tr style="--row-color:#5C5C5C"><td><span class="ingred-name">${esc2(x.name)}</span>${x.raw?`<div class="ingred-note">mula sa ${esc2(x.raw)} · yield ${x.yield}%</div>`:''}</td>
          <td class="num">${_ksKg(x.rawG)}</td><td class="num">${_ksKg(x.needG)}</td></tr>`).join('')}</tbody>
      </table></div>
      <div class="notes-panel"><div class="tracking-block">
        <h3>Pagsubaybay sa Prep</h3>
        <div class="track-row"><span>Aktwal na raw</span><div class="fill-line"></div></div>
        <div class="track-row"><span>Aktwal na output</span><div class="fill-line"></div></div>
        <div class="track-row"><span>Ginawa ni</span><div class="fill-line"></div></div>
        <div class="track-row"><span>Sinuri ni</span><div class="fill-line"></div></div>
      </div></div>
    </div></div>`:'';

  // ---- combined shopping / prep list, grouped by category ----
  const combinedHtml=KSHEET_ORDER.map(k=>{
    const entries=[...combined.entries()].filter(([,v])=>v.cat===k).sort((a,b)=>b[1].grams-a[1].grams);
    if(!entries.length) return '';
    const c=KSHEET_CATS.find(z=>z.k===k);
    return `<div class="cat-group">
      <div class="cat-group-header" style="background:${c.c}">${esc2(c.l)}</div>
      <table class="ingred"><thead><tr><th>Ingredient</th><th class="num">Combined Total</th></tr></thead>
      <tbody>${entries.map(([name,v])=>`<tr><td><span class="ingred-name">${esc2(name)}${v.bones?'<span class="bone-flag">🦴 BONE</span>':''}</span></td><td class="num">${_ksKg(v.grams)}</td></tr>`).join('')}</tbody></table>
    </div>`;
