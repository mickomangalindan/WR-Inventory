<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wholesome Rabbit ERP</title>
<style>
  :root{
    /* Wholesome Rabbit — natural green + warm cream + earth tones */
    --berry:#4e7a3e; --berry-d:#3c5f30; --teal:#6f9a4e; --bg:#f5f3ec; --panel:#fff;
    --ink:#2c2a24; --muted:#8c887e; --line:#e7e3d8; --line2:#f1eee5;
    --hi:#eaf0e1; --ok:#3f7d54; --warn:#c9832f; --danger:#c0524d; --link:#4e7a3e;
    --earth:#b5762a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-size:13px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  /* top bar */
  .topbar{height:46px;background:var(--berry);color:#fff;display:flex;align-items:center;gap:14px;padding:0 14px}
  .topbar .brand{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
  .topbar .crumb{opacity:.9;font-size:13px}
  .topbar .crumb b{opacity:1}
  .topbar .sp{flex:1}
  .topbar button{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:5px;padding:6px 11px;font-size:12px;cursor:pointer}
  .topbar button:hover{background:rgba(255,255,255,.28)}
  .mode{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:700}
  .mode.demo{background:#f5e9c9;color:#7a5b12} .mode.live{background:#cdeede;color:#0d6b3f}
  /* layout */
  .app{display:flex;height:calc(100% - 46px)}
  .side{width:210px;background:#fff;border-right:1px solid var(--line);overflow-y:auto;flex-shrink:0}
  .side .mod{padding:11px 14px 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
  .side .mi{display:flex;align-items:center;gap:9px;padding:8px 14px;cursor:pointer;font-size:13px;color:#3b3b45}
  .side .mi:hover{background:var(--hi)}
  .side .mi.active{background:var(--hi);color:var(--berry);font-weight:600;box-shadow:inset 3px 0 0 var(--berry)}
  .side .mi .ic{width:18px;text-align:center}
  .main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
  /* control panel */
  .cp{background:#fff;border-bottom:1px solid var(--line);padding:9px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  .cp .title{font-size:16px;font-weight:700;margin-right:6px}
  .cp .sp{flex:1}
  .btn{background:var(--berry);color:#fff;border:none;border-radius:5px;padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer}
  .btn:hover{background:var(--berry-d)}
  .btn.sec{background:#fff;color:#3b3b45;border:1px solid #ccc}
  .btn.sec:hover{background:#f6f6f8}
  .btn.sm{padding:4px 9px;font-size:12px}
  .btn.link{background:none;border:none;color:var(--link);padding:2px 6px;cursor:pointer;font-weight:600}
  .search{display:flex;align-items:center;border:1px solid #ccc;border-radius:5px;padding:5px 9px;gap:7px;background:#fff;min-width:220px}
  .search input{border:none;outline:none;font-size:13px;flex:1;background:none}
  .vswitch{display:flex;border:1px solid #ccc;border-radius:5px;overflow:hidden}
  .vswitch button{background:#fff;border:none;padding:6px 10px;cursor:pointer;color:#6b6b77;font-size:13px;border-right:1px solid #eee}
  .vswitch button:last-child{border-right:none}
  .vswitch button.on{background:var(--hi);color:var(--berry)}
  .drop{position:relative}
  .drop .menu{position:absolute;top:110%;left:0;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.12);min-width:190px;z-index:40;padding:5px 0;display:none}
  .drop.open .menu{display:block}
  .drop .menu div{padding:7px 13px;cursor:pointer;font-size:12.5px}
  .drop .menu div:hover{background:var(--hi)}
  .drop .menu .hd{font-size:10px;text-transform:uppercase;color:var(--muted);cursor:default;font-weight:700;letter-spacing:.05em}
  .drop .menu .hd:hover{background:none}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#eef0f6;border:1px solid #dfe2ee;border-radius:16px;padding:3px 10px;font-size:12px;color:#40506b}
  .chip b{color:var(--berry)} .chip .x{cursor:pointer;opacity:.6} .chip .x:hover{opacity:1}
  /* content */
  .content{padding:16px;flex:1}
  .listcard{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  table{width:100%;border-collapse:collapse}
  thead th{background:#fbfbfc;text-align:left;padding:9px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:#7a7a88;font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td{padding:9px 12px;border-bottom:1px solid var(--line2);font-size:13px}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#fbfaff}
  td.num,th.num{text-align:right}
  .grp td{background:#f6f5f8;font-weight:700;color:var(--berry);cursor:default}
  .pager{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:9px 14px;color:#6b6b77;font-size:12.5px}
  .pager button{background:none;border:1px solid #ccc;border-radius:4px;padding:3px 8px;cursor:pointer}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:14px}
  .b-open{background:#eef0f6;color:#40506b}.b-received{background:#dbeddb;color:#1e6b2e}
  .b-invoiced{background:#fbe6cf;color:#8a5a12}.b-closed{background:#e5e5ea;color:#555}
  .b-true{background:#dbeddb;color:#1e6b2e}.b-false{background:#f3e3e0;color:#9a3b2e}
  /* form */
  .formwrap{max-width:920px;margin:0 auto}
  .sheet{background:#fff;border:1px solid var(--line);border-radius:8px;padding:0 0 18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .statusbar{display:flex;justify-content:flex-end;gap:0;padding:10px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
  .stg{padding:5px 14px;font-size:12px;color:#8a8a99;border:1px solid var(--line);border-left:none;position:relative;background:#fff}
  .stg:first-child{border-left:1px solid var(--line);border-radius:14px 0 0 14px}
  .stg:last-child{border-radius:0 14px 14px 0}
  .stg.on{background:var(--berry);color:#fff;border-color:var(--berry)}
  .sheet .hd{padding:16px 22px 4px}
  .sheet .hd .ttl{font-size:22px;font-weight:700;border:none;outline:none;width:100%}
  .sheet .hd .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
  .groups{display:grid;grid-template-columns:1fr 1fr;gap:2px 34px;padding:14px 22px}
  @media(max-width:760px){.groups{grid-template-columns:1fr}}
  .fld{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line2)}
  .fld label{width:150px;color:#59596b;font-size:12.5px;flex-shrink:0}
  .fld .val{flex:1}
  .fld input,.fld select,.fld textarea{width:100%;border:1px solid transparent;border-radius:4px;padding:5px 7px;font-size:13px;font-family:inherit;background:none}
  .fld input:hover,.fld select:hover{border-color:var(--line)}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--teal);background:#fff;box-shadow:0 0 0 2px rgba(78,122,62,.15)}
  .notebook{margin:8px 22px 0;border-top:1px solid var(--line)}
  .nbtabs{display:flex;gap:2px;margin-top:8px}
  .nbtabs button{background:none;border:none;border-bottom:2px solid transparent;padding:8px 14px;cursor:pointer;font-weight:600;color:#6b6b77;font-size:13px}
  .nbtabs button.on{color:var(--berry);border-bottom-color:var(--berry)}
  .lines table{border:1px solid var(--line);border-radius:6px;margin-top:10px}
  .lines td{padding:4px 6px}
  .lines input,.lines select{width:100%;border:1px solid transparent;border-radius:4px;padding:5px 6px;font-size:13px;background:none}
  .lines input:focus,.lines select:focus{outline:none;border-color:var(--teal);background:#fff}
  .lines .addrow{color:var(--link);font-weight:600;cursor:pointer;padding:7px 8px;display:inline-block}
  .formbar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block;margin-right:6px}
  /* report */
  .repcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px}
  .repbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .repbar select{border:1px solid #ccc;border-radius:5px;padding:6px 9px;font-size:13px}
  .measure-bar{height:16px;background:linear-gradient(90deg,var(--berry),#a9c98a);border-radius:3px}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:100}
  .overlay.on{display:flex}
  .modal{background:#fff;border-radius:10px;padding:22px 24px;max-width:520px;width:92%;max-height:88vh;overflow:auto}
  .modal h3{margin:0 0 4px}
  .modal p{color:var(--muted);font-size:12.5px;margin:0 0 14px}
  .modal label{display:block;font-weight:600;font-size:12.5px;margin:10px 0 4px}
  .modal input{width:100%;border:1px solid #ccc;border-radius:5px;padding:8px 10px;font-size:13px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2b2b33;color:#fff;padding:11px 18px;border-radius:8px;font-size:13px;z-index:200;opacity:0;transition:.25s;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .toast.show{opacity:1;bottom:30px}
  .toast.err{background:#8a2e28}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  a.reclink{color:var(--link);text-decoration:none;font-weight:600}
  /* dashboard */
  .dash{padding:4px}
  .kpirow{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
  .kpi .v{font-size:26px;font-weight:800;margin-top:6px;color:var(--berry)}
  .kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
  .qcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .qcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;cursor:pointer;display:flex;gap:12px;align-items:center}
  .qcard:hover{border-color:var(--berry);box-shadow:0 2px 10px rgba(78,122,62,.12)}
  .qcard .ic{font-size:24px}.qcard .t{font-weight:700}.qcard .d{font-size:12px;color:var(--muted)}
  /* kanban */
  .kb{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:8px}
  .kbcol{background:#eeece4;border-radius:10px;min-width:250px;max-width:290px;flex-shrink:0;padding:8px}
  .kbcol h4{margin:4px 8px 8px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#6c6a60;display:flex;justify-content:space-between}
  .kbcol h4 .c{background:#fff;border-radius:10px;padding:0 8px;font-size:11px}
  .kbcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .kbcard:hover{box-shadow:0 3px 10px rgba(0,0,0,.1)}
  .kbcard .kt{font-weight:700;margin-bottom:3px}.kbcard .km{font-size:12px;color:var(--muted)}
  /* smart buttons + workflow */
  .wfbar{display:flex;align-items:center;gap:8px;padding:10px 16px 4px;flex-wrap:wrap}
  .wfbtn{background:var(--berry);color:#fff;border:none;border-radius:5px;padding:6px 13px;font-weight:600;font-size:12.5px;cursor:pointer}
  .wfbtn.sec{background:#fff;color:var(--berry);border:1px solid var(--berry)}
  .smart{display:flex;gap:0;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-left:auto}
  .stile{padding:6px 14px;border-right:1px solid var(--line);text-align:center;background:#fff}
  .stile:last-child{border-right:none}.stile .v{font-weight:800;color:var(--berry);font-size:15px}.stile .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  /* form 2-col with chatter */
  .formcols{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
  @media(max-width:900px){.formcols{grid-template-columns:1fr}}
  .chatter{background:#fbfaf6;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
  .chatter h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .chatter .cbtns{display:flex;gap:6px;margin-bottom:8px}
  .chatter textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px;font-family:inherit;font-size:13px}
  .msg{border-top:1px solid var(--line2);padding:8px 0;font-size:12.5px}
  .msg .who{font-weight:700}.msg .tm{color:var(--muted);font-size:11px}.msg .bd{margin-top:2px}
  .msg.act{background:#fff7e8;border:1px solid #f0dfae;border-radius:6px;padding:7px 9px;margin-top:6px}
  /* command palette */
  .cmdwrap{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-start;justify-content:center;z-index:150;padding-top:12vh}
  .cmdwrap.on{display:flex}
  .cmd{background:#fff;border-radius:12px;width:92%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
  .cmd input{width:100%;border:none;outline:none;padding:16px 18px;font-size:16px;border-bottom:1px solid var(--line)}
  .cmd .res{max-height:52vh;overflow:auto}
  .cmd .r{padding:10px 16px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:13.5px}
  .cmd .r.sel,.cmd .r:hover{background:var(--hi)}
  .cmd .r .tag{margin-left:auto;font-size:11px;color:var(--muted);text-transform:uppercase}
  .cmd .hint{padding:8px 16px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);display:flex;gap:14px}
  kbd{background:#eee;border-radius:4px;padding:1px 5px;font-size:11px;border:1px solid #ddd}
  /* bulk / attachments */
  .bulkbar{background:#fff;border:1px solid var(--berry);border-radius:8px;padding:8px 12px;margin-bottom:10px;align-items:center;gap:10px;font-size:13px}
  .attachbox{background:#fbfaf6;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .attachbox h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .attpill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:12px;margin:2px 4px 2px 0}
  .attpill a{color:var(--link);text-decoration:none} .attpill .x{cursor:pointer;color:var(--muted)}
  .msg.sys{background:#eef2ec;border:1px solid #d8e4d2;border-radius:6px;padding:6px 9px;margin-top:5px;color:#3d5f30}
  .lines th{background:#fbfbfc;font-size:10px}
  .sck{font-size:13px;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
  .b-explained{background:#fbe6cf;color:#8a5a12} .b-resolved{background:#dbeddb;color:#1e6b2e}
  .b-draft{background:#eef0f6;color:#40506b} .b-approved{background:#dbeddb;color:#1e6b2e}
  .b-undefined{background:#eef0f6;color:#40506b}


/* --- Message / Mention centre (#4) --- */
  .mbell{position:relative}
  .mbadge{position:absolute;top:-5px;right:-5px;background:#d03b3b;color:#fff;border-radius:10px;font-size:10px;font-weight:700;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 3px}
  .sidecol{display:flex;flex-direction:column;gap:12px}
  .notes{background:#fbfaf6;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .notes h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .ncompose textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px;font:inherit;font-size:13px;resize:vertical;box-sizing:border-box}
  .mchips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
  .mchip{background:#eef2ec;border:1px solid #d8e4d2;color:#3d5f30;border-radius:12px;padding:2px 9px;font-size:11.5px;cursor:pointer}
  .mchip:hover{background:#dfe9d9}
  .nmsg{background:#fff;border:1px solid var(--line);border-radius:6px;padding:7px 9px;margin-top:7px}
  .nmsg.done{opacity:.62}
  .nmsg .nhd{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .nmsg .bd{font-size:13px;color:#222;margin-top:3px;white-space:pre-wrap}
  .nmsg .tm{font-size:11.5px;color:var(--muted)}
  .ment{background:#e6eff9;color:#1b5fa8;border-radius:4px;padding:0 3px;font-weight:600}
  .btn.link.sm{font-size:11.5px}
  .pill.ok{background:#dbeddb;color:#1e6b2e;border-radius:20px;padding:1px 8px;font-size:11px;font-weight:600}
  /* activities + notification center (ClickUp-style) */
  .nhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .nhead h4{margin:0}
  .actwrap{margin:8px 0}
  .act{display:flex;align-items:flex-start;gap:9px;background:#fff;border:1px solid var(--line);border-left:3px solid #4e7a3e;border-radius:7px;padding:8px 10px;margin-top:7px}
  .act.done{opacity:.55;border-left-color:#bbb}
  .actic{font-size:16px;line-height:1.3}
  .actbody{flex:1;min-width:0}
  .acttop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:#222}
  .duechip{display:inline-flex;align-items:center;gap:3px;background:#eef2ec;color:#3d5f30;border-radius:11px;padding:1px 8px;font-size:11px;font-weight:600}
  .duechip.over{background:#f7dcd6;color:#b23b2e}
  /* schedule-activity form */
  .actform{display:flex;flex-direction:column;gap:5px}
  .actform label{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:6px}
  .actform input,.actform select,.actform textarea{border:1px solid var(--line);border-radius:7px;padding:8px;font:inherit;font-size:13px;box-sizing:border-box;width:100%}
  .actform .row2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .segbtns{display:flex;gap:6px;flex-wrap:wrap}
  .segbtns button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 11px;font-size:12.5px;cursor:pointer}
  .segbtns button.on{background:#4e7a3e;color:#fff;border-color:#4e7a3e}
  /* notification center */
  .inbox{min-width:min(560px,86vw)}
  .ibhead{display:flex;align-items:baseline;gap:10px}
  .ibhead h3{margin:0}
  .ibtabs{display:flex;gap:8px;margin:12px 0;border-bottom:1px solid var(--line)}
  .ibtab{background:none;border:none;border-bottom:2px solid transparent;padding:8px 4px;margin-bottom:-1px;font:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
  .ibtab.on{color:#4e7a3e;border-bottom-color:#4e7a3e}
  .ibcount{background:#eef0f6;color:#40506b;border-radius:10px;padding:0 7px;font-size:11px}
  .ibcount.crit{background:#f7dcd6;color:#b23b2e}
  .ibbody{max-height:60vh;overflow:auto}

/* --- Operations Dashboard (standalone design, scoped to .wrdash) --- */
.wrdash{--wgrid:#e1e0d9;--wmuted:#898781;--wink:#0b0b0b;--wink2:#52514e;--wbrand:#4e7a3e;--wborder:rgba(11,11,11,.10);--wsurface:#fff;max-width:1180px;margin:0 auto}
.wrdash .grid{display:grid;gap:14px}
.wrdash .k6{grid-template-columns:repeat(6,1fr)}
.wrdash .c2{grid-template-columns:1fr 1fr}
.wrdash .card{background:var(--wsurface);border:1px solid var(--wborder);border-radius:14px;padding:16px 18px}
.wrdash .card h2{font-size:13px;font-weight:600;margin:0 0 12px;color:var(--wink2);letter-spacing:.01em}
.wrdash .kpi .l{font-size:11.5px;color:var(--wmuted);margin-bottom:6px}
.wrdash .kpi .v{font-size:25px;font-weight:680;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--wink)}
.wrdash .kpi .v.accent{color:var(--wbrand)}
.wrdash .kpi .s{font-size:11.5px;color:var(--wmuted);margin-top:3px}
.wrdash table{width:100%;border-collapse:collapse;font-size:13px}
.wrdash th,.wrdash td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--wgrid)}
.wrdash th{color:var(--wmuted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em}
.wrdash td.n,.wrdash th.n{text-align:right;font-variant-numeric:tabular-nums}

.wrdash tfoot td{font-weight:700;border-top:2px solid var(--wgrid);border-bottom:none}
.wrdash .pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:600}

.wrdash .sw{width:11px;height:11px;border-radius:3px;flex:none}

.wrdash .bar-lab{width:150px;font-size:12.5px;color:var(--wink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.wrdash .bar-fill{display:block;height:100%;border-radius:5px}
.wrdash .bar-val{width:96px;text-align:right;font-size:12.5px;font-variant-numeric:tabular-nums;font-weight:600;color:var(--wink)}
.wrdash .qrow{display:flex;gap:11px;align-items:center;padding:9px 0;border-bottom:1px solid var(--wgrid);cursor:pointer}
.wrdash .qrow:last-of-type{border-bottom:none}
.wrdash .qmark{color:#b23b2e;font-weight:700}
.wrdash .qq{flex:1;font-size:13px;color:var(--wink)}
.wrdash .qa{font-size:13px;font-weight:700;white-space:nowrap;text-align:right}
.wrdash .hint{color:var(--wmuted);font-size:12.5px}

async function sb(path, opts={}){
  const bearer = (SUPA.token||SUPA.key);   // signed-in user's token when available, else anon key
  const r = await fetch(SUPA.url.replace(/\/$/,'')+'/rest/v1/'+path, {
    ...opts, headers:{ apikey:SUPA.key, Authorization:'Bearer '+bearer,
      'Content-Type':'application/json', Prefer: opts.prefer||'return=representation', ...(opts.headers||{}) }});
  if(!r.ok){ const t=await r.text();
    if(r.status===401 && REQUIRE_AUTH && SUPA && SUPA.token){ delete SUPA.token; delete SUPA.role; localStorage.setItem('wr_supa',JSON.stringify(SUPA)); updateMode(); showGate('Your session expired — please sign in again.'); }
    throw new Error(r.status+' '+t.slice(0,180)); }
  const txt = await r.text(); return txt? JSON.parse(txt):[];
}
async function sbAuth(email,password){
  const r=await fetch(SUPA.url.replace(/\/$/,'')+'/auth/v1/token?grant_type=password',{method:'POST',
    headers:{apikey:SUPA.key,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
  const j=await r.json(); if(!r.ok) throw new Error(j.error_description||j.msg||j.error||'sign-in failed'); return j;
}
const db = {
  async list(model, {search,groupBy,page,per}={}){
    const m=MODELS[model]||{};   // child models (bom_lines, po_lines) have no top-level entry
    if(isLive()){
      let q='?select=*';
      if(search && m.name) q+='&'+m.name+'=ilike.*'+encodeURIComponent(search)+'*';
      q+='&limit='+(per||1000);
      return await sb(model+q);
    } else {
      let rows=[...(DEMO[model]||[])];
      if(search && m.name) rows=rows.filter(r=>String(r[m.name]||'').toLowerCase().includes(search.toLowerCase()));
      return rows;
    }
  },
  async children(o2m, parentVal){
    if(isLive()) return await sb(o2m.model+'?select=*&'+o2m.fk+'=eq.'+encodeURIComponent(parentVal));
    return (DEMO[o2m.model]||[]).filter(r=>r[o2m.fk]===parentVal);
  },
  async create(model, rec){
    if(isLive()) return (await sb(model, {method:'POST', body:JSON.stringify(rec)}))[0];
    DEMO[model]=DEMO[model]||[]; rec.id=rec.id||('loc'+Date.now()+Math.floor(Math.random()*999)); DEMO[model].push(rec); return rec;
  },
  async update(model, pk, pkval, rec){
    if(isLive()) return (await sb(model+'?'+pk+'=eq.'+encodeURIComponent(pkval), {method:'PATCH', body:JSON.stringify(rec)}))[0];
    const arr=DEMO[model]=DEMO[model]||[]; const i=arr.findIndex(r=>r[pk]===pkval); if(i>=0){arr[i]={...arr[i],...rec}; return arr[i];} return rec;
  },
  async del(model, pk, pkval){
    if(isLive()) return await sb(model+'?'+pk+'=eq.'+encodeURIComponent(pkval), {method:'DELETE', prefer:'return=minimal'});
    DEMO[model]=(DEMO[model]||[]).filter(r=>r[pk]!==pkval);
  },
  async replaceChildren(o2m, parentVal, rows){
    if(isLive()){
      await sb(o2m.model+'?'+o2m.fk+'=eq.'+encodeURIComponent(parentVal),{method:'DELETE',prefer:'return=minimal'});
      if(rows.length) await sb(o2m.model,{method:'POST',body:JSON.stringify(rows),prefer:'return=minimal'});
    } else {
      DEMO[o2m.model]=(DEMO[o2m.model]||[]).filter(r=>r[o2m.fk]!==parentVal).concat(rows);
    }
  }
};

let _hashLock=false;
function setHash(h){ if(location.hash===h) return; _hashLock=true; location.hash=h; setTimeout(()=>{_hashLock=false;},0); }
function syncHash(){ let h='#/'+(state.model||'home');
  if(state.view==='form'){ const m=MODELS[state.model];
    if(formIsNew) h+='/new';
    else if(m){ const pk=formRec&&formRec[m.pk]; if(pk!=null&&pk!=='') h+='/'+encodeURIComponent(pk); } }
  setHash(h); }
async function onHashRoute(){ if(_hashLock) return;
  const raw=(location.hash||'').replace(/^#\/?/,'');
  if(!raw){ if(state.model!=='home') openModel('home'); return; }
  const slash=raw.indexOf('/'); const model=slash<0?raw:raw.slice(0,slash); const seg=slash<0?'':raw.slice(slash+1);
  if(model==='home'){ if(state.model!=='home'||state.view!=='home') openModel('home'); return; }
  if(!MODELS[model]) return;
  if(seg){ if(state.model!==model){ state.model=model; renderSide(); } if(seg==='new') openForm(null); else openForm(seg); }
  else { if(state.model!==model||state.view==='form') openModel(model); }
}
function bootRoute(){ if((location.hash||'').replace(/^#\/?/,'')) onHashRoute(); else openModel('home'); }
function copyRecordLink(){ const u=location.href; (navigator.clipboard&&navigator.clipboard.writeText(u)||Promise.reject()).then(()=>toast('Link copied')).catch(()=>{ prompt('Copy this link:',u); }); }

  $('content').innerHTML = `<div id="bulkbar" class="bulkbar" style="display:none"></div><div class="listcard">

const AUTO_REF={ purchase_orders:async()=>{ const dd=_mmddyyyy(); return 'PO-'+dd+' V'+_p2(await nextSeq('PO-'+dd))+'.01'; },

async function saveForm(){
  const m=MODELS[state.model]; let pkval=formRec[m.pk];
  // assign the document reference now (at save), not on form-open → no burned numbers on discard
  if(formIsNew && !pkval && AUTO_REF[state.model]){ try{ pkval=await AUTO_REF[state.model](); formRec[m.pk]=pkval; }catch(e){ toast(e.message,true); return; } }
  if(!pkval){ toast('Enter '+ (m.fields.find(f=>f.n===m.pk)||{}).l, true); return; }
  // optimistic lock: if someone else changed this record since it was opened, don't silently overwrite
  if(!formIsNew && isLive() && formRec.updated_at){ try{
      const cur=await sb(state.model+'?select=updated_at&'+m.pk+'=eq.'+encodeURIComponent(pkval)+'&limit=1');
      if(cur&&cur[0]&&cur[0].updated_at&&cur[0].updated_at!==formRec.updated_at){ toast('This record was changed by someone else since you opened it. Reload and re-apply your edit.',true); return; }
    }catch(e){} }
  try{
    // validate numeric fields: no NaN, no negatives (quantities/prices/counts are never < 0)
    const badNum=[];
    m.fields.forEach(f=>{ if(f.t!=='number'&&f.t!=='currency')return; const v=formRec[f.n]; if(v===''||v==null)return;
      const num=+v; if(!isFinite(num)){ badNum.push(f.l+' (not a number)'); } else if(num<0){ badNum.push(f.l+' (cannot be negative)'); } });
    if(badNum.length){ toast('Fix these fields: '+badNum.join('; '),true); return; }
    const rec={}; m.fields.forEach(f=>{ if(f.t==='formula')return; let v=formRec[f.n]; if((f.t==='number'||f.t==='currency')&&v!==''&&v!=null)v=+v; if(v!==undefined)rec[f.n]=v; });
    const uf=['created_by','counted_by','operator'].find(x=>m.fields.some(f=>f.n===x));
    if(formIsNew && uf && !rec[uf]) rec[uf]=CURRENT_USER;
    if(formIsNew) await db.create(state.model, rec);
    else await db.update(state.model, m.pk, pkval, rec);
    if(m.o2m){
      const clean=formChildren.filter(l=>Object.values(l).some(x=>x!=='' && x!=null)).map(l=>{
        const row={...l, [m.o2m.fk]:pkval}; delete row.id;   // id is a generated identity — never re-insert it (live save would 400)
        m.o2m.cols.forEach(c=>{if(c.t==='number'&&row[c.n]!=='')row[c.n]=+row[c.n];}); return row;});
      await db.replaceChildren(m.o2m, pkval, clean);
    }
    sysLog(state.model, pkval, formIsNew?('📝 Created by '+CURRENT_USER):('✏️ Updated by '+CURRENT_USER));
    toast('Saved '+pkval); relCache={}; state.view='list'; route();
  }catch(e){ toast(saveErrMsg(e), true); console.error('Save failed:', e); }
}
// Turn a raw PostgREST/Supabase error into something a non-technical user can act on.
function saveErrMsg(e){ const s=String(e&&e.message||e||'');
  if(/^401|JWT|not authenticated|Unauthorized/i.test(s)) return 'Save blocked — your sign-in expired. Sign in again and retry.';
  if(/^40[03]|permission denied|row-level security|RLS|violates row-level/i.test(s)) return "Save blocked by access rules — your role can't write to this module. Ask an Admin to grant it.";
  if(/duplicate key|already exists|23505/i.test(s)) return 'That reference already exists — use a new reference number.';
  if(/foreign key|violates foreign key|23503/i.test(s)) return 'A linked record is missing — pick an existing value for the highlighted field.';
  if(/null value|not-null|23502/i.test(s)) return 'A required field is empty — fill every required field and retry.';
  if(/column .* does not exist|PGRST/i.test(s)) return 'Save error (schema): '+s.slice(0,140);
  return 'Save failed: '+s.slice(0,160);
}
// Which tables reference each record (external usage that must block a hard delete).
// A model's OWN o2m children (a product's recipe, a PO's lines) are excluded — those
// are cleared with the parent.
const DEPENDENTS = {
  suppliers:  [{model:'item_suppliers',fk:'supplier_name'},{model:'ingredients',fk:'supplier'},{model:'purchase_orders',fk:'supplier_name'}],
  ingredients:[{model:'bom_lines',fk:'ingredient_sku'},{model:'item_suppliers',fk:'ingredient_sku'},{model:'item_yields',fk:'ingredient_sku'},{model:'po_lines',fk:'ingredient_sku'}],
  products:   [{model:'production_batches',fk:'product_sku'},{model:'transfer_lines',fk:'product_sku'},{model:'order_lines',fk:'product_sku'}]
};
async function countDependents(model, pkval){
  const defs=DEPENDENTS[model]||[]; let total=0; const parts=[]; let checkFailed=false;
  for(const d of defs){ let n=0;
    if(isLive()){ try{ const rows=await sb(d.model+'?select='+d.fk+'&'+d.fk+'=eq.'+encodeURIComponent(pkval)+'&limit=500'); n=rows.length; }catch(e){ checkFailed=true; } }
    else { n=(DEMO[d.model]||[]).filter(r=>String(r[d.fk])===String(pkval)).length; }
    if(n>0){ total+=n; parts.push(n+'× '+((MODELS[d.model]||{}).label||d.model)); }
  }
  // A failed dependency lookup must NOT read as "no dependents" — block the delete instead of orphaning children.
  return {total, detail:parts.join(', '), checkFailed};
}

    sysLog(state.model,formRec[m.pk],(on?'🗄 Archived by ':'♻ Restored by ')+CURRENT_USER); toast(on?'Archived — kept for history':'Restored'); renderForm(); }
  catch(e){ toast(e.message,true); } }
async function cancelForm(){ const m=MODELS[state.model]; if(!confirm('Cancel '+formRec[m.pk]+'? The record is kept for audit; it just will not be actioned.'))return;
  try{ await db.update(state.model,m.pk,formRec[m.pk],{[m.status.f]:'cancelled'}); formRec[m.status.f]='cancelled';
    sysLog(state.model,formRec[m.pk],'✖ Cancelled by '+CURRENT_USER); toast('Cancelled — record kept'); renderForm(); }
  catch(e){ toast(e.message,true); } }
async function deleteForm(){
  const m=MODELS[state.model]; const pkval=formRec[m.pk];
  const dep=await countDependents(state.model, pkval);
  if(dep.checkFailed){ toast("Can't verify what this record is linked to right now — delete blocked to avoid orphaning data. Try again in a moment.",true); return; }
  if(dep.total>0){ const alt=m.archivable?'Archive it instead':(m.cancelable?'Cancel it instead':'Remove those first'); toast(`Can't delete — used by ${dep.total} record(s): ${dep.detail}. ${alt}.`,true); return; }
  if(!confirm('Permanently delete '+pkval+'? This cannot be undone — for master data or documents, prefer Archive/Cancel.')) return;
  try{ if(m.o2m) await db.replaceChildren(m.o2m, pkval, []); await db.del(state.model,m.pk,pkval); relCache={}; toast('Deleted'); state.view='list'; route(); }
  catch(e){ toast(e.message,true); }
}

const BACKUP_TABLES=['suppliers','ingredients','products','bom_lines','purchase_orders','po_lines',
  'goods_receipts','gr_lines','supplier_invoices','invoice_lines','production_batches','batch_issues',
  'transfers','transfer_lines','count_sessions','count_lines','variance_log','inventory_movements',
  'raw_material_pricing','record_notes','activity_log'];
async function exportBackup(){
  toast('Building backup…'); const dump={_meta:{app:'WR ERP',exported_by:CURRENT_USER,live:isLive()}};
  for(const t of BACKUP_TABLES){ try{ dump[t]=isLive()? await sb(t+'?select=*') : (DEMO[t]||[]); }catch(e){ dump[t]={error:String(e.message||e)}; } }
  const blob=new Blob([JSON.stringify(dump,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='wr-erp-backup-'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); a.remove();
  toast('Backup downloaded ('+BACKUP_TABLES.length+' tables)');

function cleanseAll(on){ CLEANSE_GROUPS.forEach(g=>cleanseSel[g.key]=on); renderCleanser(); }
function cleanseGuard(v){ const b=$('clBtn'); if(b) b.disabled = (String(v).trim().toUpperCase()!=='CLEANSE'); }
async function runCleanse(){
  if(curRole()!=='Admin'){ toast('Only an Admin can run the cleanser',true); return; }                 // 1) role gate
  const guard=(($('clConfirm')&&$('clConfirm').value)||'').trim().toUpperCase();
  if(guard!=='CLEANSE'){ toast('Type CLEANSE in the box to confirm',true); return; }                     // 2) type-to-confirm
  const groups=CLEANSE_GROUPS.filter(g=>cleanseSel[g.key]);
  if(!groups.length){ toast('Select at least one dataset',true); return; }
  if(!confirm('You are about to PERMANENTLY DELETE:\n\n• '+groups.map(g=>g.label).join('\n• ')+'\n\nMaster data (suppliers, ingredients, products, recipes, users) is kept.\nThis cannot be undone. Continue?')) return;   // 3) itemized confirm
  let done=0; const errs=[];
  for(const g of groups){ for(const [t,pk] of g.tables){
    try{ if(isLive()){ await sb(t+'?'+pk+'=not.is.null',{method:'DELETE',prefer:'return=minimal'}); } else { DEMO[t]=[]; } done++; }
    catch(e){ errs.push(t); } } }
  if(cleanseSel.demand){ localStorage.removeItem('wr_mrp_plans'); mrpDemand={}; mrpManual={}; window._mrpPlan=null; mrpPlanCache=[]; }
  if(cleanseSel.refs){ localStorage.removeItem('wr_refseq'); }
  if(cleanseSel.prod){ prodPlanLines=[]; prodRunRef=''; }
  sysLog('cleanser','wipe','🧹 Cleansed '+done+' table(s): '+groups.map(g=>g.key).join(', ')+' by '+CURRENT_USER);
  toast('Cleansed '+done+' table(s)'+(errs.length?' · '+errs.length+' error(s): '+errs.join(','):''), errs.length>0);
  cleanseSel={}; renderCleanser();
}

async function uploadAttach(f){
  if(f.size>15*1024*1024){ toast('File is over 15MB — upload it to Drive directly and paste the link.',true); return attLink(f.name); }
  const a=autoCfg('file_upload'); const m=MODELS[state.model]; const ref=formRec[m.pk];
  if(!a||!a.on||!a.url){ return attLink(f.name); }   // no automation set → fall back to pasting a link
  const reader=new FileReader();
  reader.onload=async()=>{ const b64=String(reader.result).split(',')[1]||'';
    await postWebhook(a.url,{ model:state.model, module:state.model, ref:String(ref),
       filename:f.name, mimetype:f.type||'application/octet-stream', data:b64, by:CURRENT_USER });

    localStorage.setItem(attachKey(),JSON.stringify(at));

    toast('Uploading '+f.name+' to Drive… the link will appear shortly'); renderForm();

    // pull it back so the file shows as a clickable link (no manual paste needed).
    setTimeout(()=>{ if(state.view==='form'&&formRec[m.pk]===ref) refreshAtts(); }, 9000);

    .ml{color:#666} .mv{font-weight:600;text-align:right}
    h3{color:#4e7a3e;font-size:14px;margin:18px 0 6px}
    table.lines{width:100%;border-collapse:collapse;font-size:12px}
    table.lines th{background:#4e7a3e;color:#fff;padding:6px 8px;font-weight:600}
    table.lines td{padding:5px 8px;border-bottom:1px solid #eee}
    table.lines tr.tot td{font-weight:700;border-top:2px solid #4e7a3e;background:#f6f8f4}
    .ft{margin-top:26px;color:#888;font-size:11px;border-top:1px solid #eee;padding-top:8px}
  </style></head><body>
    <div class="hd"><h1>🐇 Wholesome Rabbit</h1><div class="doc"><div class="t">${esc(m.label)}</div><div class="r">${esc(r[m.pk]||'')}</div></div></div>
    <div class="meta">${meta}</div>${lines}

// Fire-and-forget POST to an n8n webhook. no-cors so a static app can reach n8n
// without CORS setup; n8n does the work and writes results back to Supabase.
async function postWebhook(url, payload){ if(!url) return false;
  try{ await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(payload)}); return true; }
  catch(e){ console.warn('webhook post failed', e); return false; } }
function autoCfg(k){ return (typeof AUTOS!=='undefined'&&AUTOS[k])?AUTOS[k]:null; }
// On completion: send the record to n8n → PDF → Drive folder → link back + notify (with Internal Ref).
async function notifyRecordDone(model, ref, recOverride, childrenOverride){
  const a=autoCfg('record_pdf'); if(!a||!a.on||!a.url) return;
  // Fire ONCE per record — a document that moves received → invoiced → closed must not
  // generate three PDFs. Guard on a local sent-set (same browser) AND on drive_url (cross-browser:
  // once n8n has written the link back, the PDF already exists).
  const sentKey=model+':'+ref; let sent={};
  try{ sent=JSON.parse(localStorage.getItem('wr_pdf_sent')||'{}'); }catch(e){}
  const rGuard=recOverride||formRec;
  if(sent[sentKey] || (rGuard && rGuard.drive_url)) return;
  const m=MODELS[model]; const r=recOverride||formRec;
  let children=childrenOverride;
  if(children===undefined){ children=[]; if(m.o2m){ try{ children=(r[m.pk]===ref)?formChildren:await db.children(m.o2m, ref); }catch(e){} } }
  const html=recordPrintHtml(m, {...r,[m.pk]:ref}, children);
  await postWebhook(a.url, { model, module:model, ref:String(ref), kind:m.label,
     html, email:(SUPA&&SUPA.email)||'', telegram_chat_id:'' });
  sent[sentKey]=Date.now(); localStorage.setItem('wr_pdf_sent',JSON.stringify(sent));
  sysLog(model, ref, '📄 Sent to the PDF/Drive automation ('+ref+')');
}

/* MRP / Demand planning */
let mrpDemand={}, mrpManual={};
function kgf(g){ return (g/1000).toFixed(2); }
function dateMinus(d,n){ try{ const x=new Date(d+'T00:00:00'); x.setDate(x.getDate()-(n||0)); return x.toISOString().slice(0,10);}catch(e){return d;} }
async function renderMRP(){
  $('cp').innerHTML=`<div class="title">Demand / MRP <span onclick="openKB('mrp')" title="Module guide" style="cursor:pointer;color:var(--muted);font-size:14px;font-weight:400">❔</span></div>
    <button class="btn" onclick="renderMRP()">↻ Compute</button>
    <button class="btn sec" onclick="saveMRPPlan()">💾 Save plan</button>
    <button class="wfbtn" onclick="generatePOsFromMRP()">🧾 Generate Draft POs</button>
    <div class="sp"></div><span style="color:var(--muted)">demand + lead time + PAR → replenishment → PO</span>`;
  const prods=await db.list('products',{}), boms=await db.list('bom_lines',{}), ings=await listIngredients();
  let stock={}; if(isLive()){ try{ (await db.list('stock_balance',{})).forEach(s=>{stock[s.ref_sku]=(stock[s.ref_sku]||0)+(+s.on_hand||0);});}catch(e){} }
  mrpPlanCache=await mrpPlans();
  // demand card
  let dh=`<div class="repcard">
    <div class="repbar"><span>Plan (week of)</span><input type="date" value="${MRPDATE}" onchange="MRPDATE=this.value">
      <button class="btn sm sec" onclick="openMRPImport()">📥 Import (xlsx / csv)</button>
      <button class="btn sm sec" onclick="mrpImport()">⬆ Paste</button>
      <button class="btn sm sec" onclick="mrpSheetSync()">☁ Sync from Google Sheets</button></div>
    <h3 style="margin:8px 0 8px">1 · Weekly demand (packs) — keyed by SKU</h3><table><thead><tr><th>Product</th><th>SKU</th><th class="num">Demand</th></tr></thead><tbody>`;
  prods.forEach(p=>{ dh+=`<tr><td>${esc(p.name)}</td><td><code>${esc(p.sku)}</code></td><td class="num"><input type="number" style="width:90px;text-align:right" value="${mrpDemand[p.sku]||''}" onchange="mrpDemand['${p.sku}']=+this.value||0;renderMRP()"></td></tr>`; });
  dh+='</tbody></table></div>';
  // ingredient need (usable g)
  const need={}; boms.forEach(b=>{ const dem=+mrpDemand[b.product_sku]||0; if(dem) need[b.ingredient_sku]=(need[b.ingredient_sku]||0)+(+b.usable_g||0)*dem; });
  // build plan lines: demand-driven, or par top-up
  const plan=[];
  ings.forEach(it=>{ if(it.is_intermediate) return;
    const usable=need[it.sku]||0; const y=(+it.yield_pct||100)/100; const rawNeed=y>0?usable/y:usable;
    const par=+it.par_g||0, lead=+it.lead_time_days||0, oh=stock[it.sku]||0;
    if(rawNeed<=0 && !(par>0)) return;
    const leadBuf=rawNeed*(lead/7);                          // consumption during lead time
    const base=rawNeed + par + leadBuf - oh;                 // target − on hand
    const manualKg=+mrpManual[it.sku]||0; const subtotal=base + manualKg*1000;
    const moq=(+it.min_order_kg||0)*1000;
    const final=subtotal<=0?0:(moq>0?Math.ceil(subtotal/moq)*moq:subtotal);

    const _s1=(it.supplier1||'').trim(); const defSup=(it.supplier||'').trim() || (/to be determined/i.test(_s1)?'':_s1);

function weekOf(dstr){ if(!dstr)return'—'; const d=new Date(dstr+'T00:00:00'); if(isNaN(d))return dstr; const on=new Date(d); const back=(d.getDay()+6)%7; on.setDate(d.getDate()-back); return 'Wk of '+on.toISOString().slice(0,10); }

/* ============ Internal reference numbering (DP / PO / DR / RR) ============ */
function _p2(n){ return String(n).padStart(2,'0'); }
function _mmddyyyy(dstr){ const d=dstr||new Date().toISOString().slice(0,10); const t=d.split('-'); return (t[1]||'')+(t[2]||'')+(t[0]||''); }
async function nextSeq(key){   // atomic per-key counter — Supabase RPC when live, localStorage otherwise
  if(isLive()){   // live: the atomic DB counter is the ONLY safe source — never fall back to a per-browser
    if(SUPA&&SUPA.token){ try{ const r=await sb('rpc/next_ref',{method:'POST',body:JSON.stringify({p_key:key})}); const v=Array.isArray(r)?r[0]:r; if(typeof v==='number') return v; if(v&&typeof v.next_ref==='number') return v.next_ref; }catch(e){} }
    throw new Error('Could not reserve a reference number from the server. The next_ref() function may be missing — install it before creating documents. (Falling back to a local counter would collide across users.)');
  }
  const c=JSON.parse(localStorage.getItem('wr_refseq')||'{}'); c[key]=(c[key]||0)+1; localStorage.setItem('wr_refseq',JSON.stringify(c)); return c[key];
}
async function genRef(type,opts){ opts=opts||{}; const dd=_mmddyyyy(opts.date);
  if(type==='DP'){ const cat=(opts.category||'RAW').toUpperCase(); const it=await nextSeq('DP-'+dd+'-'+cat); return {ref:'DP-'+dd+' ['+cat+'] V'+_p2(it), it, dd}; }
  if(type==='PO'){ return {ref:'PO-'+dd+' V'+_p2(opts.xx||1)+'.'+_p2(opts.zz||1), dd}; }
  if(type==='DR'||type==='RR'){ const it=await nextSeq(type+'-'+dd); return {ref:type+'-'+dd+' V'+_p2(it), it, dd}; }
  if(type==='PR'){ const it=await nextSeq('PR-'+dd); return {ref:'PR-'+dd+' V'+_p2(it), it, dd}; }
  return {ref:''};
}

function studioLabel(n,v){ const m=MODELS[studioModel]; const f=m.fields.find(x=>x.n===n); if(f)f.l=v; scfg(studioModel).labels[n]=v; saveStudioCfg(); }
function studioList(n,on){ const m=MODELS[studioModel]; if(on){ if(!m.list.includes(n))m.list.push(n);} else m.list=m.list.filter(x=>x!==n); scfg(studioModel).list=m.list.slice(); saveStudioCfg(); renderStudio(); }
function studioAddField(){ const label=prompt('New field label:'); if(!label)return; const t=(prompt('Type: text / number / currency / date','text')||'text').trim();
  const n=label.toLowerCase().replace(/[^a-z0-9]+/g,'_'); const f={n,l:label,t}; MODELS[studioModel].fields.push(f); scfg(studioModel).add.push(f); saveStudioCfg(); renderStudio(); }
function studioAddFormula(){ const label=prompt('Formula field label:'); if(!label)return; const expr=prompt('Formula (JS over field names), e.g. list_price_kg*1.12'); if(!expr)return;
  const n=label.toLowerCase().replace(/[^a-z0-9]+/g,'_'); const f={n,l:label,t:'formula',expr}; const m=MODELS[studioModel]; m.fields.push(f); if(!m.list.includes(n))m.list.push(n); scfg(studioModel).add.push(f); scfg(studioModel).list=m.list.slice(); saveStudioCfg(); renderStudio(); }
function applyStudio(){ Object.keys(STUDIO).forEach(mk=>{ const m=MODELS[mk]; if(!m)return; const o=STUDIO[mk];
  (o.add||[]).forEach(f=>{ if(!m.fields.some(x=>x.n===f.n)) m.fields.push(f); });
  if(o.labels) Object.keys(o.labels).forEach(n=>{ const f=m.fields.find(x=>x.n===n); if(f)f.l=o.labels[n]; });
  if(o.list) m.list=o.list.slice();
}); }

// Recipe cost per product (₱/pack) from the BOM — used to value production & transfers.
async function prodCostMap(){
  if(await useSecure()){ try{ const rows=await sb('rpc/wr_product_costs',{method:'POST',body:'{}'}); const m={}; (rows||[]).forEach(r=>m[r.product_sku]=+r.cost_per_pack||0); return m; }catch(e){} }  // server-side cost (masking-safe)
  const boms=await db.list('bom_lines',{}), ings=await listIngredients(); const im={}; ings.forEach(i=>im[i.sku]=i);
  const m={}; boms.forEach(b=>{ const it=im[b.ingredient_sku]||{}; const y=(+it.yield_pct||100)/100; m[b.product_sku]=(m[b.product_sku]||0)+((+b.usable_g||0)/(y||1))/1000*(+it.moving_avg_cost_kg||+it.list_price_kg||0); }); return m; }
/* ---- Idempotency: never post the same document to the ledger twice ---- */
let _postLock=false;                                  // blocks overlapping double-clicks (single user)
async function movementExists(note){                  // has this source already posted? (re-entry / 2-user guard)
  if(isLive()){ try{ const r=await sb('inventory_movements?select=id&note=eq.'+encodeURIComponent(note)+'&limit=1'); return r.length>0; }catch(e){ return false; } }
  return (DEMO.inventory_movements||[]).some(m=>m.note===note);
}
/* ---- Column masking: use the role-gated *_secure views + definer RPCs when they exist ---- */
let _secureViews;                                     // undefined = not yet probed
async function useSecure(){ if(!isLive())return false; if(_secureViews===undefined){ try{ await sb('ingredients_secure?select=sku&limit=1'); _secureViews=true; }catch(e){ _secureViews=false; } } return _secureViews; }
async function listIngredients(){ if(await useSecure()){ try{ return await sb('ingredients_secure?select=*&limit=2000'); }catch(e){} } return await db.list('ingredients',{}); }
async function listForModel(model){ if(await useSecure()){ if(model==='ingredients'){ try{ return await sb('ingredients_secure?select=*&limit=2000'); }catch(e){} } if(model==='products'){ try{ return await sb('products_secure?select=*&limit=2000'); }catch(e){} } } return await db.list(model,{}); }
// Receiving a PO adds raw stock at Bulacan and updates moving-average cost.
async function postReceipt(po){ try{
  if(await movementExists('PO '+po.po_ref)){ toast('This PO was already received — stock not posted again.',true); return; }
  const lines=await db.children(MODELS.purchase_orders.o2m, po.po_ref);
  const secure=await useSecure();
  const ings=await listIngredients(); const im={}; ings.forEach(i=>im[i.sku]=i); let n=0, costErr=0;
  // per-location on-hand snapshot (bulacan only — receipts land at bulacan)
  const stock={}; try{ (await db.list('stock_balance',{})).forEach(s=>{ if(s.ref_sku && s.location_code==='bulacan' && s.kind==='ingredient') stock[s.ref_sku]=(stock[s.ref_sku]||0)+(+s.on_hand||0); }); }catch(e){}
  for(const l of lines){ const recvKg=(l.received_kg!=null&&l.received_kg!=='')?(+l.received_kg||0):(+l.available_kg||+l.ordered_kg||0); if(!(recvKg>0)) continue;
    const g=recvKg*1000, priceKg=Math.max(0,+l.price_kg||0);
    await db.create('inventory_movements',{kind:'ingredient',ref_sku:l.ingredient_sku,location_code:'bulacan',qty:g,unit_cost:priceKg/1000,movement_type:'receipt',note:'PO '+po.po_ref});
    // roll the moving-average cost — server-side RPC when masking is on (Warehouse can't touch cost columns), else client-side
    if(secure){ try{ await sb('rpc/wr_roll_cost',{method:'POST',body:JSON.stringify({p_sku:l.ingredient_sku,p_recv_kg:recvKg,p_price_kg:priceKg})}); }catch(e){ costErr++; } }
    else { const it=im[l.ingredient_sku]; if(it){ const ohG=Math.max(0,stock[l.ingredient_sku]||0), oldAvg=+it.moving_avg_cost_kg||priceKg;  // clamp negative on-hand
      const newAvg=(ohG+g)>0?((ohG*oldAvg+g*priceKg)/(ohG+g)):priceKg;
      try{ await db.update('ingredients','sku',l.ingredient_sku,{moving_avg_cost_kg:Math.round(newAvg*100)/100,last_price_kg:priceKg}); stock[l.ingredient_sku]=ohG+g; }catch(e){ costErr++; } } }
    n++; }
  sysLog('purchase_orders',po.po_ref,'📦 Received — '+n+' ingredient(s) posted to Bulacan stock by '+CURRENT_USER);
  toast('Received · '+n+' item(s) added to stock'+(costErr?(' · ⚠ '+costErr+' cost update(s) failed'):''), costErr>0);
 }catch(e){ toast('Receive posting failed: '+e.message,true); } }
// Confirming a transfer moves finished stock Bulacan → Pasig and flags any shortfall (Check 4).
async function postTransfer(t){ try{
  if(await movementExists('Transfer '+t.transfer_ref)){ toast('This transfer was already received — not posted again.',true); return; }
  const lines=await db.children(MODELS.transfers.o2m, t.transfer_ref); const cm=await prodCostMap();
  const from=t.from_code||'bulacan', to=t.to_code||'pasig'; let n=0,flags=0;
  for(const l of lines){ const sent=Math.max(0,+l.sent_packs||0), recv=Math.max(0,+l.received_packs||0); if(sent<=0&&recv<=0) continue; const uc=cm[l.product_sku]||0;
    if(sent>0) await db.create('inventory_movements',{kind:'product',ref_sku:l.product_sku,location_code:from,qty:-sent,unit_cost:uc,movement_type:'transfer_out',note:'Transfer '+t.transfer_ref});
    if(recv>0) await db.create('inventory_movements',{kind:'product',ref_sku:l.product_sku,location_code:to,qty:recv,unit_cost:uc,movement_type:'transfer_in',note:'Transfer '+t.transfer_ref});
    const gap=sent-recv; if(Math.abs(gap)>0.0001){ flags++; try{ await db.create('variance_log',{check_type:'4 · Transfer',source_ref:t.transfer_ref,expected:sent,actual:recv,gap_qty:-gap,gap_value:Math.round((cm[l.product_sku]||0)*gap*100)/100,location:'in-transit',responsible_user:CURRENT_USER,status:'open',note:l.product_sku+' sent '+sent+' vs received '+recv}); }catch(e){} }
    n++; }
  sysLog('transfers',t.transfer_ref,'🚚 Received — '+n+' line(s) posted; '+flags+' shortfall(s) flagged by '+CURRENT_USER); toast('Transfer posted · '+flags+' shortfall(s)');
 }catch(e){ toast('Transfer posting failed: '+e.message,true); } }

async function poConfirmApply(){
  const lines=formChildren||[]; const changes=[];
  const updated=lines.map((l,i)=>{ const nq=+($('pc_q'+i).value)||0, np=+($('pc_p'+i).value)||0; const oq=+l.ordered_kg||0, op=+l.price_kg||0;
    if(Math.abs(nq-oq)>0.0001) changes.push(l.ingredient_sku+': qty '+oq+'→'+nq+'kg'); if(Math.abs(np-op)>0.0001) changes.push(l.ingredient_sku+': ₱'+op+'→₱'+np);
    return {po_ref:formRec.po_ref, ingredient_sku:l.ingredient_sku, ordered_kg:nq, available_kg:l.available_kg, price_kg:np, received_kg:l.received_kg||0}; });
  try{
    await db.replaceChildren(MODELS.purchase_orders.o2m, formRec.po_ref, updated);
    formChildren=updated; formRec.status='confirmed';
    await db.update('purchase_orders','po_ref',formRec.po_ref,{status:'confirmed'});
    sysLog('purchase_orders',formRec.po_ref, (changes.length?('✅ Confirmed with adjustments — '+changes.join('; ')):'✅ Confirmed — qty & prices verified, no changes')+' by '+CURRENT_USER);
    notifyRecordDone('purchase_orders', formRec.po_ref);   // confirmed → generate PDF → Drive → notify
    closeModal(); toast('Order confirmed — preparing the Send PO draft with the PDF link…'+(changes.length?' · '+changes.length+' change(s) logged':''));
    renderForm();
    // give n8n a few seconds to build the PDF + write the drive_url back, then open the Send PO draft with the link
    setTimeout(async()=>{ if(state.model==='purchase_orders'&&state.view==='form'&&formRec.po_ref===updated[0].po_ref){ await reloadFormRec(); if(state.model==='purchase_orders'&&state.view==='form') sendPODraft(); } }, 9000);
  }catch(e){ toast(e.message,true); }
}

async function poReceiveApply(){

async function _poReceiveApply(){

  const updated=lines.map((l,i)=>{ const rq=+(($('rc_q'+i)||{}).value)||0; const oq=+l.ordered_kg||0;

const wpeso=n=>'₱'+Math.round(n).toLocaleString('en-PH');
const wkfmt=n=>n>=1000?(n/1000).toFixed(n>=10000?0:1)+'k':(''+Math.round(n));
function wrDonut(rows){
  let data=rows.slice(0,7); const restSum=rows.slice(7).reduce((s,r)=>s+r.value,0);
  if(restSum>0){ const oi=data.findIndex(k=>k.label==='Other'); if(oi>=0) data=data.map((k,i)=>i===oi?{label:'Other',value:k.value+restSum}:k); else data=[...data,{label:'Other',value:restSum}]; }
  const tot=data.reduce((s,d)=>s+d.value,0)||1; const R=78,r=50,cx=95,cy=95,gap=0.03; let a=-Math.PI/2,paths='';
  data.forEach((d,i)=>{ const frac=d.value/tot,ang=frac*2*Math.PI,a2=a+ang-gap;
    const x1=cx+R*Math.cos(a),y1=cy+R*Math.sin(a),x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);
    const xi2=cx+r*Math.cos(a2),yi2=cy+r*Math.sin(a2),xi1=cx+r*Math.cos(a),yi1=cy+r*Math.sin(a);
    const lg=(ang-gap)>Math.PI?1:0; const col=d.label==='Other'?WOTHER:WSER[i%8];
    paths+='<path d="M'+x1.toFixed(1)+' '+y1.toFixed(1)+' A'+R+' '+R+' 0 '+lg+' 1 '+x2.toFixed(1)+' '+y2.toFixed(1)+' L'+xi2.toFixed(1)+' '+yi2.toFixed(1)+' A'+r+' '+r+' 0 '+lg+' 0 '+xi1.toFixed(1)+' '+yi1.toFixed(1)+' Z" fill="'+col+'"><title>'+esc(d.label)+': '+wpeso(d.value)+'</title></path>'; a+=ang; });
  const svg='<svg viewBox="0 0 190 190" width="190" height="190" style="display:block;margin:0 auto">'+paths+'<text x="95" y="90" text-anchor="middle" font-size="12" fill="'+WMUTED+'">Total</text><text x="95" y="108" text-anchor="middle" font-size="16" font-weight="700" fill="'+WINK+'">'+wpeso(tot)+'</text></svg>';
  const leg='<div class="legend">'+data.map((d,i)=>{ const col=d.label==='Other'?WOTHER:WSER[i%8]; return '<span class="it"><span class="sw" style="background:'+col+'"></span>'+esc(d.label)+' · <b style="font-variant-numeric:tabular-nums">'+wpeso(d.value)+'</b></span>'; }).join('')+'</div>';
  return svg+leg;
}
function wrHbars(rows,color,fmt){ const max=Math.max(1,...rows.map(r=>Math.abs(r.value)));
  return rows.map((r,i)=>{ const c=color||WSER[i%8],w=Math.max(2,Math.abs(r.value)/max*100);
    return '<div class="bar-row"><span class="bar-lab" title="'+esc(r.label)+'">'+esc(r.label)+'</span><span class="bar-track"><span class="bar-fill" style="width:'+w+'%;background:'+c+'"></span></span><span class="bar-val">'+fmt(r.value)+'</span></div>'; }).join(''); }
function wrMargins(rows){ const max=Math.max(1,...rows.map(r=>Math.abs(r.margin)));
  return rows.map(r=>{ const c=r.margin>=0?WGOOD:WCRIT,w=Math.max(2,Math.abs(r.margin)/max*100);
    return '<div class="bar-row"><span class="bar-lab" title="'+esc(r.name)+'">'+esc(r.name)+'</span><span class="bar-track"><span class="bar-fill" style="width:'+w+'%;background:'+c+'"></span></span><span class="bar-val" style="color:'+c+'">'+(r.margin>0?'+':'')+(Math.round(r.margin*10)/10)+'%</span></div>'; }).join(''); }
function wrLine(pts,xk,yk,color){ if(!pts||pts.length<2) return '<div class="hint">Not enough history yet.</div>';
  const W=440,H=170,pl=44,pr=14,pt=12,pb=26; const ys=pts.map(p=>p[yk]); const mx=Math.max(...ys,1),mn=0;
  const px=i=>pl+i/(pts.length-1)*(W-pl-pr), py=v=>H-pb-((v-mn)/((mx-mn)||1))*(H-pt-pb);
  let grid=''; for(let g=0;g<=4;g++){ const v=mx*g/4,y=py(v); grid+='<line x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+y.toFixed(1)+'" stroke="'+WGRID+'" stroke-width="1"/><text x="'+(pl-6)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" font-size="10" fill="'+WMUTED+'">'+wkfmt(v)+'</text>'; }
  let d=''; pts.forEach((p,i)=>{ d+=(i?'L':'M')+px(i).toFixed(1)+' '+py(p[yk]).toFixed(1)+' '; });
  const area='M'+px(0).toFixed(1)+' '+py(0).toFixed(1)+' '+pts.map((p,i)=>'L'+px(i).toFixed(1)+' '+py(p[yk]).toFixed(1)).join(' ')+' L'+px(pts.length-1).toFixed(1)+' '+py(0).toFixed(1)+' Z';
  let xl=''; const step=Math.max(1,Math.ceil(pts.length/6)); pts.forEach((p,i)=>{ if(i%step===0||i===pts.length-1) xl+='<text x="'+px(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9.5" fill="'+WMUTED+'">'+esc(p[xk])+'</text>'; });
  const last=pts[pts.length-1];
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="'+H+'">'+grid+'<path d="'+area+'" fill="'+color+'" opacity=".08"/><path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="'+px(pts.length-1).toFixed(1)+'" cy="'+py(last[yk]).toFixed(1)+'" r="3.5" fill="'+color+'"/><text x="'+px(pts.length-1).toFixed(1)+'" y="'+(py(last[yk])-8).toFixed(1)+'" text-anchor="end" font-size="11" font-weight="700" fill="'+WINK+'">'+wkfmt(last[yk])+'</text>'+xl+'</svg>';
}

let cmdSel=0, cmdItems=[];
function ensureCmd(){ if($('cmdwrap')) return;

}

function closeCmd(){ const w=$('cmdwrap'); if(w) w.classList.remove('on'); }
async function cmdSearch(q){
  q=(q||'').toLowerCase(); const items=[{icon:'🏠',label:'Dashboard',tag:'Open',act:()=>openModel('home')}];
  Object.keys(MODELS).forEach(k=>{ if(!q||MODELS[k].label.toLowerCase().includes(q)) items.push({icon:MODELS[k].icon,label:MODELS[k].label,tag:'Open',act:()=>openModel(k)}); });
  if(q.length>=1){ for(const mdl of ['ingredients','products','suppliers','purchase_orders']){ const m=MODELS[mdl];
    let rows=[]; try{ rows=await db.list(mdl,{search:q}); }catch(e){}
    rows.slice(0,6).forEach(r=>items.push({icon:m.icon,label:r[m.name],tag:m.label,act:()=>{ state.model=mdl; openForm(encodeURIComponent(r[m.pk])); }})); } }
  cmdItems=items.slice(0,30); cmdSel=0; renderCmd();
}
function renderCmd(){ const el=$('cmdres'); if(!el) return;
  el.innerHTML=cmdItems.map((it,i)=>`<div class="r ${i===cmdSel?'sel':''}" onclick="cmdRun(${i})"><span>${it.icon}</span><span>${esc(it.label)}</span><span class="tag">${it.tag}</span></div>`).join('')||'<div class="r">No results</div>'; }
function cmdRun(i){ const it=cmdItems[i]; if(it){ closeCmd(); it.act(); } }
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openCmd(); return; }
  const w=$('cmdwrap'); if(!w||!w.classList.contains('on')) return;
  if(e.key==='Escape') closeCmd();
  else if(e.key==='ArrowDown'){ e.preventDefault(); cmdSel=Math.min(cmdItems.length-1,cmdSel+1); renderCmd(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); cmdSel=Math.max(0,cmdSel-1); renderCmd(); }
  else if(e.key==='Enter') cmdRun(cmdSel);
});

async function prodLoadDemand(){
  const prods=(await db.list('products',{})).filter(p=>p.active!==false);
  let dm={...mrpDemand};
  if(!Object.keys(dm).some(k=>+dm[k]>0)){ try{ mrpPlanCache=await mrpPlans(); const last=mrpPlanCache[0]; if(last){ const d=last.data||last; dm={...(d.demand||{})}; } }catch(e){} }
  let lines=prods.map(p=>{ const pk=+dm[p.sku]||0; return {product_sku:p.sku,name:p.name,planned_packs:pk,good_packs:pk,reject_packs:0,waste_g:0,output_lot:''}; }).filter(l=>l.planned_packs>0);
  if(!lines.length){ lines=prods.map(p=>({product_sku:p.sku,name:p.name,planned_packs:0,good_packs:0,reject_packs:0,waste_g:0,output_lot:''})); toast('No demand found — loaded all products at 0 (encode rush orders)',true); }
  else toast('Loaded '+lines.length+' product(s) from demand');
  prodPlanLines=lines; drawProdPlan();
}
async function prodPersist(status){
  const active=prodPlanLines.filter(l=>(+l.planned_packs||0)>0||(+l.good_packs||0)>0);
  if(!active.length){ toast('Nothing to save — load demand or enter packs',true); return null; }
  if(!prodRunRef){ prodRunRef=(await genRef('PR',{date:prodPlanDate})).ref; }
  const recs=active.map((l,i)=>({batch_ref:prodRunRef+'/'+_p2(i+1), run_ref:prodRunRef, product_sku:l.product_sku, planned_packs:+l.planned_packs||0, good_packs:+l.good_packs||0, reject_packs:+l.reject_packs||0, waste_g:+l.waste_g||0, output_lot:l.output_lot||'', production_date:prodPlanDate, status, operator:CURRENT_USER}));
  if(isLive()){
    try{ await sb('production_batches?run_ref=eq.'+encodeURIComponent(prodRunRef),{method:'DELETE',prefer:'return=minimal'}); }catch(e){}
    try{ await sb('production_batches',{method:'POST',prefer:'return=minimal',body:JSON.stringify(recs)}); }catch(e){ toast(e.message,true); return null; }
  } else { DEMO.production_batches=(DEMO.production_batches||[]).filter(b=>b.run_ref!==prodRunRef).concat(recs); }
  return recs;
}
async function prodSaveDraft(){ const r=await prodPersist('draft'); if(r){ sysLog('production_batches',prodRunRef,'📝 Draft production plan saved ('+r.length+' batches) by '+CURRENT_USER); toast('Draft saved · '+prodRunRef); drawProdPlan(); } }
async function prodConfirm(){
  if(_postLock){ toast('Still posting — please wait…',true); return; }
  if(!confirm('Confirm this production run? Good packs post to finished stock at Bulacan.'))return;
  _postLock=true; try{ await _prodConfirm(); } finally{ _postLock=false; }
}
// Raw grams each product's recipe consumes per pack: usable_g ÷ yield (raw needed > usable).
async function prodBOMMap(){ const boms=await db.list('bom_lines',{}), ings=await listIngredients();
  const im={}; ings.forEach(i=>im[i.sku]=i); const m={};
  boms.forEach(b=>{ const it=im[b.ingredient_sku]||{}; const y=(+it.yield_pct||100)/100||1;
    (m[b.product_sku]=m[b.product_sku]||[]).push({ingredient_sku:b.ingredient_sku, raw_g:(+b.usable_g||0)/y, unit_cost_g:(+it.moving_avg_cost_kg||+it.list_price_kg||0)/1000}); });
  return m; }
async function _prodConfirm(){
  const recs=await prodPersist('confirmed'); if(!recs)return;
  const cm=await prodCostMap(); const bm=await prodBOMMap(); let posted=0, failed=0, drawn=0;
  for(const r of recs){ if((+r.good_packs||0)>0){ const cpp=Math.round((cm[r.product_sku]||0)*100)/100;
    if(await movementExists('Production '+r.batch_ref)) continue;   // already posted — skip (idempotent)
    const packs=+r.good_packs||0;
    try{ await db.update('production_batches','batch_ref',r.batch_ref,{cost_per_pack:cpp}); }catch(e){}
    try{ await db.create('inventory_movements',{kind:'product',ref_sku:r.product_sku,location_code:'bulacan',qty:packs,unit_cost:cpp,movement_type:'batch_output',note:'Production '+r.batch_ref}); posted++; }catch(e){ failed++; }
    // RAW DRAW-DOWN: deplete each recipe ingredient and record expected issues (feeds Checks 2 & 3).
    for(const line of (bm[r.product_sku]||[])){ const rawG=Math.round(line.raw_g*packs*100)/100; if(!(rawG>0)) continue;
      try{ await db.create('inventory_movements',{kind:'ingredient',ref_sku:line.ingredient_sku,location_code:'bulacan',qty:-rawG,unit_cost:line.unit_cost_g,movement_type:'issue_to_batch',note:'Production '+r.batch_ref}); drawn++; }catch(e){ failed++; }
      try{ await db.create('batch_issues',{batch_ref:r.batch_ref,ingredient_sku:line.ingredient_sku,expected_raw_g:rawG,actual_raw_g:rawG}); }catch(e){}
    } } }
  sysLog('production_batches',prodRunRef,'✅ Production confirmed ('+recs.length+' batches, '+drawn+' ingredient issues) by '+CURRENT_USER);
  notifyRecordDone('production_batches', prodRunRef, {batch_ref:prodRunRef,status:'confirmed',operator:CURRENT_USER,production_date:prodPlanDate}, recs);   // PDF → Drive → notify
  toast('Confirmed · '+posted+' product(s) posted; '+drawn+' raw issue(s) drawn down'+(failed?(' · ⚠ '+failed+' failed'):''), failed>0); prodRunRef=''; drawProdPlan();
}

async function countLoad(){
  const sc=countRec.scope||['All'], all=sc.includes('All');
  const ings=await db.list('ingredients',{}), prods=await db.list('products',{});
  const wantIng=all||sc.includes('Ingredients'), wantSup=all||sc.includes('Supplies'), wantStk=all||sc.includes('Stickers'), wantProd=all||sc.includes('Sellable Products');
  const loc=(countRec.location_code||'bulacan');

  let lines=[];
  ings.forEach(i=>{ const c=(i.category||'').toLowerCase(); const isSup=c.includes('supply')||c.includes('supplement');
    if((wantIng&&!isSup)||(wantSup&&isSup)) lines.push({ref_sku:i.sku,name:i.name,book_qty:stock[i.sku]||0,counted_qty:''}); });

  // Stickers are product attributes (per site), not ledger items — count each product's label stock at this location.

    lines.push({ref_sku:'STK-'+p.sku,name:p.name+' — Sticker',book_qty:bq,counted_qty:'',sticker:true,product_sku:p.sku,sticker_field:'sticker_'+loc+'_on_hand'}); });

async function countApprove(){
  if(!countLines.length){ toast('Load & count items first',true); return; }
  if(_postLock){ toast('Still posting — please wait…',true); return; }
  if(!confirm('Approve this count? Counted quantities become the new book stock, and gaps post as shrinkage variances.')) return;
  if(await movementExists('Count '+countRec.count_ref)){ toast('This count was already approved — adjustments not re-posted.',true); return; }
  _postLock=true; try{ await _countApprove(); } finally{ _postLock=false; }
}
async function _countApprove(){
  countRec.status='approved'; await countSave();
  let prodSkus=new Set(); try{ (await db.list('products',{})).forEach(p=>prodSkus.add(p.sku)); }catch(e){}   // live product list, not demo
  const cm=await prodCostMap(); let ings={}; try{ (await db.list('ingredients',{})).forEach(i=>ings[i.sku]=i); }catch(e){}
  let flags=0, failed=0;
  for(const l of countLines){ if(l.counted_qty===''||l.counted_qty==null) continue; const gap=(+l.counted_qty)-(+l.book_qty||0); if(Math.abs(gap)<0.0001) continue; flags++;
    const isStk = l.sticker || String(l.ref_sku).startsWith('STK-');
    if(isStk){
      // stickers live on the product per site — write the counted value straight back
      const psku=l.product_sku||String(l.ref_sku).slice(4);
      const field=l.sticker_field||('sticker_'+(countRec.location_code||'bulacan')+'_on_hand');
      try{ await db.update('products','sku',psku,{[field]:+l.counted_qty}); }catch(e){ failed++; }
    } else {
      const kind = prodSkus.has(l.ref_sku)?'product':'ingredient';
      try{ await db.create('inventory_movements',{kind,ref_sku:l.ref_sku,location_code:countRec.location_code,qty:gap,unit_cost:0,movement_type:'count_adjust',note:'Count '+countRec.count_ref}); }catch(e){ failed++; }
    }
    // value the shrinkage so "₱ at risk" reflects real loss (ingredient moving-avg per g, or product recipe cost)
    const kind2 = (l.sticker||String(l.ref_sku).startsWith('STK-'))?'sticker':(prodSkus.has(l.ref_sku)?'product':'ingredient');
    let uc=0; if(kind2==='ingredient'){ uc=(+(ings[l.ref_sku]||{}).moving_avg_cost_kg||0)/1000; } else if(kind2==='product'){ uc=cm[l.ref_sku]||0; }
    const gval=Math.round(gap*uc*100)/100;
    try{ await db.create('variance_log',{check_type:'3.5 · Shrinkage',source_ref:countRec.count_ref,expected:+l.book_qty||0,actual:+l.counted_qty,gap_qty:gap,gap_value:gval,location:countRec.location_code,responsible_user:CURRENT_USER,status:'open',note:(l.name||l.ref_sku)+' book vs counted'}); }catch(e){}
  }
  sysLog('count_sessions',countRec.count_ref,'✔ Approved by '+CURRENT_USER+' — '+flags+' adjustment(s) posted to stock');
  notifyRecordDone('count_sessions', countRec.count_ref, countRec, countLines);   // PDF → Drive → notify
  toast('Approved · '+flags+' adjustment(s) posted'+(failed?(' · ⚠ '+failed+' failed'):''), failed>0); state.view='list'; route();
}

async function pivot(source,cfg){ const m=MODELS[source]; let rows=[]; try{rows=await db.list(source,{});}catch(e){}

function pivotTable(title,data,rows,cfg,m){
  const dimL=(m.fields.find(f=>f.n===cfg.dim)||{}).l||'Group';
  const measL=cfg.agg==='count'?'Records':((m.fields.find(f=>f.n===cfg.measure)||{}).l||'Value');

  const total=sorted.reduce((s,d)=>s+d.v,0);
  const absTot=sorted.reduce((s,d)=>s+Math.abs(d.v),0)||1;
  const top=sorted[0], top3=sorted.slice(0,3).reduce((s,d)=>s+Math.abs(d.v),0);

    {l:aggWord,v:cfg.agg==='avg'?vfmt(avg):vfmt(total)},

async function rptReceiving(){

async function rptToPasig(){
  const tl=await _L('transfer_lines'), mov=await _L('inventory_movements'), prod=await _L('products');
  const pn={}; prod.forEach(p=>pn[p.sku]=p.name);
  const produced={}; mov.forEach(m=>{ if(m.movement_type==='batch_output') produced[m.ref_sku]=(produced[m.ref_sku]||0)+(+m.qty||0); });
  const rows=tl.map(l=>({ref:l.transfer_ref,prod:pn[l.product_sku]||l.product_sku,sent:+l.sent_packs||0,rcv:+l.received_packs||0,gap:(+l.received_packs||0)-(+l.sent_packs||0)}));
  const tSent=rows.reduce((s,r)=>s+r.sent,0), tRcv=rows.reduce((s,r)=>s+r.rcv,0), tProd=Object.values(produced).reduce((s,v)=>s+v,0), tGap=tRcv-tSent;

  rows.forEach(r=>{ h+=`<tr><td><code>${esc(r.ref)}</code></td><td>${esc(r.prod)}</td><td class="num">${r.sent}</td><td class="num">${r.rcv}</td><td class="num" ${r.gap<0?'style="color:var(--danger)"':''}>${r.gap}</td><td class="num">${r.sent?Math.round(r.rcv/r.sent*100):0}%</td><td>${flag(r)}</td></tr>`; });

// Q5 — where waste, loss & theft are happening
async function rptLossMap(){
  const v=await _L('variance_log');
  const roll=(key)=>{ const o={}; v.forEach(x=>{ const k=x[key]||'—'; const g=o[k]||(o[k]={n:0,open:0,val:0}); g.n++; if(x.status==='open')g.open++; g.val+=Math.abs(+x.gap_value||0); }); return Object.entries(o).sort((a,b)=>b[1].val-a[1].val); };
  const tbl=(rows,lab)=>`<table><thead><tr><th>${lab}</th><th class="num">#</th><th class="num">Open</th><th class="num">₱ at risk</th></tr></thead><tbody>${rows.map(([k,o])=>`<tr><td>${esc(k)}</td><td class="num">${o.n}</td><td class="num">${o.open}</td><td class="num">${_mnum(o.val)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No variances logged ✅</td></tr>'}</tbody></table>`;
  const tot=v.reduce((s,x)=>s+Math.abs(+x.gap_value||0),0);
  // full detail
  const det=[...v].sort((a,b)=>Math.abs(+b.gap_value||0)-Math.abs(+a.gap_value||0));
  const stpill=s=>{ const c=s==='resolved'?'rgba(78,122,62,.14);color:var(--ok,#4e7a3e)':s==='explained'?'rgba(181,118,42,.15);color:var(--earth,#b5762a)':'rgba(178,59,46,.12);color:var(--danger)'; return '<span class="pill" style="background:'+c+'">'+esc(s||'open')+'</span>'; };
  let detail=`<table style="margin-top:12px"><thead><tr><th>Date</th><th>Check</th><th>Source</th><th>Location</th><th class="num">Gap qty</th><th class="num">₱</th><th>Owner</th><th></th></tr></thead><tbody>`+
    det.map(x=>`<tr><td>${esc((''+(x.created_at||'')).slice(0,10))}</td><td>${esc(x.check_type||'')}</td><td><code>${esc(x.source_ref||'')}</code></td><td>${esc(x.location||'')}</td><td class="num">${num(+x.gap_qty||0)}</td><td class="num" style="color:var(--danger)">${_mnum(Math.abs(+x.gap_value||0))}</td><td>${esc(x.responsible_user||'')}</td><td>${stpill(x.status)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">Nothing logged ✅</td></tr>'+`</tbody></table>`;
  detail+='</tbody></table>';
  return `<div class="repcard"><h3 style="margin:0 0 4px">Where waste, loss &amp; theft are happening</h3><div class="hint" style="margin-bottom:8px">Answers: “where exactly are waste, loss, and theft happening?” — every gap, rolled up and line by line.</div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
     <div><div style="font-size:12px;color:var(--muted);margin-bottom:4px">BY LOCATION</div>${tbl(roll('location'),'Location')}</div>
     <div><div style="font-size:12px;color:var(--muted);margin-bottom:4px">BY CHECK TYPE</div>${tbl(roll('check_type'),'Check')}</div>
   </div>
   <div style="font-size:12px;color:var(--muted);margin:14px 0 2px">EVERY VARIANCE (most costly first)</div>${detail}
   <div class="pager">Total ${_mnum(tot)} at risk across ${v.length} logged variance(s).</div></div>`;
}
// Q6 — what is stock really worth, by stage
async function rptStockStage(){
  const sb=await _L('stock_balance'), b=await _L('production_batches'), iss=await _L('batch_issues'), ing=await _L('ingredients');
  const ic={}; ing.forEach(i=>ic[i.sku]=+i.moving_avg_cost_kg||+i.list_price_kg||0);

  const openB=new Set(b.filter(x=>x.status!=='confirmed').map(x=>x.batch_ref)); let wip=0;

     ${r('Raw materials',raw,'Bulacan commissary')}

   </tbody><tbody style="border-top:2px solid var(--line,#ddd)"><tr><td><b>Total inventory</b></td><td class="num"><b>${_mnum(tot)}</b></td><td class="num">100%</td><td></td></tr></tbody></table>

}

// Standard (planned worst-case) vs actual (moving-average) recipe cost per product — the drift is yield loss / price creep.
async function cogsReconHtml(){
  if(moneyHidden()) return '<div class="repcard"><div class="hint">Cost is hidden for your role.</div></div>';
  const prods=await db.list('products',{}), boms=await db.list('bom_lines',{}), ings=await listIngredients();
  const im={}; ings.forEach(i=>im[i.sku]=i);
  const cost=(p,useAvg)=>{ let c=0; boms.filter(b=>b.product_sku===p.sku).forEach(b=>{ const it=im[b.ingredient_sku]||{}; const y=(+it.yield_pct||100)/100||1; const rawKg=((+b.usable_g||0)/y)/1000; const price=useAvg?(+it.moving_avg_cost_kg||+it.list_price_kg||0):(+it.list_price_kg||0); c+=rawKg*price; }); return c; };
  const rows=prods.filter(p=>boms.some(b=>b.product_sku===p.sku)).map(p=>{ const std=cost(p,false), act=cost(p,true); const drift=act-std, pct=std?drift/std*100:0; return {p,std,act,drift,pct}; })
    .sort((a,b)=>Math.abs(b.drift)-Math.abs(a.drift));
  let h=`<div class="repcard"><h3 style="margin:0 0 4px">COGS — standard vs actual</h3>
    <div class="hint" style="margin-bottom:8px">Standard = list (worst-case) price ÷ yield. Actual = moving-average price from real receipts. A positive drift means the real cost is running above plan.</div>
    <table><thead><tr><th>Product</th><th class="num">Standard/pack</th><th class="num">Actual/pack</th><th class="num">Drift ₱</th><th class="num">Drift %</th></tr></thead><tbody>`;
  rows.forEach(r=>{ const col=r.drift>0.009?'var(--danger)':(r.drift<-0.009?'var(--ok)':'var(--muted)');
    h+=`<tr><td>${esc(r.p.name)}</td><td class="num">${fmt(r.std)}</td><td class="num">${fmt(r.act)}</td><td class="num" style="color:${col}">${r.drift>0?'+':''}${fmt(r.drift)}</td><td class="num" style="color:${col}">${r.std?((r.pct>0?'+':'')+r.pct.toFixed(1)+'%'):'—'}</td></tr>`; });
  if(!rows.length) h+='<tr><td colspan="5" class="empty">No costed recipes yet.</td></tr>';
  h+='</tbody></table></div>'; return h;
}

  const pg=prods.map(p=>{ const oh=stock['product:'+p.sku]||0; const thr=+p.par_packs||0; return {name:p.name,sku:p.sku,oh,thr,short:thr-oh,unit:'packs'}; }).filter(r=>r.thr>0&&r.oh<r.thr).sort((a,b)=>b.short-a.short);

    <tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td><code>${esc(r.sku)}</code></td><td class="num">${num(Math.round(r.oh))}</td><td class="num">${num(r.thr)}</td><td class="num"><b style="color:var(--danger)">${num(Math.round(r.short))} ${r.unit}</b></td></tr>`).join('')||`<tr><td colspan="5" class="empty">All at or above threshold ✅</td></tr>`}</tbody></table>

// Soft check (not a hard block): products whose recipe lists an ingredient on >1 line.
// A repeat is fine for substitutions; this just makes accidental exact copies visible.
async function dupBomHtml(){
  const boms=await db.list('bom_lines',{}), prods=await db.list('products',{}), ings=await listIngredients();
  const pn={}; prods.forEach(p=>pn[p.sku]=p.name); const inm={}; ings.forEach(i=>inm[i.sku]=i.name);
  const g={}; boms.forEach(b=>{ const k=b.product_sku+'|'+b.ingredient_sku+'|'+(b.bom_version||1); (g[k]=g[k]||[]).push(+b.usable_g||0); });
  const rows=Object.keys(g).filter(k=>g[k].length>1).map(k=>{ const [ps,is]=k.split('|'); const grams=g[k].slice().sort((a,b)=>b-a);
    const exact=new Set(grams).size===1; return {ps,is,lines:grams.length,grams,total:grams.reduce((s,x)=>s+x,0),exact}; })
    .sort((a,b)=>(a.exact===b.exact?0:(a.exact?-1:1))||b.lines-a.lines);
  let h=`<div class="repcard"><h3 style="margin:0 0 4px">Repeated recipe ingredients</h3>
    <div class="hint" style="margin-bottom:10px">A repeated ingredient is <b>fine</b> — costing sums every line (e.g. a substitution). Rows flagged <span style="color:var(--danger)">⚠ identical grams</span> are worth a look, in case a line was copied by accident.</div>
    <table><thead><tr><th>Product</th><th>Ingredient</th><th class="num">Lines</th><th class="num">Grams/line</th><th class="num">Total g</th><th></th></tr></thead><tbody>`;
  rows.forEach(r=>{ h+=`<tr><td>${esc(pn[r.ps]||r.ps)}</td><td>${esc(inm[r.is]||r.is)}</td><td class="num">${r.lines}</td><td class="num">${r.grams.join(' + ')}</td><td class="num">${num(r.total)}</td><td>${r.exact?'<span style="color:var(--danger)">⚠ identical grams</span>':'<span style="color:var(--muted)">substitution?</span>'}</td></tr>`; });
  if(!rows.length) h+='<tr><td colspan="6" class="empty">No product repeats an ingredient. ✅</td></tr>';
  h+='</tbody></table></div>'; return h;
}

function dlBlob(content,name,type){ const b=new Blob([content],{type}); const u=URL.createObjectURL(b); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(u); }

async function mrpDownloadTemplate(){
  const prods=(await db.list('products',{})).filter(p=>p.active!==false);
  const aoa=[['SKU','product_name','QTY','plan_date'],...prods.map(p=>[p.sku,p.name,0,MRPDATE])];
  if(typeof XLSX!=='undefined'){ const ws=XLSX.utils.aoa_to_sheet(aoa); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Demand'); XLSX.writeFile(wb,'WR_demand_'+MRPDATE+'.xlsx'); }
  else { dlBlob(aoa.map(r=>r.join(',')).join('\n'),'WR_demand_'+MRPDATE+'.csv','text/csv'); }

function parseImportData(name,data){
  if(/\.csv$/i.test(name)){ const map=parseDemandCSV(String(data)); return Object.keys(map).map(sku=>({sku,qty:map[sku]})); }
  if(typeof XLSX==='undefined') throw new Error('Spreadsheet support did not load — please use a .csv file');
  const wb=XLSX.read(data,{type:'binary'}); const ws=wb.Sheets[wb.SheetNames[0]]; const arr=XLSX.utils.sheet_to_json(ws,{header:1});
  const hdr=(arr[0]||[]).map(x=>String(x).trim().toLowerCase());
  const si=hdr.indexOf('sku'), qi=[hdr.indexOf('qty'),hdr.indexOf('demand'),hdr.indexOf('quantity')].find(x=>x>=0), pi=hdr.indexOf('plan_date');
  if(si<0) throw new Error('No "SKU" column found in the sheet header');
  const rows=[]; for(let i=1;i<arr.length;i++){ const r=arr[i]; if(!r)continue; const sku=r[si]; if(sku==null||String(sku).trim()==='')continue; rows.push({sku:String(sku).trim(), qty:Number(r[qi]||0), plan_date:pi>=0?r[pi]:undefined}); }
  return rows;
}
function mrpStageFile(e){ const f=e.target.files[0]; if(!f)return; const rd=new FileReader();
  rd.onload=()=>{ try{ _impRows=parseImportData(f.name,rd.result); _impReport=null;
      $('impArea').innerHTML=`<b>${esc(f.name)}</b> — ${_impRows.length} row(s) read.<div style="margin-top:8px"><button class="btn sec" onclick="mrpTestImport()">🔍 Test Import</button></div>`; }
    catch(err){ $('impArea').innerHTML='<span style="color:var(--danger)">Could not read file: '+esc(err.message)+'</span>'; } };
  if(/\.csv$/i.test(f.name)) rd.readAsText(f); else rd.readAsBinaryString(f);
}
async function mrpTestImport(){

    ${issues.length?`<div style="max-height:180px;overflow:auto"><table style="width:100%;font-size:12px"><thead><tr><th>SKU</th><th class="num">Qty</th><th>Issue</th></tr></thead><tbody>${issues.map(d=>`<tr><td><code>${esc(d.sku)}</code></td><td class="num">${esc(d.qty)}</td><td style="color:var(--danger)">${d.st}</td></tr>`).join('')}</tbody></table></div><div class="hint">Showing first ${issues.length}. Invalid rows are skipped on import.</div>`:'<div class="hint">All rows valid ✅</div>'}
    <div style="margin-top:12px"><button class="btn" onclick="mrpDoImport()" ${ok?'':'disabled'}>✓ Import ${ok} valid row(s)</button></div>`;

function mrpDoImport(){ if(!_impReport)return; const valid=_impReport.filter(d=>d.st==='ok');

  count_sessions:{d:'Weekly physical inventory with approval. Counted qty becomes the new book stock after approval.',h:['New → choose scope (All / Ingredients / Supplies / Stickers / Products)','Click "Load items" — book qty auto-fills (read-only)','Enter counted qty → Save draft → Approve & post'],l:['Book qty is computed from the ledger — you cannot edit it','On approval, counted−book posts as a count_adjust + a Check 3.5 shrinkage variance','Only approved counts change stock']},

  mrp:{d:'Weekly replenishment planner: demand + lead time + PAR → order qty, then auto-create POs grouped by supplier.',h:['Enter demand per product (or Import/Upload by SKU, or Sync from Sheets)','Adjust any line with Manual ±kg','💾 Save plan to keep it; 🧾 Generate Draft POs to order'],l:['Order = weekly need + PAR + lead-time buffer − on-hand, ± manual, rounded up to Min Order','Raw need = usable ÷ yield; lead buffer = need × (lead days ÷ 7); order-by = plan date − lead','Auto-PO groups by each ingredient\'s DEFAULT supplier — when 2 suppliers exist, the default wins']},
