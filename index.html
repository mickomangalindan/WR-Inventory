  const grand=[...combined.values()].reduce((s,v)=>s+v.grams,0);

  const subs=window._prodSub||{};
  const subNote=Object.keys(subs).length?`<div class="card" style="margin-bottom:18px">
    <h2>Palit para sa araw na ito</h2>
    <table class="ingred"><thead><tr><th>Nasa recipe</th><th>Gamitin sa halip</th></tr></thead><tbody>
    ${Object.keys(subs).map(o=>`<tr><td>${esc2(ingName(o))}</td><td><b>${esc2(ingName(subs[o]))}</b></td></tr>`).join('')}
    </tbody></table></div>`:'';

  const html=`<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
    <title>Wholesome Rabbit — Daily Production Sheet — ${esc2(prodPlanDate)}</title>
    <style>${KSHEET_CSS}</style></head><body><div class="wrap"><div id="sheet" class="show">
    ${cover}
    <div id="perMix">${mixBlocks}${outBlock}</div>
    ${subNote}
    <div class="card combined-section">
      <h2>Combined Shopping / Prep List</h2>
      <p class="hint">Lahat ng sangkap sa araw na ito, pinagsama at nakagrupo ayon sa kategorya.</p>
      <div id="combinedList">${combinedHtml}
        <div class="totals-line"><span>Grand total — all products</span><span>${_ksKg(grand)}</span></div>
        <div class="card" style="margin-top:20px">
          <h2 style="margin-bottom:14px;">Pangkalahatang Sign-Off (Araw ng Produksyon)</h2>
          <div class="mix-content">
            <div class="tracking-block">
              <div class="track-row"><span>Petsa</span><div class="fill-line">${esc2(prodPlanDate)}</div></div>
              <div class="track-row"><span>Bilang ng produktong ginawa</span><div class="fill-line">${items.length}</div></div>
              <div class="track-row"><span>Kumuha ng shopping list</span><div class="fill-line"></div></div>
              <div class="track-row"><span>Oras kinuha</span><div class="fill-line"></div></div>
            </div>
            <div class="tracking-block">
              <div class="track-row"><span>Namuno sa produksyon</span><div class="fill-line"></div></div>
              <div class="track-row"><span>Sinuri / nag-verify</span><div class="fill-line"></div></div>
              <div class="track-row"><span>Oras natapos</span><div class="fill-line"></div></div>
              <div class="track-row"><span>Isyu / kulang na stock</span><div class="fill-line"></div></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    </div></div></body></html>`;
  const w=window.open('','_pr','width=1000,height=1000'); if(!w){ toast('Allow pop-ups to print',true); return; }
  w.document.write(html); w.document.close(); w.focus(); setTimeout(()=>w.print(),300);
}
/* "2026-08-14" → "Friday, August 14, 2026" for the sheet's cover. */
function _kbLongDate(d){ try{ const t=new Date(String(d)+'T00:00:00'); if(isNaN(t.getTime())) return String(d||'');
  return t.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'}); }catch(e){ return String(d||''); } }

/* ---- BOM substitution for a run (#3) with add/remove counter ---- */
async function prodSubstitute(){
  const lines=prodPlanLines.filter(l=>(+l.good_packs||0)>0);
  if(!lines.length){ toast('Add products with packs first',true); return; }
  const ings=await listIngredients(); const im={}; ings.forEach(i=>im[i.sku]=i);
  const boms=await db.list('bom_lines',{});
  const req=[]; const seen=new Set(); lines.forEach(l=>boms.filter(b=>b.product_sku===l.product_sku).forEach(b=>{ if(!seen.has(b.ingredient_sku)){ seen.add(b.ingredient_sku); req.push(b.ingredient_sku); } }));
  window._prodSub=window._prodSub||{};
  const rows=req.map(sku=>{ const it=im[sku]||{}; const alt=(it.approved_alt||'').trim(); const chosen=window._prodSub[sku]||'';
    const opts=_procIngOptions(ings,{selected:chosen, exclude:sku, placeholder:null,
      star:o=>alt&&String(o.name||'').trim().toLowerCase()===alt.toLowerCase()});
    return `<tr><td>${esc(it.name||sku)}<div class="mini"><code>${esc(sku)}</code>${alt?' · approved alt: <b>'+esc(alt)+'</b>':''}</div></td>
      <td><select onchange="prodSetSub('${esc(sku)}',this.value)" style="width:280px"><option value="" ${!chosen?'selected':''}>— same (no change) —</option>${opts}</select></td></tr>`; }).join('');
  $('modal').innerHTML=`<div><h3>🔁 Substitute BOM ingredients — this run</h3>
    <p class="mini">When an ingredient is unavailable, swap it for another for <b>this production run only</b>. The recipe grams stay the same; the replacement is processed &amp; consumed instead, with its own yield &amp; cost. The finished product is unchanged.</p>
    <div class="mscroll" style="overflow-x:auto"><table><thead><tr><th>Recipe ingredient</th><th>Replace with</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div style="margin-top:10px;padding:8px 10px;background:#f6f8f4;border-radius:8px;font-size:13px"><b id="subCount">${Object.keys(window._prodSub).length}</b> substitution(s) set for this run</div>
    <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" onclick="closeModal();drawProdPlan()">✅ Apply</button><button class="btn sec" onclick="window._prodSub={};closeModal();drawProdPlan()">Clear all</button></div></div>`;
  $('overlay').classList.add('on');
}
function prodSetSub(orig,val){ window._prodSub=window._prodSub||{}; if(!val||val===orig) delete window._prodSub[orig]; else window._prodSub[orig]=val; const c=$('subCount'); if(c)c.textContent=Object.keys(window._prodSub).length; }
function prodRemainCell(i){ const l=prodPlanLines[i]; const el=$('prem'+i); if(!el)return;
  if(!(+prodTargetMap[l.product_sku]>0)){ el.innerHTML='<span class="mini" style="color:var(--muted)">—</span>'; return; }
  const rem=_prodRemain(l.product_sku,l.good_packs); el.innerHTML=`<b style="color:${rem>0?'var(--berry)':'#4e7a3e'}">${rem}</b>`; }
function prodAddLine(sku){ if(!sku)return; if(prodPlanLines.some(l=>l.product_sku===sku)){ drawProdPlan(); return; } const p=(window._prodAllProducts||[]).find(x=>x.sku===sku)||{}; prodPlanLines.push({product_sku:sku,name:p.name||sku,planned_packs:+prodTargetMap[sku]||0,good_packs:0,reject_packs:0,waste_g:0,output_lot:''}); drawProdPlan(); }
function prodDelLine(i){ prodPlanLines.splice(i,1); drawProdPlan(); prodPackTouch(); }
async function prodPersist(status){
  const active=prodPlanLines.filter(l=>(+l.planned_packs||0)>0||(+l.good_packs||0)>0);
  if(!active.length){ toast('Nothing to save — load demand or enter packs',true); return null; }
  if(!prodRunRef){ prodRunRef=(await genRef('PR',{date:prodPlanDate})).ref; }
  const recs=active.map((l,i)=>({batch_ref:prodRunRef+'/'+_p2(i+1), run_ref:prodRunRef, product_sku:l.product_sku, planned_packs:+l.planned_packs||0, good_packs:+l.good_packs||0, reject_packs:+l.reject_packs||0, waste_g:+l.waste_g||0, output_lot:l.output_lot||'', production_date:prodPlanDate, status, operator:CURRENT_USER}));
  if(isLive()){
    try{ await sb('production_batches?run_ref=eq.'+encodeURIComponent(prodRunRef),{method:'DELETE',prefer:'return=minimal'}); }catch(e){}
    try{ await sb('production_batches',{method:'POST',prefer:'return=minimal',body:JSON.stringify(recs)}); }catch(e){ toast(e.message,true); return null; }
  } else { DEMO.production_batches=(DEMO.production_batches||[]).filter(b=>b.run_ref!==prodRunRef).concat(recs); }
  return recs;
}
async function prodSaveDraft(){ const r=await prodPersist('draft'); if(r){ await prodSavePlanDoc('draft');
  sysLog('production_batches',prodRunRef,'📝 Draft production plan saved ('+r.length+' batches) by '+CURRENT_USER); drawProdPlan();
  try{ await coSyncStatuses(); }catch(e){}      // a custom SKU on a plan → "In Production"
  let sh=[]; try{ sh=await _prodShortages(); }catch(e){}
  if(sh.length){ _prodShortWarn(sh, 'Draft saved · '+prodRunRef); } else { toast('Draft saved · '+prodRunRef+' · ✓ stock covers the run'); }
} }

/* ---- Draft plans you can come back to ---------------------------------------
   production_batches only holds the product lines. The output-ingredient list and
   the run's substitutions lived in memory, so closing the tab lost them and there
   was no way to reopen yesterday's draft at all. The whole plan is now saved as a
   document as well, keyed by run_ref.
   Needs `production_plans` (wr_production_plans.sql). If the table is not there the
   app still works — you just get the old behaviour: product lines only, today only. */
async function prodSavePlanDoc(status){
  if(!prodRunRef) return;
  const doc={ run_ref:prodRunRef, plan_date:prodPlanDate, status:status||'draft',
    data:{ lines:prodPlanLines, outs:prodOutLines, subs:(window._prodSub||{}),
           packStk:prodPackStk, packSup:prodPackSup, by:CURRENT_USER },
    saved_by:CURRENT_USER };
  if(isLive()){
    try{ await sb('production_plans?on_conflict=run_ref',{method:'POST',prefer:'resolution=merge-duplicates,return=minimal',body:JSON.stringify(doc)}); }
    catch(e){ console.warn('production_plans not available — run wr_production_plans.sql',String(e&&e.message||e)); }
  } else {
    const a=JSON.parse(localStorage.getItem('wr_prod_plans')||'[]').filter(x=>x.run_ref!==prodRunRef);
    a.unshift({...doc, saved_at:new Date().toISOString()});
    localStorage.setItem('wr_prod_plans',JSON.stringify(a.slice(0,50)));
  }
}
async function prodPlanDocs(){
  if(isLive()){ try{ return await sb('production_plans?select=*&order=saved_at.desc&limit=40')||[]; }catch(e){ return []; } }
  return JSON.parse(localStorage.getItem('wr_prod_plans')||'[]');
}
async function prodOpenDrafts(){
  showBusy('Loading saved plans…');
  let docs=await prodPlanDocs();
  // Fall back to reconstructing from production_batches when the doc table is absent.
  let fromBatches=[];
  if(!docs.length){
    try{ let rows;
      if(isLive()) rows=await sb('production_batches?select=run_ref,production_date,product_sku,status&status=eq.draft&order=run_ref.desc');
      else rows=(DEMO.production_batches||[]).filter(b=>b.status==='draft');
      const by={}; (rows||[]).forEach(r=>{ (by[r.run_ref]=by[r.run_ref]||{run_ref:r.run_ref,plan_date:r.production_date,n:0}).n++; });
      fromBatches=Object.values(by);
    }catch(e){}
  }
  hideBusy();
  const rows = docs.length
    ? docs.map(d=>{ const n=((d.data||{}).lines||[]).filter(l=>(+l.good_packs||0)>0).length;
        const no=((d.data||{}).outs||[]).filter(o=>(+o.needed_kg||0)>0).length;
        const packs=((d.data||{}).lines||[]).reduce((s,l)=>s+(+l.good_packs||0),0);
        return `<tr><td>${esc(d.plan_date||'')}</td><td><code>${esc(d.run_ref)}</code></td>
          <td>${d.status==='confirmed'?'<span class="badge b-received">posted</span>':'<span class="badge b-open">draft</span>'}</td>
          <td class="num">${n}</td><td class="num">${packs}</td><td class="num">${no}</td>
          <td><span class="btn link" onclick="prodLoadPlanDoc('${encodeURIComponent(d.run_ref)}')">Open</span></td></tr>`; }).join('')
    : fromBatches.map(d=>`<tr><td>${esc(d.plan_date||'')}</td><td><code>${esc(d.run_ref)}</code></td>
        <td><span class="badge b-open">draft</span></td><td class="num">${d.n}</td><td class="num">—</td><td class="num">—</td>
        <td><span class="btn link" onclick="prodLoadRun('${encodeURIComponent(d.run_ref)}','${esc(d.plan_date||'')}')">Open</span></td></tr>`).join('');

/* ---- Actuals maths, in one place so the row, the recap and the totals agree ----

    if(anyProd){ recs=await prodPersist('confirmed'); if(!recs){ _postLock=false; return; } }
    else if(!prodRunRef){ prodRunRef=(await genRef('PR',{date:prodPlanDate})).ref; }   // output-only run
    const cm=await prodCostMap(); const bm=await prodBOMMap();
    const DEFAULT_FG_SHELF=4; const _shelfBy={}; try{ (await db.list('products',{})).forEach(p=>_shelfBy[p.sku]=+p.shelf_life_days||0); }catch(e){}
    const totProc={}; recs.forEach(r=>{ const packs=+r.good_packs||0; (bm[r.product_sku]||[]).forEach(line=>{ totProc[line.ingredient_sku]=(totProc[line.ingredient_sku]||0)+line.processed_g*packs; }); });
    const procRef='Production '+prodRunRef;
    // 1) processing per output (aggregate): consume raw (actual), produce processed (actual made)
    for(const x of acts){ const rawG=Math.round((+x.actualRawKg||0)*1000*100)/100; const madeG=Math.round((+x.actualMadeKg||0)*1000*100)/100;
      if(x.parent && rawG>0){ try{ await db.create('inventory_movements',{kind:'ingredient',ref_sku:x.parent,location_code:'bulacan',qty:-rawG,unit_cost:x.parentCostG,movement_type:'processing_out',note:procRef}); }catch(e){} }
      if(madeG>0){ const y=(rawG>0?madeG/rawG:1); try{ await db.create('inventory_movements',{kind:'ingredient',ref_sku:x.sku,location_code:'bulacan',qty:madeG,unit_cost:(y>0?x.parentCostG/y:x.outCostG),movement_type:'processing_in',note:procRef}); }catch(e){} }
    }
    /* 1b) THE PREP IS PRODUCTION TOO.
       Before this, a run that only processed raw — trimming buffalo, deboning a
       duck — posted its movements and left NOTHING in the Production list. The
       stock moved, but the day's work was invisible, and there was no record to
       point at when someone asked what the team did. Each output ingredient now
       writes its own batch, marked kind='output', alongside the product batches
       of the same run. Quantities live in their own kg columns so nothing that
       counts PACKS is disturbed. */
    let outRecs=[];

      else DEMO.production_batches=(DEMO.production_batches||[]).filter(b=>!(b.run_ref===prodRunRef&&b.kind==='output'));
      let _pi=0;

        const madeKg=Math.round((+x.actualMadeKg||0)*1000)/1000;
        const rawKg =Math.round((+x.actualRawKg ||0)*1000)/1000;
        const procKg=Math.round((+x.procUsedKg  ||0)*1000)/1000;

        if(!(madeKg>0 || rawKg>0)) continue;
        _pi++;

          kind:'output', location_code:planProduceLoc(), production_date:prodPlanDate,
          status:'confirmed', operator:CURRENT_USER,
          planned_packs:0, good_packs:0, reject_packs:0, waste_g:0, output_lot:'',
          output_kg:madeKg, raw_used_kg:rawKg, from_stock_kg:procKg,
          yield_pct:(rawKg>0?Math.round((madeKg/rawKg)*1000)/10:null) };
        try{ await db.create('production_batches',rec); outRecs.push(rec); }
        catch(e){ console.warn('output batch failed',rec.batch_ref,String(e&&e.message||e)); }
      }
    }catch(e){ console.warn('output batches failed',String(e&&e.message||e)); }

    // 2) per batch: finished output + mix draw-down + batch issues (actuals allocated by share)
    let posted=0,failed=0,drawn=0;
    for(const r of recs){ const packs=+r.good_packs||0; if(packs<=0) continue;
      if(await movementExists('Production '+r.batch_ref)) continue;
      const cpp=Math.round((cm[r.product_sku]||0)*100)/100;
      const _bb=addDaysISO(prodPlanDate||todayISO(), _shelfBy[r.product_sku]||DEFAULT_FG_SHELF);   // best-before = production date + shelf life
      try{ await db.update('production_batches','batch_ref',r.batch_ref,{cost_per_pack:cpp,best_before:_bb}); }catch(e){}
      try{ await db.create('inventory_movements',{kind:'product',ref_sku:r.product_sku,location_code:'bulacan',qty:packs,unit_cost:cpp,movement_type:'batch_output',note:'Production '+r.batch_ref,expiry_date:_bb}); posted++; }catch(e){ failed++; }
      for(const line of (bm[r.product_sku]||[])){ const procG=Math.round(line.processed_g*packs*100)/100; if(!(procG>0)) continue;
        const x=actBy[line.ingredient_sku]||{}; const tot=totProc[line.ingredient_sku]||procG; const share=tot>0?(line.processed_g*packs)/tot:1;
        const actRawB=Math.round((+x.actualRawKg||0)*1000*share*100)/100; const madeB=Math.round((+x.actualMadeKg||0)*1000*share*100)/100;
        try{ await db.create('inventory_movements',{kind:'ingredient',ref_sku:line.ingredient_sku,location_code:'bulacan',qty:-procG,unit_cost:line.unit_cost_g,movement_type:'issue_to_batch',note:'Production '+r.batch_ref}); drawn++; }catch(e){ failed++; }
        try{ await db.create('batch_issues',{batch_ref:r.batch_ref,ingredient_sku:line.ingredient_sku,expected_raw_g:Math.round(line.raw_g*packs*100)/100,actual_raw_g:actRawB,expected_processed_g:procG,actual_processed_g:(madeB||procG),uom:'kg'}); }catch(e){}
      }
    }
    /* Packaging & labels — the run consumed them, so take them out of stock.
       Product labels live on the product row (sticker_<site>_on_hand); supplies
       are ordinary ingredient stock, so they post as a negative movement.
       A personalised label has no stock record to draw from; it is recorded on
       the batch note only. */
    let _lblDone=0, _supDone=0;
    try{
      const _loc=planProduceLoc();
      for(const r of prodPackStk){
        const q=+r.qty||0; if(!(q>0)) continue;
        if(r.kind==='product'){
          const cur=+(((window._prodAllProducts||[]).find(p=>p.sku===r.sku)||{})['sticker_'+_loc+'_on_hand'])||0;
          try{ await db.update('products','sku',r.sku,{['sticker_'+_loc+'_on_hand']:Math.round(cur-q)}); _lblDone++; }catch(e){}
        } else if(r.kind==='supply'){
          try{ await db.create('inventory_movements',{kind:'ingredient',ref_sku:r.sku,location_code:_loc,qty:-q,
                 unit_cost:0,movement_type:'production',note:'Labels used · '+prodRunRef}); _lblDone++; }catch(e){}
        }
      }
      for(const r of prodPackSup){
        const q=+r.qty||0; if(!(q>0)) continue;
        try{ await db.create('inventory_movements',{kind:'ingredient',ref_sku:r.sku,location_code:_loc,qty:-q,
               unit_cost:0,movement_type:'production',note:'Supplies used · '+prodRunRef}); _supDone++; }catch(e){}
      }
      const _pers=prodPackStk.filter(r=>r.kind==='personal'&&(+r.qty||0)>0);
      if(_lblDone||_supDone||_pers.length)
        sysLog('production_batches',prodRunRef,'🏷️ Packaging posted — '+_lblDone+' label line(s), '+_supDone+' supply line(s)'+
          (_pers.length?(' · personalised: '+_pers.map(x=>x.name+' ×'+x.qty).join(', ')):'')+' at '+_loc);
    }catch(e){ console.warn('packaging post failed',String(e&&e.message||e)); }
    const nOut=outRecs.length;
    sysLog('production_batches',prodRunRef,'✅ Production confirmed with actuals ('+recs.length+' product batch(es)'
      +(nOut?', '+nOut+' prep batch(es) — '+outRecs.map(r=>ingName(r.product_sku)+' '+r.output_kg+' kg').join(', '):'')
      +') — processed+produced by '+CURRENT_USER);
    if(recs.length) notifyRecordDone('production_batches', prodRunRef, {batch_ref:prodRunRef,status:'confirmed',operator:CURRENT_USER,production_date:prodPlanDate}, recs);
    try{ await prodSavePlanDoc('confirmed'); }catch(e){}
    try{ await coSyncStatuses(); }catch(e){}   // packs made → Partially Fulfilled / Completed
    toast('Confirmed · '+posted+' product(s)'+(nOut?', '+nOut+' output ingredient(s)':'')+', '+drawn+' issue(s), yield captured'
      +((_lblDone||_supDone)?(' · '+_lblDone+' label + '+_supDone+' supply line(s) deducted'):'')+(failed?(' · ⚠ '+failed+' failed'):''), failed>0);
    prodRunRef=''; prodPlanLines=[]; prodOutLines=[]; prodPackStk=[]; prodPackSup=[]; window._prodAct=null; window._prodSub={}; closeModal(); await renderProdPlan();
  }catch(e){ toast(e.message,true); } finally{ _postLock=false; }
}

async function prodBOMMap(){ const boms=await db.list('bom_lines',{}), ings=await listIngredients();

function _outIngCtx(ings){

// Strip form qualifiers to a base material name so "Beef Lungs Raw" & "Beef Lungs Processed" group together.
function _matBase(name){ return String(name||'').replace(/\([^)]*\)/g,' ').replace(/[-–—_/]+/g,' ')
  .replace(/\b(raw|processed|process|ground|minced|whole|wd|dressed)\b/gi,' ')
  .replace(/\s+/g,' ').trim(); }
// Build the set of base materials that have a processed form (so we can label raw siblings "— Raw"),
// and a base→category map from the processed items. Raw ingredients in the master all carry the
// generic category "Raw Material", so a raw item inherits its processed sibling's real food
// category (Muscle Meat, Organ Meat, …) — that keeps raw + processed of the same base together.
function _countProcBases(ings,bs,bn){ const m=_countProcMaps(ings,bs,bn); return m.bases; }
function _countProcMaps(ings,bs,bn){ const bases=new Set(), catByBase={};
  ings.forEach(i=>{ if(i.is_intermediate){ const p=_procParent(i,bs,bn); const base=_matBase(p?p.name:i.name)||(p?p.name:i.name);
    if(base){ const k=base.toLowerCase(); bases.add(k); if(i.category && !catByBase[k]) catByBase[k]=i.category; } } });
  return {bases,catByBase}; }
// Classify one ingredient for the weekly count: supplies (incl. stickers/labels) → Kitchen Supplies;
// food ingredients grouped by base material with raw + processed shown underneath.
function _countIngClass(i, ctx){
  if(isSupplyItem(i)){ return {isSup:true, g1:'Kitchen Supplies', g2:(i.category||'Supplies'), name:i.name, grank:800000, uom:(i.uom||'pcs'), scale:1, form:'supply'}; }
  const isProc=!!i.is_intermediate; const p=isProc?_procParent(i,ctx.bs,ctx.bn):null;
  const base=(_matBase(p?p.name:i.name)||(p?p.name:i.name)); const bk=base.toLowerCase(); const hasPair=ctx.procBases.has(bk);
  // Raw items inherit the processed sibling's category so both land under the same group.
  const inheritedCat=(!isProc && ctx.procCat && ctx.procCat[bk]) ? ctx.procCat[bk] : null;
  const cat=inheritedCat||i.category||'Ingredients';
  let nm=i.name;
  if(isProc) nm = /processed/i.test(i.name)? i.name : (i.name+' — Processed');
  else if(hasPair) nm = /\braw\b/i.test(i.name)? i.name : (i.name+' — Raw');
  return {isSup:false, g1:cat, g2:base, name:nm, grank:400000+_grank(cat)*1000+_so(i), uom:'kg', scale:1000, form:isProc?'processed':'raw'};
}

// ONE ordered sequence of render rows (group header / subgroup header / item) from any list of
// lines {g1,g2,grank,form,name}. Shared by the weekly count AND the opening-balance sheet so their

function _renderRows(lines){ const _lr2=l=>l.grank==null?500000:l.grank; const _gmin=arr=>Math.min(...arr.map(_lr2));
  const _bg1={}; lines.slice().sort((a,b)=>_lr2(a)-_lr2(b)||String(a.name||'').localeCompare(b.name||'')).forEach(l=>{ const k=l.g1||l.cat||'Other'; (_bg1[k]=_bg1[k]||[]).push(l); });
  const out=[]; Object.keys(_bg1).sort((a,b)=>_gmin(_bg1[a])-_gmin(_bg1[b])).forEach(g1=>{
    out.push({type:'g1',label:g1,count:_bg1[g1].length});
    const _bg2={}; _bg1[g1].forEach(l=>{ const k=l.g2||'Other'; (_bg2[k]=_bg2[k]||[]).push(l); });
    const _fr=l=>((l.form==='processed')?1:0);
    Object.keys(_bg2).sort((a,b)=>_gmin(_bg2[a])-_gmin(_bg2[b])).forEach(g2=>{
      out.push({type:'g2',label:g2,count:_bg2[g2].length});
      _bg2[g2].slice().sort((a,b)=>_fr(a)-_fr(b)||_lr2(a)-_lr2(b)||String(a.name||'').localeCompare(b.name||'')).forEach(l=>out.push({type:'item',l})); });
  }); return out; }

// Parse an uploaded template AoA → [{sku, counted}] using the 'sku' + 'counted' (or 'count'/'qty') columns.
function _countRowsFromAoa(arr){
  const hdr=(arr[0]||[]).map(x=>String(x).trim().toLowerCase()); const ci=n=>hdr.indexOf(n);
  const si=ci('sku'); let qi=ci('counted'); if(qi<0)qi=ci('count'); if(qi<0)qi=ci('counted qty'); if(qi<0)qi=ci('counted_qty'); if(qi<0)qi=ci('qty');
  if(si<0||qi<0) return [];
  const rows=[]; for(let i=1;i<arr.length;i++){ const r=arr[i]; if(!r)continue; const sku=r[si]; if(sku==null||String(sku).trim()==='')continue;
    const raw=r[qi]; if(raw==null||String(raw).trim()==='')continue; const q=Number(raw); if(isNaN(q))continue;
    rows.push({sku:String(sku).trim(), counted:q}); }

function _countParseUpload(name,data){
  if(/\.csv$/i.test(name)){ const arr=String(data).split(/\r?\n/).filter(x=>x.trim()!=='').map(line=>{ const out=[]; let cur='',q=false; for(let i=0;i<line.length;i++){ const ch=line[i]; if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; } else { if(ch===','){out.push(cur);cur='';} else if(ch==='"') q=true; else cur+=ch; } } out.push(cur); return out; });
    const rows=_countRowsFromAoa(arr); if(!rows.length) throw new Error('No "sku"/"counted" columns found'); return rows; }
  if(typeof XLSX==='undefined') throw new Error('Spreadsheet support did not load — use a .csv file');
  const wb=XLSX.read(data,{type:'binary'}); let rows=[];
  wb.SheetNames.forEach(sn=>{ try{ rows=rows.concat(_countRowsFromAoa(XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1}))); }catch(e){} });
  if(!rows.length) throw new Error('No "sku"/"counted" rows found on any tab');
  return rows;
}

      let filled=0, unknown=0; const miss=[];

    } catch(err){ toast('Could not read file: '+err.message,true); } finally{ e.target.value=''; } };

function countSetBoxLoose(i,boxV,looseV){ const l=countLines[i]; const box=+l.box||1;

  const wantIng=all||sc.includes('Ingredients'), wantSup=all||sc.includes('Supplies'), wantStk=all||sc.includes('Stickers'), wantProd=all||sc.includes('Sellable Products');
  const loc=(countRec.location_code||'bulacan');

  let lines=[];

  const _bs={}, _bn={}; ings.forEach(it=>{ _bs[it.sku]=it; const nm=(it.name||'').trim().toLowerCase(); if(nm)_bn[nm]=it; });
  const _pm=_countProcMaps(ings,_bs,_bn); const ctx={bs:_bs,bn:_bn,procBases:_pm.bases,procCat:_pm.catByBase};
  ings.slice().sort(cmpItems).forEach(i=>{ const cl=_countIngClass(i,ctx);
    if(cl.isSup){ if(wantSup) lines.push({ref_sku:i.sku,name:cl.name,book_qty:stock[i.sku]||0,counted_qty:'',cat:cl.g2,catrank:_grank('Supplies'),g1:cl.g1,g2:cl.g2,grank:cl.grank,uom:cl.uom,scale:cl.scale,form:cl.form,sort_order:i.sort_order}); return; }
    if(!wantIng) return;
    lines.push({ref_sku:i.sku, name:cl.name, book_qty:stock[i.sku]||0, counted_qty:'', cat:cl.g2, catrank:_grank(i.category), g1:cl.g1, g2:cl.g2, grank:cl.grank, uom:cl.uom, scale:cl.scale, form:cl.form, sort_order:i.sort_order}); });
  if(wantProd) prods.slice().sort(cmpItems).forEach(p=>lines.push({ref_sku:p.sku,name:p.name,book_qty:stock[p.sku]||0,counted_qty:'',cat:(p.family||'Other'),catrank:_grank(p.family),g1:(p.group_1||'Products'),g2:(p.group_2||p.family||'Other'),grank:_so(p),uom:'packs',scale:1,isProduct:true,box:(+p.box_size||1),sort_order:p.sort_order}));
  // Stickers are product attributes (per site), not ledger items — count each product's label stock at this location.
  if(wantStk) prods.slice().sort(cmpItems).forEach(p=>{ const bq=+p['sticker_'+loc+'_on_hand']||0;
    lines.push({ref_sku:'STK-'+p.sku,name:p.name+' — Sticker',book_qty:bq,counted_qty:'',sticker:true,product_sku:p.sku,sticker_field:'sticker_'+loc+'_on_hand',cat:(p.family||'Other')+' — Stickers',catrank:_grank(p.family)+0.5,g1:(p.group_1||'Products')+' — Stickers',g2:(p.group_2||p.family||'Other'),grank:600000+_so(p),uom:'pcs',scale:1,sort_order:p.sort_order}); });
  countLines=lines;

// Weekly-inventory reference: WI-MMDDYYYY [SCOPE].VXX. Scope tag from the selected scope.
function _wiScopeTag(scope){ const s=scope||['All']; if(s.includes('All')||!s.length) return 'ALL';
  const map={'Ingredients':'ING','Supplies':'SUP','Stickers':'STK','Sellable Products':'FG'};
  return s.map(x=>map[x]||String(x).slice(0,3).toUpperCase()).join('+'); }
async function countSave(){

    if(!countRec.count_ref){ const g=await genRef('WI',{date:countRec.count_date,scope:_wiScopeTag(countRec.scope)}); countRec.count_ref=g.ref; }
    if(isLive()){
      // UPSERT the parent session first (a PATCH to a missing row succeeds with 0 rows and never
      // throws, so the old try-update/catch-create left no session → count_lines FK 23503).
      await sb('count_sessions?on_conflict=count_ref',{method:'POST',prefer:'resolution=merge-duplicates,return=minimal',body:JSON.stringify({count_ref:countRec.count_ref,location_code:countRec.location_code,count_date:countRec.count_date,status:countRec.status||'draft',counted_by:CURRENT_USER})});

    } else {

      DEMO.count_lines=(DEMO.count_lines||[]).filter(r=>r.count_ref!==countRec.count_ref).concat(countLines.map(l=>({count_ref:countRec.count_ref,...l})));
    }
    sysLog('count_sessions',countRec.count_ref,'📝 Draft saved by '+CURRENT_USER); toast('Saved draft');
    // The session now exists, so the proof rail (attachments + messages) can attach to it.
    if(formIsNew){ formIsNew=false; formRec=countRec; await renderForm(); }

async function countApprove(){
  if(!countLines.length){ toast('Load & count items first',true); return; }
  if(_postLock){ toast('Still posting — please wait…',true); return; }
  if(!confirm('Approve this count? Counted quantities become the new book stock, and gaps post as shrinkage variances.')) return;
  if(await movementExists('Count '+countRec.count_ref)){ toast('This count was already approved — adjustments not re-posted.',true); return; }
  _postLock=true; try{ await _countApprove(); } finally{ _postLock=false; }
}
async function _countApprove(){
  countRec.status='approved'; await countSave();
  let prodSkus=new Set(); try{ (await db.list('products',{})).forEach(p=>prodSkus.add(p.sku)); }catch(e){}   // live product list, not demo
  const cm=await prodCostMap(); let ings={}; try{ (await db.list('ingredients',{})).forEach(i=>ings[i.sku]=i); }catch(e){}
  let flags=0, failed=0;
  for(const l of countLines){ if(l.counted_qty===''||l.counted_qty==null) continue; const gap=(+l.counted_qty)-(+l.book_qty||0); if(Math.abs(gap)<0.0001) continue; flags++;
    const isStk = l.sticker || String(l.ref_sku).startsWith('STK-');
    if(isStk){
      // stickers live on the product per site — write the counted value straight back
      const psku=l.product_sku||String(l.ref_sku).slice(4);
      const field=l.sticker_field||('sticker_'+(countRec.location_code||'bulacan')+'_on_hand');
      try{ await db.update('products','sku',psku,{[field]:+l.counted_qty}); }catch(e){ failed++; }
    } else {
      const kind = prodSkus.has(l.ref_sku)?'product':'ingredient';
      try{ await db.create('inventory_movements',{kind,ref_sku:l.ref_sku,location_code:countRec.location_code,qty:gap,unit_cost:0,movement_type:'count_adjust',note:'Count '+countRec.count_ref}); }catch(e){ failed++; }
    }
    // value the shrinkage so "₱ at risk" reflects real loss (ingredient moving-avg per g, or product recipe cost)
    const kind2 = (l.sticker||String(l.ref_sku).startsWith('STK-'))?'sticker':(prodSkus.has(l.ref_sku)?'product':'ingredient');
    let uc=0; if(kind2==='ingredient'){ uc=(+(ings[l.ref_sku]||{}).moving_avg_cost_kg||0)/1000; } else if(kind2==='product'){ uc=cm[l.ref_sku]||0; }
    const gval=Math.round(gap*uc*100)/100;
    try{ await db.create('variance_log',{check_type:'3.5 · Shrinkage',source_ref:countRec.count_ref,expected:+l.book_qty||0,actual:+l.counted_qty,gap_qty:gap,gap_value:gval,location:countRec.location_code,responsible_user:CURRENT_USER,status:'open',note:(l.name||l.ref_sku)+' book vs counted'}); }catch(e){}
  }
  sysLog('count_sessions',countRec.count_ref,'✔ Approved by '+CURRENT_USER+' — '+flags+' adjustment(s) posted to stock');
  notifyRecordDone('count_sessions', countRec.count_ref, countRec, countLines);   // PDF → Drive → notify
  toast('Approved · '+flags+' adjustment(s) posted'+(failed?(' · ⚠ '+failed+' failed'):''), failed>0); state.view='list'; route();
}

function pivotTable(title,data,rows,cfg,m){
  const dimL=(m.fields.find(f=>f.n===cfg.dim)||{}).l||'Group';
  const measL=cfg.agg==='count'?'Records':((m.fields.find(f=>f.n===cfg.measure)||{}).l||'Value');

  const vfmt=v=>isMoney?fmt(v):num(Math.round(v*100)/100);

  const sorted=[...data].sort((a,b)=>Math.abs(b.v)-Math.abs(a.v));
  const total=sorted.reduce((s,d)=>s+d.v,0);
  const absTot=sorted.reduce((s,d)=>s+Math.abs(d.v),0)||1;
  const top=sorted[0], top3=sorted.slice(0,3).reduce((s,d)=>s+Math.abs(d.v),0);

    {l:aggWord,v:cfg.agg==='avg'?vfmt(avg):vfmt(total)},

    {l:'Largest — '+String(top.k),v:vfmt(top.v)+' · '+Math.round(Math.abs(top.v)/absTot*100)+'%'},

  const bars=wrHbars(sorted.map(d=>({label:String(d.k),value:d.v})),null,vfmt);

// Q6 — what is stock really worth, by stage
/* ---- Inventory valuation: what is understating it, and by how much ----------
   Three columns, because they answer three different questions:
     As posted     qty × the unit_cost actually on the movement. This is the
                   book number. A zero-cost movement contributes nothing.
     At cost       the same qty priced from master data, filling the gaps:
                     raw / supply   moving-average, else list price
                     PROCESSED      its raw parent's cost ÷ yield%  ← the rule
                                    you asked about: 1 kg of processed eats
                                    1/yield kg of raw, so that is what it cost
                     product        tot_cost_ref
     At selling    products at sell_price. Not an accounting number — it is the
                   revenue the shelf represents, useful next to cost, never in
                   the books.
   Negative quantities are shown separately because they are not a valuation
   problem, they are a counting problem: you cannot hold −4 kg of anything. */
function _valProcCost(it, bySku, byName){
  const y=((+it.yield_pct||100)/100)||1;
  const p=_procParent(it, bySku, byName);
  const raw=p?(+p.moving_avg_cost_kg||+p.list_price_kg||0):0;
  return raw>0 ? (raw/y) : 0;                      // per kg of PROCESSED output
}
async function rptStockGaps(){
  const bal=await _L('stock_balance'), ing=await _L('ingredients'), prod=await _L('products');
  const bySku={}, byName={}; ing.forEach(i=>{ bySku[i.sku]=i; const n=(i.name||'').trim().toLowerCase(); if(n) byName[n]=i; });
  const pm={}; prod.forEach(p=>pm[p.sku]=p);
  const rows=[]; let posted=0, atCost=0, atSell=0, negQty=0, negVal=0;
  const zero=[], neg=[], derived=[];
  bal.forEach(b=>{
    const qty=+b.on_hand||0; if(!qty) return;
    const isProd=(b.kind==='product');
    const it=isProd?(pm[b.ref_sku]||{}):(bySku[b.ref_sku]||{});
    const name=it.name||b.ref_sku;
    const post=+b.stock_value||0;
    let cost=0, how='';
    if(isProd){ cost=(+it.tot_cost_ref||0)*qty; how='product cost'; }
    else if(isSupplyItem(it)){ cost=(+it.list_price_kg||+it.moving_avg_cost_kg||0)*qty; how='supply unit price'; }
    else if(it.is_intermediate){ const c=_valProcCost(it,bySku,byName); cost=c*(qty/1000); how=c?'raw ÷ yield':''; if(c) derived.push({name,sku:b.ref_sku,c}); }
    else { cost=((+it.moving_avg_cost_kg||+it.list_price_kg||0))*(qty/1000); how='moving average'; }
    const sell=isProd?((+it.sell_price||0)*qty):0;
    posted+=post; atCost+=cost; atSell+=sell;
    if(qty<0){ negQty++; negVal+=post; neg.push({name,sku:b.ref_sku,loc:b.location_code,qty,post}); }
    else if(Math.abs(post)<0.005 && cost>0.005) zero.push({name,sku:b.ref_sku,loc:b.location_code,qty,cost,how});
    rows.push({name,sku:b.ref_sku,kind:b.kind,loc:b.location_code,qty,post,cost,sell,how});
  });
  const gap=atCost-posted;
  const m=v=>_mnum(v);
  const tile=(v,l,c)=>`<div class="stile"><div class="v"${c?` style="color:${c}"`:''}>${v}</div><div class="l">${l}</div></div>`;
  const zeroTot=zero.reduce((a,x)=>a+x.cost,0);
  const zTop=zero.sort((a,b)=>b.cost-a.cost).slice(0,15);
  const nTop=neg.sort((a,b)=>a.qty-b.qty).slice(0,15);
  const dTop=derived.slice(0,10);
  return `<div class="repcard"><h3 style="margin:0 0 4px">Inventory valuation — where the value is going missing</h3>
    <div class="hint" style="margin-bottom:8px">Book value is <b>qty × the unit cost on each movement</b>. Anything posted at zero cost counts as zero, forever, which is what understates the total. This prices the same stock from master data to show the gap.</div>
    <div class="smart" style="margin-bottom:10px">
      ${tile(m(posted),'As posted (book)')}
      ${tile(m(atCost),'At cost (master)', gap>0?'#4e7a3e':'')}
      ${tile(m(gap),'Understated by', gap>0?'var(--berry)':'#4e7a3e')}
      ${tile(m(atSell),'At selling price')}
      ${tile(negQty,'Negative qty lines', negQty?'var(--danger)':'#4e7a3e')}
    </div>
    <h4 style="margin:12px 0 4px">1 · Posted at zero cost — ${zero.length} line(s), worth ${m(zeroTot)}</h4>
    <div class="hint" style="margin:0 0 6px">These carry real stock at no book value. Fix the master price, then re-run <code>wr_opening_cost_backfill.sql</code> to reprice the movements already posted.</div>
    <div style="overflow-x:auto"><table><thead><tr><th>Item</th><th>SKU</th><th>Site</th><th class="num">Qty</th><th class="num">Should be</th><th>Priced from</th></tr></thead><tbody>
    ${zTop.map(x=>`<tr><td>${esc(x.name)}</td><td><code>${esc(x.sku)}</code></td><td class="mini">${esc(x.loc||'')}</td><td class="num">${Math.round(x.qty)}</td><td class="num">${m(x.cost)}</td><td class="mini">${esc(x.how)}</td></tr>`).join('')
      ||'<tr><td colspan="6" class="empty">Nothing posted at zero cost ✅</td></tr>'}
    ${zero.length>15?`<tr><td colspan="6" class="mini" style="color:var(--muted)">…and ${zero.length-15} more</td></tr>`:''}
    </tbody></table></div>
    <h4 style="margin:14px 0 4px">2 · Negative quantities — ${negQty} line(s)</h4>
    <div class="hint" style="margin:0 0 6px">You cannot hold less than nothing. Each of these is a movement posted that the stock could not cover — production drawing an ingredient never received, or an opening balance missed. They drag the total down by ${m(negVal)}. Fix by counting the item and posting the correction, not by editing the value.</div>
    <div style="overflow-x:auto"><table><thead><tr><th>Item</th><th>SKU</th><th>Site</th><th class="num">Qty</th><th class="num">Book value</th></tr></thead><tbody>
    ${nTop.map(x=>`<tr><td>${esc(x.name)}</td><td><code>${esc(x.sku)}</code></td><td class="mini">${esc(x.loc||'')}</td><td class="num" style="color:var(--danger)">${Math.round(x.qty)}</td><td class="num">${m(x.post)}</td></tr>`).join('')
      ||'<tr><td colspan="5" class="empty">No negative stock ✅</td></tr>'}
    </tbody></table></div>
    <h4 style="margin:14px 0 4px">3 · Processed ingredients priced from raw ÷ yield — ${derived.length} item(s)</h4>
    <div class="hint" style="margin:0 0 6px">A processed ingredient rarely has a purchase price of its own, because you never buy it — you make it. Its cost is the raw parent's cost divided by the yield: at 50% yield, 1 kg of processed consumed 2 kg of raw, so it is worth twice the raw price per kilo.</div>
    <div style="overflow-x:auto"><table><thead><tr><th>Processed</th><th>SKU</th><th class="num">Derived ₱/kg</th></tr></thead><tbody>
    ${dTop.map(x=>`<tr><td>${esc(x.name)}</td><td><code>${esc(x.sku)}</code></td><td class="num">${m(x.c)}</td></tr>`).join('')
      ||'<tr><td colspan="3" class="empty">No processed stock on hand.</td></tr>'}
    </tbody></table></div>`+
    _repNote('Three valuations of the same stock: <b>as posted</b> (the book), <b>at cost</b> (repriced from master, with processed derived from raw ÷ yield), and <b>at selling price</b> (products only — revenue potential, never an accounting figure).',
      'the <b>Understated by</b> figure and section 1 — every line there is stock you own carrying no value. Section 2 is a counting error, not a pricing one; fix it with a count, not a price.')+`</div>`;
}

/* ============ Gross Margin — full cost per pack (raw + other costs) → GP% → suggested price ============ */
// Per-pack gross-margin model (from the Product Gross Profit Simulation). Rates are global;
// per-product toggles (debone / butcher / sous-vide / ecobag / thermal) live on each product.
const COST_MODEL_DEFAULT={ target_gm:0.30,
  perGram:{ electricity:0.0186667, water:0.0006667, transport:0.0058267 },   // ₱ per gram
  labor:{ plain:0.0245, debone:0.147, butcher:0.0119617, sousvide:0.0012 },  // ₱ per gram
  pack:{ vacuum:3.57, ecobag:12, thermal:13, sticker:1.375 },                // ₱/pack fallback if not in Supplies (sticker = ₱1.375 each)
  pct:{ transaction:0.06, marketing:0.05 } };
function _cmMigrate(m){ // tolerate old {fixed,pct[]} shape
  if(!m||m.perGram) return m||JSON.parse(JSON.stringify(COST_MODEL_DEFAULT));
  return JSON.parse(JSON.stringify(COST_MODEL_DEFAULT)); }
let COST_MODEL=(function(){ try{ return _cmMigrate(JSON.parse(localStorage.getItem('wr_cost_model')||'null')); }catch(e){ return JSON.parse(JSON.stringify(COST_MODEL_DEFAULT)); } })();
async function loadCostModel(){ if(window._costModelLoaded||!isLive()) return; window._costModelLoaded=true;
  try{ const r=await sb('app_settings?select=value&key=eq.cost_model'); if(r&&r[0]&&r[0].value&&r[0].value.perGram){ COST_MODEL=Object.assign(JSON.parse(JSON.stringify(COST_MODEL_DEFAULT)),r[0].value); localStorage.setItem('wr_cost_model',JSON.stringify(COST_MODEL)); } }catch(e){} }
function saveCostModel(){ localStorage.setItem('wr_cost_model',JSON.stringify(COST_MODEL));
  if(isLive()){ sb('app_settings',{method:'POST',prefer:'resolution=merge-duplicates,return=minimal',body:JSON.stringify({key:'cost_model',value:COST_MODEL})}).catch(()=>{}); }
  toast('Cost model saved'); renderMargin(); }
function cmSetPG(k,v){ (COST_MODEL.perGram=COST_MODEL.perGram||{})[k]=+v||0; }
function cmSetLab(k,v){ (COST_MODEL.labor=COST_MODEL.labor||{})[k]=+v||0; }
function cmSetPack(k,v){ (COST_MODEL.pack=COST_MODEL.pack||{})[k]=+v||0; }
function cmSetPct(k,v){ (COST_MODEL.pct=COST_MODEL.pct||{})[k]=(+v||0)/100; }
function cmSetTarget(v){ COST_MODEL.target_gm=(+v||0)/100; }
function cmReset(){ COST_MODEL=JSON.parse(JSON.stringify(COST_MODEL_DEFAULT)); renderMargin(); }

// Resolve packaging / sticker unit-costs from the Kitchen Supplies list (by name), falling back to model rates.
function _supplyCosts(ings){
  const pk=COST_MODEL.pack||{};
  const find=re=>{ const it=(ings||[]).find(i=>isSupplyItem(i)&&re.test(String(i.name||''))); return it?(+it.list_price_kg||+it.moving_avg_cost_kg||0):null; };
  const pick=(re,fb)=>{ const v=find(re); return v==null?(+fb||0):v; };
  return { vacuum:pick(/vacuum/i,pk.vacuum), ecobag:pick(/eco\s*-?\s*bag|ecobag/i,pk.ecobag),
           thermal:pick(/thermal/i,pk.thermal), sticker:pick(/sticker|label/i,pk.sticker),
           src:{ vacuum:find(/vacuum/i)!=null, ecobag:find(/eco\s*-?\s*bag|ecobag/i)!=null, thermal:find(/thermal/i)!=null, sticker:find(/sticker|label/i)!=null } };
}
// Full per-product gross-margin rows. Shared by the Gross Margin view, the dashboard, and reports.
function marginRowsFor(prods,boms,ings){
  const im={}; (ings||[]).forEach(i=>im[i.sku]=i);
  const pg=COST_MODEL.perGram||{}, lab=COST_MODEL.labor||{}, pct=COST_MODEL.pct||{}, tgm=+COST_MODEL.target_gm||0;
  const sc=_supplyCosts(ings); const feesPct=(+pct.transaction||0)+(+pct.marketing||0);
  const rawCost=p=>{ let c=0; (boms||[]).filter(b=>b.product_sku===p.sku).forEach(b=>{ const it=im[b.ingredient_sku]||{}; const cg=((+it.moving_avg_cost_kg||+it.price_kg_processed||+it.list_price_kg||0))/1000; c+=(+b.usable_g||0)*cg; }); return c; };
  return (prods||[]).filter(p=>p.active!==false).map(p=>{
    const g=+p.pack_g||0, sell=+p.sell_price||0, raw=rawCost(p);
    const elec=(+pg.electricity||0)*g, water=(+pg.water||0)*g, transport=(+pg.transport||0)*g;
    const labor=(p.cost_debone?(+lab.debone||0):(+lab.plain||0))*g;
    const butcher=p.cost_butcher?((+lab.butcher||0)*g):0;
    const sousvide=p.cost_sousvide?((+lab.sousvide||0)*g):0;
    const vacuum=sc.vacuum, sticker=sc.sticker, ecobag=p.cost_ecobag?sc.ecobag:0, thermal=p.cost_thermal?sc.thermal:0;
    const process=elec+water+transport+labor+butcher+sousvide, pack=vacuum+sticker+ecobag+thermal;
    const fixedCost=raw+process+pack, fees=feesPct*sell, total=fixedCost+fees;
    const gp=sell>0?(sell-total)/sell:0; const denom=1-tgm-feesPct; const suggested=denom>0?fixedCost/denom:0;
    return {p,g,raw,elec,water,transport,labor,butcher,sousvide,vacuum,sticker,ecobag,thermal,process,pack,fees,fixedCost,total,sell,gp,suggested,feesPct,tgm};
  });
}

   Owner decision view. Cross-references each product's current stock with its Shopify
   rolling-sales momentum so slow-movers-with-stock and fast-movers-running-low jump out.
   Data lives in the sales_momentum table (sku, product, u30, u60, u90, u120, refreshed_at),
   refreshed by the Shopify report Apps Script or pasted in via "Import" below.
     Momentum × = recent 30-day daily sales rate ÷ 120-day daily average (>1 = accelerating).
     Days of cover = current stock ÷ recent daily rate (how long stock lasts at today's pace). */
let MOM_COVER_LOW = 14, MOM_COVER_HIGH = 45;   // days-of-cover bands (owner-tunable)
let MOM_GROUP = 'hier';                         // '' | 'hier' | 'family' | 'status'  (table grouping)
let MOM_VIZ = 'bars';                          // 'bars' | 'map'  (default = general-audience bars)
const MOM_HI = 1.15, MOM_LO = 0.85;            // momentum ratio bands

// Actual sales per month, derived from the cumulative windows (M-1 = last 30d, M-2 = days 31-60, …).
function momMonthly(r){
  const u30=+r.u30||0,u60=+r.u60||0,u90=+r.u90||0,u120=+r.u120||0;
  return { m1:Math.max(0,u30), m2:Math.max(0,u60-u30), m3:Math.max(0,u90-u60), m4:Math.max(0,u120-u90) };
}
// Tiny inline trend line for [m4,m3,m2,m1] (oldest → newest). Green if rising, red if falling.
function sparkline(vals,w,h){ w=w||66; h=h||20; const n=vals.length; if(!n) return '';
  const max=Math.max(1,...vals), min=Math.min(0,...vals), rng=(max-min)||1;
  const pts=vals.map((v,i)=>{ const x=(n===1?0:(i/(n-1)))*(w-4)+2; const y=h-2-((v-min)/rng)*(h-4); return x.toFixed(1)+','+y.toFixed(1); });
  const col=(vals[n-1]>=vals[0])?'var(--ok)':'var(--danger)'; const lp=pts[n-1].split(',');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="vertical-align:middle"><polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="1.5"/><circle cx="${lp[0]}" cy="${lp[1]}" r="2.2" fill="${col}"/></svg>`;
}

async function momLoad(){
  if(isLive()){ try{ return await sb('sales_momentum?select=*&limit=2000'); }catch(e){ return []; } }
  return window._momDemo || JSON.parse(localStorage.getItem('wr_mom')||'[]');
}
function momMetrics(r, stockUnits){
  const u30=+r.u30||0, u120=+r.u120||0, daily30=u30/30;
  const mom = u120>0 ? Math.round((u30*4)/u120*100)/100 : (u30>0?2:0);
  const cover = daily30>0 ? stockUnits/daily30 : (stockUnits>0?999:0);
  return {daily30, mom, cover, hasSales:u120>0||u30>0};
}
// Urgency rank for sorting/grouping by importance (0 = act first).
function momPriority(q){ const m={stockout:0,watch:1,overstock:2,steady:3,wellstocked:4,nosale:5}; return (q&&m[q.key]!=null)?m[q.key]:6; }
function momImportanceSort(a,b){ const pa=momPriority(a.q), pb=momPriority(b.q);
  if(pa!==pb) return pa-pb;
  if(a.q.key==='stockout'||a.q.key==='watch') return a.cover-b.cover;      // most urgent (least cover) first
  if(a.q.key==='overstock'||a.q.key==='wellstocked') return b.cover-a.cover; // biggest excess first
  return b.m1-a.m1; }
function momQuad(mom, cover, hasSales){
  if(!hasSales) return {key:'nosale', label:'No recent sales', color:'var(--muted)', icon:'⚪', act:'No 120-day sales — review listing / seasonality'};
  const loCover = cover < MOM_COVER_LOW, hiCover = cover > MOM_COVER_HIGH;
  if(loCover && mom>=1)  return {key:'stockout', label:'Stockout risk',        color:'var(--danger)',       icon:'🔴', act:'Produce / reorder now — low stock, demand holding or rising'};
  if(loCover)            return {key:'watch',    label:'Low stock · cooling',   color:'var(--earth,#b5762a)',icon:'🟡', act:'Low stock but slowing — small top-up, watch'};
  if(hiCover && mom<=MOM_LO) return {key:'overstock',label:'Overstock / slow mover',color:'var(--earth,#b5762a)',icon:'🟠', act:'Slow production · promote or bundle to clear'};
  if(hiCover)            return {key:'wellstocked',label:'Well stocked',        color:'var(--ok)',           icon:'🟢', act:'Comfortable cover — hold'};
  return {key:'steady', label:'Steady', color:'var(--berry)', icon:'🔵', act:'Balanced — on track'};
}

// Plain-language "runway" bars — days of cover per product, shortest (most urgent) first.
function momBars(rows){
  const list=rows.slice().sort((a,b)=>a.cover-b.cover);   // strict runway: least stock left on top
  const N=Math.min(list.length,26); const shown=list.slice(0,N);
  const lw=210, rpad=64, W=760, rh=26, top=8, H=top+N*rh+34;
  const cap=Math.max(MOM_COVER_HIGH*1.4, 30);
  const x=c=>lw+(Math.min(c,cap)/cap)*(W-lw-rpad);
  const arrow=m=> m>=1.15?'<tspan fill="#2e7d32">▲</tspan>':(m<=0.85?'<tspan fill="#c0392b">▼</tspan>':'<tspan fill="#888">▬</tspan>');
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;font-family:inherit;font-size:12px">`;
  // threshold guide lines
  const xl=x(MOM_COVER_LOW), xh=x(MOM_COVER_HIGH);
  s+=`<line x1="${xl}" y1="${top}" x2="${xl}" y2="${top+N*rh}" stroke="#e0a4a0" stroke-dasharray="3 3"/><text x="${xl}" y="${top+N*rh+12}" text-anchor="middle" font-size="10" fill="#c0392b">${MOM_COVER_LOW}d</text>`;
  s+=`<line x1="${xh}" y1="${top}" x2="${xh}" y2="${top+N*rh}" stroke="#b7d1a6" stroke-dasharray="3 3"/><text x="${xh}" y="${top+N*rh+12}" text-anchor="middle" font-size="10" fill="#4e7a3e">${MOM_COVER_HIGH}d</text>`;
  s+=`<text x="${lw}" y="${top+N*rh+28}" font-size="10" fill="#888">← fewer days of stock left · more days →   (bar labels: units last 30d + trend)</text>`;
  shown.forEach((r,i)=>{ const y=top+i*rh; const cov=r.cover>=999?cap:r.cover; const bw=Math.max(2,x(cov)-lw);
    const nm=r.product.length>30?r.product.slice(0,29)+'…':r.product;
    s+=`<text x="4" y="${y+rh/2+4}" fill="#20241d">${esc(nm)}</text>`;
    s+=`<rect x="${lw}" y="${y+4}" width="${bw.toFixed(1)}" height="${rh-8}" rx="3" fill="${r.q.color}" fill-opacity="0.82"><title>${esc(r.product)} (${esc(r.sku)})\n${r.cover>=999?'∞':Math.round(r.cover)} days cover · stock ${Math.round(r.stock)}\n30d units ${r.m1} · momentum ×${r.mom}\n${r.q.label} — ${r.q.act}</title></rect>`;
    s+=`<text x="${(x(cov)+6).toFixed(1)}" y="${y+rh/2+4}" fill="#555" font-size="11"><tspan font-weight="700">${r.cover>=999?'∞':Math.round(r.cover)}d</tspan> · ${r.m1} ${arrow(r.mom)}</text>`;
  });
  s+=`</svg>`;
  if(list.length>N) s+=`<div class="mini" style="color:var(--muted);margin-top:4px">Showing the ${N} most urgent of ${list.length} — full list in the table below.</div>`;
  return s;
}
// Inline SVG scatter: X = momentum (0.4..1.8, centre 1.0), Y = days of cover (0..cap, high=top).
function momScatter(rows){
  const W=760, H=420, pad=54, x0=pad, x1=W-20, y0=H-pad, y1=20;
  const capCover = Math.max(MOM_COVER_HIGH*1.6, 60);
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const MX0=0.4, MX1=1.8;
  const sx=m=>x0+((clamp(m,MX0,MX1)-MX0)/(MX1-MX0))*(x1-x0);
  const sy=c=>y0-((clamp(c,0,capCover))/capCover)*(y0-y1);
  const maxU=Math.max(1,...rows.map(r=>r.u30));
  const rad=u=>4+Math.sqrt(u/maxU)*13;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;font-family:inherit">`;
  // quadrant shading around mom=1 and cover bands
  const xMid=sx(1), yLo=sy(MOM_COVER_LOW), yHi=sy(MOM_COVER_HIGH);
  s+=`<rect x="${x0}" y="${y1}" width="${xMid-x0}" height="${yHi-y1}" fill="#f6efe4"/>`;                 // top-left overstock-ish
  s+=`<rect x="${xMid}" y="${yLo}" width="${x1-xMid}" height="${y0-yLo}" fill="#fbe9e7"/>`;               // bottom-right stockout
  // grid lines
  s+=`<line x1="${xMid}" y1="${y1}" x2="${xMid}" y2="${y0}" stroke="#d9cfc0" stroke-dasharray="4 3"/>`;
  s+=`<line x1="${x0}" y1="${yLo}" x2="${x1}" y2="${yLo}" stroke="#e5b48a" stroke-dasharray="4 3"/>`;
  s+=`<line x1="${x0}" y1="${yHi}" x2="${x1}" y2="${yHi}" stroke="#bcd3ad" stroke-dasharray="4 3"/>`;
  // axes
  s+=`<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y0}" stroke="#333"/><line x1="${x0}" y1="${y1}" x2="${x0}" y2="${y0}" stroke="#333"/>`;
  s+=`<text x="${(x0+x1)/2}" y="${H-16}" text-anchor="middle" font-size="12" font-weight="700">Momentum × (← slowing · accelerating →)</text>`;
  s+=`<text x="16" y="${(y1+y0)/2}" text-anchor="middle" font-size="12" font-weight="700" transform="rotate(-90 16 ${(y1+y0)/2})">Days of cover (← low stock · high stock →)</text>`;
  // x ticks
  [0.5,0.75,1,1.25,1.5,1.75].forEach(t=>{ const x=sx(t); s+=`<text x="${x}" y="${y0+16}" text-anchor="middle" font-size="10" fill="#666">${t}</text>`; });
  [MOM_COVER_LOW,MOM_COVER_HIGH].forEach(c=>{ const y=sy(c); s+=`<text x="${x0-6}" y="${y+3}" text-anchor="end" font-size="10" fill="#666">${c}d</text>`; });
  // corner labels
  s+=`<text x="${x0+8}" y="${y1+14}" font-size="10" fill="#b5762a">🟠 Overstock (high stock · low momentum)</text>`;
  s+=`<text x="${x1-8}" y="${y0-8}" text-anchor="end" font-size="10" fill="#c0392b">🔴 Stockout risk (low stock · high momentum)</text>`;
  // dots (draw larger first)
  rows.slice().sort((a,b)=>b.u30-a.u30).forEach(r=>{ const cx=sx(r.mom), cy=sy(r.cover), rr=rad(r.u30);

// Standard (planned worst-case) vs actual (moving-average) recipe cost per product — the drift is yield loss / price creep.
async function cogsReconHtml(){
  if(moneyHidden()) return '<div class="repcard"><div class="hint">Cost is hidden for your role.</div></div>';
  const prods=await db.list('products',{}), boms=await db.list('bom_lines',{}), ings=await listIngredients();
  const im={}; ings.forEach(i=>im[i.sku]=i);
  const cost=(p,useAvg)=>{ let c=0; boms.filter(b=>b.product_sku===p.sku).forEach(b=>{ const it=im[b.ingredient_sku]||{}; const y=(+it.yield_pct||100)/100||1; const rawKg=((+b.usable_g||0)/y)/1000; const price=useAvg?(+it.moving_avg_cost_kg||+it.list_price_kg||0):(+it.list_price_kg||0); c+=rawKg*price; }); return c; };
  const rows=prods.filter(p=>boms.some(b=>b.product_sku===p.sku)).map(p=>{ const std=cost(p,false), act=cost(p,true); const drift=act-std, pct=std?drift/std*100:0; return {p,std,act,drift,pct}; })
    .sort((a,b)=>Math.abs(b.drift)-Math.abs(a.drift));
  let h=`<div class="repcard"><h3 style="margin:0 0 4px">COGS — standard vs actual</h3>
    <div class="hint" style="margin-bottom:8px">Standard = list (worst-case) price ÷ yield. Actual = moving-average price from real receipts. A positive drift means the real cost is running above plan.</div>
    <table><thead><tr><th>Product</th><th class="num">Standard/pack</th><th class="num">Actual/pack</th><th class="num">Drift ₱</th><th class="num">Drift %</th></tr></thead><tbody>`;
  rows.forEach(r=>{ const col=r.drift>0.009?'var(--danger)':(r.drift<-0.009?'var(--ok)':'var(--muted)');
    h+=`<tr style="cursor:pointer" onclick="gotoRecord('products','${esc(String(r.p.sku)).replace(/'/g,'&#39;')}')" title="Open product"><td>${esc(r.p.name)}</td><td class="num">${fmt(r.std)}</td><td class="num">${fmt(r.act)}</td><td class="num" style="color:${col}">${r.drift>0?'+':''}${fmt(r.drift)}</td><td class="num" style="color:${col}">${r.std?((r.pct>0?'+':'')+r.pct.toFixed(1)+'%'):'—'}</td></tr>`; });
  if(!rows.length) h+='<tr><td colspan="5" class="empty">No costed recipes yet.</td></tr>';
  h+='</tbody></table>'+
    _repNote('<b>Standard/pack</b> is the planned worst-case cost (list price ÷ yield). <b>Actual/pack</b> uses the moving-average cost from real receipts. <b>Drift ₱/%</b> = actual − standard; positive means real cost is running above plan. Tap a row to open the product.',
      'products with a <b>positive drift</b> (cost creeping above plan — supplier price increases or yield loss) and a large <b>Drift %</b> — those are your cues to reprice, renegotiate, or check the yield. Sorted worst-first.')+`</div>`;
  return h;
}

    s.onload=()=>res(true); s.onerror=()=>{ delete _scriptCache[url]; rej(new Error('Could not load '+url)); }; document.head.appendChild(s); });

/* ===== Shared styled PDF + Excel engine (used by Opening Balance AND Weekly Count) =====
   A "column spec" is [{label, val:(line,itemNo)=>cell, width(xlsx chars), pdfWidth, align, numFmt}].
   Both builders consume _numberedRows(lines): section (g1/g2) header rows span all columns; item
   rows are numbered. Header row (fixed) + page "X of Y" (PDF) / frozen top row (xlsx). */
const _WR_GREEN='4E7A3E', _WR_G1='E7F0E9', _WR_G1T='2F5D33', _WR_G2='F2F6EF', _WR_G2T='4E7A3E';
const _pdfTableLayout={ hLineWidth:(i,node)=>(i===0||i===1||i===node.table.body.length)?0.9:0.3,
  vLineWidth:()=>0, hLineColor:(i)=>(i===1?'#4E7A3E':'#dddddd'),
  paddingTop:()=>3, paddingBottom:()=>3, paddingLeft:()=>5, paddingRight:()=>5 };
function _pdfBody(lines, cols){
  const span=cols.length;
  const head=cols.map(c=>({text:c.label, bold:true, color:'#ffffff', fillColor:'#'+_WR_GREEN, alignment:c.align||'left'}));
  const body=[head];
  _numberedRows(lines).forEach(r=>{
    if(r.t==='g1'){ body.push([{text:r.label+' ('+r.count+')', colSpan:span, fillColor:'#'+_WR_G1, bold:true, color:'#'+_WR_G1T, margin:[2,3,2,3]}].concat(Array(span-1).fill({}))); return; }
    if(r.t==='g2'){ body.push([{text:'    › '+r.label+' ('+r.count+')', colSpan:span, fillColor:'#'+_WR_G2, bold:true, color:'#'+_WR_G2T}].concat(Array(span-1).fill({}))); return; }
    body.push(cols.map(c=>{ const v=c.val(r.l,r.n); return {text:(v==null?'':String(v)), alignment:c.align||'left', fontSize:c.fontSize||9}; }));
  });
  return body;
}
function _pdfDocDef({title, sub, lines, cols, contentWidth}){
  const cw=contentWidth||547;
  return { pageSize:'A4', pageMargins:[24, 84, 24, 40],
    header:function(){ return { margin:[24,18,24,0], stack:[
      {columns:[ {text:'WHOLESOME RABBIT', bold:true, color:'#'+_WR_G1T, fontSize:14}, {text:title||'', alignment:'right', color:'#'+_WR_GREEN, fontSize:11, margin:[0,3,0,0]} ]},
      {text:sub||'', color:'#666666', fontSize:9, margin:[0,3,0,0]},
      {canvas:[{type:'line', x1:0, y1:5, x2:cw, y2:5, lineWidth:1.2, lineColor:'#'+_WR_GREEN}]} ]}; },
    footer:function(cur,tot){ return { margin:[24,6,24,0], columns:[
      {text:'Printed '+new Date().toLocaleString(), fontSize:8, color:'#aaaaaa'},
      {text:'Page '+cur+' of '+tot, alignment:'right', fontSize:9, color:'#666666'} ]}; },
    content:[{ table:{ headerRows:1, dontBreakRows:true, widths:cols.map(c=>c.pdfWidth||'auto'), body:_pdfBody(lines,cols) }, layout:_pdfTableLayout }],
    defaultStyle:{fontSize:9} };
}
async function _downloadPdf(docDef, fname){ const pm=await _ensurePdfMake(); await new Promise(res=>{ pm.createPdf(docDef).download(fname, res); }); }
async function _excelStyled(tabs, fname, cols){
  const XJS=await _ensureExcelJS(); const wb=new XJS.Workbook(); const N=cols.length;
  tabs.forEach(([nm,lines])=>{ const ws=wb.addWorksheet(String(nm).slice(0,31), {views:[{state:'frozen', ySplit:1}]});
    ws.columns=cols.map(c=>({header:c.label, width:c.width||14}));
    const hr=ws.getRow(1); hr.height=18; hr.font={bold:true, color:{argb:'FFFFFFFF'}};
    hr.eachCell(c=>{ c.fill={type:'pattern', pattern:'solid', fgColor:{argb:'FF'+_WR_GREEN}}; c.alignment={vertical:'middle'}; });
    _numberedRows(lines).forEach(r=>{
      if(r.t==='g1'||r.t==='g2'){ const row=ws.addRow([]); ws.mergeCells(row.number,1,row.number,N); const c=row.getCell(1);
        c.value=(r.t==='g2'?'   ▸ ':'')+r.label+' ('+r.count+')';
        c.font={bold:true, color:{argb:'FF'+(r.t==='g2'?_WR_G2T:_WR_G1T)}}; c.fill={type:'pattern', pattern:'solid', fgColor:{argb:'FF'+(r.t==='g2'?_WR_G2:_WR_G1)}}; return; }
      const row=ws.addRow(cols.map(c=>{ const v=c.val(r.l,r.n); return (v===''||v==null)?null:v; }));
      cols.forEach((c,ci)=>{ const cell=row.getCell(ci+1); if(c.align)cell.alignment={horizontal:c.align}; if(c.numFmt)cell.numFmt=c.numFmt; }); });
    ws.autoFilter={from:{row:1,column:1}, to:{row:1,column:N}};
  });
  const buf=await wb.xlsx.writeBuffer(); dlBlob(new Uint8Array(buf), fname, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}

      book:_bookProd(p.sku), cost:(+p.tot_cost_ref||0), g1:(p.group_1||'Products'),g2:(p.group_2||p.family||'Other'),grank:_so(p),form:''});
    stkLines.push({sku:'STK-'+p.sku,name:p.name+' — Sticker',type:'sticker',unit:'pcs',location:loc,qty:q('STK-'+p.sku),
      book:(+p['sticker_'+loc+'_on_hand']||0), cost:0, g1:(p.group_1||'Products'),g2:(p.group_2||p.family||'Other'),grank:_so(p),form:''}); });
  return {ingredients:ingLines, products:prodLines, supplies:supLines, stickers:stkLines};
}
const _OPHDR=['sku','name','type','unit','location','qty','on hand now','cost/unit'];
// Render one section's lines to an AoA: optional header row, then section/subgroup header rows

function _openingAoa(lines, withHdr){ const out=[]; if(withHdr!==false) out.push(_OPHDR.slice());
  _renderRows(lines).forEach(r=>{ if(r.type==='g1'){ out.push(['',r.label+' ('+r.count+')','','','','','','']); return; }
    if(r.type==='g2'){ out.push(['','  ▸ '+r.label+' ('+r.count+')','','','','','','']); return; }
    const l=r.l; out.push([l.sku,l.name,l.type,l.unit,l.location,(l.qty===''||l.qty==null)?'':l.qty,
      (l.book==null||l.book==='')?'':l.book, (+l.cost)?Math.round(l.cost*100)/100:'']); });
  return out; }

function _numberedRows(lines){ let n=0; return _renderRows(lines).map(r=>{ if(r.type==='item'){ n++; return {t:'item',n,l:r.l}; } return {t:r.type,label:r.label,count:r.count}; }); }

// Parse rows from one AoA (header + data); skips section/blank rows (no sku). Returns [] if no sku/qty header.
function _opRowsFromAoa(arr){
  const hdr=(arr[0]||[]).map(x=>String(x).trim().toLowerCase());
  const ci=n=>hdr.indexOf(n); const si=ci('sku'),ni=ci('name'),ui=ci('unit'),ti=ci('type'),li=ci('location'),qi=ci('qty');
  if(si<0||qi<0) return [];
  const rows=[]; for(let i=1;i<arr.length;i++){ const r=arr[i]; if(!r)continue; const sku=r[si]; if(sku==null||String(sku).trim()==='')continue;
    rows.push({sku:String(sku).trim(), name:ni>=0?String(r[ni]||'').trim():'', unit:ui>=0?String(r[ui]||'').trim():'', type:ti>=0?String(r[ti]||'').trim().toLowerCase():'', location:li>=0?String(r[li]||_opLoc).trim().toLowerCase():_opLoc, qty:Number(r[qi]||0)}); }
  return rows;
}
function _opParseSheet(name,data){
  if(/\.csv$/i.test(name)){ const arr=String(data).split(/\r?\n/).filter(x=>x.trim()!=='').map(line=>{ const out=[]; let cur='',q=false; for(let i=0;i<line.length;i++){ const ch=line[i]; if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; } else { if(ch===',')  {out.push(cur);cur='';} else if(ch==='"') q=true; else cur+=ch; } } out.push(cur); return out; });
    const rows=_opRowsFromAoa(arr); if(!rows.length) throw new Error('No "sku"/"qty" columns found'); return rows; }
  if(typeof XLSX==='undefined') throw new Error('Spreadsheet support did not load — use a .csv file');
  const wb=XLSX.read(data,{type:'binary'}); let rows=[];
  wb.SheetNames.forEach(sn=>{ try{ const arr=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1}); rows=rows.concat(_opRowsFromAoa(arr)); }catch(e){} });   // read EVERY tab (Ingredients / Products / Kitchen Supplies / Stickers)
  if(!rows.length) throw new Error('No "sku"/"qty" rows found on any tab');
  return rows;
}
function openingStageFile(e){ const f=e.target.files[0]; if(!f)return; window._opFile=f; const rd=new FileReader();
  rd.onload=()=>{ try{ _opRows=_opParseSheet(f.name,rd.result); _opReport=null;
      $('opArea').innerHTML=`<b>${esc(f.name)}</b> — ${_opRows.length} row(s) read.<div style="margin-top:8px"><button class="btn sec" onclick="openingTest()">🔍 Test</button></div>`; }
    catch(err){ $('opArea').innerHTML='<span style="color:var(--danger)">Could not read file: '+esc(err.message)+'</span>'; } };
  if(/\.csv$/i.test(f.name)) rd.readAsText(f); else rd.readAsBinaryString(f); }
async function openingTest(){ if(!_opRows)return;
  const ings=new Set((await db.list('ingredients',{})).map(i=>i.sku)); const prods=new Set((await db.list('products',{})).map(p=>p.sku));
  let ok=0,unknown=0,zero=0;
  _opReport=_opRows.map(r=>{ let st='ok'; const type=r.type||'';
    const refOk = type==='sticker'? prods.has(String(r.sku).replace(/^STK-/,'')) : (type==='product'? prods.has(r.sku) : ings.has(r.sku));
    if(!refOk){ st='unknown sku'; unknown++; } else if(isNaN(r.qty)){ st='bad qty'; unknown++; } else if(!(+r.qty)){ st='zero (skipped)'; zero++; } else ok++;
    return {...r,st}; });
  const issues=_opReport.filter(d=>d.st!=='ok'&&d.st!=='zero (skipped)').slice(0,12);
  $('opArea').innerHTML=`<div style="margin:6px 0"><b style="color:var(--ok,#4e7a3e)">${ok} to post</b> · <b style="color:var(--danger)">${unknown} unknown/bad</b> · <span style="color:var(--muted)">${zero} zero (skipped)</span> of ${_opRows.length}</div>
    ${issues.length?`<div style="max-height:170px;overflow:auto"><table style="width:100%;font-size:12px"><thead><tr><th>SKU</th><th>Type</th><th class="num">Qty</th><th>Issue</th></tr></thead><tbody>${issues.map(d=>`<tr><td><code>${esc(d.sku)}</code></td><td>${esc(d.type)}</td><td class="num">${esc(d.qty)}</td><td style="color:var(--danger)">${esc(d.st)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="hint">No errors ✅</div>'}
    <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="openingDoImport()" ${ok?'':'disabled'} style="background:#b23b2e">✓ Post ${ok} opening balance(s)</button>
      <button class="btn sec" onclick="openingPrintSheet()">🖨 Print this sheet (PDF)</button>
      <button class="btn sec" onclick="openingExportXlsx()">⬇ Save as Excel</button></div>`;
}

async function openingDoImport(){ if(!_opReport)return;
  if(curRole&&curRole()!=='Admin'){ toast('Only an Admin can post opening balances',true); return; }
  const valid=_opReport.filter(d=>d.st==='ok');
  if(!valid.length){ toast('Nothing to post',true); return; }
  if(_postLock){ toast('Still posting…',true); return; } _postLock=true;
  const upLoc=(_opLoc==='pasig'?'pasig':'bulacan');
  const note='Opening upload '+upLoc+' '+todayISO();
  /* Value the opening stock. stock_balance is SUM(qty × unit_cost), so posting 0 here
     makes every opening item worth nothing. The ledger's unit basis is not uniform:
       food ingredient  qty in GRAMS → cost per gram  (price_kg / 1000)
       kitchen supply   qty in UNITS → cost per unit  (price as-is)
       product          qty in PACKS → cost per pack  (tot_cost_ref — COST, never sell price) */
  const _ingMap={}, _prodMap={};
  try{ (await listIngredients()).forEach(i=>_ingMap[i.sku]=i); }catch(e){}
  try{ (await db.list('products',{})).forEach(p=>_prodMap[p.sku]=p); }catch(e){}
  const _openCost=(sku,type)=>{
    if(type==='product'){ const p=_prodMap[sku]||{}; return +p.tot_cost_ref||0; }
    const i=_ingMap[sku]||{};
    if(type==='supply') return +i.list_price_kg||+i.moving_avg_cost_kg||0;
    return (+i.moving_avg_cost_kg||+i.list_price_kg||0)/1000;
  };
  let _unpriced=0;
  try{
    // replace the previous opening upload FOR THIS LOCATION only — leaves the other site's opening intact
    if(isLive()){ try{ await sb('inventory_movements?note=like.Opening%20upload*&location_code=eq.'+upLoc,{method:'DELETE',prefer:'return=minimal'}); }catch(e){} }
    else { DEMO.inventory_movements=(DEMO.inventory_movements||[]).filter(m=>!(String(m.note||'').startsWith('Opening upload')&&m.location_code===upLoc)); }
    let posted=0,fail=0;
    for(const r of valid){ const qty=+r.qty||0; const loc=upLoc; const type=r.type||'';
      try{
        if(type==='sticker'){ const psku=String(r.sku).replace(/^STK-/,''); await db.update('products','sku',psku,{['sticker_'+loc+'_on_hand']:qty}); posted++; continue; }
        const uc=_openCost(r.sku,type); if(!uc) _unpriced++;
        if(type==='product'){ await db.create('inventory_movements',{kind:'product',ref_sku:r.sku,location_code:loc,qty:qty,unit_cost:uc,movement_type:'opening',note}); posted++; continue; }
        const g=(type==='supply')?qty:qty*1000;   // supplies in whole units; food ingredients kg→g
        await db.create('inventory_movements',{kind:'ingredient',ref_sku:r.sku,location_code:loc,qty:g,unit_cost:uc,movement_type:'opening',note}); posted++;
      }catch(e){ fail++; }
    }
    sysLog('inventory_movements',note,'📥 Opening balances uploaded ('+posted+' rows'+(_unpriced?', '+_unpriced+' with no master price':'')+') by '+CURRENT_USER);
    /* File the workbook itself against the location's opening-balance record, and
       log the post as a note. Without this the source file lived only in whoever's
       Downloads folder ran the upload, and there was nothing to audit against. */
    try{
      const ref=obRef();
      sysLog('opening_balance', ref, '📥 Posted '+posted+' opening row(s) for '+upLoc+' by '+CURRENT_USER+(_unpriced?(' · '+_unpriced+' with no master price'):''));
      if(window._opFile){
        window._attCtx={model:'opening_balance', ref, rerender:()=>{}};
        await uploadAttach(window._opFile);          // → Drive, then record_attachments
      }
    }catch(e){ console.warn('opening proof filing failed', String(e&&e.message||e)); }
    closeModal();
    toast('Opening balances posted: '+posted+(fail?(' · ⚠ '+fail+' failed'):'')
      +(_unpriced?(' · ⚠ '+_unpriced+' item(s) had no price in the master and posted at ₱0 — set the price, then re-upload'):''), (fail>0||_unpriced>0));
  }catch(e){ toast(e.message,true); } finally{ _postLock=false; }
}

/* ===== Supplies Reorder → manual PO (PAR − stock, in each item's unit) ===== */
async function renderSuppliesReorder(){
  $('cp').innerHTML=`<div class="title">Supplies Reorder <span onclick="openKB()" title="Module guide" style="cursor:pointer;color:var(--muted);font-size:14px;font-weight:400">❔</span></div>
    <button class="wfbtn" onclick="generateSuppliesPO()">🧾 Generate Supplies PO</button>
    <div class="sp"></div><span style="color:var(--muted)">reorder qty = PAR − current stock</span>`;
  const ings=await listIngredients();
  const sups=ings.filter(i=>/(supply|supplement)/i.test(i.category||''));
  let stock={}; if(isLive()){ try{ (await db.list('stock_balance',{})).forEach(s=>{ if(s.kind==='ingredient') stock[s.ref_sku]=(stock[s.ref_sku]||0)+(+s.on_hand||0); }); }catch(e){} }
  const rows=sups.map(i=>{ const par=+i.par_g||0; const oh=stock[i.sku]||0; const reorder=Math.max(0,par-oh);
    const _s1=(i.supplier1||'').trim(); const sup=(i.supplier||'').trim()||(/to be determined/i.test(_s1)?'':_s1);
    return {sku:i.sku,name:i.name,uom:i.uom||'pcs',par,oh,reorder,supplier:sup,price:+i.list_price_kg||0}; })
    .sort((a,b)=>b.reorder-a.reorder||String(a.name).localeCompare(b.name));
  window._supReorder=rows.filter(r=>r.reorder>0);
  let h=`<div class="repcard"><div class="hint" style="margin:0 0 8px">Extracted ${todayISO()}. Items below PAR need reordering; <b>reorder qty = PAR − current stock</b>, in each item's unit. Set PAR + default supplier on each supply (Master Data → Ingredients). Generate a draft PO grouped by supplier — receiving a supplies PO adds whole units to stock (not kg).</div>
    <div style="overflow-x:auto"><table><thead><tr><th>Item</th><th class="num">Current</th><th class="num">PAR</th><th class="num">Reorder</th><th>Unit</th><th>Supplier</th><th>Alert</th></tr></thead><tbody>`;
  rows.forEach(r=>{ const low=r.reorder>0; h+=`<tr><td>${esc(r.name)}</td><td class="num">${r.oh}</td><td class="num">${r.par||'—'}</td><td class="num">${low?'<b style="color:var(--berry)">'+r.reorder+'</b>':'—'}</td><td>${esc(r.uom)}</td><td>${esc(r.supplier)||'<span class="mini">set default</span>'}</td><td>${low?'<span style="color:var(--danger)">Reorder Needed</span>':'<span style="color:#4e7a3e">OK</span>'}</td></tr>`; });
  if(!rows.length) h+='<tr><td colspan="7" class="empty">No supply items found. Seed supplies and set PAR first.</td></tr>';
  h+=`</tbody></table></div><div class="pager">${window._supReorder.length} item(s) below PAR</div></div>`;
  $('content').innerHTML=h;
}
async function generateSuppliesPO(){
  const need=window._supReorder||[];
  if(!need.length){ toast('Nothing below PAR to reorder',true); return; }
  const bySup={}; need.forEach(r=>{ const s=r.supplier||'(unassigned)'; (bySup[s]=bySup[s]||[]).push(r); });
  showBusy('Creating supplies PO(s)…'); const refs=[];
  try{
    const dd=_mmddyyyy(todayISO()); let zz=0;
    for(const sup of Object.keys(bySup)){ zz++;
      const ref='PO-'+dd+' [SUPPLIES]'+(zz>1?(' V'+_p2(zz)):'');
      const rec={po_ref:ref, supplier_name:(sup==='(unassigned)'?null:sup), order_date:todayISO(), status:'confirmed', created_by:CURRENT_USER};
      try{ await db.create('purchase_orders',rec);
        const pl=bySup[sup].map(r=>({po_ref:ref, ingredient_sku:r.sku, ordered_kg:r.reorder, available_kg:r.reorder, price_kg:r.price, received_kg:0}));
        await db.replaceChildren({model:'po_lines',fk:'po_ref'}, ref, pl);
        sysLog('purchase_orders',ref,'🧾 Supplies reorder (PAR − stock) — '+bySup[sup].length+' item(s) by '+CURRENT_USER);
        refs.push(ref);
      }catch(e){ toast(e.message,true); }
    }
  } finally { hideBusy(); }

async function generateStickerPO(){

        // a personalised label has no stock SKU — strip the marker so the line
        // still points at the real product the printer needs artwork for
        const pl=bySup[sup].map(l=>({po_ref:ref, ingredient_sku:String(l.sku).replace(/^PERSONAL:/,''),
          ordered_kg:l.qty, available_kg:l.qty, price_kg:+l.price||0, received_kg:0}));
        await db.replaceChildren({model:'po_lines',fk:'po_ref'}, ref, pl);

  else { dlBlob(aoa.map(r=>r.join(',')).join('\n'),'WR_demand_'+MRPDATE+'.csv','text/csv'); }

function parseImportData(name,data){
  if(/\.csv$/i.test(name)){ const map=parseDemandCSV(String(data)); return Object.keys(map).map(sku=>({sku,qty:map[sku]})); }
  if(typeof XLSX==='undefined') throw new Error('Spreadsheet support did not load — please use a .csv file');
  const wb=XLSX.read(data,{type:'binary'}); const ws=wb.Sheets[wb.SheetNames[0]]; const arr=XLSX.utils.sheet_to_json(ws,{header:1});
  const hdr=(arr[0]||[]).map(x=>String(x).trim().toLowerCase());
  const si=hdr.indexOf('sku'), qi=[hdr.indexOf('qty'),hdr.indexOf('demand'),hdr.indexOf('quantity')].find(x=>x>=0), pi=hdr.indexOf('plan_date');
  if(si<0) throw new Error('No "SKU" column found in the sheet header');
  const rows=[]; for(let i=1;i<arr.length;i++){ const r=arr[i]; if(!r)continue; const sku=r[si]; if(sku==null||String(sku).trim()==='')continue; rows.push({sku:String(sku).trim(), qty:Number(r[qi]||0), plan_date:pi>=0?r[pi]:undefined}); }
  return rows;
}
function mrpStageFile(e){ const f=e.target.files[0]; if(!f)return; const rd=new FileReader();
  rd.onload=()=>{ try{ _impRows=parseImportData(f.name,rd.result); _impReport=null;
      $('impArea').innerHTML=`<b>${esc(f.name)}</b> — ${_impRows.length} row(s) read.<div style="margin-top:8px"><button class="btn sec" onclick="mrpTestImport()">🔍 Test Import</button></div>`; }
    catch(err){ $('impArea').innerHTML='<span style="color:var(--danger)">Could not read file: '+esc(err.message)+'</span>'; } };
  if(/\.csv$/i.test(f.name)) rd.readAsText(f); else rd.readAsBinaryString(f);
}
async function mrpTestImport(){
  if(!_impRows){ return; }
  const prods=await db.list('products',{}); const known=new Set(prods.map(p=>p.sku));
  let ok=0,unknown=0,bad=0; _impReport=_impRows.map(r=>{ let st='ok'; if(!known.has(r.sku)){st='unknown SKU';unknown++;} else if(isNaN(r.qty)||r.qty<0){st='bad qty';bad++;} else ok++; return {...r,st}; });
  const issues=_impReport.filter(d=>d.st!=='ok').slice(0,12);
  $('impArea').innerHTML=`<div style="margin:6px 0"><b style="color:var(--ok)">${ok} valid</b> · <b style="color:var(--danger)">${unknown} unknown SKU</b> · <b style="color:var(--earth)">${bad} bad qty</b> &nbsp;of ${_impRows.length}</div>
    ${issues.length?`<div style="max-height:180px;overflow:auto"><table style="width:100%;font-size:12px"><thead><tr><th>SKU</th><th class="num">Qty</th><th>Issue</th></tr></thead><tbody>${issues.map(d=>`<tr><td><code>${esc(d.sku)}</code></td><td class="num">${esc(d.qty)}</td><td style="color:var(--danger)">${d.st}</td></tr>`).join('')}</tbody></table></div><div class="hint">Showing first ${issues.length}. Invalid rows are skipped on import.</div>`:'<div class="hint">All rows valid ✅</div>'}
    <div style="margin-top:12px"><button class="btn" onclick="mrpDoImport()" ${ok?'':'disabled'}>✓ Import ${ok} valid row(s)</button></div>`;
}
function mrpDoImport(){ if(!_impReport)return; const valid=_impReport.filter(d=>d.st==='ok');
  const pd=valid.map(v=>v.plan_date).find(Boolean); if(pd){ const s=String(pd).slice(0,10); if(/^\d{4}-\d\d-\d\d$/.test(s)) MRPDATE=s; }
  const map={}; valid.forEach(v=>{ map[v.sku]=(map[v.sku]||0)+(+v.qty||0); });
  closeModal(); applyDemandMap(map); toast('Imported '+valid.length+' demand row(s)'); }
async function mrpSheetSync(){ const a=AUTOS.sheets_demand;
  // Every locked custom order that still owes packs — whatever week it is scheduled
  // for. Merged OVER the demand table (never added to it) so a cached row cannot
  // double-count, and so a moved needed_date can never strand the packs.
  const co=await coOpenDemandMap(); const nCo=Object.keys(co).length;
  if(!isLive()){ // demo: pull locked custom-order demand from the in-memory demand table
    const rows=(DEMO.demand||[]).filter(r=>String(r.plan_date||'')===String(MRPDATE));
    const map={}; rows.forEach(r=>{ map[r.sku]=(map[r.sku]||0)+(+r.qty||0); });
    Object.keys(co).forEach(s=>{ map[s]=co[s]; });
    if(!Object.keys(map).length){ toast('No demand rows for '+MRPDATE+' — lock a custom order, or use Import / Paste.',true); return; }
    applyDemandMap(map); await coSyncStatuses(); toast('Pulled '+rows.length+' demand row(s)'+(nCo?' + '+nCo+' custom-order SKU(s)':'')+' for '+MRPDATE); return; }
  // If the webhook is configured, TRIGGER n8n (reads your Google Sheet → upserts the demand table for this plan date), then pull.
  if(a&&a.on&&a.url){
    showBusy('Syncing demand from Google Sheets…');
    await postWebhook(a.url,{ action:'sync_demand', plan_date:MRPDATE, by:CURRENT_USER });
    await new Promise(r=>setTimeout(r,8000));   // give n8n time to read the sheet + upsert
    hideBusy();
  }
  let rows=[]; let sheetErr='';
  try{ rows=await sb('demand?select=sku,qty&plan_date=eq.'+encodeURIComponent(MRPDATE))||[]; }
  catch(e){ sheetErr=String((e&&e.message)||e); }
  const map={}; rows.forEach(r=>{ map[r.sku]=+r.qty||0; });
  Object.keys(co).forEach(s=>{ map[s]=co[s]; });      // the order wins over its cached demand row
  if(!Object.keys(map).length){
    toast(sheetErr ? ('Demand read failed — '+sheetErr)
      : (a&&a.on&&a.url?('Synced, but no demand rows for '+MRPDATE+' — check the sheet & the n8n workflow')
                       :'No demand for '+MRPDATE+' — lock a custom order, use Import / Paste, or enable the Google Sheets webhook in Automations'),true);
    return; }
  applyDemandMap(map);
  await coSyncStatuses();          // locked orders now counted → "Added in Demand" 
  toast('Synced '+rows.length+' demand row(s)'+(nCo?' + '+nCo+' custom-order SKU(s)':'')+' for '+MRPDATE+(sheetErr?' (sheet demand unavailable)':''));
}
