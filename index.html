// Shrink a phone photo in the browser before upload: downscale to <=1600px and re-encode as
// JPEG ~0.82. A 5 MB photo → ~300 KB, so the upload + n8n Drive write are far faster.
// Non-images (PDF, etc.) and tiny images pass through untouched.
function _compressImage(f, maxDim, quality){
  return new Promise(resolve=>{
    if(!/^image\/(jpe?g|png|webp)$/i.test(f.type) || f.size < 400*1024){ resolve({file:f, name:f.name, type:f.type}); return; }
    const url=URL.createObjectURL(f); const img=new Image();
    img.onload=()=>{ try{
      const scale=Math.min(1, (maxDim||1600)/Math.max(img.width,img.height));
      const w=Math.max(1,Math.round(img.width*scale)), h=Math.max(1,Math.round(img.height*scale));
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      c.toBlob(b=>{ if(b && b.size < f.size){ const nm=f.name.replace(/\.(png|webp)$/i,'.jpg'); resolve({file:b, name:nm, type:'image/jpeg'}); }
        else resolve({file:f, name:f.name, type:f.type}); }, 'image/jpeg', quality||0.82);
    }catch(e){ URL.revokeObjectURL(url); resolve({file:f, name:f.name, type:f.type}); } };
    img.onerror=()=>{ URL.revokeObjectURL(url); resolve({file:f, name:f.name, type:f.type}); };
    img.src=url;
  });
}
async function uploadAttach(f){
  if(f.size>15*1024*1024){ toast('File is over 15MB — upload it to Drive directly and paste the link.',true); return attLink(f.name); }
  const a=autoCfg('file_upload'); const t=_attTarget(); const ref=t.ref;
  if(!a||!a.on||!a.url){ return attLink(f.name); }   // no automation set → fall back to pasting a link
  toast('Preparing '+f.name+'…');
  const c=await _compressImage(f, 1600, 0.82);        // shrink photos before encoding/uploading
  const reader=new FileReader();
  reader.onload=async()=>{ const b64=String(reader.result).split(',')[1]||'';
    await postWebhook(a.url,{ model:t.model, module:t.model, ref:String(ref),
       filename:c.name, mimetype:c.type||'application/octet-stream', data:b64, by:CURRENT_USER });
    const at=loadAttach(); at.push({name:c.name,pending:true});
    localStorage.setItem(attachKey(),JSON.stringify(at));
    sysLog(t.model, ref, '📎 '+CURRENT_USER+' uploaded '+c.name+' → Drive');
    toast('Uploading '+c.name+' to Drive… the link will appear shortly'); _attRerender();
    // The upload webhook (Apps Script /exec or n8n) uploads to Drive, makes a shareable link, and
    // writes it into record_attachments; poll it back so the file becomes a clickable link. If it
    // never arrives (webhook off/misconfigured), stop polling and clear the stuck "uploading…" chip.
    let tries=0; const MAXT=12; const poll=async()=>{ tries++;
      if(_attTarget().ref!==ref) return;   // user navigated away / switched target
      await refreshAtts();
      const done=(formAtts||[]).some(a=>a.filename===c.name);   // DB link arrived?
      if(done){ const at=loadAttach().filter(x=>x.name!==c.name||!x.pending); localStorage.setItem(attachKey(),JSON.stringify(at)); _attRerender(); return; }
      if(tries<MAXT){ setTimeout(poll, 4000); }
      else { // give up — remove the stuck pending chip and tell the user how to recover
        const at=loadAttach().filter(x=>!(x.name===c.name&&x.pending)); localStorage.setItem(attachKey(),JSON.stringify(at));
        if(_attTarget().ref===ref) _attRerender();
        toast('Drive link didn\'t come back for '+c.name+'. Check Administration → Automations → "File upload to Drive" is ON with the correct /exec (or n8n) URL, then re-upload — or 🔗 Paste link.',true);
      } };
    setTimeout(poll, 3500);
  };
  reader.readAsDataURL(c.file);
}
function attLink(name){ const url=prompt('Paste a Drive link for '+(name||'this file')+':')||''; if(!url) return;
  const a=loadAttach(); a.push({name:name||url,url}); localStorage.setItem(attachKey(),JSON.stringify(a)); _attRerender(); }
function attDel(i){ const a=loadAttach(); a.splice(i,1); localStorage.setItem(attachKey(),JSON.stringify(a)); _attRerender(); }

// Fire-and-forget POST to an n8n webhook. no-cors so a static app can reach n8n
// without CORS setup; n8n does the work and writes results back to Supabase.
async function postWebhook(url, payload){ if(!url) return false;
  try{ await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(payload)}); return true; }
  catch(e){ console.warn('webhook post failed', e); return false; } }
function autoCfg(k){ return (typeof AUTOS!=='undefined'&&AUTOS[k])?AUTOS[k]:null; }
// On completion: send the record to n8n → PDF → Drive folder → link back + notify (with Internal Ref).
async function notifyRecordDone(model, ref, recOverride, childrenOverride){
  const a=autoCfg('record_pdf'); if(!a||!a.on||!a.url) return;
  // Fire ONCE per record — a document that moves received → invoiced → closed must not
  // generate three PDFs. Guard on a local sent-set (same browser) AND on drive_url (cross-browser:
  // once n8n has written the link back, the PDF already exists).
  const sentKey=model+':'+ref; let sent={};
  try{ sent=JSON.parse(localStorage.getItem('wr_pdf_sent')||'{}'); }catch(e){}
  const rGuard=recOverride||formRec;
  if(sent[sentKey] || (rGuard && rGuard.drive_url)) return;
  const m=MODELS[model]; const r=recOverride||formRec;
  let children=childrenOverride;
  if(children===undefined){ children=[]; if(m.o2m){ try{ children=(r[m.pk]===ref)?formChildren:await db.children(m.o2m, ref); }catch(e){} } }
  const html=recordPrintHtml(m, {...r,[m.pk]:ref}, children);
  await postWebhook(a.url, { model, module:model, ref:String(ref), kind:m.label,
     html, email:(SUPA&&SUPA.email)||'', telegram_chat_id:'' });
  sent[sentKey]=Date.now(); localStorage.setItem('wr_pdf_sent',JSON.stringify(sent));
  sysLog(model, ref, '📄 Sent to the PDF/Drive automation ('+ref+')');
}

function _bulkChangeSet(model,pk,dirtyObj){ const m=MODELS[model]; const o=(window._bulkOrig||{})[pk]||{}; const set={};
  Object.keys(dirtyObj).forEach(f=>{ let val=dirtyObj[f]; const fd=m.fields.find(x=>x.n===f)||{};
    if(fd.t==='number'||fd.t==='currency'){ val=(val===''||val==null)?null:(+val); }
    const ov=o[f]==null?'':o[f]; if(String(val==null?'':val)!==String(ov)) set[f]=val; });
  return set; }
async function bulkSave(){
  const model=window._bulkModel; const m=MODELS[model]; const dirty=window._bulkDirty||{};
  const byPk={}; Object.keys(dirty).forEach(pk=>{ const set=_bulkChangeSet(model,pk,dirty[pk]); if(Object.keys(set).length) byPk[pk]=set; });
  const n=Object.keys(byPk).length;

function bulkTemplate(){ const model=window._bulkModel; const m=MODELS[model]; const cfg=BULK_CFG[model];
  const header=[m.pk,'name',...cfg.cols];

  if(typeof XLSX!=='undefined'){ const ws=XLSX.utils.aoa_to_sheet(aoa); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Data'); XLSX.writeFile(wb,'WR_'+model+'_'+todayISO()+'.xlsx'); }
  else { dlBlob(aoa.map(r=>r.map(c=>/[",\n]/.test(String(c))?'"'+String(c).replace(/"/g,'""')+'"':c).join(',')).join('\n'),'WR_'+model+'_'+todayISO()+'.csv','text/csv'); }

function _bulkCsvLine(line){ const out=[]; let cur='',q=false; for(let i=0;i<line.length;i++){ const ch=line[i];
  if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
  else { if(ch===',') {out.push(cur);cur='';} else if(ch==='"') q=true; else cur+=ch; } } out.push(cur); return out; }
function bulkImportFile(e){ const f=e.target.files[0]; if(!f)return; const rd=new FileReader();
  rd.onload=()=>{ try{ const model=window._bulkModel; const m=MODELS[model]; const cfg=BULK_CFG[model]; let arr;
      if(/\.csv$/i.test(f.name)){ arr=String(rd.result).split(/\r?\n/).filter(x=>x.trim()!=='').map(_bulkCsvLine); }
      else { if(typeof XLSX==='undefined') throw new Error('Spreadsheet support did not load — use a .csv'); const wb=XLSX.read(rd.result,{type:'binary'}); const ws=wb.Sheets[wb.SheetNames[0]]; arr=XLSX.utils.sheet_to_json(ws,{header:1}); }
      const hdr=(arr[0]||[]).map(x=>String(x).trim().toLowerCase()); const pki=hdr.indexOf(String(m.pk).toLowerCase());
      if(pki<0) throw new Error('the sheet needs a "'+m.pk+'" column');
      const colIdx={}; cfg.cols.forEach(c=>{ const i=hdr.indexOf(c.toLowerCase()); if(i>=0) colIdx[c]=i; });
      const orig=window._bulkOrig||{}; const staged=[]; let unknown=0;
      for(let i=1;i<arr.length;i++){ const row=arr[i]; if(!row)continue; const pk=String(row[pki]==null?'':row[pki]).trim(); if(!pk)continue;
        const o=orig[pk]; if(!o){ unknown++; continue; }
        const dirty={}; Object.keys(colIdx).forEach(c=>{ dirty[c]=row[colIdx[c]]; });
        const set=_bulkChangeSet(model,pk,dirty); if(Object.keys(set).length) staged.push({pk,set}); }
      window._bulkStaged=staged;
      $('bulkImportArea').innerHTML = staged.length
        ? `<div class="tip">Ready to update <b>${staged.length}</b> record(s) from <b>${esc(f.name)}</b> — only changed cells will be written${unknown?` · <span style="color:var(--danger)">${unknown} row(s) skipped (unknown ${esc(m.pk)})</span>`:''}.<div style="margin-top:8px"><button class="btn" style="background:#b23b2e" onclick="bulkImportApply()">✓ Apply ${staged.length} update(s)</button> <button class="btn sec" onclick="window._bulkStaged=null;document.getElementById('bulkImportArea').innerHTML=''">Cancel</button></div></div>`
        : `<div class="hint">No changes detected in <b>${esc(f.name)}</b>${unknown?` (${unknown} row(s) had an unknown ${esc(m.pk)})`:''}.</div>`;
    }catch(err){ $('bulkImportArea').innerHTML='<span style="color:var(--danger)">Could not read file: '+esc(err.message)+'</span>'; } };
  if(/\.csv$/i.test(f.name)) rd.readAsText(f); else rd.readAsBinaryString(f);
}
async function bulkImportApply(){ const staged=window._bulkStaged||[]; const model=window._bulkModel; const m=MODELS[model];
  if(!staged.length){ toast('Nothing to apply',true); return; }
  if(!confirm('Apply '+staged.length+' record update(s) to '+m.label+'?\nThis writes to the live database.')) return;
  showBusy('Applying '+staged.length+' update(s)…'); let ok=0,fail=0;
  for(const s of staged){ try{ await db.update(model,m.pk,s.pk,s.set); sysLog(model,s.pk,'📥 Bulk-import: '+Object.keys(s.set).join(', ')+' by '+CURRENT_USER); ok++; }catch(e){ fail++; } }
  hideBusy(); window._bulkStaged=null; relCache={}; toast('Updated '+ok+' record(s)'+(fail?(' · ⚠ '+fail+' failed'):''), fail>0); openBulkEdit();
}
/* --- Approval workflow: submit bulk changes for an Admin to review & apply --- */
async function bulkSubmit(){
  const model=window._bulkModel; const m=MODELS[model]; const dirty=window._bulkDirty||{};
  const changes=[]; Object.keys(dirty).forEach(pk=>{ const set=_bulkChangeSet(model,pk,dirty[pk]); if(Object.keys(set).length) changes.push({pk,set}); });
  if(!changes.length){ toast('No actual changes to submit',true); return; }
  const fields=[...new Set(changes.reduce((a,c)=>a.concat(Object.keys(c.set)),[]))];
  const summary=changes.length+' '+m.label.toLowerCase()+' · '+fields.join(', ');
  if(!confirm('Submit '+changes.length+' change(s) to '+m.label+' for approval?')) return;
  showBusy('Submitting for approval…');
  try{ await db.create('bulk_change_requests',{ model:model, changes:changes, summary:summary, requested_by:CURRENT_USER, status:'pending' });

    hideBusy(); window._bulkDirty={}; toast('Submitted — an Admin will review it under Administration → Approvals'); openBulkEdit();

}

async function approveReq(id){
  if(typeof curRole==='function' && curRole()!=='Admin'){ toast('Only an Admin can approve',true); return; }
  let reqs=[]; try{ reqs=await db.list('bulk_change_requests',{}); }catch(e){}
  const rq=reqs.find(r=>String(r.id)===String(id)); if(!rq){ toast('Request not found',true); return; }
  const changes=_bcrChanges(rq); const m=MODELS[rq.model];
  if(!m){ toast('Unknown model',true); return; }
  if(!confirm('Approve and apply '+changes.length+' change(s) to '+m.label+'?')) return;
  showBusy('Applying…'); let ok=0,fail=0;
  for(const c of changes){ try{ await db.update(rq.model, m.pk, c.pk, c.set); ok++; }catch(e){ fail++; } }
  try{ await db.update('bulk_change_requests','id',rq.id,{status:'approved',reviewed_by:CURRENT_USER,reviewed_at:new Date().toISOString()}); }catch(e){}
  sysLog(rq.model,'—','✅ '+CURRENT_USER+' approved: '+(rq.summary||'')+' ('+ok+' applied'+(fail?(', '+fail+' failed'):'')+')');
  hideBusy(); relCache={}; toast('Approved — '+ok+' applied'+(fail?(' · ⚠ '+fail+' failed'):''), fail>0); renderApprovals();
}
async function rejectReq(id){
  if(typeof curRole==='function' && curRole()!=='Admin'){ toast('Only an Admin can approve',true); return; }
  const note=prompt('Reason for rejecting (optional):'); if(note===null) return;
  try{ await db.update('bulk_change_requests','id',id,{status:'rejected',reviewed_by:CURRENT_USER,reviewed_at:new Date().toISOString(),review_note:note||''}); }catch(e){ toast(e.message,true); return; }
  sysLog('bulk_change_requests',String(id),'✕ '+CURRENT_USER+' rejected a change request');
  toast('Rejected'); renderApprovals();
}

let mrpAdd={};
function kgf(g){ return (g/1000).toFixed(2); }
// Local (Philippines) calendar date — NOT UTC. toISOString() is UTC, so before 08:00 PH it
// still reads the previous day; use Asia/Manila so "today" matches the user's clock.
function todayISO(){ try{ return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Manila'}); }catch(e){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); } }
function dateMinus(d,n){ try{ const x=new Date(d+'T00:00:00'); x.setDate(x.getDate()-(n||0)); return x.toISOString().slice(0,10);}catch(e){return d;} }
function addDaysISO(d,n){ try{ const x=new Date((d||todayISO())+'T00:00:00'); x.setDate(x.getDate()+(+n||0)); return x.toISOString().slice(0,10);}catch(e){return d||'';} }
/* ---- #3 Bin locations: one bin per (item sku, location) — used by Receiving + Count ---- */
async function loadBins(){ try{ const rows=await db.list('item_bins',{}); const m={}; (rows||[]).forEach(r=>{ m[r.sku+'|'+(r.location_code||'bulacan')]=r.bin||''; }); window._binMap=m; }catch(e){ window._binMap=window._binMap||{}; } }
function binOf(sku,loc){ return (window._binMap||{})[String(sku)+'|'+(loc||'bulacan')]||''; }
async function setBin(sku,loc,bin){ loc=loc||'bulacan'; sku=String(sku); (window._binMap=window._binMap||{})[sku+'|'+loc]=bin;
  try{ if(isLive()){ await sb('item_bins?on_conflict=sku,location_code',{method:'POST',prefer:'resolution=merge-duplicates,return=minimal',body:JSON.stringify({sku:sku,location_code:loc,bin:bin})}); }
    else { DEMO.item_bins=(DEMO.item_bins||[]).filter(x=>!(x.sku===sku&&(x.location_code||'bulacan')===loc)); DEMO.item_bins.push({sku:sku,location_code:loc,bin:bin}); } }catch(e){} }
function countSetBin(sku,loc,v){ setBin(sku,loc,v); }
/* ---- Order rounding: minimum-order + whole ordering-pack multiples (#4), sticker sheets (#5) ---- */
// Round an order qty (kg) UP to satisfy the minimum order AND land on a whole ordering-pack multiple.
function roundOrderKg(kg, minKg, packKg){
  kg=+kg||0; if(kg<=0) return 0; minKg=+minKg||0; packKg=+packKg||0;
  let out=kg;
  if(packKg>0) out=Math.ceil((out-1e-9)/packKg)*packKg;                 // whole packs
  if(minKg>0 && out<minKg-1e-9) out=packKg>0?Math.ceil((minKg-1e-9)/packKg)*packKg:minKg;   // meet min, still whole packs
  return Math.round(out*1000)/1000;
}
// Stickers are bought per printed sheet/page — round pieces UP to full sheets.
function stickerSheets(pieces, perSheet){ pieces=+pieces||0; perSheet=+perSheet||0;
  if(perSheet>0 && pieces>0){ const sheets=Math.ceil((pieces-1e-9)/perSheet); return {sheets, pieces:sheets*perSheet}; }
  return {sheets:0, pieces}; }

async function renderMRP(){
  $('cp').innerHTML=`<div class="title">Demand / MRP <span onclick="openKB('mrp')" title="Module guide" style="cursor:pointer;color:var(--muted);font-size:14px;font-weight:400">❔</span></div>
    <button class="btn" onclick="renderMRP()">↻ Compute</button>
    <button class="btn sec" onclick="saveMRPPlan()" title="Saving locks this week's demand — the Production Plan only takes targets from a saved (locked) plot">💾 Save plan (locks demand)</button>
    <button class="btn sec" onclick="renderDemandHistory()">📚 History</button>
    <button class="btn sec" onclick="openPlanLocs()">⚙ Planning locations</button>
    <button class="wfbtn" onclick="generatePOsFromMRP()">🧾 Generate Draft POs</button>
    <div class="sp"></div><span style="color:var(--muted)">demand + lead time + PAR → replenishment → PO</span>`;
  const prods=await db.list('products',{}), boms=await db.list('bom_lines',{}), ings=await listIngredients();
  const sups=await db.list('suppliers',{});
  const supMin={}; sups.forEach(s=>{ const nm=(s.name||'').trim(); if(nm) supMin[nm]=(+s.min_order_kg||0)*1000; });   // supplier min order → grams
  // Only the locations configured as SUPPLY. Summing every location counted
  // consignee stock as available and under-ordered.
  let stock={};
  if(isLive()){ try{ (await db.list('stock_balance',{})).forEach(s=>{ if(!planCountsLoc(s.location_code)) return; stock[s.ref_sku]=(stock[s.ref_sku]||0)+(+s.on_hand||0);});}catch(e){} }
  else { (DEMO.inventory_movements||[]).forEach(mv=>{ if(mv.kind!=='ingredient'||!planCountsLoc(mv.location_code)) return; stock[mv.ref_sku]=(stock[mv.ref_sku]||0)+(+mv.qty||0); }); }
  window._mrpStock=stock;
  /* SCHEDULED INCOMING — bought but not yet received. Without this the plan
     re-orders what is already on its way. A PO counts as on-order once it is
     'confirmed' (issued to the supplier) and stops counting the moment it is
     received, because receiving posts the quantity into stock_balance. */
  const onOrder={}, onOrderEta={};
  try{
    const openRefs={};
    (await db.list('purchase_orders',{})).forEach(o=>{
      const st=String(o.status||'').toLowerCase();
      // A partially received PO is still bringing the REST of its order in.
      if(st==='confirmed'||st==='partial') openRefs[o.po_ref]=o.expected_delivery||''; });
    if(Object.keys(openRefs).length){
      (await db.list('po_lines',{})).forEach(l=>{
        if(!(l.po_ref in openRefs)) return;
        const g=poRemainQty(l)*1000; if(!(g>0)) return;   // only what has NOT landed yet
        onOrder[l.ingredient_sku]=(onOrder[l.ingredient_sku]||0)+g;
        const eta=openRefs[l.po_ref];
        if(eta && (!onOrderEta[l.ingredient_sku] || eta<onOrderEta[l.ingredient_sku])) onOrderEta[l.ingredient_sku]=eta;
      });
    }
  }catch(e){}
  window._mrpOnOrder=onOrder;
  mrpPlanCache=await mrpPlans();
  // Every locked custom order that still owes packs, whatever week it is scheduled
  // for. This is the "I locked the order but the MRP shows zero" case, made visible.
  const coAll=await coOpenDemand().catch(()=>({}));
  window._mrpCoAll=coAll;
  /* Which of these are ALREADY on a saved demand plot or a live production plan.
     An order does not leave the list when it is plotted — the packs are still
     owed until they are made, and dropping it would mean an order that was
     plotted once and never produced quietly disappears from planning. But it
     does not belong in the "what do I plan today" table either, so it moves to
     its own collapsed group with the plan it is sitting on.                     */
  const coEv=await coPlanEvidence().catch(()=>({planned:{},inDemand:{}}));
  const coDone={}, coFresh={};
  Object.keys(coAll).forEach(k=>{
    const w=coWhyText(coEv,k);
    if(w) coDone[k]=w; else coFresh[k]=true;
  });
  window._mrpCoEv=coEv; window._mrpCoDone=coDone;
  const coPend={};
  // "Add all" only ever pulls the ones that are NOT already planned somewhere.
  Object.keys(coAll).forEach(s=>{ if(coFresh[s] && (+mrpDemand[s]||0)!==coAll[s].packs) coPend[s]=coAll[s].packs; });
  window._mrpCoPend=coPend;
  const nCoPend=Object.keys(coPend).length;
  const _pName={}; prods.forEach(p=>{ _pName[p.sku]=p.name||p.sku; });

  /* ---- Custom orders get their own section -------------------------------
     They were rows 130-odd deep in a list of 135 products, so nobody saw them
     and nobody could tell WHICH order a CUST- SKU belonged to. They are a
     different kind of demand — one named customer, a due date, an order
     reference — so they are planned in their own card, above the catalogue,
     and taken out of the SKU table below to remove the double entry point. */
  const coSkus=Object.keys(coAll);
  let dh='';
  if(coSkus.length){
    const totPacks=coSkus.reduce((s,k)=>s+coAll[k].packs,0);
    const orders=[]; coSkus.forEach(k=>coAll[k].orders.forEach(o=>{ if(!orders.includes(o.ref)) orders.push(o.ref); }));
    const byNeed=(x,y)=>String(coAll[x].needed||'9999').localeCompare(String(coAll[y].needed||'9999'));
    const freshSkus=coSkus.filter(k=>!coDone[k]).sort(byNeed);
    const doneSkus =coSkus.filter(k=>coDone[k]).sort(byNeed);
    const nFreshOrders=new Set(); freshSkus.forEach(k=>coAll[k].orders.forEach(o=>nFreshOrders.add(o.ref)));
    const nDoneOrders =new Set(); doneSkus.forEach(k=>coAll[k].orders.forEach(o=>nDoneOrders.add(o.ref)));
    const _corow=(sku,planned)=>{
      const c=coAll[sku]; const inD=+mrpDemand[sku]||0;
      const late=c.needed && c.needed<todayISO();
      const state = planned ? `<span class="badge b-invoiced">${esc(coDone[sku])}</span>`
                  : (inD>=c.packs ? '<span class="badge b-received">in this run</span>'
                  : (inD>0 ? '<span class="badge b-invoiced">part in this run</span>'
                           : '<span class="badge b-open">not planned yet</span>'));
      return `<tr>
        <td>${esc(c.orders.map(o=>o.customer).filter((v,i,a)=>a.indexOf(v)===i).join(', ')||'—')}
          <div class="mini" style="color:var(--muted)">${esc(c.orders.map(o=>o.ref).join(', '))}</div></td>
        <td>${esc(_pName[sku]||sku)}<div class="mini"><code>${esc(sku)}</code></div></td>
        <td class="mini" style="white-space:nowrap;${late?'color:var(--danger);font-weight:700':''}">${esc(c.needed||'—')}${late?' · overdue':''}</td>
        <td class="num"><b>${c.packs}</b></td>
        <td class="num"><input type="number" step="any" inputmode="decimal" style="width:84px;text-align:right" value="${mrpDemand[sku]||''}" onchange="mrpDemand['${sku}']=+this.value||0;renderMRP()"></td>
        <td>${state}</td></tr>`; };
    const _cohead=`<thead><tr><th>Customer / order</th><th>Product</th><th>Needed</th><th class="num">Ordered</th><th class="num">In this run</th><th>Where it stands</th></tr></thead>`;
    dh+=`<div class="repcard" style="border-left:4px solid var(--berry)">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <h3 style="margin:0">🧑‍🍳 Custom orders — ${nFreshOrders.size} to plan${nDoneOrders.size?(', '+nDoneOrders.size+' already planned'):''}</h3>
        ${nCoPend?`<button class="btn sm" onclick="mrpPullCustom()">＋ Add the ${nCoPend} unplanned to this run</button>`:''}
      </div>
      <div class="hint" style="margin:6px 0 8px">Every <b>locked</b> order that still owes packs, <b>whatever week it is scheduled for</b>. An order already on a saved demand plot or a live production plan drops out of the table below — it is not new work — but it stays listed underneath, because <b>the packs are still owed until they are actually produced</b>. Only confirmed production clears an order from here for good.</div>
      ${freshSkus.length
        ? `<div style="overflow-x:auto"><table>${_cohead}<tbody>${freshSkus.map(k=>_corow(k,false)).join('')}</tbody></table></div>
           <div class="pager">${freshSkus.length} custom SKU(s) need planning · ${freshSkus.reduce((n,k)=>n+coAll[k].packs,0)} pack(s)</div>`
        : `<div class="hint" style="background:#eef5ee;border-color:#cfe0cf;margin:0"><b>✅ Nothing new to plan.</b> All ${coSkus.length} custom SKU(s), ${totPacks} pack(s), are already on a demand plot or a production plan — listed below.</div>`}
      ${doneSkus.length?`<details style="margin-top:10px"${freshSkus.length?'':' open'}>
        <summary style="cursor:pointer;font-weight:700;font-size:13px">Already planned — ${doneSkus.length} custom SKU(s), ${doneSkus.reduce((n,k)=>n+coAll[k].packs,0)} pack(s) still owed</summary>
        <div class="hint" style="margin:8px 0">These are counted already. Adding them again here would buy the ingredients twice. They clear when the production run is <b>confirmed</b>.</div>
        <div style="overflow-x:auto"><table>${_cohead}<tbody>${doneSkus.map(k=>_corow(k,true)).join('')}</tbody></table></div>
      </details>`:''}
      </div>`;
  }
  if(!coSkus.length){
    const d=await coDemandDiag().catch(()=>({rows:[],err:'',counted:0}));
    if(d.err || d.rows.length){
      dh+=`<div class="repcard" style="border-left:4px solid #e0b400">
        <h3 style="margin:0 0 6px">🧑‍🍳 Custom orders — none are in this run</h3>
        ${d.err?`<div class="mini" style="color:var(--danger);margin-bottom:6px">Could not read the custom-order tables: ${esc(d.err)}</div>`:''}
        <div class="hint" style="margin:0 0 8px">An order reaches the demand run only when it is <b>locked</b> (past Draft, not cancelled, not completed) and its lines carry a <b>CUST- SKU with packs</b>. Here is where each one stands.</div>
        <div style="overflow-x:auto"><table><thead><tr><th>Order</th><th>Customer</th><th>Needed</th><th>Status</th><th class="num">Lines</th><th class="num">With SKU</th><th class="num">Packs</th><th>Why it is not counted</th></tr></thead>
        <tbody>${d.rows.map(r=>`<tr><td><code>${esc(r.ref)}</code></td><td>${esc(r.customer||'—')}</td><td class="mini">${esc(r.needed||'—')}</td>
          <td>${coStatBadge(r.status)}</td><td class="num">${r.lines}</td><td class="num">${r.withSku}</td><td class="num">${r.packs||'—'}</td>
          <td class="mini" style="color:${r.reason?'var(--danger)':'#4e7a3e'}">${esc(r.reason||'counted')}</td></tr>`).join('')
          ||'<tr><td colspan="8" class="empty">No custom orders exist yet.</td></tr>'}</tbody></table></div></div>`;
    }
  }
  // demand card
  dh+=`<div class="repcard"${(coSkus.length||1)?' style="margin-top:14px"':''}>
    <div class="repbar"><span>Plan (week of)</span><input type="date" value="${MRPDATE}" onchange="MRPDATE=this.value">
      <button class="btn sm sec" onclick="openMRPImport()">📥 Import (xlsx / csv)</button>
      <button class="btn sm sec" onclick="mrpImport()">⬆ Paste</button>
      <button class="btn sm sec" onclick="mrpSheetSync()" title="Pulls the demand table for this plan date, plus every locked custom order regardless of its scheduled date">☁ Sync demand (sheets + custom orders)</button></div>`;
  dh+=`<h3 style="margin:8px 0 8px">1 · Weekly demand (packs) — keyed by SKU</h3>
    <table><thead><tr><th>Product</th><th>SKU</th><th class="num">Demand</th></tr></thead><tbody>`;
  const _demRow=p=>`<tr><td>${esc(p.name)}</td><td><code>${esc(p.sku)}</code></td><td class="num"><input type="number" step="any" inputmode="decimal" style="width:90px;text-align:right" value="${mrpDemand[p.sku]||''}" onchange="mrpDemand['${p.sku}']=+this.value||0;renderMRP()"></td></tr>`;
  // custom-order SKUs are planned in the card above, not here
  const catalogue=prods.filter(p=>!coAll[p.sku]);
  hierGroups(catalogue,{g1:'group_1',g2:'group_2'}).forEach(G=>{
    dh+=`<tr style="background:#e7f0e9"><td colspan="3"><b>${esc(G.g1)}</b> <span class="mini">· ${G.all.length}</span></td></tr>`;
    G.subs.forEach(S=>{ dh+=`<tr style="background:#f6f8f4"><td colspan="3" style="padding-left:22px">▸ <b>${esc(S.g2)}</b></td></tr>`+S.items.map(_demRow).join(''); });
  });
  dh+='</tbody></table></div>';
  // ---- Ingredient need, ROLLED UP to the purchasable ingredient -------------
  // We only buy the whole-dressed / raw (WD) form; processed forms (deboned, ground,
  // liver, secreting organs…) are made from it. So a recipe's need for a processed
  // ingredient converts to its purchasable parent via yield:
  //   WD as-purchased grams = processed recipe grams ÷ (yield% / 100)
  // The parent is found by the processed item's source_sku, else by matching its
  // "Raw input (what you buy)" text to a purchasable ingredient's name.
  const bySku={}, byName={};
  ings.forEach(it=>{ bySku[it.sku]=it; const nm=(it.name||'').trim().toLowerCase(); if(nm) byName[nm]=it; });
  /* PROCESSED STOCK COUNTS. A recipe asking for 10 kg of processed broccoli when
     10 kg is already sitting processed needs NO raw broccoli bought — production
     draws the processed bin first (that is the processed-first rule the kitchen
     already follows). Before this, the roll-up converted the whole recipe need to
     raw and ordered it, so every processed item held in stock was bought twice. */
  const need={}, _unmapped={}, procUse={}, procAvail={};
  ings.forEach(i=>{ if(isProcessedItem(i)) procAvail[i.sku]=Math.max(0, +stock[i.sku]||0); });
  boms.forEach(b=>{ const dem=+mrpDemand[b.product_sku]||0; if(!dem) return;
    const g=(+b.usable_g||0)*dem; if(!g) return;
    const it=bySku[b.ingredient_sku];
    if(!it){ need[b.ingredient_sku]=(need[b.ingredient_sku]||0)+g; return; }
    const y=(+it.yield_pct||100)/100;
    let recipeG=g, rootSku=b.ingredient_sku;
    if(isProcessedItem(it)){
      // draw the processed bin first; only the shortfall becomes raw to buy
      const take=Math.min(recipeG, procAvail[it.sku]||0);
      if(take>0){ procAvail[it.sku]-=take; procUse[it.sku]=(procUse[it.sku]||0)+take; recipeG-=take; }
      const bySrc = it.source_sku && bySku[it.source_sku] ? bySku[it.source_sku] : null;
      const ri=(it.raw_input||'').trim().toLowerCase(); const byRi = (ri && byName[ri] && byName[ri].sku!==it.sku) ? byName[ri] : null;
      const parent = bySrc || byRi;
      if(parent) rootSku=parent.sku; else _unmapped[it.name||b.ingredient_sku]=1;
    }
    if(recipeG<=0) return;                                     // fully covered by processed stock
    need[rootSku]=(need[rootSku]||0)+(y>0? recipeG/y : recipeG);
  });
  window._mrpProcUse=procUse;
  window._mrpUnmapped=Object.keys(_unmapped);
  // build plan lines. Raw-ingredient reorder RULE (per WR):
  //   Reorder a raw when demand outstrips stock (projected ending inv < 0)
  //   OR when remaining stock is low (~1–5 kg). Custom PAR stocking is for the
  //   SELLABLE PRODUCTS, not raws — so raws use this low-stock reorder point,
  //   never par_g. When reordering, top up to cover demand + lead-time use and
  //   restore the small reorder buffer.
  const RAW_REORDER_G = 5000;   // reorder point for raw ingredients: 5 kg
  const plan=[];
  /* mrpAdd holds items the buyer put on the order by hand — anything in the master
     that the demand roll-up did not surface: a supply, a processed form bought in
     rather than made, a raw with healthy stock you want to top up anyway. The
     quantity is in the ITEM'S OWN unit (kg for food, the uom for supplies), which
     is why the row carries `unit` from here on. */
  ings.forEach(it=>{
    const added=+mrpAdd[it.sku]||0;
    const sup=isSupplyItem(it);
    if(it.is_intermediate && !added) return;   // processed forms are made, not bought — unless asked for by name
    if(sup && !added) return;                  // supplies reorder on PAR in their own module — unless asked for by name
    const rawNeed=need[it.sku]||0;   // already as-purchased — processed forms have been rolled up into this one
    const lead=+it.lead_time_days||0, oh=stock[it.sku]||0;
    const inc=onOrder[it.sku]||0;                            // confirmed POs not yet received
    const avail=oh+inc;                                      // what we will actually have
    const endInv=avail-rawNeed;                              // projected ending inventory after this week's demand
    // trigger: demand exceeds what is on hand PLUS what is already coming
    const lowStock = (endInv < 0) || (endInv <= RAW_REORDER_G && (rawNeed>0 || avail>0));
    const manualKg=+mrpManual[it.sku]||0;
    if(!lowStock && manualKg<=0 && added<=0) return;          // healthy stock, nothing added → nothing to order
    const leadBuf=rawNeed*(lead/7);                          // consumption during lead time
    const buf = lowStock ? RAW_REORDER_G : 0;                // restore the reorder buffer when we do reorder
    const base = lowStock ? (rawNeed + buf + leadBuf - avail) : 0;   // target − (on hand + on order)
    const subtotal=base + manualKg*1000;
    const moq=(+it.min_order_kg||0)*1000;
    // round up to satisfy the min order AND land on a whole ordering-pack multiple (#4)
    let final=subtotal<=0?0:roundOrderKg(subtotal/1000, +it.min_order_kg||0, +it.pack_size_kg||0)*1000;
    // A supply is counted in whole units, not grams, and is never rounded to a pack size.
    if(sup) final=added;
    else if(added>0) final=final + added*1000;
    // default supplier: the ingredient's own default, else fall back to Supplier 1 from the master (ignore "to be determined")
    const _s1=(it.supplier1||'').trim(); const defSup=(it.supplier||'').trim() || (/to be determined/i.test(_s1)?'':_s1);
    plan.push({sku:it.sku,name:it.name,rawNeed,par:buf,leadBuf,lead,oh,inc,eta:(onOrderEta[it.sku]||''),base,endInv,lowStock,manualKg,moq,final,
      added, unit:(sup?(it.uom||'units'):'kg'), isSupply:sup, isProcessed:!!it.is_intermediate,
      remark:(mrpRemarks[it.sku]||''),supplier:defSup,price:+it.list_price_kg||0,orderBy:dateMinus(MRPDATE,lead)});
  });
  plan.sort((a,b)=>b.final-a.final);
  window._mrpPlan=plan;
  const _pu=window._mrpProcUse||{}; const _puN=Object.keys(_pu).length;
  let rh=`<div class="repcard" style="margin-top:14px"><h3 style="margin:0 0 4px">2 · Replenishment plan</h3>
    ${_puN?`<div class="hint" style="margin:0 0 6px">Processed stock counts: <b>${_puN} processed ingredient(s)</b> covered part of this demand from stock already made (${Object.keys(_pu).slice(0,3).map(k=>esc(ingName(k))+' '+(Math.round(_pu[k]/10)/100)+' kg').join(', ')}${_puN>3?', …':''}), so no raw is ordered for that portion.</div>`:''}
    <div class="hint" style="margin:0 0 8px">Raws reorder when demand outstrips <b>stock + what is already on order</b>, or ending stock is low (≤ 5 kg). <b>On order</b> = confirmed POs not yet received, so you don't re-buy a shipment that is already coming; it drops out the moment you receive it. Order qty = weekly need + 5 kg buffer + lead-time buffer − on hand − on order, then ± your manual adjustment, rounded up to the <b>min order</b> and to a whole <b>ordering pack</b> (both set per ingredient in Master Data). (Custom PAR stocking is for the sellable products.) Processed forms (deboned, ground, liver…) are rolled up into the whole-dressed / raw ingredient you actually buy. Supplier = each item's default.</div>
    ${(window._mrpUnmapped&&window._mrpUnmapped.length)?`<div style="background:#fdf0ed;border:1px solid var(--danger);border-radius:6px;padding:9px 11px;margin:0 0 10px;color:var(--danger);font-size:12.5px">⚠ These processed ingredients have demand but no purchasable parent set (Raw input / source), so their need could <b>not</b> be rolled up to a WD and is not in the plan: <b>${window._mrpUnmapped.map(esc).join(', ')}</b>. Set their <i>Raw input (what you buy)</i> to the matching WD ingredient's name in Ingredients.</div>`:''}
    <div style="overflow-x:auto"><table><thead><tr><th>Ingredient</th><th class="num">Need</th><th class="num">On hand</th><th class="num">On order</th><th class="num">End inv</th><th class="num">+Buffer</th><th class="num">+Lead</th><th class="num">Base</th><th class="num">Manual ±kg</th><th class="num">MOQ</th><th class="num">Order</th><th>Order by</th><th>Supplier</th></tr></thead><tbody>`;
  const _rowHtml=(l)=>`<tr><td>${esc(l.name)}

// supplier's total order falls short, "Top up to qualify" adds the shortfall to
// that supplier's largest line as a MANUAL adjustment and tags it with a remark.
function mrpMinOrderCard(bySup, supMin, supKgFn){
  const sups=Object.keys(bySup).filter(s=>!/no default supplier/.test(s));
  if(!sups.length) return '';
  const rows=sups.map(sup=>{
    const arr=bySup[sup]; const sKg=supKgFn(arr); const minG=supMin[sup]||0;
    const short=minG>0?Math.max(0,minG-sKg):0;
    return {sup,arr,sKg,minG,short,items:arr.filter(l=>+l.final>0).length};
  }).sort((a,b)=> ((b.short>0?1:0)-(a.short>0?1:0)) || (b.short-a.short) || a.sup.localeCompare(b.sup));
  const anyMin=rows.some(r=>r.minG>0);
  let t=`<div class="repcard" style="margin-top:14px"><h3 style="margin:0 0 4px">3 · Minimum order qty analysis</h3>
    <div class="hint" style="margin:0 0 8px">Minimum order is <b>per supplier</b>. If an order is below a supplier's minimum, use “Top up to qualify” — the extra kg is added to that supplier's largest line as a <b>manual adjustment</b> and tagged with a remark. Note: suppliers are sometimes <b>combined into one delivery</b> to share the delivery fee, so treat these minimums as a guide, not a hard block.</div>
    <div style="overflow-x:auto"><table><thead><tr><th>Supplier</th><th class="num">Items</th><th class="num">Order kg</th><th class="num">Min order</th><th class="num">Short by</th><th>Status</th><th>Action</th></tr></thead><tbody>`;
  rows.forEach(r=>{
    let status='<span class="mini">no min set</span>', action='';
    if(r.minG>0 && r.short<=0){ status='<span style="color:#4e7a3e;font-weight:600">✓ qualifies</span>'; }
    else if(r.minG>0){
      status=`<span style="color:var(--danger);font-weight:600">short ${kgf(r.short)} kg</span>`;
      const cand=r.arr.slice().sort((a,b)=> ((+b.final||0)-(+a.final||0)) || ((+b.base||0)-(+a.base||0)))[0];
      if(cand){
        const OT=r.sKg-(+cand.final||0); const target=r.minG-OT;
        // round the top-up UP to 0.01 kg so MOQ/precision never leaves us a sub-gram short
        const newManualKg=Math.max(0,Math.ceil((target-(+cand.base||0))/10)/100);
        const addedKg=Math.max(0,Math.round((newManualKg-(+cand.manualKg||0))*100)/100);
        if(addedKg>0) action=`<button class="btn sm" onclick="mrpQualifySet('${cand.sku}',${newManualKg.toFixed(2)},${addedKg.toFixed(2)})">➕ Top up ${addedKg.toFixed(2)} kg on ${esc(cand.name)}</button>`;
      }
    }
    t+=`<tr><td>${esc(r.sup)}</td><td class="num">${r.items}</td><td class="num">${kgf(r.sKg)}</td><td class="num">${r.minG>0?kgf(r.minG):'—'}</td><td class="num">${r.short>0?kgf(r.short):'—'}</td><td>${status}</td><td>${action}</td></tr>`;
  });
  t+=`</tbody></table></div>${anyMin?'':'<div class="hint" style="margin-top:6px">No supplier minimums set yet — set a <b>Min order / delivery (kg)</b> on each supplier (Master Data → Suppliers) to activate this analysis.</div>'}</div>`;
  return t;
}

/* ============ Internal reference numbering (DP / PO / DR / RR) ============ */
function _p2(n){ return String(n).padStart(2,'0'); }
function _mmddyyyy(dstr){ const d=dstr||todayISO(); const t=d.split('-'); return (t[1]||'')+(t[2]||'')+(t[0]||''); }
async function nextSeq(key){   // atomic per-key counter — Supabase RPC when live, localStorage otherwise
  if(isLive()){   // live: the atomic DB counter is the ONLY safe source — never fall back to a per-browser
    if(SUPA&&SUPA.token){ try{ const r=await sb('rpc/next_ref',{method:'POST',body:JSON.stringify({p_key:key})}); const v=Array.isArray(r)?r[0]:r; if(typeof v==='number') return v; if(v&&typeof v.next_ref==='number') return v.next_ref; }catch(e){} }
    throw new Error('Could not reserve a reference number from the server. The next_ref() function may be missing — install it before creating documents. (Falling back to a local counter would collide across users.)');
  }
  const c=JSON.parse(localStorage.getItem('wr_refseq')||'{}'); c[key]=(c[key]||0)+1; localStorage.setItem('wr_refseq',JSON.stringify(c)); return c[key];
}
async function genRef(type,opts){ opts=opts||{}; const dd=_mmddyyyy(opts.date);
  if(type==='DP'){ const cat=(opts.category||'RAW').toUpperCase(); const it=await nextSeq('DP-'+dd+'-'+cat); return {ref:'DP-'+dd+' ['+cat+'] V'+_p2(it), it, dd}; }
  if(type==='PO'){ return {ref:'PO-'+dd+' V'+_p2(opts.xx||1)+'.'+_p2(opts.zz||1), dd}; }
  if(type==='DR'||type==='RR'){ const it=await nextSeq(type+'-'+dd); return {ref:type+'-'+dd+' V'+_p2(it), it, dd}; }
  if(type==='PR'){ const it=await nextSeq('PR-'+dd); return {ref:'PR-'+dd+' V'+_p2(it), it, dd}; }
  if(type==='CO'){ const it=await nextSeq('CO-'+dd); return {ref:'CO-'+dd+' V'+_p2(it), it, dd}; }
  if(type==='WI'){ const sc=(opts.scope||'ALL').toUpperCase(); const it=await nextSeq('WI-'+dd+'-'+sc); return {ref:'WI-'+dd+' ['+sc+'].V'+_p2(it), it, dd}; }
  return {ref:''};
}

async function generatePOsFromMRP(){
  const lines=(window._mrpPlan||[]).filter(l=>l.final>0);
  if(!lines.length){ toast('Nothing to order — set demand first',true); return; }
  const bySup={}; lines.forEach(l=>{ const s=l.supplier||'(unassigned)'; (bySup[s]=bySup[s]||[]).push(l); });
  const supList=Object.keys(bySup); const total=supList.length;
  showBusy('Creating draft POs… (0 of '+total+')');
  const refs=[];
  try{
    // XX = the demand plot's iteration; mint one now if the plan wasn't saved first
    let xx=window._mrpDPit; if(!xx){ const g=await genRef('DP',{category:'RAW',date:MRPDATE}); xx=g.it; window._mrpDPit=xx; }
    let zz=0;
    for(const sup of supList){ zz++;
      setBusy('Creating draft PO '+zz+' of '+total+' — '+sup);
      const ref=(await genRef('PO',{date:MRPDATE,xx,zz})).ref;   // PO-MMDDYYYY VXX.ZZ
      const rec={po_ref:ref, supplier_name:(sup==='(unassigned)'?null:sup), order_date:MRPDATE, status:'open', created_by:CURRENT_USER};
      try{
        await db.create('purchase_orders', rec);
        // ordered_kg holds kilos for food and WHOLE UNITS for a supply — the same
        // basis receiving uses, so a box of masks is not received as 0.007 kg.
        const pl=bySup[sup].map(l=>({po_ref:ref, ingredient_sku:l.sku,
          ordered_kg: l.isSupply ? l.final : Math.round(l.final/10)/100,
          price_kg:l.price, received_kg:0}));
        await db.replaceChildren({model:'po_lines',fk:'po_ref'}, ref, pl);
        const _rem=bySup[sup].filter(l=>l.remark).map(l=>l.name+' — '+l.remark);
        sysLog('purchase_orders',ref,'🤖 Auto-generated from Demand Plot V'+_p2(xx)+' ('+MRPDATE+') by '+CURRENT_USER+(_rem.length?('\n• '+_rem.join('\n• ')):''));
        refs.push(ref+' · '+sup+' ('+bySup[sup].length+')');
      }catch(e){ toast(e.message,true); }
    }
  } finally { hideBusy(); }
  toast('Created '+refs.length+' draft PO(s), grouped by default supplier');
  openModel('purchase_orders');
}

function smartTiles(model, rec, children){
  if(model==='purchase_orders'){
    const ordTot=children.reduce((s,l)=>s+poOrderQty(l)*(+l.price_kg||0),0);   // order value = vendor-avail qty × price
    const recvTot=children.reduce((s,l)=>s+(+l.received_kg||0)*(+l.price_kg||0),0);
    const anyRecv=children.some(l=>+l.received_kg>0);
    const disc=+rec.discount||0, fee=+rec.delivery_fee||0;
    const billable=(anyRecv?recvTot:ordTot) - disc + fee;    // invoice follows RECEIVED qty once receiving starts
    const P=n=>'₱'+Math.round(n).toLocaleString('en-PH');
    const paid=(window._poPay||[]).reduce((s,p)=>s+(+p.amount||0),0);
    const bal=billable-paid;
    const tiles=[{v:children.length,l:'Lines'},{v:P(ordTot),l:'Order value'}];
    if(anyRecv) tiles.push({v:P(recvTot),l:'Received'});
    if(disc) tiles.push({v:'−'+P(disc),l:'Discount'});
    if(fee)  tiles.push({v:'+'+P(fee),l:'Delivery'});
    tiles.push({v:P(billable),l:anyRecv?'Billable (received)':'Est. total'});
    if(paid>0){ tiles.push({v:P(paid),l:'Paid'}); tiles.push({v:P(bal),l:bal>0.5?'Balance':'✓ Settled'}); }
    return tiles; }
  if(model==='products') return [{v:children.length,l:'Recipe items'},{v:(rec.pack_g||0)+'g',l:'Pack'}];
  if(model==='ingredients') return [{v:'₱'+(rec.list_price_kg||0),l:'₱/kg'},{v:(rec.default_method||'—'),l:'Method'}];
  return [];
}

async function prodCostMap(){
  if(await useSecure()){ try{ const rows=await sb('rpc/wr_product_costs',{method:'POST',body:'{}'}); const m={}; (rows||[]).forEach(r=>m[r.product_sku]=+r.cost_per_pack||0); return m; }catch(e){} }  // server-side cost (masking-safe)

  const m={}; boms.forEach(b=>{ const it=im[b.ingredient_sku]||{}; const y=(+it.yield_pct||100)/100; m[b.product_sku]=(m[b.product_sku]||0)+((+b.usable_g||0)/(y||1))/1000*(+it.moving_avg_cost_kg||+it.list_price_kg||0); }); return m; }

// Receiving a PO adds raw stock at Bulacan and updates moving-average cost.
async function postReceipt(po){ try{
  if(await movementExists('PO '+po.po_ref)){ toast('This PO was already received — stock not posted again.',true); return; }
  const lines=await db.children(MODELS.purchase_orders.o2m, po.po_ref);
  const secure=await useSecure();
  const ings=await listIngredients(); const im={}; ings.forEach(i=>im[i.sku]=i); let n=0, costErr=0;
  // per-location on-hand snapshot (bulacan only — receipts land at bulacan)
  const stock={}; try{ (await db.list('stock_balance',{})).forEach(s=>{ if(s.ref_sku && s.location_code===planProduceLoc() && s.kind==='ingredient') stock[s.ref_sku]=(stock[s.ref_sku]||0)+(+s.on_hand||0); }); }catch(e){}
  for(const l of lines){ const recvKg=(l.received_kg!=null&&l.received_kg!=='')?(+l.received_kg||0):(+l.available_kg||+l.ordered_kg||0); if(!(recvKg>0)) continue;
    // Supplies are counted in whole units (scale 1), food ingredients in kg (×1000 → grams).
    const isSup=/(supply|supplement)/i.test((im[l.ingredient_sku]||{}).category||'');
    const g=isSup?recvKg:recvKg*1000, priceKg=Math.max(0,+l.price_kg||0);
    const _exp=(window._recvExpiry&&window._recvExpiry[l.ingredient_sku])||null;
    await db.create('inventory_movements',{kind:'ingredient',ref_sku:l.ingredient_sku,location_code:'bulacan',qty:g,unit_cost:(isSup?priceKg:priceKg/1000),movement_type:'receipt',note:'PO '+po.po_ref, expiry_date:_exp});
    if(isSup){ n++; continue; }   // supplies carry no per-kg moving-average cost
    // roll the moving-average cost — server-side RPC when masking is on (Warehouse can't touch cost columns), else client-side
    if(secure){ try{ await sb('rpc/wr_roll_cost',{method:'POST',body:JSON.stringify({p_sku:l.ingredient_sku,p_recv_kg:recvKg,p_price_kg:priceKg})}); }catch(e){ costErr++; } }
    else { const it=im[l.ingredient_sku]; if(it){ const ohG=Math.max(0,stock[l.ingredient_sku]||0), oldAvg=+it.moving_avg_cost_kg||priceKg;  // clamp negative on-hand
      const newAvg=(ohG+g)>0?((ohG*oldAvg+g*priceKg)/(ohG+g)):priceKg;
      try{ await db.update('ingredients','sku',l.ingredient_sku,{moving_avg_cost_kg:Math.round(newAvg*100)/100,last_price_kg:priceKg}); stock[l.ingredient_sku]=ohG+g; }catch(e){ costErr++; } } }
    n++; }
  sysLog('purchase_orders',po.po_ref,'📦 Received — '+n+' ingredient(s) posted to Bulacan stock by '+CURRENT_USER);
  toast('Received · '+n+' item(s) added to stock'+(costErr?(' · ⚠ '+costErr+' cost update(s) failed'):''), costErr>0);
 }catch(e){ toast('Receive posting failed: '+e.message,true); } }
// Confirming a transfer moves finished stock Bulacan → Pasig and flags any shortfall (Check 4).
async function postTransfer(t){ try{
  if(await movementExists('Transfer '+t.transfer_ref)){ toast('This transfer was already received — not posted again.',true); return; }
  const lines=await db.children(MODELS.transfers.o2m, t.transfer_ref); const cm=await prodCostMap();
  // Soft best-before warning — flag products that have finished stock already past best-before.
  try{ const _today=todayISO(); const _bad={}; (await db.list('production_batches',{})).forEach(b=>{ const bb=b.best_before?String(b.best_before).slice(0,10):''; if(bb && bb<_today && (!_bad[b.product_sku]||bb<_bad[b.product_sku])) _bad[b.product_sku]=bb; });
    const _mv=[...new Set(lines.map(l=>l.product_sku))].filter(s=>_bad[s]);
    if(_mv.length){ const _pn={}; (await db.list('products',{})).forEach(p=>_pn[p.sku]=p.name);
      if(!confirm('⚠ Best-before warning — these products have finished stock past best-before:\n\n'+_mv.map(s=>'• '+(_pn[s]||s)+' (best before '+_bad[s]+')').join('\n')+'\n\nMake sure you are not shipping expired packs. Proceed with the transfer?')) return; } }catch(e){}
  const from=t.from_code||'bulacan', to=t.to_code||'pasig'; let n=0,flags=0;
  for(const l of lines){ const sent=Math.max(0,+l.sent_packs||0), recv=Math.max(0,+l.received_packs||0); if(sent<=0&&recv<=0) continue; const uc=cm[l.product_sku]||0;
    if(sent>0) await db.create('inventory_movements',{kind:'product',ref_sku:l.product_sku,location_code:from,qty:-sent,unit_cost:uc,movement_type:'transfer_out',note:'Transfer '+t.transfer_ref});
    if(recv>0) await db.create('inventory_movements',{kind:'product',ref_sku:l.product_sku,location_code:to,qty:recv,unit_cost:uc,movement_type:'transfer_in',note:'Transfer '+t.transfer_ref});
    const gap=sent-recv; if(Math.abs(gap)>0.0001){ flags++; try{ await db.create('variance_log',{check_type:'4 · Transfer',source_ref:t.transfer_ref,expected:sent,actual:recv,gap_qty:-gap,gap_value:Math.round((cm[l.product_sku]||0)*gap*100)/100,location:'in-transit',responsible_user:CURRENT_USER,status:'open',note:l.product_sku+' sent '+sent+' vs received '+recv}); }catch(e){} }
    n++; }
  sysLog('transfers',t.transfer_ref,'🚚 Received — '+n+' line(s) posted; '+flags+' shortfall(s) flagged by '+CURRENT_USER); toast('Transfer posted · '+flags+' shortfall(s)');
 }catch(e){ toast('Transfer posting failed: '+e.message,true); } }

// current pack/sheet target for a confirm line, computed against the live input value.
function poRoundTarget(i){ const info=(window._poRound||[])[i]; if(!info) return null; const cur=+($('pc_q'+i)||{}).value||0;
  if(info.kind==='sheet'){ const s=stickerSheets(cur,info.per); return {kind:'sheet',per:info.per,cur,target:s.pieces,sheets:s.sheets}; }
  return {kind:'pack',min:info.min,pack:info.pack,cur,target:roundOrderKg(cur,info.min,info.pack)}; }
function poApplyRound(i){ const t=poRoundTarget(i); const el=$('pc_q'+i); if(el&&t&&t.target>0){ el.value=t.target; poConfirmFlag(i); } }
function poRoundAll(){ (window._poRound||[]).forEach((_,i)=>poApplyRound(i)); }
// Live order-qty-vs-available check + pack/sheet suggestion per line.
function poConfirmFlag(i){ const q=+($('pc_q'+i)||{}).value||0; const a=(window._poAvail&&window._poAvail[i])||0; const e=$('pc_flag'+i);
  const rc=$('pc_round'+i); if(rc){ const t=poRoundTarget(i);
    if(!t || (t.kind==='sheet'&&!(t.per>0)) || (t.kind==='pack'&&!(t.min>0||t.pack>0))) rc.innerHTML='<span style="color:var(--muted)">—</span>';
    else if(t.kind==='sheet'){ const need=t.target>t.cur+1e-9; rc.innerHTML=`${t.sheets} sheet(s)=${t.target}pc ${need?`<a onclick="poApplyRound(${i})" style="cursor:pointer;color:#4e7a3e">⤴</a>`:'✓'}`; }
    else { const need=t.target>t.cur+1e-9; rc.innerHTML=`${t.pack>0?('×'+t.pack):''}${t.min>0?(' min'+t.min):''} → ${t.target} ${need?`<a onclick="poApplyRound(${i})" style="cursor:pointer;color:#4e7a3e">⤴</a>`:'✓'}`; }
  }
  if(!e)return;
  if(q>a+0.0001){ e.innerHTML='<span style="color:var(--danger)">⚠ over avail by '+(Math.round((q-a)*100)/100)+'</span>'; }
  else if(q<a-0.0001){ e.innerHTML='<span style="color:var(--muted)">'+(Math.round((a-q)*100)/100)+' below</span>'; }
  else { e.innerHTML='<span style="color:#4e7a3e">✓ full</span>'; } }
async function poConfirmApply(){
  const lines=formChildren||[]; const changes=[]; const overs=[];
  const updated=lines.map((l,i)=>{ const nq=+($('pc_q'+i).value)||0, np=+($('pc_p'+i).value)||0; const req=+l.ordered_kg||0, av=(window._poAvail&&window._poAvail[i])||0, op=+l.price_kg||0;
    if(Math.abs(nq-req)>0.0001) changes.push(ingName(l.ingredient_sku)+': req '+req+' → order '+nq+'kg'); if(Math.abs(np-op)>0.0001) changes.push(ingName(l.ingredient_sku)+': ₱'+op+'→₱'+np);
    if(nq>av+0.0001) overs.push(ingName(l.ingredient_sku)+' (order '+nq+' > avail '+av+'kg)');

    return {po_ref:formRec.po_ref, ingredient_sku:l.ingredient_sku, ordered_kg:req, available_kg:nq, price_kg:np, received_kg:l.received_kg||0}; });
  if(overs.length) changes.push('⚠ order exceeds availability: '+overs.join('; '));

    notifyRecordDone('purchase_orders', formRec.po_ref);   // issued → generate PDF → Drive → notify

/* ============ PO payments (partial / full) ============ */
const PO_PAY_METHODS=['Bank transfer','GCash','Cash'];
async function poPayments(ref){ if(!ref) return [];
  if(isLive()){ try{ return await sb('po_payments?po_ref=eq.'+encodeURIComponent(ref)+'&order=paid_at.asc,id.asc'); }catch(e){ return []; } }
  return (DEMO.po_payments||[]).filter(p=>p.po_ref===ref); }
// Effective ORDER qty per line = vendor-available (what we actually order), falling back to the
// original requested qty until a quotation sets availability. The requested (ordered_kg) is locked.
function poOrderQty(l){ return (l&&l.available_kg!=null&&l.available_kg!=='')?(+l.available_kg||0):(+((l||{}).ordered_kg)||0); }
// What a line still owes: ordered minus what has already been received.
function poRemainQty(l){ return Math.max(0, Math.round((poOrderQty(l)-(+((l||{}).received_kg)||0))*1000)/1000); }
// Billable = received qty × price (falls back to the ORDER qty — vendor avail — until anything is
// received) − discount + delivery fee.
/* A delivery fee charged by a third-party fleet is NOT owed to the supplier —
   it is its own payable, to a different party, usually on different terms.
   Rolling it into the supplier's bill overstates what you owe them and hides
   the courier spend entirely. */
function poFeeToFleet(rec){ return /fleet/i.test(String((rec||{}).delivery_payee||'')); }
function poBillable(rec, lines){ lines=lines||[];
  const ordTot=lines.reduce((s,l)=>s+poOrderQty(l)*(+l.price_kg||0),0);
  const recvTot=lines.reduce((s,l)=>s+(+l.received_kg||0)*(+l.price_kg||0),0);
  const anyRecv=lines.some(l=>+l.received_kg>0);
  const disc=+rec.discount||0, fee=poFeeToFleet(rec)?0:(+rec.delivery_fee||0);
  return Math.max(0,(anyRecv?recvTot:ordTot) - disc + fee); }
// what a fleet/courier is owed on this PO, if anyone
function poFleetDue(rec){ return poFeeToFleet(rec)?(+((rec||{}).delivery_fee)||0):0; }

    let rem=paid; const srows=stages.map(s=>{ const amt=billable*s.pct/100; const cov=Math.min(amt,Math.max(0,rem)); rem-=cov; const stt=cov>=amt-0.5?'paid':(cov>0?'partial':'due'); const col=stt==='paid'?'#4e7a3e':(stt==='partial'?'var(--earth,#b5762a)':'var(--danger)');

// Post ONLY this batch's delta to the ledger (unique per-batch note) and roll moving-avg cost by the delta.
async function postReceiptDelta(po, deltas, loc){
  loc=loc||'bulacan';
  const secure=await useSecure();
  const ings=await listIngredients(); const im={}; ings.forEach(i=>im[i.sku]=i); let n=0, costErr=0;
  const stock={}; try{ (await db.list('stock_balance',{})).forEach(s=>{ if(s.ref_sku&&s.location_code===loc&&s.kind==='ingredient') stock[s.ref_sku]=(stock[s.ref_sku]||0)+(+s.on_hand||0); }); }catch(e){}
  const batchNote='PO '+po.po_ref+' R'+Date.now();   // unique per batch → no double-post guard needed
  for(const d of deltas){ const recvKg=+d.recvKg||0; if(!(recvKg>0)) continue;
    const isSup=/(supply|supplement)/i.test((im[d.ingredient_sku]||{}).category||'');
    const g=isSup?recvKg:recvKg*1000, priceKg=Math.max(0,+d.priceKg||0);
    try{ await db.create('inventory_movements',{kind:'ingredient',ref_sku:d.ingredient_sku,location_code:loc,qty:g,unit_cost:(isSup?priceKg:priceKg/1000),movement_type:'receipt',note:batchNote}); }catch(e){ continue; }
    if(isSup){ n++; continue; }
    if(secure){ try{ await sb('rpc/wr_roll_cost',{method:'POST',body:JSON.stringify({p_sku:d.ingredient_sku,p_recv_kg:recvKg,p_price_kg:priceKg})}); }catch(e){ costErr++; } }
    else { const it=im[d.ingredient_sku]; if(it){ const ohG=Math.max(0,stock[d.ingredient_sku]||0), oldAvg=+it.moving_avg_cost_kg||priceKg;
      const newAvg=(ohG+g)>0?((ohG*oldAvg+g*priceKg)/(ohG+g)):priceKg;
      try{ await db.update('ingredients','sku',d.ingredient_sku,{moving_avg_cost_kg:Math.round(newAvg*100)/100,last_price_kg:priceKg}); stock[d.ingredient_sku]=ohG+g; }catch(e){ costErr++; } } }
    n++; }
  return {n,costErr};
}
async function _poReceiveApply(){
  const lines=formChildren||[]; const notes=[]; const _vars=[]; const deltas=[];
  const isFinal=!!($('rc_final')||{}).checked;
  const loc=($('rc_loc')||{}).value||'bulacan';
  let anyNow=false;
  const updated=lines.map((l,i)=>{ const now=+(($('rc_q'+i)||{}).value)||0; const already=+l.received_kg||0; const oq=poOrderQty(l); const pr=+l.price_kg||0;
    if(now>0){ anyNow=true; deltas.push({ingredient_sku:l.ingredient_sku, recvKg:now, priceKg:pr}); }
    const bv=($('rc_bin'+i)||{}).value; if(bv!==undefined&&bv!==null) setBin(l.ingredient_sku,loc,bv);
    const total=Math.round((already+now)*1000)/1000;
    if(isFinal){ const g=Math.round((oq-total)*1000)/1000;
      if(g>0.0001){ notes.push(ingName(l.ingredient_sku)+': ordered '+oq+' → received '+total+'kg (short '+g+')');
        _vars.push({check_type:'1 · PO fulfilment',source_ref:formRec.po_ref,expected:oq,actual:total,gap_qty:-g,gap_value:Math.round(g*pr*100)/100,location:loc,responsible_user:CURRENT_USER,status:'open',note:ingName(l.ingredient_sku)+' ordered '+oq+' vs received '+total+' (short, PO closed)'}); }
      else if(g< -0.0001){ notes.push(ingName(l.ingredient_sku)+': ordered '+oq+' → received '+total+'kg (over '+(-g)+')');
        _vars.push({check_type:'1 · PO fulfilment',source_ref:formRec.po_ref,expected:oq,actual:total,gap_qty:-g,gap_value:Math.round(-g*pr*100)/100,location:loc,responsible_user:CURRENT_USER,status:'open',note:ingName(l.ingredient_sku)+' ordered '+oq+' vs received '+total+' (over)'}); } }
    return {po_ref:formRec.po_ref, ingredient_sku:l.ingredient_sku, ordered_kg:l.ordered_kg, available_kg:l.available_kg, price_kg:l.price_kg, received_kg:total}; });
  if(!anyNow && !isFinal){ toast('Enter a quantity received, or tick Final delivery to close',true); return; }
  if(anyNow && !loc){ toast('Pick the receiving warehouse',true); return; }
  // fully received on every line?
  const complete=updated.every(u=>(+u.received_kg||0) >= poOrderQty(u)-0.0001);
  const willClose = isFinal || complete;
  try{
    await db.replaceChildren(MODELS.purchase_orders.o2m, formRec.po_ref, updated);
    formChildren=updated;
    if(deltas.length){ const res=await postReceiptDelta(formRec, deltas, loc); }
    // A PO with one delivery in and another still to come now says so.
    formRec.status = willClose ? 'received' : 'partial';
    await db.update('purchase_orders','po_ref',formRec.po_ref,{status:formRec.status});

    for(const v of _vars){ try{ await db.create('variance_log',v); }catch(e){} }
    if(willClose) notifyRecordDone('purchase_orders', formRec.po_ref);   // PDF → Drive → notify only when closed
    closeModal(); renderForm();
    toast(willClose?'PO received & closed':'Batch received — PO still open for the next delivery');
  }catch(e){ toast(e.message,true); }
}

/* command palette ⌘K */
let cmdSel=0, cmdItems=[];
function ensureCmd(){ if($('cmdwrap')) return;
  const d=document.createElement('div'); d.className='cmdwrap'; d.id='cmdwrap';
  d.innerHTML=`<div class="cmd"><input id="cmdq" placeholder="Search records, jump to a module…" oninput="cmdSearch(this.value)"><div class="res" id="cmdres"></div><div class="hint"><span><kbd>↑↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></div></div>`;
  d.addEventListener('click',e=>{ if(e.target===d) closeCmd(); });
