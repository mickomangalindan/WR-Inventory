<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wholesome Rabbit ERP</title>
<style>
  :root{
    /* Wholesome Rabbit — natural green + warm cream + earth tones */
    --berry:#4e7a3e; --berry-d:#3c5f30; --teal:#6f9a4e; --bg:#f5f3ec; --panel:#fff;
    --ink:#2c2a24; --muted:#8c887e; --line:#e7e3d8; --line2:#f1eee5;
    --hi:#eaf0e1; --ok:#3f7d54; --warn:#c9832f; --danger:#c0524d; --link:#4e7a3e;
    --earth:#b5762a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-size:13px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  /* top bar */
  .topbar{height:46px;background:var(--berry);color:#fff;display:flex;align-items:center;gap:14px;padding:0 14px}
  .topbar .brand{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
  .topbar .crumb{opacity:.9;font-size:13px}
  .topbar .crumb b{opacity:1}
  .topbar .sp{flex:1}
  .topbar button{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:5px;padding:6px 11px;font-size:12px;cursor:pointer}
  .topbar button:hover{background:rgba(255,255,255,.28)}
  .mode{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:700}
  .mode.demo{background:#f5e9c9;color:#7a5b12} .mode.live{background:#cdeede;color:#0d6b3f}
  /* layout */
  .app{display:flex;height:calc(100% - 46px)}
  .side{width:210px;background:#fff;border-right:1px solid var(--line);overflow-y:auto;flex-shrink:0}
  .side .mod{padding:11px 14px 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
  .side .mi{display:flex;align-items:center;gap:9px;padding:8px 14px;cursor:pointer;font-size:13px;color:#3b3b45}
  .side .mi:hover{background:var(--hi)}
  .side .mi.active{background:var(--hi);color:var(--berry);font-weight:600;box-shadow:inset 3px 0 0 var(--berry)}
  .side .mi .ic{width:18px;text-align:center}
  .main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
  /* control panel */
  .cp{background:#fff;border-bottom:1px solid var(--line);padding:9px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  .cp .title{font-size:16px;font-weight:700;margin-right:6px}
  .cp .sp{flex:1}
  .btn{background:var(--berry);color:#fff;border:none;border-radius:5px;padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer}
  .btn:hover{background:var(--berry-d)}
  .btn.sec{background:#fff;color:#3b3b45;border:1px solid #ccc}
  .btn.sec:hover{background:#f6f6f8}
  .btn.sm{padding:4px 9px;font-size:12px}
  .btn.link{background:none;border:none;color:var(--link);padding:2px 6px;cursor:pointer;font-weight:600}
  .search{display:flex;align-items:center;border:1px solid #ccc;border-radius:5px;padding:5px 9px;gap:7px;background:#fff;min-width:220px}
  .search input{border:none;outline:none;font-size:13px;flex:1;background:none}
  .vswitch{display:flex;border:1px solid #ccc;border-radius:5px;overflow:hidden}
  .vswitch button{background:#fff;border:none;padding:6px 10px;cursor:pointer;color:#6b6b77;font-size:13px;border-right:1px solid #eee}
  .vswitch button:last-child{border-right:none}
  .vswitch button.on{background:var(--hi);color:var(--berry)}
  .drop{position:relative}
  .drop .menu{position:absolute;top:110%;left:0;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.12);min-width:190px;z-index:40;padding:5px 0;display:none}
  .drop.open .menu{display:block}
  .drop .menu div{padding:7px 13px;cursor:pointer;font-size:12.5px}
  .drop .menu div:hover{background:var(--hi)}
  .drop .menu .hd{font-size:10px;text-transform:uppercase;color:var(--muted);cursor:default;font-weight:700;letter-spacing:.05em}
  .drop .menu .hd:hover{background:none}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#eef0f6;border:1px solid #dfe2ee;border-radius:16px;padding:3px 10px;font-size:12px;color:#40506b}
  .chip b{color:var(--berry)} .chip .x{cursor:pointer;opacity:.6} .chip .x:hover{opacity:1}
  /* content */
  .content{padding:16px;flex:1}
  .listcard{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  table{width:100%;border-collapse:collapse}
  thead th{background:#fbfbfc;text-align:left;padding:9px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:#7a7a88;font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td{padding:9px 12px;border-bottom:1px solid var(--line2);font-size:13px}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#fbfaff}
  td.num,th.num{text-align:right}
  .grp td{background:#f6f5f8;font-weight:700;color:var(--berry);cursor:default}
  .pager{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:9px 14px;color:#6b6b77;font-size:12.5px}
  .pager button{background:none;border:1px solid #ccc;border-radius:4px;padding:3px 8px;cursor:pointer}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:14px}
  .b-open{background:#eef0f6;color:#40506b}.b-received{background:#dbeddb;color:#1e6b2e}
  .b-invoiced{background:#fbe6cf;color:#8a5a12}.b-closed{background:#e5e5ea;color:#555}
  .b-true{background:#dbeddb;color:#1e6b2e}.b-false{background:#f3e3e0;color:#9a3b2e}
  /* form */
  .formwrap{max-width:920px;margin:0 auto}
  .sheet{background:#fff;border:1px solid var(--line);border-radius:8px;padding:0 0 18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .statusbar{display:flex;justify-content:flex-end;gap:0;padding:10px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
  .stg{padding:5px 14px;font-size:12px;color:#8a8a99;border:1px solid var(--line);border-left:none;position:relative;background:#fff}
  .stg:first-child{border-left:1px solid var(--line);border-radius:14px 0 0 14px}
  .stg:last-child{border-radius:0 14px 14px 0}
  .stg.on{background:var(--berry);color:#fff;border-color:var(--berry)}
  .sheet .hd{padding:16px 22px 4px}
  .sheet .hd .ttl{font-size:22px;font-weight:700;border:none;outline:none;width:100%}
  .sheet .hd .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
  .groups{display:grid;grid-template-columns:1fr 1fr;gap:2px 34px;padding:14px 22px}
  @media(max-width:760px){.groups{grid-template-columns:1fr}}
  .fld{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line2)}
  .fld label{width:150px;color:#59596b;font-size:12.5px;flex-shrink:0}
  .fld .val{flex:1}
  .fld input,.fld select,.fld textarea{width:100%;border:1px solid transparent;border-radius:4px;padding:5px 7px;font-size:13px;font-family:inherit;background:none}
  .fld input:hover,.fld select:hover{border-color:var(--line)}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--teal);background:#fff;box-shadow:0 0 0 2px rgba(78,122,62,.15)}
  .notebook{margin:8px 22px 0;border-top:1px solid var(--line)}
  .nbtabs{display:flex;gap:2px;margin-top:8px}
  .nbtabs button{background:none;border:none;border-bottom:2px solid transparent;padding:8px 14px;cursor:pointer;font-weight:600;color:#6b6b77;font-size:13px}
  .nbtabs button.on{color:var(--berry);border-bottom-color:var(--berry)}
  .lines table{border:1px solid var(--line);border-radius:6px;margin-top:10px}
  .lines td{padding:4px 6px}
  .lines input,.lines select{width:100%;border:1px solid transparent;border-radius:4px;padding:5px 6px;font-size:13px;background:none}
  .lines input:focus,.lines select:focus{outline:none;border-color:var(--teal);background:#fff}
  .lines .addrow{color:var(--link);font-weight:600;cursor:pointer;padding:7px 8px;display:inline-block}
  .formbar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block;margin-right:6px}
  /* report */
  .repcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px}
  .repbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .repbar select{border:1px solid #ccc;border-radius:5px;padding:6px 9px;font-size:13px}
  .measure-bar{height:16px;background:linear-gradient(90deg,var(--berry),#a9c98a);border-radius:3px}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:100}
  .overlay.on{display:flex}
  .modal{background:#fff;border-radius:10px;padding:22px 24px;max-width:520px;width:92%;max-height:88vh;overflow:auto}
  .modal h3{margin:0 0 4px}
  .modal p{color:var(--muted);font-size:12.5px;margin:0 0 14px}
  .modal label{display:block;font-weight:600;font-size:12.5px;margin:10px 0 4px}
  .modal input{width:100%;border:1px solid #ccc;border-radius:5px;padding:8px 10px;font-size:13px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2b2b33;color:#fff;padding:11px 18px;border-radius:8px;font-size:13px;z-index:200;opacity:0;transition:.25s;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .toast.show{opacity:1;bottom:30px}
  .toast.err{background:#8a2e28}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  a.reclink{color:var(--link);text-decoration:none;font-weight:600}
  /* dashboard */
  .dash{padding:4px}
  .kpirow{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
  .kpi .v{font-size:26px;font-weight:800;margin-top:6px;color:var(--berry)}
  .kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
  .qcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .qcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;cursor:pointer;display:flex;gap:12px;align-items:center}
  .qcard:hover{border-color:var(--berry);box-shadow:0 2px 10px rgba(78,122,62,.12)}
  .qcard .ic{font-size:24px}.qcard .t{font-weight:700}.qcard .d{font-size:12px;color:var(--muted)}
  /* kanban */
  .kb{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:8px}
  .kbcol{background:#eeece4;border-radius:10px;min-width:250px;max-width:290px;flex-shrink:0;padding:8px}
  .kbcol h4{margin:4px 8px 8px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#6c6a60;display:flex;justify-content:space-between}
  .kbcol h4 .c{background:#fff;border-radius:10px;padding:0 8px;font-size:11px}
  .kbcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .kbcard:hover{box-shadow:0 3px 10px rgba(0,0,0,.1)}
  .kbcard .kt{font-weight:700;margin-bottom:3px}.kbcard .km{font-size:12px;color:var(--muted)}
  /* smart buttons + workflow */
  .wfbar{display:flex;align-items:center;gap:8px;padding:10px 16px 4px;flex-wrap:wrap}
  .wfbtn{background:var(--berry);color:#fff;border:none;border-radius:5px;padding:6px 13px;font-weight:600;font-size:12.5px;cursor:pointer}
  .wfbtn.sec{background:#fff;color:var(--berry);border:1px solid var(--berry)}
  .smart{display:flex;gap:0;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-left:auto}
  .stile{padding:6px 14px;border-right:1px solid var(--line);text-align:center;background:#fff}
  .stile:last-child{border-right:none}.stile .v{font-weight:800;color:var(--berry);font-size:15px}.stile .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  /* form 2-col with chatter */
  .formcols{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
  @media(max-width:900px){.formcols{grid-template-columns:1fr}}
  .chatter{background:#fbfaf6;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
  .chatter h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .chatter .cbtns{display:flex;gap:6px;margin-bottom:8px}
  .chatter textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px;font-family:inherit;font-size:13px}
  .msg{border-top:1px solid var(--line2);padding:8px 0;font-size:12.5px}
  .msg .who{font-weight:700}.msg .tm{color:var(--muted);font-size:11px}.msg .bd{margin-top:2px}
  .msg.act{background:#fff7e8;border:1px solid #f0dfae;border-radius:6px;padding:7px 9px;margin-top:6px}
  /* command palette */
  .cmdwrap{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-start;justify-content:center;z-index:150;padding-top:12vh}
  .cmdwrap.on{display:flex}
  .cmd{background:#fff;border-radius:12px;width:92%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
  .cmd input{width:100%;border:none;outline:none;padding:16px 18px;font-size:16px;border-bottom:1px solid var(--line)}
  .cmd .res{max-height:52vh;overflow:auto}
  .cmd .r{padding:10px 16px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:13.5px}
  .cmd .r.sel,.cmd .r:hover{background:var(--hi)}
  .cmd .r .tag{margin-left:auto;font-size:11px;color:var(--muted);text-transform:uppercase}
  .cmd .hint{padding:8px 16px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);display:flex;gap:14px}
  kbd{background:#eee;border-radius:4px;padding:1px 5px;font-size:11px;border:1px solid #ddd}
  /* bulk / attachments */
  .bulkbar{background:#fff;border:1px solid var(--berry);border-radius:8px;padding:8px 12px;margin-bottom:10px;align-items:center;gap:10px;font-size:13px}
  .attachbox{background:#fbfaf6;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .attachbox h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .attpill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:12px;margin:2px 4px 2px 0}
  .attpill a{color:var(--link);text-decoration:none} .attpill .x{cursor:pointer;color:var(--muted)}
  .msg.sys{background:#eef2ec;border:1px solid #d8e4d2;border-radius:6px;padding:6px 9px;margin-top:5px;color:#3d5f30}
  .lines th{background:#fbfbfc;font-size:10px}
  .sck{font-size:13px;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
  .b-explained{background:#fbe6cf;color:#8a5a12} .b-resolved{background:#dbeddb;color:#1e6b2e}
  .b-draft{background:#eef0f6;color:#40506b} .b-approved{background:#dbeddb;color:#1e6b2e}
  .b-undefined{background:#eef0f6;color:#40506b}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">🐇 Wholesome Rabbit <span style="opacity:.6;font-weight:400">ERP</span></div>
  <div class="crumb" id="crumb"></div>
  <div class="sp"></div>
  <span style="opacity:.85">👤</span><select id="userSel" onchange="setUser(this.value)" style="background:rgba(255,255,255,.16);color:#fff;border:none;border-radius:5px;padding:5px 8px;font-size:12px"></select>
  <span class="mode demo" id="modeTag">DEMO</span>
  <button onclick="openKB()">❔ Guide</button>
  <button onclick="openSettings()">⚙ Connect Supabase</button>
</div>
<div class="app">
  <div class="side" id="side"></div>
  <div class="main">
    <div class="cp" id="cp"></div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

let SUPA = JSON.parse(localStorage.getItem('wr_supa')||'null');
let DEMO = window.__DEMO__ || {suppliers:[],ingredients:[],products:[],bom_lines:[],purchase_orders:[],po_lines:[],inventory_movements:[],stock_balance:[]};
['suppliers','ingredients','products','bom_lines','purchase_orders','po_lines','inventory_movements','stock_balance'].forEach(k=>DEMO[k]=DEMO[k]||[]);
const isLive = ()=> !!(SUPA && SUPA.url && SUPA.key);

async function sb(path, opts={}){
  const bearer = (SUPA.token||SUPA.key);   // signed-in user's token when available, else anon key
  const r = await fetch(SUPA.url.replace(/\/$/,'')+'/rest/v1/'+path, {
    ...opts, headers:{ apikey:SUPA.key, Authorization:'Bearer '+bearer,
      'Content-Type':'application/json', Prefer: opts.prefer||'return=representation', ...(opts.headers||{}) }});
  if(!r.ok){ const t=await r.text(); throw new Error(r.status+' '+t.slice(0,180)); }
  const txt = await r.text(); return txt? JSON.parse(txt):[];
}
async function sbAuth(email,password){
  const r=await fetch(SUPA.url.replace(/\/$/,'')+'/auth/v1/token?grant_type=password',{method:'POST',
    headers:{apikey:SUPA.key,'Content-Type':'application/json'},body:JSON.stringify({email,password})});
  const j=await r.json(); if(!r.ok) throw new Error(j.error_description||j.msg||j.error||'sign-in failed'); return j;
}
const db = {
  async list(model, {search,groupBy,page,per}={}){
    const m=MODELS[model]||{};   // child models (bom_lines, po_lines) have no top-level entry
    if(isLive()){
      let q='?select=*';
      if(search && m.name) q+='&'+m.name+'=ilike.*'+encodeURIComponent(search)+'*';
      q+='&limit='+(per||1000);
      return await sb(model+q);
    } else {
      let rows=[...(DEMO[model]||[])];
      if(search && m.name) rows=rows.filter(r=>String(r[m.name]||'').toLowerCase().includes(search.toLowerCase()));
      return rows;
    }
  },
  async children(o2m, parentVal){
    if(isLive()) return await sb(o2m.model+'?select=*&'+o2m.fk+'=eq.'+encodeURIComponent(parentVal));
    return (DEMO[o2m.model]||[]).filter(r=>r[o2m.fk]===parentVal);
  },
  async create(model, rec){
    if(isLive()) return (await sb(model, {method:'POST', body:JSON.stringify(rec)}))[0];
    DEMO[model]=DEMO[model]||[]; rec.id=rec.id||('loc'+Date.now()+Math.floor(Math.random()*999)); DEMO[model].push(rec); return rec;
  },
  async update(model, pk, pkval, rec){
    if(isLive()) return (await sb(model+'?'+pk+'=eq.'+encodeURIComponent(pkval), {method:'PATCH', body:JSON.stringify(rec)}))[0];
    const arr=DEMO[model]; const i=arr.findIndex(r=>r[pk]===pkval); if(i>=0) arr[i]={...arr[i],...rec}; return arr[i];
  },
  async del(model, pk, pkval){
    if(isLive()) return await sb(model+'?'+pk+'=eq.'+encodeURIComponent(pkval), {method:'DELETE', prefer:'return=minimal'});
    DEMO[model]=(DEMO[model]||[]).filter(r=>r[pk]!==pkval);
  },
  async replaceChildren(o2m, parentVal, rows){
    if(isLive()){
      await sb(o2m.model+'?'+o2m.fk+'=eq.'+encodeURIComponent(parentVal),{method:'DELETE',prefer:'return=minimal'});
      if(rows.length) await sb(o2m.model,{method:'POST',body:JSON.stringify(rows),prefer:'return=minimal'});
    } else {
      DEMO[o2m.model]=(DEMO[o2m.model]||[]).filter(r=>r[o2m.fk]!==parentVal).concat(rows);
    }
  }
};

let repCfg={dim:'',measure:'',agg:'count'};
async function renderReport(){
  controlPanel();
  const m=MODELS[state.model];
  const dims=m.fields.filter(f=>['text','select','rel'].includes(f.t));
  const meas=m.fields.filter(f=>['number','currency'].includes(f.t));
  if(!repCfg.dim) repCfg.dim=(dims[0]||{}).n||'';
  if(!repCfg.measure) repCfg.measure=(meas[0]||{}).n||'';
  let rows=[]; try{ rows=await db.list(state.model,{}); }catch(e){ $('content').innerHTML=`<div class="empty">⚠ ${esc(e.message)}</div>`; return; }
  const g={};
  rows.forEach(r=>{ const k=r[repCfg.dim]==null?'—':r[repCfg.dim];
    g[k]=g[k]||{count:0,sum:0}; g[k].count++; g[k].sum+=(+r[repCfg.measure]||0); });
  const data=Object.keys(g).map(k=>({k, v: repCfg.agg==='count'?g[k].count:(repCfg.agg==='sum'?g[k].sum:g[k].sum/g[k].count)})).sort((a,b)=>b.v-a.v);
  const max=Math.max(1,...data.map(d=>d.v));
  const measFmt=(m.fields.find(f=>f.n===repCfg.measure)||{}).t==='currency' && repCfg.agg!=='count';
  $('content').innerHTML=`<div class="repcard">
    <div class="repbar">
      <span>Measure:</span>
      <select onchange="repSet('agg',this.value)"><option value="count" ${repCfg.agg==='count'?'selected':''}>Count</option>
        <option value="sum" ${repCfg.agg==='sum'?'selected':''}>Sum</option><option value="avg" ${repCfg.agg==='avg'?'selected':''}>Average</option></select>
      ${repCfg.agg!=='count'?`<select onchange="repSet('measure',this.value)">${meas.map(f=>`<option value="${f.n}" ${repCfg.measure===f.n?'selected':''}>${f.l}</option>`).join('')}</select>`:''}
      <span style="margin-left:10px">Grouped by:</span>
      <select onchange="repSet('dim',this.value)">${dims.map(f=>`<option value="${f.n}" ${repCfg.dim===f.n?'selected':''}>${f.l}</option>`).join('')}</select>
    </div>
    <table><thead><tr><th>${(m.fields.find(f=>f.n===repCfg.dim)||{}).l||''}</th><th class="num" style="width:130px">${repCfg.agg}</th><th style="width:40%"></th></tr></thead>
    <tbody>${data.map(d=>`<tr style="cursor:default"><td>${esc(d.k)}</td><td class="num">${measFmt?fmt(d.v):num(Math.round(d.v*100)/100)}</td>
      <td><div class="measure-bar" style="width:${Math.max(3,d.v/max*100)}%"></div></td></tr>`).join('')}
    </tbody></table>
    <div class="pager">${data.length} groups · ${rows.length} records</div></div>`;
}

/* MRP / Demand planning */
let mrpDemand={}, mrpManual={};
function kgf(g){ return (g/1000).toFixed(2); }
function dateMinus(d,n){ try{ const x=new Date(d+'T00:00:00'); x.setDate(x.getDate()-(n||0)); return x.toISOString().slice(0,10);}catch(e){return d;} }
async function renderMRP(){
  $('cp').innerHTML=`<div class="title">Demand / MRP <span onclick="openKB('mrp')" title="Module guide" style="cursor:pointer;color:var(--muted);font-size:14px;font-weight:400">❔</span></div>
    <button class="btn" onclick="renderMRP()">↻ Compute</button>
    <button class="btn sec" onclick="saveMRPPlan()">💾 Save plan</button>
    <button class="wfbtn" onclick="generatePOsFromMRP()">🧾 Generate Draft POs</button>
    <div class="sp"></div><span style="color:var(--muted)">demand + lead time + PAR → replenishment → PO</span>`;
  const prods=await db.list('products',{}), boms=await db.list('bom_lines',{}), ings=await db.list('ingredients',{});
  let stock={}; if(isLive()){ try{ (await db.list('stock_balance',{})).forEach(s=>{stock[s.ref_sku]=(stock[s.ref_sku]||0)+(+s.on_hand||0);});}catch(e){} }
  mrpPlanCache=await mrpPlans();
  // demand card
  let dh=`<div class="repcard">
    <div class="repbar"><span>Plan (week of)</span><input type="date" value="${MRPDATE}" onchange="MRPDATE=this.value">
      <button class="btn sm sec" onclick="mrpImport()">⬆ Import (SKU,qty)</button>
      <input type="file" id="mrpFile" accept=".csv,.txt" style="display:none" onchange="mrpFileImport(event)">
      <button class="btn sm sec" onclick="document.getElementById('mrpFile').click()">📄 Upload CSV</button>
      <button class="btn sm sec" onclick="mrpSheetSync()">☁ Sync from Google Sheets</button></div>
    <h3 style="margin:8px 0 8px">1 · Weekly demand (packs) — keyed by SKU</h3><table><thead><tr><th>Product</th><th>SKU</th><th class="num">Demand</th></tr></thead><tbody>`;
  prods.forEach(p=>{ dh+=`<tr><td>${esc(p.name)}</td><td><code>${esc(p.sku)}</code></td><td class="num"><input type="number" style="width:90px;text-align:right" value="${mrpDemand[p.sku]||''}" onchange="mrpDemand['${p.sku}']=+this.value||0;renderMRP()"></td></tr>`; });
  dh+='</tbody></table></div>';
  // ingredient need (usable g)
  const need={}; boms.forEach(b=>{ const dem=+mrpDemand[b.product_sku]||0; if(dem) need[b.ingredient_sku]=(need[b.ingredient_sku]||0)+(+b.usable_g||0)*dem; });
  // build plan lines: demand-driven, or par top-up
  const plan=[];
  ings.forEach(it=>{ if(it.is_intermediate) return;
    const usable=need[it.sku]||0; const y=(+it.yield_pct||100)/100; const rawNeed=y>0?usable/y:usable;
    const par=+it.par_g||0, lead=+it.lead_time_days||0, oh=stock[it.sku]||0;
    if(rawNeed<=0 && !(par>0)) return;
    const leadBuf=rawNeed*(lead/7);                          // consumption during lead time
    const base=rawNeed + par + leadBuf - oh;                 // target − on hand
    const manualKg=+mrpManual[it.sku]||0; const subtotal=base + manualKg*1000;
    const moq=(+it.min_order_kg||0)*1000;
    const final=subtotal<=0?0:(moq>0?Math.ceil(subtotal/moq)*moq:subtotal);
    plan.push({sku:it.sku,name:it.name,rawNeed,par,leadBuf,lead,oh,base,manualKg,moq,final,supplier:it.supplier||'',price:+it.list_price_kg||0,orderBy:dateMinus(MRPDATE,lead)});
  });
  plan.sort((a,b)=>b.final-a.final);
  window._mrpPlan=plan;
  let rh=`<div class="repcard" style="margin-top:14px"><h3 style="margin:0 0 4px">2 · Replenishment plan</h3>
    <div class="hint" style="margin:0 0 8px">Order qty = weekly need + PAR + lead-time buffer − on hand, then ± your manual adjustment, rounded up to the min order. Supplier = each item's default.</div>
    <div style="overflow-x:auto"><table><thead><tr><th>Ingredient</th><th class="num">Need</th><th class="num">+PAR</th><th class="num">+Lead</th><th class="num">−OnHand</th><th class="num">Base</th><th class="num">Manual ±kg</th><th class="num">MOQ</th><th class="num">Order</th><th>Order by</th><th>Supplier</th></tr></thead><tbody>`;
  plan.forEach((l,i)=>{ rh+=`<tr><td>${esc(l.name)}<div class="mini">yield ${(+(ings.find(x=>x.sku===l.sku)||{}).yield_pct||100)}%</div></td>
    <td class="num">${kgf(l.rawNeed)}</td><td class="num">${kgf(l.par)}</td><td class="num">${kgf(l.leadBuf)}</td><td class="num">${kgf(l.oh)}</td><td class="num">${kgf(Math.max(0,l.base))}</td>
    <td class="num"><input type="number" step="any" style="width:74px;text-align:right" value="${l.manualKg||''}" onchange="mrpManual['${l.sku}']=+this.value||0;renderMRP()"></td>
    <td class="num">${l.moq?kgf(l.moq):'—'}</td><td class="num"><b style="color:var(--berry)">${l.final>0?kgf(l.final):'—'}</b></td>
    <td>${l.lead?l.orderBy:'—'}</td><td>${esc(l.supplier)||'<span class="mini">set default</span>'}</td></tr>`; });
  if(!plan.length) rh+=`<tr><td colspan="11" class="empty">Enter demand above (and set PAR on ingredients) to build the plan.</td></tr>`;
  const toBuy=plan.filter(l=>l.final>0); const totVal=toBuy.reduce((s,l)=>s+(l.final/1000)*l.price,0);
  rh+=`</tbody></table></div><div class="pager">${toBuy.length} item(s) to order · est. ₱${Math.round(totVal).toLocaleString('en-PH')}</div>${savedPlansHtml()}</div>`;
  $('content').innerHTML=dh+rh;
}
let mrpPlanCache=[];
async function mrpPlans(){ if(isLive()){ try{ return await sb('mrp_plans?select=*&order=saved_at.desc&limit=30'); }catch(e){ return []; } } return JSON.parse(localStorage.getItem('wr_mrp_plans')||'[]'); }
function savedPlansHtml(){ const a=mrpPlanCache; if(!a.length)return''; return `<div style="margin-top:12px"><h4 style="margin:0 0 6px;font-size:12px;text-transform:uppercase;color:var(--muted)">Saved plans ${isLive()?'· Supabase':''}</h4>${a.map((p,i)=>{ const date=p.plan_date||p.date; const lines=(p.data?p.data.lines:p.lines)||[]; const n=lines.filter(l=>l.final>0).length; return `<span class="attpill">${esc(date)} · ${n} items <span class="x" onclick="loadMRPPlan(${i})" title="load">↺</span> <span class="x" onclick="delMRPPlan(${i})">✕</span></span>`; }).join('')}</div>`; }
async function saveMRPPlan(){ const data={demand:{...mrpDemand},manual:{...mrpManual},lines:(window._mrpPlan||[]).map(l=>({sku:l.sku,name:l.name,final:l.final,supplier:l.supplier,price:l.price}))};
  try{ if(isLive()){ await sb('mrp_plans',{method:'POST',prefer:'return=minimal',body:JSON.stringify({plan_date:MRPDATE,created_by:CURRENT_USER,data})}); toast('Plan saved to Supabase'); }
    else { const a=JSON.parse(localStorage.getItem('wr_mrp_plans')||'[]'); a.unshift({date:MRPDATE,by:CURRENT_USER,...data}); localStorage.setItem('wr_mrp_plans',JSON.stringify(a)); toast('Plan saved for '+MRPDATE); } }
  catch(e){ toast(e.message,true); } renderMRP(); }
function loadMRPPlan(i){ const p=mrpPlanCache[i]; if(!p)return; const d=p.data||p; MRPDATE=p.plan_date||p.date||MRPDATE; mrpDemand={...(d.demand||{})}; mrpManual={...(d.manual||{})}; renderMRP(); toast('Loaded plan'); }
async function delMRPPlan(i){ const p=mrpPlanCache[i]; if(!p)return; try{ if(isLive()&&p.id){ await sb('mrp_plans?id=eq.'+p.id,{method:'DELETE',prefer:'return=minimal'}); } else { const a=JSON.parse(localStorage.getItem('wr_mrp_plans')||'[]'); a.splice(i,1); localStorage.setItem('wr_mrp_plans',JSON.stringify(a)); } }catch(e){ toast(e.message,true); } renderMRP(); }
async function generatePOsFromMRP(){
  const lines=(window._mrpPlan||[]).filter(l=>l.final>0);
  if(!lines.length){ toast('Nothing to order — set demand first',true); return; }
  const bySup={}; lines.forEach(l=>{ const s=l.supplier||'(unassigned)'; (bySup[s]=bySup[s]||[]).push(l); });
  const refs=[]; let n=0;
  for(const sup of Object.keys(bySup)){
    const ref='WR-PO-'+String(Date.now()).slice(-5)+(n?('-'+n):''); n++;
    const rec={po_ref:ref, supplier_name:(sup==='(unassigned)'?null:sup), order_date:MRPDATE, status:'open', created_by:'MRP'};
    try{
      await db.create('purchase_orders', rec);
      const pl=bySup[sup].map(l=>({po_ref:ref, ingredient_sku:l.sku, ordered_kg:Math.round(l.final/10)/100, price_kg:l.price, received_kg:0}));
      await db.replaceChildren({model:'po_lines',fk:'po_ref'}, ref, pl);
      sysLog('purchase_orders',ref,'🤖 Auto-generated from MRP ('+MRPDATE+') by '+CURRENT_USER);
      refs.push(ref+' · '+sup+' ('+bySup[sup].length+')');
    }catch(e){ toast(e.message,true); }
  }
  toast('Created '+refs.length+' draft PO(s), grouped by default supplier');
  openModel('purchase_orders');
}

let cmdSel=0, cmdItems=[];
function ensureCmd(){ if($('cmdwrap')) return;
  const d=document.createElement('div'); d.className='cmdwrap'; d.id='cmdwrap';
  d.innerHTML=`<div class="cmd"><input id="cmdq" placeholder="Search records, jump to a module…" oninput="cmdSearch(this.value)"><div class="res" id="cmdres"></div><div class="hint"><span><kbd>↑↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></div></div>`;
  d.addEventListener('click',e=>{ if(e.target===d) closeCmd(); });
  document.body.appendChild(d);
}
function openCmd(){ ensureCmd(); $('cmdwrap').classList.add('on'); $('cmdq').value=''; cmdSearch(''); setTimeout(()=>{const q=$('cmdq'); if(q)q.focus();},30); }
function closeCmd(){ const w=$('cmdwrap'); if(w) w.classList.remove('on'); }
async function cmdSearch(q){
  q=(q||'').toLowerCase(); const items=[{icon:'🏠',label:'Dashboard',tag:'Open',act:()=>openModel('home')}];
  Object.keys(MODELS).forEach(k=>{ if(!q||MODELS[k].label.toLowerCase().includes(q)) items.push({icon:MODELS[k].icon,label:MODELS[k].label,tag:'Open',act:()=>openModel(k)}); });
  if(q.length>=1){ for(const mdl of ['ingredients','products','suppliers','purchase_orders']){ const m=MODELS[mdl];
    let rows=[]; try{ rows=await db.list(mdl,{search:q}); }catch(e){}
    rows.slice(0,6).forEach(r=>items.push({icon:m.icon,label:r[m.name],tag:m.label,act:()=>{ state.model=mdl; openForm(encodeURIComponent(r[m.pk])); }})); } }
  cmdItems=items.slice(0,30); cmdSel=0; renderCmd();
}
function renderCmd(){ const el=$('cmdres'); if(!el) return;
  el.innerHTML=cmdItems.map((it,i)=>`<div class="r ${i===cmdSel?'sel':''}" onclick="cmdRun(${i})"><span>${it.icon}</span><span>${esc(it.label)}</span><span class="tag">${it.tag}</span></div>`).join('')||'<div class="r">No results</div>'; }
function cmdRun(i){ const it=cmdItems[i]; if(it){ closeCmd(); it.act(); } }
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openCmd(); return; }
  const w=$('cmdwrap'); if(!w||!w.classList.contains('on')) return;
  if(e.key==='Escape') closeCmd();
  else if(e.key==='ArrowDown'){ e.preventDefault(); cmdSel=Math.min(cmdItems.length-1,cmdSel+1); renderCmd(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); cmdSel=Math.max(0,cmdSel-1); renderCmd(); }
  else if(e.key==='Enter') cmdRun(cmdSel);
});

async function countLoad(){

async function pivot(source,cfg){ const m=MODELS[source]; let rows=[]; try{rows=await db.list(source,{});}catch(e){}
  const g={}; rows.forEach(r=>{const k=r[cfg.dim]==null?'—':r[cfg.dim]; g[k]=g[k]||{count:0,sum:0}; g[k].count++; g[k].sum+=(+r[cfg.measure]||0);});

async function recipeCostHtml(){
  const prods=await db.list('products',{}), boms=await db.list('bom_lines',{}), ings=await db.list('ingredients',{});
  const cost=p=>{ let c=0; boms.filter(b=>b.product_sku===p.sku).forEach(b=>{ const it=ings.find(i=>i.sku===b.ingredient_sku)||{}; const y=(+it.yield_pct||100)/100; const rawg=(+b.usable_g||0)/(y||1); c+=(rawg/1000)*(+it.list_price_kg||0); }); return c; };
  let h=`<div class="repcard"><h3 style="margin:0 0 8px">Recipe cost per product</h3><table><thead><tr><th>Product</th><th class="num">Pack (g)</th><th class="num">Ingredient cost/pack</th><th class="num">Sell</th><th class="num">Margin</th></tr></thead><tbody>`;
  prods.forEach(p=>{ const c=cost(p), sell=+p.sell_price||0, mg=sell?((sell-c)/sell*100):0;
    h+=`<tr><td>${esc(p.name)}</td><td class="num">${p.pack_g}</td><td class="num">${fmt(c)}</td><td class="num">${fmt(sell)}</td><td class="num" style="color:${mg<0?'var(--danger)':'var(--ok)'}">${sell?mg.toFixed(0)+'%':'—'}</td></tr>`; });
  h+='</tbody></table><div class="hint" style="margin-top:8px">Ingredient cost only (raw ÷ yield × list price). Add labour + packaging in Production for full cost/pack.</div></div>';
  return h;
}

let MRPDATE=new Date().toISOString().slice(0,10);
function parseDemandCSV(text){ const map={}; text.split(/\r?\n/).forEach(line=>{ const p=line.split(/[,\t]/); if(p.length>=2){ const s=(p[0]||'').trim(); if(s&&s.toLowerCase()!=='sku') map[s]=+p[1]||0; } }); return map; }
function applyDemandMap(map){ Object.keys(map).forEach(sku=>{ mrpDemand[sku]=+map[sku]||0; }); renderMRP(); }
function mrpImport(){ const t=prompt('Paste demand lines — SKU,qty (one per line):'); if(!t)return; applyDemandMap(parseDemandCSV(t)); toast('Demand imported by SKU'); }
function mrpFileImport(e){ const f=e.target.files[0]; if(!f)return; const rd=new FileReader(); rd.onload=()=>{ applyDemandMap(parseDemandCSV(String(rd.result))); toast('Imported from '+f.name); }; rd.readAsText(f); }
async function mrpSheetSync(){ const a=AUTOS.sheets_demand;
  if(isLive()){ try{ const rows=await sb('demand?select=sku,qty&plan_date=eq.'+encodeURIComponent(MRPDATE)); if(!rows.length){ toast('No synced demand for '+MRPDATE+' yet — n8n writes it from your sheet',true); return; } const map={}; rows.forEach(r=>{ map[r.sku]=+r.qty||0; }); applyDemandMap(map); toast('Pulled '+rows.length+' demand rows for '+MRPDATE); }catch(e){ toast(e.message,true); } return; }
  if(!a||!a.on||!a.url){ toast('Enable Google Sheets sync in Automations first',true); return; }
  toast('Connect Supabase to pull demand synced by n8n. In demo, use Import / Upload.'); }
