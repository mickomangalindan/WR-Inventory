<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wholesome Rabbit ERP</title>
<style>
  :root{
    /* Wholesome Rabbit — natural green + warm cream + earth tones */
    --berry:#4e7a3e; --berry-d:#3c5f30; --teal:#6f9a4e; --bg:#f5f3ec; --panel:#fff;
    --ink:#2c2a24; --muted:#8c887e; --line:#e7e3d8; --line2:#f1eee5;
    --hi:#eaf0e1; --ok:#3f7d54; --warn:#c9832f; --danger:#c0524d; --link:#4e7a3e;
    --earth:#b5762a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-size:13px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  /* top bar */
  .topbar{height:46px;background:var(--berry);color:#fff;display:flex;align-items:center;gap:14px;padding:0 14px}
  .topbar .brand{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
  .topbar .crumb{opacity:.9;font-size:13px}
  .topbar .crumb b{opacity:1}
  .topbar .sp{flex:1}
  .topbar button{background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:5px;padding:6px 11px;font-size:12px;cursor:pointer}
  .topbar button:hover{background:rgba(255,255,255,.28)}
  .mode{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:700}
  .mode.demo{background:#f5e9c9;color:#7a5b12} .mode.live{background:#cdeede;color:#0d6b3f}
  /* layout */
  .app{display:flex;height:calc(100% - 46px)}
  .side{width:210px;background:#fff;border-right:1px solid var(--line);overflow-y:auto;flex-shrink:0}
  .side .mod{padding:11px 14px 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
  .side .mi{display:flex;align-items:center;gap:9px;padding:8px 14px;cursor:pointer;font-size:13px;color:#3b3b45}
  .side .mi:hover{background:var(--hi)}
  .side .mi.active{background:var(--hi);color:var(--berry);font-weight:600;box-shadow:inset 3px 0 0 var(--berry)}
  .side .mi .ic{width:18px;text-align:center}
  .main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
  /* control panel */
  .cp{background:#fff;border-bottom:1px solid var(--line);padding:9px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
  .cp .title{font-size:16px;font-weight:700;margin-right:6px}
  .cp .sp{flex:1}
  .btn{background:var(--berry);color:#fff;border:none;border-radius:5px;padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer}
  .btn:hover{background:var(--berry-d)}
  .btn.sec{background:#fff;color:#3b3b45;border:1px solid #ccc}
  .btn.sec:hover{background:#f6f6f8}
  .btn.sm{padding:4px 9px;font-size:12px}
  .btn.link{background:none;border:none;color:var(--link);padding:2px 6px;cursor:pointer;font-weight:600}
  .search{display:flex;align-items:center;border:1px solid #ccc;border-radius:5px;padding:5px 9px;gap:7px;background:#fff;min-width:220px}
  .search input{border:none;outline:none;font-size:13px;flex:1;background:none}
  .vswitch{display:flex;border:1px solid #ccc;border-radius:5px;overflow:hidden}
  .vswitch button{background:#fff;border:none;padding:6px 10px;cursor:pointer;color:#6b6b77;font-size:13px;border-right:1px solid #eee}
  .vswitch button:last-child{border-right:none}
  .vswitch button.on{background:var(--hi);color:var(--berry)}
  .drop{position:relative}
  .drop .menu{position:absolute;top:110%;left:0;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.12);min-width:190px;z-index:40;padding:5px 0;display:none}
  .drop.open .menu{display:block}
  .drop .menu div{padding:7px 13px;cursor:pointer;font-size:12.5px}
  .drop .menu div:hover{background:var(--hi)}
  .drop .menu .hd{font-size:10px;text-transform:uppercase;color:var(--muted);cursor:default;font-weight:700;letter-spacing:.05em}
  .drop .menu .hd:hover{background:none}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#eef0f6;border:1px solid #dfe2ee;border-radius:16px;padding:3px 10px;font-size:12px;color:#40506b}
  .chip b{color:var(--berry)} .chip .x{cursor:pointer;opacity:.6} .chip .x:hover{opacity:1}
  /* content */
  .content{padding:16px;flex:1}
  .listcard{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  /* ---- Sticky table headers ------------------------------------------------
     On a 200-row count sheet or reorder list you lose the column headings after
     one screen. The page itself is the scroller (.main), so a plain sticky <th>
     pins to the top of the window — no fixed height, no inner scrollbar, and
     nothing changes for short tables. Anything wrapped in .stickyhead scrolls in
     its own box instead, for tables inside a modal. */
  .listcard table thead th,
  .repcard > div[style*="overflow-x"] > table thead th,
  table.sticky thead th{position:sticky;top:0;z-index:3}
  .stickyhead{max-height:70vh;overflow:auto}
  .stickyhead thead th{position:sticky;top:0;z-index:3}
  /* the header must be opaque or rows show through it while scrolling */
  thead th{background:#fbfbfc}
  .mscroll thead th{position:sticky;top:0;z-index:3;background:#fbfbfc}
  table{width:100%;border-collapse:collapse}
  thead th{background:#fbfbfc;text-align:left;padding:9px 12px;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:#7a7a88;font-weight:700;border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td{padding:9px 12px;border-bottom:1px solid var(--line2);font-size:13px}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#fbfaff}
  td.num,th.num{text-align:right}
  .grp td{background:#f6f5f8;font-weight:700;color:var(--berry);cursor:default}
  .pager{display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:9px 14px;color:#6b6b77;font-size:12.5px}
  .pager button{background:none;border:1px solid #ccc;border-radius:4px;padding:3px 8px;cursor:pointer}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:14px}
  /* Form tags — "Processed" / "Raw" markers on ingredient pickers (Production Plan). */
  .tagf{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
        padding:1px 6px;border-radius:4px;vertical-align:1px;margin-right:5px}
  .tagf-proc{background:#dbeddb;color:#1e6b2e}
  .tagf-raw{background:#f0ece3;color:#7a6432}
  /* On-hand chips. Same two colours as the Processed / Raw tags, so a glance
     tells you WHICH stock a number is — the green one is what you already made,
     the brown one is what you can still pull from the chiller. */
  .ohchip{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:10px;
          margin-left:6px;white-space:nowrap;vertical-align:1px}
  .ohchip.proc{background:#dbeddb;color:#1e6b2e}
  .ohchip.raw{background:#f0ece3;color:#7a6432}
  .ohchip.none{background:#f3f3f1;color:#9a9a93}
  .ohchip.short{background:#f7dcd6;color:#8a2b1c}
  /* Record tables sized to their content instead of an even split — a PO's SKU
     column no longer gets the same width as a one-character flag. Each header
     carries a grip you can drag; the width is remembered per model+column. */
  table.autow{table-layout:auto;width:100%}
  table.autow th{position:relative;white-space:nowrap}
  table.autow td{white-space:normal;word-break:break-word;vertical-align:top}
  table.autow td code{white-space:nowrap}
  .colgrip{position:absolute;top:0;right:0;width:7px;height:100%;cursor:col-resize;user-select:none}
  .colgrip:hover{background:rgba(0,0,0,.12)}
  body.colresizing{cursor:col-resize;user-select:none}
  /* Production actuals: a recap line under every row that spells the arithmetic out. */
  table.pa tr.parecap td{border-top:none;padding:0 8px 9px 8px;font-size:11.5px;color:#5b5851;background:#fbfbf8}
  table.pa tr.parecap b{color:#22201c}
  .b-open{background:#eef0f6;color:#40506b}.b-received{background:#dbeddb;color:#1e6b2e}
  .b-invoiced{background:#fbe6cf;color:#8a5a12}.b-closed{background:#e5e5ea;color:#555}
  .b-partial{background:#fbe6cf;color:#8a5a12}
  .b-true{background:#dbeddb;color:#1e6b2e}.b-false{background:#f3e3e0;color:#9a3b2e}
  /* form */
  .formwrap{max-width:920px;margin:0 auto}
  /* A record whose body is a TABLE of lines — a PO, a transfer, a batch — was
     squeezed into 920px minus a 320px side column, i.e. ~580px for a six-column
     table. Ingredient names truncated to "Pork lo" and ₱/kg to "2:" while a
     third of the screen sat empty. Those records get the room instead. */
  .formwrap.wide{max-width:1480px}
  /* …but a field label + box does not get better at 700px wide, so on a wide
     record the header fields go to three columns instead of stretching. */
  .formwrap.wide .groups{grid-template-columns:repeat(3,minmax(260px,1fr))}
  @media(max-width:1200px){ .formwrap.wide .groups{grid-template-columns:1fr 1fr} }
  @media(max-width:760px){ .formwrap.wide .groups{grid-template-columns:1fr} }
  .sheet{background:#fff;border:1px solid var(--line);border-radius:8px;padding:0 0 18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .statusbar{display:flex;justify-content:flex-end;gap:0;padding:10px 16px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
  .stg{padding:5px 14px;font-size:12px;color:#8a8a99;border:1px solid var(--line);border-left:none;position:relative;background:#fff}
  .stg:first-child{border-left:1px solid var(--line);border-radius:14px 0 0 14px}
  .stg:last-child{border-radius:0 14px 14px 0}
  .stg.on{background:var(--berry);color:#fff;border-color:var(--berry)}
  .sheet .hd{padding:16px 22px 4px}
  .sheet .hd .ttl{font-size:22px;font-weight:700;border:none;outline:none;width:100%}
  .sheet .hd .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
  .groups{display:grid;grid-template-columns:1fr 1fr;gap:2px 34px;padding:14px 22px}
  @media(max-width:760px){.groups{grid-template-columns:1fr}}
  .fld{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line2)}
  .fld label{width:150px;color:#59596b;font-size:12.5px;flex-shrink:0}
  .fld .val{flex:1}
  .fld input,.fld select,.fld textarea{width:100%;border:1px solid transparent;border-radius:4px;padding:5px 7px;font-size:13px;font-family:inherit;background:none}
  .fld input:hover,.fld select:hover{border-color:var(--line)}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--teal);background:#fff;box-shadow:0 0 0 2px rgba(78,122,62,.15)}
  .notebook{margin:8px 22px 0;border-top:1px solid var(--line)}
  .nbtabs{display:flex;gap:2px;margin-top:8px}
  .nbtabs button{background:none;border:none;border-bottom:2px solid transparent;padding:8px 14px;cursor:pointer;font-weight:600;color:#6b6b77;font-size:13px}
  .nbtabs button.on{color:var(--berry);border-bottom-color:var(--berry)}
  .lines table{border:1px solid var(--line);border-radius:6px;margin-top:10px;table-layout:auto}
  .lines td{padding:4px 6px}
  /* The name / SKU column takes the slack; numeric columns keep a floor wide
     enough for a five-figure price rather than collapsing to their header. */
  .lines td:first-child,.lines th:first-child{min-width:240px;width:36%}
  .lines td.num,.lines th.num{min-width:96px}
  .lines input[type=number]{text-align:right}
  .lines input,.lines select{width:100%;border:1px solid transparent;border-radius:4px;padding:5px 6px;font-size:13px;background:none}
  .lines input:focus,.lines select:focus{outline:none;border-color:var(--teal);background:#fff}
  .lines .addrow{color:var(--link);font-weight:600;cursor:pointer;padding:7px 8px;display:inline-block}
  .formbar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;align-items:center}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block;margin-right:6px}
  /* report */
  .repcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px}
  .repbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  .repbar select{border:1px solid #ccc;border-radius:5px;padding:6px 9px;font-size:13px}
  .measure-bar{height:16px;background:linear-gradient(90deg,var(--berry),#a9c98a);border-radius:3px}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:100}
  .overlay.on{display:flex}
  /* A pop-out should show its content, not hide it behind a second scrollbar.
     The modal is the ONLY scroller; inner tables grow and the action bar sticks
     to the bottom so Confirm is always reachable without hunting for it. */
  .modal{background:#fff;border-radius:10px;padding:22px 24px;max-width:min(820px,94vw);width:auto;min-width:min(460px,92vw);max-height:92vh;overflow:auto;position:relative}
  .modal.wide{max-width:min(1240px,97vw)}
  .modal .mscroll{max-height:none !important;overflow:visible !important}
  .modal .mfoot{position:sticky;bottom:-22px;background:#fff;padding:12px 0 2px;margin-top:14px;
                border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;z-index:2}
  .modal h3{margin:0 0 4px}
  .modal p{color:var(--muted);font-size:12.5px;margin:0 0 14px}
  .modal label{display:block;font-weight:600;font-size:12.5px;margin:10px 0 4px}
  .modal input{width:100%;border:1px solid #ccc;border-radius:5px;padding:8px 10px;font-size:13px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2b2b33;color:#fff;padding:11px 18px;border-radius:8px;font-size:13px;z-index:200;opacity:0;transition:.25s;box-shadow:0 6px 20px rgba(0,0,0,.25)}
  .toast.show{opacity:1;bottom:30px}
  .toast.err{background:#8a2e28}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  a.reclink{color:var(--link);text-decoration:none;font-weight:600}
  /* dashboard */
  .dash{padding:4px}
  .kpirow{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
  .kpi .v{font-size:26px;font-weight:800;margin-top:6px;color:var(--berry)}
  .kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
  .qcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .qcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;cursor:pointer;display:flex;gap:12px;align-items:center}
  .qcard:hover{border-color:var(--berry);box-shadow:0 2px 10px rgba(78,122,62,.12)}
  .qcard .ic{font-size:24px}.qcard .t{font-weight:700}.qcard .d{font-size:12px;color:var(--muted)}
  /* kanban */
  .kb{display:flex;gap:14px;align-items:flex-start;overflow-x:auto;padding-bottom:8px}
  .kbcol{background:#eeece4;border-radius:10px;min-width:250px;max-width:290px;flex-shrink:0;padding:8px}
  .kbcol h4{margin:4px 8px 8px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#6c6a60;display:flex;justify-content:space-between}
  .kbcol h4 .c{background:#fff;border-radius:10px;padding:0 8px;font-size:11px}
  .kbcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:11px 12px;margin-bottom:8px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .kbcard:hover{box-shadow:0 3px 10px rgba(0,0,0,.1)}
  .kbcard .kt{font-weight:700;margin-bottom:3px}.kbcard .km{font-size:12px;color:var(--muted)}
  /* smart buttons + workflow */
  .wfbar{display:flex;align-items:center;gap:8px;padding:10px 16px 4px;flex-wrap:wrap}
  .wfbtn{background:var(--berry);color:#fff;border:none;border-radius:5px;padding:6px 13px;font-weight:600;font-size:12.5px;cursor:pointer}
  .wfbtn.sec{background:#fff;color:var(--berry);border:1px solid var(--berry)}
  .smart{display:flex;gap:0;border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-left:auto}
  .stile{padding:6px 14px;border-right:1px solid var(--line);text-align:center;background:#fff}
  .stile:last-child{border-right:none}.stile .v{font-weight:800;color:var(--berry);font-size:15px}.stile .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  /* form 2-col with chatter */
  .formcols{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
  @media(max-width:900px){.formcols{grid-template-columns:1fr}}
  /* Weekly count keeps its wide line table and gains the proof/notes rail beside it. */
  .formcols-count{max-width:1340px;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
  .formcols-count>.sheet,.formcols-count>.formbar{grid-column:1;min-width:0}
  .formcols-count>.sidecol{grid-column:2;grid-row:1 / span 2}
  @media(max-width:900px){.formcols-count{grid-template-columns:1fr}
    .formcols-count>.sidecol{grid-column:1;grid-row:auto}}
  .chatter{background:#fbfaf6;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
  .chatter h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .chatter .cbtns{display:flex;gap:6px;margin-bottom:8px}
  .chatter textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px;font-family:inherit;font-size:13px}
  .msg{border-top:1px solid var(--line2);padding:8px 0;font-size:12.5px}
  .msg .who{font-weight:700}.msg .tm{color:var(--muted);font-size:11px}.msg .bd{margin-top:2px}
  .msg.act{background:#fff7e8;border:1px solid #f0dfae;border-radius:6px;padding:7px 9px;margin-top:6px}
  /* command palette */
  .cmdwrap{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-start;justify-content:center;z-index:150;padding-top:12vh}
  .cmdwrap.on{display:flex}
  .cmd{background:#fff;border-radius:12px;width:92%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden}
  .cmd input{width:100%;border:none;outline:none;padding:16px 18px;font-size:16px;border-bottom:1px solid var(--line)}
  .cmd .res{max-height:52vh;overflow:auto}
  .cmd .r{padding:10px 16px;cursor:pointer;display:flex;gap:10px;align-items:center;font-size:13.5px}
  .cmd .r.sel,.cmd .r:hover{background:var(--hi)}
  .cmd .r .tag{margin-left:auto;font-size:11px;color:var(--muted);text-transform:uppercase}
  .cmd .hint{padding:8px 16px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);display:flex;gap:14px}
  kbd{background:#eee;border-radius:4px;padding:1px 5px;font-size:11px;border:1px solid #ddd}
  /* bulk / attachments */
  .bulkbar{background:#fff;border:1px solid var(--berry);border-radius:8px;padding:8px 12px;margin-bottom:10px;align-items:center;gap:10px;font-size:13px}
  .attachbox{background:#fbfaf6;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .attachbox h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .attpill{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:3px 10px;font-size:12px;margin:2px 4px 2px 0}
  .attpill a{color:var(--link);text-decoration:none} .attpill .x{cursor:pointer;color:var(--muted)}
  .msg.sys{background:#eef2ec;border:1px solid #d8e4d2;border-radius:6px;padding:6px 9px;margin-top:5px;color:#3d5f30}
  .lines th{background:#fbfbfc;font-size:10px}
  .sck{font-size:13px;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
  .b-explained{background:#fbe6cf;color:#8a5a12} .b-resolved{background:#dbeddb;color:#1e6b2e}
  .b-draft{background:#eef0f6;color:#40506b} .b-approved{background:#dbeddb;color:#1e6b2e}
  .b-undefined{background:#eef0f6;color:#40506b}


/* --- Message / Mention centre (#4) --- */
  .mbell{position:relative}
  .mbadge{position:absolute;top:-5px;right:-5px;background:#d03b3b;color:#fff;border-radius:10px;font-size:10px;font-weight:700;min-width:16px;height:16px;line-height:16px;text-align:center;padding:0 3px}
  .sidecol{display:flex;flex-direction:column;gap:12px}
  .notes{background:#fbfaf6;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .notes h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .ncompose textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:7px;font:inherit;font-size:13px;resize:vertical;box-sizing:border-box}
  .mchips{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}

/* =====================================================================
   MOBILE / TABLET — managers and approvers work from a phone.
   Desktop (>900px) is untouched: every rule below is inside a media query.
   Three moves: the sidebar becomes an off-canvas drawer, every wide table
   scrolls inside its card instead of clipping, and record lists collapse
   into label:value cards. Nothing changes what the app does.
   ===================================================================== */
.navtog{display:none;background:rgba(255,255,255,.15);color:#fff;border:none;border-radius:6px;
        font-size:17px;line-height:1;padding:6px 10px;cursor:pointer;flex-shrink:0}
.navscrim{display:none;position:fixed;inset:46px 0 0 0;background:rgba(20,24,18,.45);z-index:45}
.navscrim.on{display:block}

@media(max-width:900px){
  /* --- top bar: one line, no wrapping --- */
  .topbar{gap:8px;padding:0 8px}
  .navtog{display:block}
  .topbar .brand{font-size:13px;white-space:nowrap}
  .topbar .crumb{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
  .topbar button{padding:6px 9px}
  #userBox{max-width:38vw;overflow:hidden}
  #userBox select{max-width:96px}

  /* --- sidebar becomes an off-canvas drawer --- */
  .app{position:relative}
  .side{position:fixed;top:46px;bottom:0;left:0;width:250px;z-index:50;
        transform:translateX(-100%);transition:transform .22s ease;
        box-shadow:2px 0 14px rgba(0,0,0,.18);-webkit-overflow-scrolling:touch}
  .side.open{transform:translateX(0)}
  .side .mi{padding:11px 16px;font-size:14px}      /* thumb-sized rows */
  .main{width:100%}

  /* --- control panel: a single scrollable strip, never a tall stack --- */
  .cp{flex-wrap:nowrap;overflow-x:auto;gap:8px;padding:8px 10px;scrollbar-width:none}
  .cp::-webkit-scrollbar{display:none}
  .cp>*{flex-shrink:0}
  .cp .title{font-size:15px}
  .cp .sp{display:none}
  .search{min-width:170px}

  /* --- nothing clips: wide tables scroll inside their own card --- */
  .content{padding:10px}
  .listcard,.repcard,.sheet{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .repcard{padding:12px}
  .lines,.notebook{margin-left:0;margin-right:0}
  .lines table{min-width:640px}

  /* --- forms: label above value, full-width inputs --- */
  .formwrap{max-width:100%}
  .groups{padding:12px 14px;gap:2px}
  .fld{flex-direction:column;align-items:stretch;gap:3px}
  .fld label{width:auto;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
  .fld .val input,.fld .val select,.fld .val textarea{width:100%}
  .sheet .hd{padding-left:14px;padding-right:14px}
  .formbar{flex-wrap:nowrap;overflow-x:auto;padding:9px 10px;gap:8px;scrollbar-width:none}
  .formbar::-webkit-scrollbar{display:none}
  .formbar>*{flex-shrink:0}

  /* --- modals fill the screen --- */
  .modal, .modal.wide{width:100%;max-width:100%;min-width:0;max-height:92vh;border-radius:12px 12px 0 0;padding:14px}
  .modal .mfoot{bottom:-14px}
  #overlay{align-items:flex-end}

  /* --- touch targets --- */
  .btn,.btn.sec{padding:9px 14px;font-size:13px}
  .btn.sm{padding:7px 11px}
  input,select,textarea{font-size:16px}   /* 16px stops iOS zooming on focus */
  tbody td{padding:11px 12px}
}

@media(max-width:700px){
  /* --- record lists become cards: each row is a stack of label : value --- */
  .listcard table.mcards{min-width:0}
  .listcard table.mcards thead{display:none}
  .listcard table.mcards,.listcard table.mcards tbody,.listcard table.mcards tr{display:block;width:100%}
  .listcard table.mcards tr{background:#fff;border:1px solid var(--line);border-radius:10px;
      margin:0 0 8px;padding:4px 12px 8px}
  .listcard table.mcards tr.grp{background:#f6f5f8;border-color:#e6e2ee;padding:8px 12px;margin-top:12px}
  .listcard table.mcards tr.grp td{padding:0;border:none}
  .listcard table.mcards td{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
      padding:5px 0;border:none;border-bottom:1px dashed var(--line2);text-align:left}
  .listcard table.mcards td:last-child{border-bottom:none}
  .listcard table.mcards td.num{text-align:left}
  .listcard table.mcards td[data-l]::before{content:attr(data-l);color:var(--muted);font-size:11px;
      text-transform:uppercase;letter-spacing:.04em;font-weight:700;flex-shrink:0}
  /* the first data column is the card's title — no label, no indent */
  .listcard table.mcards td.mtitle{font-weight:700;font-size:14.5px;padding:8px 0 6px !important;
      display:block;border-bottom:1px solid var(--line2)}
  .listcard table.mcards td.mtitle::before{display:none}
  /* bulk-select checkbox floats top-right of the card instead of taking a whole row */
  .listcard table.mcards tr{position:relative}
  .listcard table.mcards td.bcb{position:absolute;top:8px;right:10px;padding:0;border:none;display:block}
  .listcard table.mcards td.bcb+td.mtitle{padding-right:30px !important}
  /* group headers stay one line: title plus whatever subtotals exist */
  .listcard table.mcards tr.grp{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
  .listcard table.mcards tr.grp td{display:inline;border:none;padding:0;font-size:13px}
  .listcard table.mcards tr.grp td::before{display:none}
  .listcard table.mcards tr.grp td.mtitle{font-size:13.5px;border:none;padding:0 !important;display:inline}
  .listcard table.mcards tfoot tr{display:flex;flex-wrap:wrap;gap:4px 12px;background:#faf9f4}
  .listcard table.mcards tfoot td{display:inline;border:none;padding:0}
  .listcard table.mcards tfoot td::before{display:none}
  .listcard .pager{justify-content:space-between;padding:8px 4px}
  .kpirow{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:12px 13px}.kpi .v{font-size:21px}
  .wrdash .k6{grid-template-columns:1fr 1fr}
}
/* =====================================================================
   PRINT — everything sticky or scrollable becomes ordinary paper.
   A sticky header would print once, pinned, over the first rows; an inner
   scroll box would print only what happens to be scrolled into it; a folded
   <details> would print as a closed triangle. All three are undone here, and
   the table header is set to repeat at the top of every page instead.
   ===================================================================== */
@media print{
  thead th{position:static !important}
  thead{display:table-header-group}
  tfoot{display:table-row-group}
  tr{break-inside:avoid;page-break-inside:avoid}
  .stickyhead,.mscroll,.listcard,.repcard{max-height:none !important;overflow:visible !important}
  details{display:block !important}
  details>summary{display:none !important}
  details>*{display:block !important}
}

@media(max-width:430px){
  .topbar .bfull{display:none}          /* 🐇 ERP only */
  /* keep KPIs two-up so a phone shows the whole scorecard in one screen */
  .kpi .v{font-size:19px}
  .wrdash .kpi .v{font-size:19px}
  .wrdash .card{padding:12px 13px}
}

/* Coarse pointers (touch) get bigger hit areas even on wide tablets. */
@media(pointer:coarse){
  .side .mi{min-height:42px}
  .btn,.vswitch button,.pager button{min-height:38px}
  .attpill .x,.chip .x{padding:4px}
}

async function sb(path, opts={}){
  const bearer = (SUPA.token||SUPA.key);   // signed-in user's token when available, else anon key
  const r = await fetch(SUPA.url.replace(/\/$/,'')+'/rest/v1/'+path, {

      'Content-Type':'application/json', Prefer: opts.prefer||'return=representation', ...(opts.headers||{}) }});
  if(!r.ok){ const t=await r.text();
    if(r.status===401 && REQUIRE_AUTH && SUPA && SUPA.token){ delete SUPA.token; delete SUPA.role; localStorage.setItem('wr_supa',JSON.stringify(SUPA)); updateMode(); showGate('Your session expired — please sign in again.'); }
    throw new Error(r.status+' '+t.slice(0,180)); }
  const txt = await r.text(); return txt? JSON.parse(txt):[];
}

/* ---- Column masking (wr_column_masking.sql) ----
   That migration REVOKEs select on the cost/price columns of ingredients & products from
   `authenticated` and `anon`, and exposes them through role-gated *_secure views. Postgres
   denies `SELECT *` when ANY referenced column is revoked, so once it is applied every read
   of the base table fails — for Admin too, because the app's roles only exist inside wr_role().
   Routing it here, in the db layer, covers all ~44 call sites at once instead of one by one.
   Writes are unaffected by the revoke (it is SELECT-only) EXCEPT that PostgREST's default
   `return=representation` needs SELECT on the returned columns — so masked writes switch to
   `return=minimal` and echo back the record we sent. */
const MASKED_TABLES=['ingredients','products'];
async function _readRel(T){ return (MASKED_TABLES.includes(T) && await useSecure()) ? T+'_secure' : T; }
async function _maskedWrite(T){ return MASKED_TABLES.includes(T) && await useSecure(); }
/* Which columns a text search actually looks at. Before this, EVERY search — the
   list box and ⌘K alike — matched one column, the model's `name`. So typing a SKU
   into Ingredients found nothing, a supplier's name never found their POs, and a
   customer's name never found their custom order. Declare the columns per model
   and both paths widen at once. */
function searchCols(model){ const m=MODELS[model]||{}; return (m.searchOn&&m.searchOn.length)?m.searchOn:(m.name?[m.name]:[]); }
// PostgREST's or=() is comma/paren-delimited, so strip those from the term.
function _sanitizeTerm(s){ return String(s==null?'':s).replace(/[(),"']/g,' ').replace(/\s+/g,' ').trim(); }
/* Every word must appear somewhere in the row — so "beef kidney" finds the one
   item, not everything with "beef" in it. */
function _localSearch(rows, cols, term){
  const words=String(term||'').toLowerCase().split(/\s+/).filter(Boolean); if(!words.length) return rows;
  return (rows||[]).filter(r=>{ const t=cols.map(c=>r[c]).filter(v=>v!=null&&v!=='').join(' ').toLowerCase();
    return words.every(w=>t.includes(w)); });
}
const db = {
  async list(model, {search,groupBy,page,per}={}){
    const m=MODELS[model]||{};   // child models (bom_lines, po_lines) have no top-level entry
    const T=m.srcTable||model;   // a model may read/write a shared physical table (e.g. supplies → ingredients)
    const cols=searchCols(model), term=_sanitizeTerm(search);
    if(isLive()){
      const lim='&limit='+(per||1000);
      let filt='';
      // Two or more words is an AND across columns ("beef kidney"), which ilike
      // cannot express — read the table and match in the browser instead.
      if(term && cols.length && term.split(' ').length>1){
        return _localSearch(await sb((await _readRel(T))+'?select=*'+lim), cols, term);
      }
      if(term && cols.length){
        filt = cols.length===1
          ? '&'+cols[0]+'=ilike.*'+encodeURIComponent(term)+'*'
          : '&or=('+cols.map(c=>c+'.ilike.*'+encodeURIComponent(term)+'*').join(',')+')';
      }
      const rel=await _readRel(T);
      try{ return await sb(rel+'?select=*'+filt+lim); }
      catch(e){
        // A declared column may not exist on this database yet (older schema, or a
        // masked view that drops it). Rather than showing "no results", fall back
        // to the name column, then to an unfiltered read filtered in the browser.
        if(!filt) throw e;
        try{
          if(m.name) return await sb(rel+'?select=*&'+m.name+'=ilike.*'+encodeURIComponent(term)+'*'+lim);
        }catch(e2){}
        const rows=await sb(rel+'?select=*'+lim);
        return _localSearch(rows, cols, term);
      }
    } else {
      let rows=[...(DEMO[T]||[])];
      if(term && cols.length) rows=_localSearch(rows, cols, term);
      return rows;
    }
  },
  async children(o2m, parentVal){
    if(isLive()) return await sb(o2m.model+'?select=*&'+o2m.fk+'=eq.'+encodeURIComponent(parentVal));
    return (DEMO[o2m.model]||[]).filter(r=>r[o2m.fk]===parentVal);
  },
  async create(model, rec){
    const T=(MODELS[model]&&MODELS[model].srcTable)||model;
    if(isLive()){
      if(await _maskedWrite(T)){ await sb(T,{method:'POST',prefer:'return=minimal',body:JSON.stringify(rec)}); return {...rec}; }
      return (await sb(T, {method:'POST', body:JSON.stringify(rec)}))[0];
    }
    DEMO[T]=DEMO[T]||[]; rec.id=rec.id||('loc'+Date.now()+Math.floor(Math.random()*999)); DEMO[T].push(rec); return rec;
  },
  async update(model, pk, pkval, rec){
    const T=(MODELS[model]&&MODELS[model].srcTable)||model;
    if(isLive()){
      if(await _maskedWrite(T)){ await sb(T+'?'+pk+'=eq.'+encodeURIComponent(pkval),{method:'PATCH',prefer:'return=minimal',body:JSON.stringify(rec)}); return {...rec}; }
      return (await sb(T+'?'+pk+'=eq.'+encodeURIComponent(pkval), {method:'PATCH', body:JSON.stringify(rec)}))[0];
    }
    const arr=DEMO[T]=DEMO[T]||[]; const i=arr.findIndex(r=>r[pk]===pkval); if(i>=0){arr[i]={...arr[i],...rec}; return arr[i];} return rec;
  },
  async del(model, pk, pkval){
    const T=(MODELS[model]&&MODELS[model].srcTable)||model;
    if(isLive()) return await sb(T+'?'+pk+'=eq.'+encodeURIComponent(pkval), {method:'DELETE', prefer:'return=minimal'});
    DEMO[T]=(DEMO[T]||[]).filter(r=>r[pk]!==pkval);
  },
  async replaceChildren(o2m, parentVal, rows){
    if(isLive()){
      await sb(o2m.model+'?'+o2m.fk+'=eq.'+encodeURIComponent(parentVal),{method:'DELETE',prefer:'return=minimal'});
      if(rows.length) await sb(o2m.model,{method:'POST',body:JSON.stringify(rows),prefer:'return=minimal'});
    } else {
      DEMO[o2m.model]=(DEMO[o2m.model]||[]).filter(r=>r[o2m.fk]!==parentVal).concat(rows);
    }
  }
};

// ---- Canonical warehouse ordering (WR_Sort_Order_Setup / products.sort_order) ----
// Groups (families/categories) come in this order across every view; items sort by their sort_order.
const GROUP_ORDER=['Wholesome Mix','BARF Mix','PMR Mix','Meatballs — Wholesome Mix','Meatballs — Single Protein','Single Protein','Bone Broth','Dog Chew','Organs','Fish',"Goat's Milk",
  'Muscle Meat','Muscle meat','Organ Meat','Muscle organ','Secreting organ','Other secreting organs','Liver','Raw meaty bones','Whole dressed','Bone','Vegetables','Fruit','Seeds','Supplement','Source materials','Supplies','Kitchen Supplies'];
function _grank(n){ const i=GROUP_ORDER.indexOf(String(n||'').replace(/^[^0-9A-Za-z]+/,'').trim()); return i<0?900:i; }
function cmpGroupKeys(a,b){ return _grank(a)-_grank(b) || String(a).localeCompare(String(b)); }
function _so(r){ const v=+(r&&r.sort_order); return (isFinite(v)&&v>0)?v:999999; }
function cmpItems(a,b){ return _so(a)-_so(b) || String(a.name||a.variant||a.sku||a.ref_sku||'').localeCompare(String(b.name||b.variant||b.sku||b.ref_sku||'')); }
// 3-level hierarchy: Group (group_1) → Subgroup (group_2) → Item (sort_order). Groups ordered by their first item.
const HIER={ products:{g1:'group_1', g2:'group_2'}, ingredients:{g1:'ingredient_group'} };
function hierGroups(rows,H){
  const gmin=list=>Math.min(...list.map(_so));
  const byG1={}; rows.forEach(r=>{ const k=(r[H.g1]||'Other'); (byG1[k]=byG1[k]||[]).push(r); });
  return Object.keys(byG1).sort((a,b)=>gmin(byG1[a])-gmin(byG1[b])||String(a).localeCompare(b)).map(g1=>{
    // 2-level (no g2): one flat item list per group, kept in master (sort_order) order.
    if(!H.g2){ return {g1, subs:[{g2:null, items:byG1[g1].slice().sort(cmpItems)}], all:byG1[g1]}; }
    const byG2={}; byG1[g1].forEach(r=>{ const k=(r[H.g2]||'Other'); (byG2[k]=byG2[k]||[]).push(r); });
    const subs=Object.keys(byG2).sort((a,b)=>gmin(byG2[a])-gmin(byG2[b])||String(a).localeCompare(b)).map(g2=>({g2, items:byG2[g2].slice().sort(cmpItems)}));
    return {g1, subs, all:byG1[g1]};
  });
}

async function _tagSupplierTypes(supRows){
  let ings=[]; try{ ings=await db.list('ingredients',{}); }catch(e){}
  const byName={};
  ings.forEach(i=>{ const cat=(String(i.category||'').trim())||'Other';
    [i.supplier,i.supplier1,i.supplier2].forEach(s=>{ s=String(s||'').trim(); if(!s) return; (byName[s]=byName[s]||{}); byName[s][cat]=(byName[s][cat]||0)+1; }); });
  supRows.forEach(r=>{ const nm=String(r.name||'').trim(); const cnts=byName[nm];
    if(!cnts){ r.sells_type='— unassigned'; return; }
    const keys=Object.keys(cnts).sort((a,b)=>cnts[b]-cnts[a]); r.sells_type=keys[0]; });

/* ---- URL hash routing: deep links to any module/record + browser back/forward ---- */
let _hashLock=false;
function setHash(h){ if(location.hash===h) return; _hashLock=true; location.hash=h; setTimeout(()=>{_hashLock=false;},0); }
function syncHash(){ let h='#/'+(state.model||'home');
  if(state.view==='form'){ const m=MODELS[state.model];
    if(formIsNew) h+='/new';
    else if(m){ const pk=formRec&&formRec[m.pk]; if(pk!=null&&pk!=='') h+='/'+encodeURIComponent(pk); } }
  setHash(h); }
async function onHashRoute(){ if(_hashLock) return;
  const raw=(location.hash||'').replace(/^#\/?/,'');
  if(!raw){ if(state.model!=='home') openModel('home'); return; }
  const slash=raw.indexOf('/'); const model=slash<0?raw:raw.slice(0,slash); const seg=slash<0?'':raw.slice(slash+1);
  if(model==='home'){ if(state.model!=='home'||state.view!=='home') openModel('home'); return; }
  if(!MODELS[model]) return;
  if(seg){ if(state.model!==model){ state.model=model; renderSide(); } if(seg==='new') openForm(null); else openForm(seg); }
  else { if(state.model!==model||state.view==='form') openModel(model); }
}
function bootRoute(){ if((location.hash||'').replace(/^#\/?/,'')) onHashRoute(); else openModel('home'); }

/* ---- Advanced search & filters (products / ingredients) ---- */
const FILTERS={
  products:[ {k:'group_1',l:'Group'},{k:'group_2',l:'Subgroup'},{k:'feeding_style',l:'Feeding style'},{k:'variant',l:'Variant'} ],
  ingredients:[ {k:'_type',l:'Type'},{k:'ingredient_group',l:'Group'},{k:'category',l:'Category'},{k:'supplier',l:'Supplier'} ]
};
function ingType(r){ if(isSupplyItem(r)) return /sticker|label/i.test(String(r.category||'')+' '+String(r.name||''))?'Sticker':'Supply'; return r.is_intermediate?'Processed':'Raw'; }
function _rowFacet(model,r,k){ if(k==='_type') return ingType(r); return r[k]; }
function _searchText(model,r){ const parts= model==='products'? [r.name,r.sku,r.group_1,r.group_2,r.feeding_style,r.variant,r.barcode] : [r.name,r.sku,r.category,r.ingredient_group,r.raw_input,r.supplier,r.supplier1,r.supplier2]; return parts.filter(Boolean).join(' ').toLowerCase(); }
function applyAdvFilter(model,rows){
  const terms=(state.search||'').toLowerCase().split(/\s+/).filter(Boolean);
  const f=state.filters||{};
  return rows.filter(r=>{
    const t=_searchText(model,r);
    if(terms.length && !terms.every(w=>t.includes(w))) return false;
    for(const key of Object.keys(f)){ const vals=f[key]; if(vals&&vals.length){ const rv=_rowFacet(model,r,key); if(!vals.includes(String(rv==null?'':rv))) return false; } }
    return true;
  });
}
function _advCount(){ const f=state.filters||{}; return Object.keys(f).reduce((s,k)=>s+((f[k]||[]).length),0); }
async function openFilters(){
  const model=state.model; const cfg=FILTERS[model]||[];

  const visible = model==='ingredients' ? rows.filter(r=>!isSupplyItem(r)) : rows;
  const facets=cfg.map(c=>{ const set=new Map(); visible.forEach(r=>{ const v=_rowFacet(model,r,c.k); if(v!=null&&String(v).trim()!==''){ const key=String(v); set.set(key,(set.get(key)||0)+1); } }); return {...c, values:[...set.entries()].sort((a,b)=>a[0].localeCompare(b[0]))}; }).filter(fc=>fc.values.length>=2);

      return `<label style="display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border:1px solid ${on?'var(--brand,#4e7a3e)':'var(--line)'};background:${on?'#eaf3ea':'#fff'};border-radius:14px;font-size:12px;cursor:pointer">
        <input type="checkbox" class="advcb" data-k="${esc(fc.k)}" value="${esc(v)}" ${on?'checked':''} style="margin:0"> ${esc(v)} <span style="color:var(--muted)">${n}</span></label>`; }).join('')}</div></div>`).join('')
    : '<div class="mini" style="color:var(--muted)">No filterable facets for this list.</div>';
  $('modal').innerHTML=`<div style="min-width:340px;max-width:560px"><h3>🎛 Filter ${esc((MODELS[model]||{}).label||model)}</h3>
    <p class="mini">Type one or more keywords (all must match: name, SKU, group, supplier…) and tick any facets to narrow the list.</p>
    <div class="fld"><label>Keywords</label><div class="val"><input id="advq" value="${esc(state.search||'')}" placeholder="e.g. chicken raw" style="width:100%" onkeydown="if(event.key==='Enter')applyFilters()"></div></div>

  $('overlay').classList.add('on');
}

async function renderList(){
  controlPanel();
  const m=MODELS[state.model];
  $('content').innerHTML='<div class="empty">Loading…</div>';
  let rows;
  try{
    if(state.model==='ingredients'||state.model==='products'){
      rows=await listForModel(state.model);   // fetch all — advanced multi-keyword search + facet filters run client-side
      rows=applyAdvFilter(state.model, rows);
    } else { rows=await db.list(state.model,{search:state.search}); }
  }
  catch(e){ $('content').innerHTML=`<div class="empty">⚠ ${esc(e.message)}<br><br>Check your Supabase connection / RLS.</div>`; return; }
  let archivedCount=0;
  if(m.archivable && !state.showArchived){ archivedCount=rows.filter(r=>r.active===false).length; rows=rows.filter(r=>r.active!==false); }
  /* Purchase Orders open on LIVE business only. A cancelled order is dead and a
     fully received one is history — keeping both in the default view buried the
     handful of orders that still need doing. One click brings them back. */
  let poHidden=0;
  if(state.model==='purchase_orders' && !state._poAll){
    poHidden=rows.filter(r=>PO_DONE.includes(String(r.status||''))).length;
    rows=rows.filter(r=>!PO_DONE.includes(String(r.status||'')));
  }
  // Ingredients hides kitchen supplies; the Supplies module shows only them (same table).
  if(state.model==='ingredients') rows=rows.filter(r=>!isSupplyItem(r));
  else if(m.supplyModel) rows=rows.filter(isSupplyItem);
  // Suppliers: tag each with the ingredient type it mainly sells, so they can be grouped by it.
  if(state.model==='suppliers'){ try{ await _tagSupplierTypes(rows); }catch(e){} }
  if(['products','ingredients','supplies'].includes(state.model)) rows.sort(cmpItems);   // warehouse ordering
  state._rows=rows; const bulk=!m.readonly;
  const cols=m.list.map(n=>m.fields.find(f=>f.n===n)).filter(f=>f && fieldMode(state.model,f.n)!=='hide');
  /* Production: a batch's SKU is a product on a product batch and an INGREDIENT
     on an output batch, so neither master alone can name every row. */
  if(state.model==='production_batches'){
    try{ const nm={};
      (await db.list('products',{})).forEach(p=>nm[p.sku]=p.name||p.sku);
      (await listIngredients()).forEach(i=>nm[i.sku]=i.name||i.sku);
      rows.forEach(r=>{ r._item=nm[r.product_sku]||r.product_sku; if(!r.kind) r.kind='product'; });
    }catch(e){ rows.forEach(r=>{ r._item=r.product_sku; }); }
  }
  // Purchase Orders: append Total kg + Est. value columns, summed from each PO's lines.
  if(state.model==='purchase_orders'){
    try{ const pls=await db.list('po_lines',{}); let ings=[]; try{ings=await listIngredients();}catch(e){}
      const ip={}; ings.forEach(i=>ip[i.sku]=(+i.moving_avg_cost_kg||+i.list_price_kg||0));   // ingredients + supplies historical price
      const stkCost=_supplyCosts(ings).sticker;                                               // per-sticker cost (Supplies / cost model)
      const stkPO=new Set(rows.filter(r=>_isStickerPO(r)).map(r=>r.po_ref));
      const agg={};
      pls.forEach(l=>{ const a=agg[l.po_ref]=agg[l.po_ref]||{q:0,v:0}; const q=poOrderQty(l); let pr=(+l.price_kg||0)||ip[l.ingredient_sku]||0; if(!pr && stkPO.has(l.po_ref)) pr=stkCost; a.q+=q; a.v+=q*pr; });
      rows.forEach(r=>{ const a=agg[r.po_ref]||{q:0,v:0}; r._total_qty=Math.round(a.q*100)/100; r._total_val=Math.round(a.v*100)/100; });
      cols.push({n:'_total_qty',l:'Total kg',t:'number'},{n:'_total_val',l:'Est. value',t:'currency'});
    }catch(e){}
  }
  const bcb=r=>`<td class="bcb" onclick="event.stopPropagation()"><input type="checkbox" class="selcb" ${(state.sel||[]).includes(String(r[m.pk]))?'checked':''} onclick="toggleSel('${encodeURIComponent(r[m.pk])}',this.checked)"></td>`;
  const cell=(f,r,ci)=>{
    let v=r[f.n];
    // ≤700px card layout: data-l is the row label, .mtitle is the card heading
    const L=` data-l="${esc(f.l)}"${ci===0?' class="mtitle"':''}`;
    if(f.t==='formula'){ const val=evalF(f.expr,r); return `<td class="num"${L}>${isNaN(+val)?esc(val):num(Math.round(+val*100)/100)}</td>`; }
    if(f.t==='currency') return `<td class="num"${L}>${fmt(v)}</td>`;
    if(f.t==='number') return `<td class="num"${L}>${v==null?'':num(v)}</td>`;
    if(f.t==='bool') return `<td style="text-align:center"${L}>${v?'<span title="Yes" style="color:#2f7d33;font-weight:800">✓</span>':'<span title="No" style="color:#cbcbcb">–</span>'}</td>`;
    if(f.n==='status') return `<td${L}><span class="badge b-${v}">${esc(statusLabel(state.model,v))}</span></td>`;
    return `<td${L}>${esc(v)}</td>`;
  };
  const numCols=cols.filter(f=>['currency','number'].includes(f.t));
  const sumOf=(arr,f)=>arr.reduce((s,r)=>s+(+r[f.n]||0),0);
  const sumCell=(f,v)=>f.t==='currency'?`<td class="num"><b>${fmt(v)}</b></td>`:`<td class="num"><b>${num(Math.round(v*100)/100)}</b></td>`;
  let body='';
  if(state.model==='purchase_orders' && state._poWS!==false){
    // Two-level grouping (DEFAULT for POs): Week reference (order date) → Status
    const gw={}; rows.forEach(r=>{ const k=weekOf(r.order_date||'—'); (gw[k]=gw[k]||[]).push(r); });

      const gs={}; wr.forEach(r=>{ const s=r.status==null?'—':r.status; (gs[s]=gs[s]||[]).push(r); });

let formRec={}, formChildren=[], formIsNew=false, relCache={}, formTab=0;
async function relOptions(model){
  if(relCache[model]) return relCache[model];
  const m=MODELS[model]; let rows=await db.list(model,{});
  if(m.archivable) rows=rows.filter(r=>r.active!==false);   // don't offer archived records in pickers
  // `t` keeps the "Name (SKU)" form for places that show one line; `n` is the plain
  // name, for line tables that already print the SKU underneath — showing the code
  // twice on the same row is noise, not information.
  let list=rows.map(r=>({v:r[m.pk], n:String(r[m.name]==null?r[m.pk]:r[m.name]), t:r[m.name]+(r[m.pk]!==r[m.name]?` (${r[m.pk]})`:''), g1:r.group_1, g2:r.group_2, cat:r.category, rg:r.ingredient_group, so:_so(r), _gr:0}));
  // Products & ingredients get ordered + group tags so line pickers can show grouped optgroups.
  if(model==='products'){ list.sort((a,b)=>a.so-b.so||String(a.t).localeCompare(b.t)); list.forEach(o=>{ o.g1=o.g1||'Products'; o.g2=o.g2||'Other'; }); }
  else if(model==='ingredients'){
    // Group ingredients the way the count sheet does — category › base material —
    // instead of one flat "Ingredients" bucket with no subgroup at all.
    const ctxRows=_outIngRows(rows, rows); const cl={};
    ctxRows.forEach(x=>{ cl[x.sku]={g1:x._g1, g2:x._g2, nm:x._nm, gr:x._grank}; });
    list.forEach(o=>{ const c=cl[o.v]||{}; o.g1=c.g1||o.rg||o.cat||'Ingredients'; o.g2=c.g2||null; o.n=c.nm||o.n; o._gr=c.gr||0; });
    list.sort((a,b)=>(a._gr-b._gr)||a.so-b.so||String(a.n).localeCompare(b.n));
  }
  relCache[model]=list;
  return list;
}
// Build <option>/<optgroup> markup — grouped (Group › Subgroup) when the options carry group tags.
function relOptsHTML(opts,v,plain){
  const lbl=o=>plain?(o.n||o.t):o.t;
  if(!opts.some(o=>o.g1)) return opts.map(o=>`<option value="${esc(o.v)}" ${v===o.v?'selected':''}>${esc(lbl(o))}</option>`).join('');
  const byG1={}; opts.forEach(o=>{ const k=o.g1||o.cat||'Other'; (byG1[k]=byG1[k]||[]).push(o); });
  let h='';
  // Groups in the master's own reading order, not whatever order the rows arrived in.
  const gkeys=Object.keys(byG1).sort((x,y)=>{
    const rx=Math.min(...byG1[x].map(o=>o._gr||o.so||0)), ry=Math.min(...byG1[y].map(o=>o._gr||o.so||0));
    return (rx-ry)||x.localeCompare(y); });
  gkeys.forEach(g1=>{
    const byG2={}; byG1[g1].forEach(o=>{ const k=o.g2||''; (byG2[k]=byG2[k]||[]).push(o); });
    Object.keys(byG2).sort((x,y)=>{
      const rx=Math.min(...byG2[x].map(o=>o._gr||o.so||0)), ry=Math.min(...byG2[y].map(o=>o._gr||o.so||0));
      return (rx-ry)||x.localeCompare(y); }).forEach(g2=>{ const lb=g2?(g1+' › '+g2):g1;
      h+=`<optgroup label="${esc(lb)}">`+byG2[g2].map(o=>`<option value="${esc(o.v)}" ${v===o.v?'selected':''}>${esc(lbl(o))}</option>`).join('')+`</optgroup>`; });
  });
  return h;
}
async function openForm(idEnc){

  if(m.customForm==='count') return renderCountForm(idEnc);

  if(idEnc){ const pkval=decodeURIComponent(idEnc);
    const rows=await listForModel(state.model); formRec={...(rows.find(r=>String(r[m.pk])===pkval)||{})};
  } else { formRec={}; if(m.supplyModel) formRec.is_supply=true; if(m.status) formRec[m.status.f]=m.status.stages[0]; if(m.fields.find(f=>f.n==='order_date')) formRec.order_date=todayISO(); if(m.fields.find(f=>f.n==='transfer_date')) formRec.transfer_date=todayISO();

    try{ const nm={};
      (await db.list('products',{})).forEach(p=>nm[p.sku]=p.name||p.sku);

  if(m.o2m) for(const c of m.o2m.cols) if(c.t==='rel') await relOptions(c.rel);

  renderForm(); syncHash();
}

    if(c.t==='number'){ const sc=+c.scale||1; const disp=(v===''||v==null)?'':(sc!==1?(Math.round((+v/sc)*1e6)/1e6):v);
      return `<td class="num"><input type="number" step="any" value="${esc(disp)}" oninput="lSetNum(${i},'${c.n}',this.value,${sc})" ${ro} ${ro?'title="From the recipe" style="background:#f4f5f8;color:#8a93a5"':''}></td>`; }
    return `<td><input value="${esc(v)}" oninput="lSet(${i},'${c.n}',this.value)" ${ro}></td>`;

function trSetBoxLoose(i,boxV,looseV){ const l=formChildren[i]; const box=((window._prodLineMap||{})[l.product_sku]||{}).box||1;
  if(boxV!=null) l._sbx=(boxV===''?'':(+boxV||0)); if(looseV!=null) l._slo=(looseV===''?'':(+looseV||0));
  if((l._sbx===''||l._sbx==null)&&(l._slo===''||l._slo==null)){ l.sent_packs=''; } else { l.sent_packs=(+l._sbx||0)*box+(+l._slo||0); } }

const AUTO_REF={ purchase_orders:async()=>{ const dd=_mmddyyyy(); return 'PO-'+dd+' V'+_p2(await nextSeq('PO-'+dd))+'.01'; },
                 transfers:async()=>(await genRef('DR',{})).ref };
async function saveForm(){
  const m=MODELS[state.model]; let pkval=formRec[m.pk];
  // assign the document reference now (at save), not on form-open → no burned numbers on discard
  if(formIsNew && !pkval && AUTO_REF[state.model]){ try{ pkval=await AUTO_REF[state.model](); formRec[m.pk]=pkval; }catch(e){ toast(e.message,true); return; } }
  if(!pkval){ toast('Enter '+ (m.fields.find(f=>f.n===m.pk)||{}).l, true); return; }
  // optimistic lock: if someone else changed this record since it was opened, don't silently overwrite
  if(!formIsNew && isLive() && formRec.updated_at){ try{
      const cur=await sb(state.model+'?select=updated_at&'+m.pk+'=eq.'+encodeURIComponent(pkval)+'&limit=1');
      if(cur&&cur[0]&&cur[0].updated_at&&cur[0].updated_at!==formRec.updated_at){ toast('This record was changed by someone else since you opened it. Reload and re-apply your edit.',true); return; }
    }catch(e){} }
  try{
    // validate numeric fields: no NaN, no negatives (quantities/prices/counts are never < 0)
    const badNum=[];
    m.fields.forEach(f=>{ if(f.t!=='number'&&f.t!=='currency')return; const v=formRec[f.n]; if(v===''||v==null)return;
      const num=+v; if(!isFinite(num)){ badNum.push(f.l+' (not a number)'); } else if(num<0){ badNum.push(f.l+' (cannot be negative)'); } });
    if(badNum.length){ toast('Fix these fields: '+badNum.join('; '),true); return; }
    const rec={}; m.fields.forEach(f=>{ if(f.t==='formula')return; let v=formRec[f.n]; if((f.t==='number'||f.t==='currency')&&v!==''&&v!=null)v=+v; if(v!==undefined)rec[f.n]=v; });
    const uf=['created_by','counted_by','operator'].find(x=>m.fields.some(f=>f.n===x));
    if(formIsNew && uf && !rec[uf]) rec[uf]=CURRENT_USER;
    if(formIsNew) await db.create(state.model, rec);
    else await db.update(state.model, m.pk, pkval, rec);
    if(m.o2m){
      const clean=formChildren.filter(l=>Object.values(l).some(x=>x!=='' && x!=null)).map(l=>{
        const row={...l, [m.o2m.fk]:pkval}; delete row.id;   // id is a generated identity — never re-insert it (live save would 400)
        m.o2m.cols.forEach(c=>{if(c.t==='number'&&row[c.n]!=='')row[c.n]=+row[c.n];}); return row;});
      await db.replaceChildren(m.o2m, pkval, clean);
    }
    sysLog(state.model, pkval, formIsNew?('📝 Created by '+CURRENT_USER):('✏️ Updated by '+CURRENT_USER));
    toast('Saved '+pkval); relCache={}; state.view='list'; route();
  }catch(e){ toast(saveErrMsg(e), true); console.error('Save failed:', e); }
}
// Turn a raw PostgREST/Supabase error into something a non-technical user can act on.
function saveErrMsg(e){ const s=String(e&&e.message||e||'');
  if(/^401|JWT|not authenticated|Unauthorized/i.test(s)) return 'Save blocked — your sign-in expired. Sign in again and retry.';
  if(/^40[03]|permission denied|row-level security|RLS|violates row-level/i.test(s)) return "Save blocked by access rules — your role can't write to this module. Ask an Admin to grant it.";
  if(/duplicate key|already exists|23505/i.test(s)) return 'That reference already exists — use a new reference number.';
  if(/foreign key|violates foreign key|23503/i.test(s)) return 'A linked record is missing — pick an existing value for the highlighted field.';
  if(/null value|not-null|23502/i.test(s)) return 'A required field is empty — fill every required field and retry.';
  if(/column .* does not exist|PGRST/i.test(s)) return 'Save error (schema): '+s.slice(0,140);
  return 'Save failed: '+s.slice(0,160);
}
// Which tables reference each record (external usage that must block a hard delete).
// A model's OWN o2m children (a product's recipe, a PO's lines) are excluded — those
// are cleared with the parent.
const DEPENDENTS = {
  suppliers:  [{model:'item_suppliers',fk:'supplier_name'},{model:'ingredients',fk:'supplier'},{model:'purchase_orders',fk:'supplier_name'}],
  ingredients:[{model:'bom_lines',fk:'ingredient_sku'},{model:'item_suppliers',fk:'ingredient_sku'},{model:'item_yields',fk:'ingredient_sku'},{model:'po_lines',fk:'ingredient_sku'}],
  products:   [{model:'production_batches',fk:'product_sku'},{model:'transfer_lines',fk:'product_sku'},{model:'order_lines',fk:'product_sku'}]
};
async function countDependents(model, pkval){
  const defs=DEPENDENTS[model]||[]; let total=0; const parts=[]; let checkFailed=false;
  for(const d of defs){ let n=0;
    if(isLive()){ try{ const rows=await sb(d.model+'?select='+d.fk+'&'+d.fk+'=eq.'+encodeURIComponent(pkval)+'&limit=500'); n=rows.length; }catch(e){ checkFailed=true; } }
    else { n=(DEMO[d.model]||[]).filter(r=>String(r[d.fk])===String(pkval)).length; }
    if(n>0){ total+=n; parts.push(n+'× '+((MODELS[d.model]||{}).label||d.model)); }
  }
  // A failed dependency lookup must NOT read as "no dependents" — block the delete instead of orphaning children.
  return {total, detail:parts.join(', '), checkFailed};
}
async function archiveForm(on){ const m=MODELS[state.model];
  try{ await db.update(state.model,m.pk,formRec[m.pk],{active:!on}); formRec.active=!on; relCache={};
    sysLog(state.model,formRec[m.pk],(on?'🗄 Archived by ':'♻ Restored by ')+CURRENT_USER); toast(on?'Archived — kept for history':'Restored'); renderForm(); }
  catch(e){ toast(e.message,true); } }
async function cancelForm(){ const m=MODELS[state.model];
  if(!confirm('Cancel '+formRec[m.pk]+'?\n\n• The record and all its lines are KEPT, for audit\n• Its status becomes "cancelled" and it stops being actioned — demand, payables, on-order and the reports all skip it\n• Stock already received or posted is NOT reversed; correct that with a count or a movement\n\nThis is reversible: set the status back on the form.'))return;
  try{ await db.update(state.model,m.pk,formRec[m.pk],{[m.status.f]:'cancelled'}); formRec[m.status.f]='cancelled';
    sysLog(state.model,formRec[m.pk],'✖ Cancelled by '+CURRENT_USER); toast('Cancelled — record kept'); renderForm(); }
  catch(e){ toast(e.message,true); } }
async function deleteForm(){
  const m=MODELS[state.model]; const pkval=formRec[m.pk];
  const dep=await countDependents(state.model, pkval);
  if(dep.checkFailed){ toast("Can't verify what this record is linked to right now — delete blocked to avoid orphaning data. Try again in a moment.",true); return; }
  if(dep.total>0){ const alt=m.archivable?'Archive it instead':(m.cancelable?'Cancel it instead':'Remove those first'); toast(`Can't delete — used by ${dep.total} record(s): ${dep.detail}. ${alt}.`,true); return; }
  if(!confirm('Permanently delete '+pkval+'? This cannot be undone — for master data or documents, prefer Archive/Cancel.')) return;
  try{ if(m.o2m) await db.replaceChildren(m.o2m, pkval, []); await db.del(state.model,m.pk,pkval); relCache={}; toast('Deleted'); state.view='list'; route(); }
  catch(e){ toast(e.message,true); }
}

  const dims=m.fields.filter(f=>['text','select','rel'].includes(f.t));
  const meas=m.fields.filter(f=>['number','currency'].includes(f.t));
  if(!repCfg.dim) repCfg.dim=(dims[0]||{}).n||'';
  if(!repCfg.measure) repCfg.measure=(meas[0]||{}).n||'';
  let rows=[]; try{ rows=await db.list(state.model,{}); }catch(e){ $('content').innerHTML=`<div class="empty">⚠ ${esc(e.message)}</div>`; return; }
  const g={};

  const data=Object.keys(g).map(k=>({k, v: repCfg.agg==='count'?g[k].count:(repCfg.agg==='sum'?g[k].sum:g[k].sum/g[k].count)})).sort((a,b)=>b.v-a.v);
  const max=Math.max(1,...data.map(d=>d.v));

      ${repCfg.agg!=='count'?`<select onchange="repSet('measure',this.value)">${meas.map(f=>`<option value="${f.n}" ${repCfg.measure===f.n?'selected':''}>${f.l}</option>`).join('')}</select>`:''}
      <span style="margin-left:10px">Grouped by:</span>
      <select onchange="repSet('dim',this.value)">${dims.map(f=>`<option value="${f.n}" ${repCfg.dim===f.n?'selected':''}>${f.l}</option>`).join('')}</select>
    </div>
    <table><thead><tr><th>${(m.fields.find(f=>f.n===repCfg.dim)||{}).l||''}</th><th class="num" style="width:130px">${repCfg.agg}</th><th style="width:40%"></th></tr></thead>
    <tbody>${data.map(d=>`<tr style="cursor:default"><td>${esc(d.k)}</td><td class="num">${measFmt?fmt(d.v):num(Math.round(d.v*100)/100)}</td>
      <td><div class="measure-bar" style="width:${Math.max(3,d.v/max*100)}%"></div></td></tr>`).join('')}
    </tbody></table>
    <div class="pager">${data.length} groups · ${rows.length} records</div></div>`;
}

/* ===================== Live Stock — movement reconciliation, grouped, actionable =====================
   Beginning (opening) + Received − Used + Produced ± Transfers ± Adjustments = Ending, per item,
   grouped like the count sheet (raw + its processed form together, products by family, supplies apart).
   Ending equals the ledger SUM(qty), so this both explains and cross-checks on-hand. */
let LS_LOC='all', LS_ACT=false;
async function renderLiveStock(){
  $('cp').innerHTML=`<div class="title">Live Stock <span onclick="openKB('stock_balance')" title="guide" style="cursor:pointer;color:var(--muted);font-size:14px;font-weight:400">❔</span></div>
    <button class="btn" onclick="renderLiveStock()">↻ Recompute</button>
    <span class="mini" style="margin-left:8px">Site <select onchange="LS_LOC=this.value;renderLiveStock()">
      <option value="all"${LS_LOC==='all'?' selected':''}>All</option>
      <option value="bulacan"${LS_LOC==='bulacan'?' selected':''}>Bulacan</option>
      <option value="pasig"${LS_LOC==='pasig'?' selected':''}>Pasig</option></select></span>
    <label class="mini" style="margin-left:8px"><input type="checkbox" ${LS_ACT?'checked':''} onchange="LS_ACT=this.checked;renderLiveStock()"> Needs action only</label>
    <div class="sp"></div><span style="color:var(--muted)">begin + in − used + produced ± moves = ending</span>`;
  let mov=[],ings=[],prods=[]; try{mov=await db.list('inventory_movements',{per:100000});}catch(e){} try{ings=await listIngredients();}catch(e){} try{prods=await db.list('products',{});}catch(e){}
  const im={}; ings.forEach(i=>im[i.sku]=i); const pm={}; prods.forEach(p=>pm[p.sku]=p);
  const _bs={},_bn={}; ings.forEach(it=>{ _bs[it.sku]=it; const nm=(it.name||'').trim().toLowerCase(); if(nm)_bn[nm]=it; });
  const matOf=(i)=>{ if(!i||!i.is_intermediate) return (i&&i.name)||''; const p=_procParent(i,_bs,_bn); return (p&&p.name)||i.name; };

  const acc={};
  mov.forEach(v=>{ const loc=v.location_code||'bulacan'; if(LS_LOC!=='all' && loc!==LS_LOC) return;
    const sku=v.ref_sku; if(!sku) return; const key=sku+'|'+(LS_LOC==='all'?'*':loc);
    const a=acc[key]||(acc[key]={sku,begin:0,recv:0,prod:0,cons:0,tf:0,adj:0,val:0});
    const q=+v.qty||0, t=v.movement_type||'';
    if(t==='opening') a.begin+=q;
    else if(t==='receipt') a.recv+=q;
    else if(t==='batch_output'||t==='processing_in') a.prod+=q;
    else if(t==='issue_to_batch'||t==='processing_out') a.cons+=q;
    else if(t==='transfer_in'||t==='transfer_out') a.tf+=q;
    else a.adj+=q;   // count_adjust and anything else nets here
    a.val += q*(+v.unit_cost||0);
  });

  let rows=Object.values(acc).map(a=>{ const end=a.begin+a.recv+a.prod+a.cons+a.tf+a.adj;
    const isProd=!!pm[a.sku]; const it=isProd?pm[a.sku]:(im[a.sku]||{}); const isSup=!isProd&&isSupplyItem(it);
    const div=(isProd||isSup)?1:1000; const unit=isProd?'packs':(isSup?(it.uom||'units'):'kg');
    // 3-level grouping (Group › Subgroup › Item), matching the count sheet & master data.
    let g1,g2,grank;
    if(isProd){ g1='📦 '+(it.group_1||'Products'); g2=(it.group_2||it.family||'Other'); grank=_so(it); }
    else if(isSup){ g1='🧴 Kitchen Supplies'; g2=(it.category||'Supplies'); grank=800000; }
    else { g1='🥩 '+(it.category||'Ingredients'); g2=(matOf(it)||a.sku); grank=400000+_grank(it.category)*1000+_so(it); }
    const name=(it.name||a.sku)+((!isProd&&!isSup&&it.is_intermediate)?' — processed':'');
    const par=isProd?(+it.par_packs||0):(+it.reorder_g||+it.par_g||0);
    const below=par>0 && end<par, neg=end< -0.0001;
    return {sku:a.sku, name, g1, g2, grank, unit, div, begin:a.begin, recv:a.recv, prod:a.prod, cons:a.cons, tf:a.tf, adj:a.adj, end, value:a.val, par, below, neg, sort_order:it.sort_order};
  }).filter(r=> r.begin||r.recv||r.prod||r.cons||r.tf||r.adj);
  if(LS_ACT) rows=rows.filter(r=>r.below||r.neg);

  const nBelow=rows.filter(r=>r.below).length, nNeg=rows.filter(r=>r.neg).length;
  const totVal=Object.values(acc).reduce((s,a)=>s+a.val,0);
  const mh=(typeof moneyHidden==='function'&&moneyHidden());
  const kpi=(l,val,s,col)=>`<div class="kpi"><div class="l">${l}</div><div class="v"${col?` style="color:${col}"`:''}>${val}</div><div class="s">${s||''}</div></div>`;
  let h=`<div class="kpirow">
    ${kpi('Items in stock', rows.length, LS_LOC==='all'?'all sites':LS_LOC)}
    ${kpi('⚠ Below reorder/PAR', nBelow, 'need replenishing', nBelow?'var(--earth,#b5762a)':'')}
    ${kpi('🔴 Negative', nNeg, 'ledger to investigate', nNeg?'var(--danger)':'')}
    ${mh?'':kpi('Stock value', fmt(totVal), 'at moving-avg cost', 'var(--berry)')}
  </div>`;

  const qf=(v,div)=> div===1000? (Math.round(v/1000*100)/100).toLocaleString('en-PH',{maximumFractionDigits:2}) : num(Math.round(v));
  // 3-level grouping (Group › Subgroup › Item) — same order everywhere.
  const _lr=r=>r.grank==null?500000:r.grank;
  const _gmin=arr=>Math.min(...arr.map(_lr));
  const byG1={}; rows.forEach(r=>{ (byG1[r.g1]=byG1[r.g1]||[]).push(r); });
  h+=`<div class="repcard"><div style="overflow-x:auto"><table><thead><tr>
    <th>Item</th><th>Unit</th><th class="num">Begin</th><th class="num">+In</th><th class="num">+Prod</th><th class="num">−Used</th><th class="num">±Transfer</th><th class="num">±Adjust</th><th class="num">Ending</th>${mh?'':'<th class="num">Value</th>'}<th>Flag</th></tr></thead><tbody>`;
  if(!rows.length) h+=`<tr><td colspan="${mh?10:11}" class="empty">${LS_ACT?'Nothing needs action ✅':'No stock movements yet.'}</td></tr>`;
  Object.keys(byG1).sort((a,b)=>_gmin(byG1[a])-_gmin(byG1[b])||cmpGroupKeys(a,b)).forEach(g1=>{
    const g1list=byG1[g1]; const gval=g1list.reduce((s,r)=>s+r.value,0);
    h+=`<tr style="background:#e7f0e9"><td colspan="${mh?9:9}"><b>${esc(g1)}</b> <span class="mini">· ${g1list.length} item(s)</span></td>${mh?'':`<td class="num"><b>${fmt(gval)}</b></td>`}<td></td></tr>`;
    const byG2={}; g1list.forEach(r=>{ (byG2[r.g2]=byG2[r.g2]||[]).push(r); });
    Object.keys(byG2).sort((a,b)=>_gmin(byG2[a])-_gmin(byG2[b])||cmpGroupKeys(a,b)).forEach(g2=>{
    const list=byG2[g2].slice().sort((a,b)=>_lr(a)-_lr(b)||cmpItems(a,b));
    h+=`<tr style="background:#f6f8f4"><td colspan="${mh?10:11}" style="padding-left:24px">▸ <b>${esc(g2)}</b> <span class="mini">(${list.length})</span></td></tr>`;
    list.forEach(r=>{ const endCol=r.neg?'var(--danger)':(r.below?'var(--earth,#b5762a)':'var(--ink)');
      const flag=r.neg?'<span style="color:var(--danger);font-weight:700">🔴 negative</span>':(r.below?'<span style="color:var(--earth,#b5762a);font-weight:700">⚠ reorder</span>':'<span class="mini" style="color:var(--ok)">ok</span>');
      const cl=r.below||r.neg?' style="cursor:pointer"':' style="cursor:pointer"';
      const model=pm[r.sku]?'products':'ingredients';
      h+=`<tr${cl} onclick="gotoRecord('${model}','${esc(String(r.sku)).replace(/'/g,'&#39;')}')" title="Open item">
        <td>${esc(r.name)}</td><td class="mini">${esc(r.unit)}</td>
        <td class="num">${qf(r.begin,r.div)}</td><td class="num">${r.recv?qf(r.recv,r.div):'—'}</td><td class="num">${r.prod?qf(r.prod,r.div):'—'}</td>
        <td class="num">${r.cons?qf(r.cons,r.div):'—'}</td><td class="num">${r.tf?qf(r.tf,r.div):'—'}</td><td class="num">${r.adj?qf(r.adj,r.div):'—'}</td>
        <td class="num" style="color:${endCol}"><b>${qf(r.end,r.div)}</b></td>${mh?'':`<td class="num">${fmt(r.value)}</td>`}<td>${flag}</td></tr>`; });
    });
  });
  h+=`</tbody></table></div>
    <div class="hint" style="margin-top:8px"><b>Ending = Begin + In + Prod − Used ± Transfer ± Adjust</b>, straight from the ledger — so it both explains and equals current on-hand. Ingredients show in <b>kg</b>, finished goods in <b>packs</b>, supplies in their unit. Rows open the item; <b style="color:var(--earth,#b5762a)">⚠ reorder</b> = at/below reorder or PAR, <b style="color:var(--danger)">🔴 negative</b> = a ledger gap to fix. ${LS_LOC==='all'?'Showing both sites combined — switch Site to split Bulacan vs Pasig.':''}</div></div>`;
  $('content').innerHTML=h;
}

function colDragStart(e,grip){

  const startX=e.clientX, startW=th.getBoundingClientRect().width;
  document.body.classList.add('colresizing');

    th.style.width=w+'px'; th.style.minWidth=w+'px'; th.style.maxWidth=w+'px'; };
  const up=()=>{ document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up);

// FULL database snapshot — every user table, ordered parents → children so restore can
// clear children-first and load parents-first without breaking foreign keys.
const BACKUP_TABLES=[
  // master / config (parents)
  'locations','suppliers','profiles','ingredients','products',
  'app_config','app_settings','ref_counters',
  // item reference data
  'item_bins','item_suppliers','item_yields','item_group_options','bom_lines','raw_material_pricing','sales_momentum',
  // sales orders
  'sales_orders','order_lines','custom_orders','custom_order_lines',
  // purchasing
  'purchase_orders','po_lines','po_payments','goods_receipts','gr_lines','supplier_invoices','invoice_lines',
  // production
  'production_batches','batch_issues',
  // transfers & counts
  'transfers','transfer_lines','count_sessions','count_lines',
  // deliveries
  'deliveries','delivery_lines',
  // ledgers, planning, logs & attachments
  'inventory_movements','variance_log','demand','mrp_plans','mrp_plan_lines',
  'saved_reports','record_notes','record_attachments','bulk_change_requests','activity_log'];
async function exportBackup(){
  toast('Building backup…'); const dump={_meta:{app:'WR ERP',exported_by:CURRENT_USER,live:isLive()}};
  for(const t of BACKUP_TABLES){ try{ dump[t]=isLive()? await sb((await _readRel(t))+'?select=*') : (DEMO[t]||[]); }catch(e){ dump[t]={error:String(e.message||e)}; } }
  const blob=new Blob([JSON.stringify(dump,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='wr-erp-backup-'+todayISO()+'.json'; document.body.appendChild(a); a.click(); a.remove();
  toast('Backup downloaded ('+BACKUP_TABLES.length+' tables)');
}
// Conflict key per backup table — used to clear rows (delete filter) and to upsert natural-key tables.
// Tables not listed default to 'id' (a surrogate identity column): their id is dropped on restore
// so identity regenerates, and every child references a natural key (sku / *_ref), never that id.
const RESTORE_PK={ locations:'code', suppliers:'name', ingredients:'sku', products:'sku', profiles:'id',
  app_config:'key', app_settings:'key', ref_counters:'key', sales_momentum:'sku', item_bins:'sku,location_code',
  purchase_orders:'po_ref', goods_receipts:'gr_ref', supplier_invoices:'invoice_ref',
  production_batches:'batch_ref', transfers:'transfer_ref', count_sessions:'count_ref',
  sales_orders:'order_ref', deliveries:'delivery_ref' };
// Tables whose 'id' is a meaningful key (not a throwaway surrogate) — keep it on restore & upsert on it.
const RESTORE_KEEP_ID=new Set(['profiles']);
// Tables we never DELETE during restore (only upsert) — profiles is linked to auth users; wiping it
// mid-restore could lock people out. Its rows are merged in instead.
const RESTORE_NO_DELETE=new Set(['profiles']);
function restoreStage(e){ const f=e.target.files[0]; if(!f)return; const rd=new FileReader();
  rd.onload=()=>{ try{ const d=JSON.parse(rd.result);
      if(typeof d!=='object'||d===null) throw new Error('not a backup file');
      window._restoreDump=d;
      const counts=BACKUP_TABLES.map(t=>Array.isArray(d[t])?`${t}: ${d[t].length}`:null).filter(Boolean);
      const total=BACKUP_TABLES.reduce((s,t)=>s+(Array.isArray(d[t])?d[t].length:0),0);
      const when=(d._meta&&d._meta.exported_by)?` · by ${esc(d._meta.exported_by)}`:'';
      $('rbArea').innerHTML=`<b>${esc(f.name)}</b> — ${total} row(s) across ${counts.length} table(s)${when}.
        <div class="mini" style="margin:6px 0;max-height:90px;overflow:auto">${counts.map(esc).join(' · ')||'no recognised tables'}</div>
        ${total?`<div style="margin-top:6px">Type <b>RESTORE</b> to enable: <input id="rbConfirm" oninput="var b=document.getElementById('rbBtn'); if(b) b.disabled=(this.value.trim().toUpperCase()!=='RESTORE')" style="border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:130px"></div>
        <div style="margin-top:10px"><button class="btn" id="rbBtn" disabled style="background:#b23b2e" onclick="restoreBackup()">♻ Restore — replaces current data</button></div>`:''}`;
    }catch(err){ $('rbArea').innerHTML='<span style="color:var(--danger)">Could not read backup: '+esc(err.message)+'</span>'; } };
  rd.readAsText(f);
}
async function restoreBackup(){
  if(typeof curRole==='function' && curRole()!=='Admin'){ toast('Only an Admin can restore',true); return; }
  const d=window._restoreDump; if(!d){ toast('Choose a backup file first',true); return; }
  if(!isLive()){ toast('Restore runs against the live database only',true); return; }
  if(!confirm('RESTORE will DELETE the current contents of the '+BACKUP_TABLES.length+' backed-up tables (master data, transactions, and the stock ledger) and load the backup in their place.\n\nThis cannot be undone. Continue?')) return;
  if(window._postLock){ toast('Busy…',true); return; } window._postLock=true;
  showBusy('Restoring backup…');
  const errs=[]; let ins=0;
  try{
    // 1) clear existing rows — children first (reverse of the FK-ordered list). Skip NO_DELETE tables.
    for(const t of [...BACKUP_TABLES].reverse()){ if(RESTORE_NO_DELETE.has(t)) continue;
      const pk=(RESTORE_PK[t]||'id').split(',')[0];   // first column of a composite key for the filter
      try{ await sb(t+'?'+pk+'=not.is.null',{method:'DELETE',prefer:'return=minimal'}); }
      catch(e){ errs.push('clear '+t+': '+(e.message||e)); } }
    // 2) load the snapshot — parents first. Drop surrogate id (identity regenerates) EXCEPT where the
    //    id is a real key (profiles). Upsert natural-key tables on their conflict key.
    for(const t of BACKUP_TABLES){ let rows=d[t]; if(!Array.isArray(rows)||!rows.length) continue;
      const keepId=RESTORE_KEEP_ID.has(t);
      rows=rows.map(r=>{ const c={...r}; if(!keepId) delete c.id; return c; });
      const pk=RESTORE_PK[t]||'id'; const upsert=(pk!=='id')||keepId;
      for(let i=0;i<rows.length;i+=500){ const chunk=rows.slice(i,i+500);
        try{ await sb(t+(upsert?('?on_conflict='+pk):''),{method:'POST',prefer:(upsert?'resolution=merge-duplicates,return=minimal':'return=minimal'),body:JSON.stringify(chunk)}); ins+=chunk.length; }
        catch(e){ errs.push('load '+t+': '+(e.message||e)); } } }
    try{ sysLog('cleanser','restore','♻ Restored full backup ('+ins+' rows across '+BACKUP_TABLES.length+' tables) by '+CURRENT_USER); }catch(e){}
  } finally { hideBusy(); window._postLock=false; }
  if(errs.length) console.warn('Restore issues:', errs);
  toast('Restore complete — '+ins+' row(s) loaded'+(errs.length?(' · ⚠ '+errs.length+' issue(s), see console'):''), errs.length>0);
}
function cleanseAll(on){ CLEANSE_GROUPS.forEach(g=>cleanseSel[g.key]=on); renderCleanser(); }
function cleanseGuard(v){ const b=$('clBtn'); if(b) b.disabled = (String(v).trim().toUpperCase()!=='CLEANSE'); }
async function runCleanse(){
  if(curRole()!=='Admin'){ toast('Only an Admin can run the cleanser',true); return; }                 // 1) role gate
  const guard=(($('clConfirm')&&$('clConfirm').value)||'').trim().toUpperCase();
  if(guard!=='CLEANSE'){ toast('Type CLEANSE in the box to confirm',true); return; }                     // 2) type-to-confirm
  const groups=CLEANSE_GROUPS.filter(g=>cleanseSel[g.key]);
  if(!groups.length){ toast('Select at least one dataset',true); return; }
  if(!confirm('You are about to PERMANENTLY DELETE:\n\n• '+groups.map(g=>g.label).join('\n• ')+'\n\nMaster data (suppliers, ingredients, products, recipes, users) is kept.\nThis cannot be undone. Continue?')) return;   // 3) itemized confirm
  let done=0; const errs=[];
  for(const g of groups){ for(const [t,pk] of g.tables){
    try{ if(isLive()){ await sb(t+'?'+pk+'=not.is.null',{method:'DELETE',prefer:'return=minimal'}); } else { DEMO[t]=[]; } done++; }
    catch(e){ errs.push(t); } } }
  // Clear the notes/activities/attachments that belonged to the wiped records, so the
  // Apps Script reminder can't keep firing at documents that no longer exist.
  const noteModels=[...new Set(groups.flatMap(g=>g.models||[]))];
  if(noteModels.length && !cleanseSel.notes){
    const filt='model=in.('+noteModels.map(m=>encodeURIComponent(m)).join(',')+')';
    for(const t of ['record_notes','record_attachments']){
      try{ if(isLive()){ await sb(t+'?'+filt,{method:'DELETE',prefer:'return=minimal'}); } else { DEMO[t]=(DEMO[t]||[]).filter(r=>!noteModels.includes(r.model)); } done++; }
      catch(e){ errs.push(t); }
    }
    try{ localStorage.removeItem('wr_notes'); Object.keys(localStorage).forEach(k=>{ if(/^attach:/.test(k) && noteModels.includes(k.split(':')[1])) localStorage.removeItem(k); }); }catch(e){}
  }
  if(cleanseSel.demand){ localStorage.removeItem('wr_mrp_plans'); mrpDemand={}; mrpManual={}; mrpRemarks={}; mrpAdd={}; window._mrpPlan=null; mrpPlanCache=[]; }
  if(cleanseSel.refs){ localStorage.removeItem('wr_refseq'); }
  if(cleanseSel.prod){ prodPlanLines=[]; prodRunRef=''; }
  sysLog('cleanser','wipe','🧹 Cleansed '+done+' table(s): '+groups.map(g=>g.key).join(', ')+' by '+CURRENT_USER);
  toast('Cleansed '+done+' table(s)'+(errs.length?' · '+errs.length+' error(s): '+errs.join(','):''), errs.length>0);
  cleanseSel={}; renderCleanser();
}

/* ---- Planning locations ------------------------------------------------------
   WHICH WAREHOUSES COUNT AS SUPPLY WHEN PLANNING.

   This was inconsistent, and the inconsistency is what makes the MRP and the
   kitchen disagree:
     • Demand/MRP summed stock_balance across EVERY location — so consignee and
       Pasig stock silently offset what Bulacan needed to buy, and it under-ordered.
     • Production, the shortage check and the raw guard all hard-coded 'bulacan' —
       so the same run then reported shortages the MRP said were covered.

   Two settings, because they are two different questions:
     supply[]  locations whose stock offsets purchasing. Stock sitting with a
               consignee cannot be pulled back to cook with, so consignees stay
               OUT unless you say otherwise.
     produce   the single site the kitchen draws from and posts output to.
   Default: supply = [bulacan], produce = bulacan — Bulacan only, which is what
   the production side always assumed.                                          */
const PLAN_CFG_DEFAULT={supply:['bulacan'], produce:'bulacan'};
let PLAN_CFG = JSON.parse(localStorage.getItem('wr_plancfg')||'null') || {...PLAN_CFG_DEFAULT};
async function loadPlanCfg(){
  if(isLive()&&SUPA&&SUPA.token){ try{ const r=await sb("app_config?select=value&key=eq.planning_locations");
    if(r&&r[0]&&r[0].value){ PLAN_CFG={...PLAN_CFG_DEFAULT,...r[0].value}; localStorage.setItem('wr_plancfg',JSON.stringify(PLAN_CFG)); } }catch(e){} } }
async function savePlanCfg(){
  localStorage.setItem('wr_plancfg',JSON.stringify(PLAN_CFG));
  if(isLive()&&SUPA&&SUPA.token){ try{ await sb('app_config?on_conflict=key',{method:'POST',prefer:'resolution=merge-duplicates,return=minimal',body:JSON.stringify({key:'planning_locations',value:PLAN_CFG})}); }
    catch(e){ toast('Saved on this device; sync failed: '+e.message,true); return false; } }
  return true; }
function planSupplyLocs(){ const a=(PLAN_CFG&&PLAN_CFG.supply)||[]; return a.length?a.map(String):['bulacan']; }

function attAdd(){   // opens a real file picker; routes the file to Drive via n8n if configured
